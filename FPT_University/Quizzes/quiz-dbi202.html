<title>DBI202 — Ngân hàng câu hỏi</title>
<style>
  :root{
    --paper:#F2F3F0; --card:#FFFFFF; --ink:#16202E; --ink-soft:#54606F; --ink-faint:#8A94A0;
    --rule:#DDE0DC; --rule-strong:#C6CBC5;
    --indigo:#2B4C7E; --indigo-soft:#E7ECF4;
    --ok:#1F7A5C; --ok-bg:#E6F2ED; --no:#C4442D; --no-bg:#FBEAE6;
    --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px -12px rgba(22,32,46,.18);
    --mono:ui-monospace,"Cascadia Mono","Consolas","SF Mono",monospace;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Yu Gothic UI","Meiryo","MS Gothic",sans-serif;
    --ui:"Segoe UI","Inter","Helvetica Neue",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#12161A; --card:#1A1F25; --ink:#E7E9E4; --ink-soft:#A3ACB6; --ink-faint:#6E7883;
      --rule:#2A3138; --rule-strong:#3B444D;
      --indigo:#89AEE0; --indigo-soft:#1E2A3A;
      --ok:#5FC49C; --ok-bg:#16302A; --no:#EE8168; --no-bg:#341E1A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12161A; --card:#1A1F25; --ink:#E7E9E4; --ink-soft:#A3ACB6; --ink-faint:#6E7883;
    --rule:#2A3138; --rule-strong:#3B444D;
    --indigo:#89AEE0; --indigo-soft:#1E2A3A;
    --ok:#5FC49C; --ok-bg:#16302A; --no:#EE8168; --no-bg:#341E1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --paper:#F2F3F0; --card:#FFFFFF; --ink:#16202E; --ink-soft:#54606F; --ink-faint:#8A94A0;
    --rule:#DDE0DC; --rule-strong:#C6CBC5;
    --indigo:#2B4C7E; --indigo-soft:#E7ECF4;
    --ok:#1F7A5C; --ok-bg:#E6F2ED; --no:#C4442D; --no-bg:#FBEAE6;
    --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px -12px rgba(22,32,46,.18);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 96px}

  /* ---------- top rail ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--paper);
         border-bottom:1px solid var(--rule);padding:14px 0 12px;margin-bottom:26px}
  .rail{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .course{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo)}
  .subtitle{font-size:12px;color:var(--ink-faint);letter-spacing:.02em}
  .spacer{flex:1}
  .stat{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b{color:var(--ink);font-weight:650}
  .bar{height:3px;background:var(--rule);border-radius:2px;margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s ease}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  select,.btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card);
    border:1px solid var(--rule-strong);border-radius:7px;padding:6px 11px;cursor:pointer}
  select{max-width:100%}
  .btn:hover{border-color:var(--indigo);color:var(--indigo)}
  .btn[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
  :root[data-theme="dark"] .btn[aria-pressed="true"],
  .btn[aria-pressed="true"]{color:var(--paper)}
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:7px;overflow:hidden}
  .seg .btn{border:0;border-radius:0;border-right:1px solid var(--rule-strong)}
  .seg .btn:last-child{border-right:0}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

  /* ---------- question card ---------- */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
        box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;gap:16px}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .tag{background:var(--indigo-soft);color:var(--indigo);padding:2px 8px;border-radius:20px;
       letter-spacing:.06em;font-weight:650}
  .prompt{font-size:14.5px;color:var(--ink-soft);text-wrap:pretty}
  .setup{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--paper);
         border:1px solid var(--rule);border-radius:8px;padding:12px 14px;
         overflow-x:auto;white-space:pre;color:var(--ink-soft)}
  .stem{font-family:var(--jp);font-size:23px;line-height:1.75;font-weight:600;text-wrap:balance}
  .stem.latin{font-family:var(--ui);font-size:19px;font-weight:600}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:9px;margin:2px 0 0}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
       background:var(--card);border:1px solid var(--rule-strong);border-radius:9px;
       padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--indigo);background:var(--indigo-soft)}
  .opt:disabled{cursor:default}
  .key{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rule-strong);
       display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:1px}
  .otext{font-family:var(--jp);font-size:17px;line-height:1.6}
  .otext.latin{font-family:var(--ui);font-size:15.5px}
  .otext.mono{font-family:var(--mono);font-size:13.5px;line-height:1.6;
              overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .mark{flex:none;margin-left:auto;font-size:19px;line-height:1;padding-left:8px;font-weight:400}

  .opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}
  .opt.sel .key{border-color:var(--indigo);color:var(--indigo);font-weight:800}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .key{border-color:var(--ok);color:var(--ok)}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--no-bg)}
  .opt.wrong .key{border-color:var(--no);color:var(--no)}
  .opt.wrong .mark{color:var(--no)}
  .opt.dim{opacity:.5}

  /* ---------- explanation ---------- */
  .exp{border-top:1px solid var(--rule);padding-top:16px;display:flex;flex-direction:column;gap:13px}
  .exp[hidden]{display:none}
  .verdict{font-size:14px;font-weight:650}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)} .verdict.na{color:var(--ink-faint)}
  .multi{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         color:var(--indigo);background:var(--indigo-soft);padding:2px 8px;border-radius:20px}
  .block{display:flex;flex-direction:column;gap:5px}
  .label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .keypoint{font-size:15.5px;line-height:1.6;font-weight:600;border-left:2.5px solid var(--indigo);padding-left:12px}
  .body{font-size:14.5px;line-height:1.65;color:var(--ink-soft)}
  .src{font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:var(--paper);
       border:1px solid var(--rule);border-radius:8px;padding:11px 13px;color:var(--ink-soft)}
  ul.why{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  ul.why li{font-size:14px;line-height:1.6;color:var(--ink-soft);display:flex;gap:9px}
  ul.why li b{color:var(--no);font-weight:700;flex:none;min-width:14px}
  table.vocab{border-collapse:collapse;font-size:14px;width:100%}
  table.vocab td{padding:5px 12px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  table.vocab td:first-child{font-family:var(--jp);font-weight:650;white-space:nowrap}
  table.vocab td:nth-child(2){font-family:var(--jp);color:var(--ink-faint);white-space:nowrap}
  table.vocab td:last-child{color:var(--ink-soft);width:99%}
  .caveat{font-size:11.5px;color:var(--ink-faint);font-style:italic}

  /* ---------- nav ---------- */
  .nav{display:flex;gap:8px;align-items:center;margin-top:20px}
  .nav .spacer{flex:1}
  .hint{font-size:11.5px;color:var(--ink-faint)}
  .hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);
            border-radius:4px;padding:1px 5px;background:var(--card)}

  /* ---------- list mode ---------- */
  .list{display:flex;flex-direction:column;gap:14px}
  .list .card{padding:20px 22px}
  .empty{text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:15px}

  /* ---------- reference tables ---------- */
  .refs{display:flex;flex-direction:column;gap:22px}
  .refs h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           color:var(--indigo);margin:0 0 2px}
  .refs .from{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}
  .rrow{display:grid;grid-template-columns:minmax(88px,auto) 1fr;gap:4px 18px;
        padding:12px 0;border-top:1px solid var(--rule)}
  .rrow:first-of-type{border-top:0}
  .rterm{font-family:var(--jp);font-size:19px;font-weight:650;line-height:1.4}
  .rmean{font-size:14.5px;line-height:1.6;color:var(--ink-soft)}
  .rex{grid-column:2;display:flex;flex-direction:column;gap:3px;margin-top:5px;
       border-left:2px solid var(--rule-strong);padding-left:11px}
  .rex div{font-size:14px;line-height:1.6}
  .rex .ja{font-family:var(--jp);color:var(--ink)}
  .rex .vi{color:var(--ink-faint);font-size:13px}
  @media (max-width:600px){ .rrow{grid-template-columns:1fr;gap:3px} .rex{grid-column:1} }

  @media (max-width:600px){
    .wrap{padding:0 14px 80px}
    .card{padding:20px 17px 18px;border-radius:10px}
    .stem{font-size:20px} .stem.latin{font-size:17px}
    .otext{font-size:16px} .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DATA = {"course":"DBI202","sections":["Thủ tục, trigger, view, cursor","Chuẩn hoá \u0026 phụ thuộc hàm","Truy vấn SQL","Mô hình quan hệ \u0026 khoá","Mô hình ER","Giao dịch \u0026 đồng thời","Đại số quan hệ","DDL \u0026 ràng buộc","Tổng quan DBMS","Chỉ mục \u0026 tối ưu","Thêm, sửa, xoá dữ liệu"],"questions":[{"id":8,"slide":8,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"What is transaction in the context of database and database management system?","options":[{"label":"A","text":"Querying database"},{"label":"B","text":"Inserting tuples into a relation"},{"label":"C","text":"Modifying tuples in a relation"},{"label":"D","text":"Deleting tuples from a relation"}],"answer":"","note":"Chữa đề FE DBI202 FA25 RE | Mọi người bật slide show rồi xem","key_point":"Transaction là một chuỗi các thao tác thao tác trên database được xử lý như một đơn vị logic duy nhất.","why_correct":"Trong DBMS, một transaction không giới hạn chỉ ở việc query, insert, modify hay delete riêng lẻ, mà bản thân các thao tác này (hoặc sự kết hợp của chúng) chính là các hành động nằm bên trong một transaction.","why_wrong":[{"label":"A","why":"Chỉ mô tả một thao tác đọc dữ liệu, chưa đủ định nghĩa cho toàn bộ transaction."},{"label":"B","why":"Chỉ mô tả một thao tác thêm dữ liệu cụ thể."},{"label":"C","why":"Chỉ mô tả một thao tác cập nhật dữ liệu cụ thể."},{"label":"D","why":"Chỉ mô tả một thao tác xóa dữ liệu cụ thể."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực thi tuần tự và toàn vẹn."},{"word":"tuple","reading":"","meaning":"Một dòng hoặc bản ghi trong bảng dữ liệu quan hệ."}]},{"id":11,"slide":11,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"With SQL, how do you select all the records from a table named \"tblDepartment\" where the value of the column \"depName\" is “E\u0026D department”?\nChoose correct answers.","options":[{"label":"A","text":"SELECT * FROM tblDepartment WHERE depName LIKE \"%E\u0026D department\""},{"label":"B","text":"SELECT * FROM tblDepartment WHERE depName = \"E\u0026D department\""},{"label":"C","text":"SELECT * FROM tblDepartment WHERE depName LIKE \"E\u0026D department\""},{"label":"D","text":"SELECT * FROM tblDepartment WHERE depName = \"%E\u0026D department%\""}],"answer":"BC","note":"BC","key_point":"Dung toan tu = hoac LIKE voi pattern chinh xac de loc du lieu trong SQL.","why_correct":"Dap an B dung toan tu = de tim chinh xac chuoi \"E\u0026D department\". Dap an C dung LIKE voi chuoi khong co wildcard, hoat động giong het toan tu = nen cung cho ket qua chinh xac.","why_wrong":[{"label":"A","why":"Dung wildcard % o dau nhung thieu o cuoi, chi tim cac gia tri ket thuc bang chuoi do."},{"label":"D","why":"Dung toan tu = nhung lai chua ky tu % nen se tim kiem chinh xac chuoi co chua dau phan tram, khong phai tim kiem wildcard."}],"vocab":[{"word":"SELECT","reading":"","meaning":"Cau lenh SQL dung de truy van du lieu tu database."},{"word":"WHERE","reading":"","meaning":"Menh de SQL dung de loc ban ghi thoa man dieu kien."}]},{"id":12,"slide":12,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"What are some benefits of normalization when converting an ERD to a relational model?","options":[{"label":"A","text":"Increased storage space efficiency"},{"label":"B","text":"Reduced update anomalies"},{"label":"C","text":"Simplified database queries"},{"label":"D","text":"Enhanced data security"}],"answer":"AB","note":"AB\nnhưng mà đề ra chọn 1 thì phải","key_point":"Normalization eliminates redundancy, improving storage and reducing update anomalies.","why_correct":"Normalization divides data into multiple tables to minimize data duplication, which directly saves storage space efficiency and prevents update anomalies.","why_wrong":[{"label":"C","why":"Queries often become more complex due to required joins across multiple normalized tables."},{"label":"D","why":"Security is handled by access control policies, not by the normalization process."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu nhằm giảm thiểu dư thừa dữ liệu."},{"word":"update anomalies","reading":"","meaning":"Các bất thường khi cập nhật dữ liệu do dư thừa."}]},{"id":14,"slide":14,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What is the result of the below query: SELECT SUBSTRING(\u0027FPTUDN\u0027, 1, 3) AS \u0027Substring\u0027\n\nHoàng Hoàng","options":[{"label":"A","text":"FPT"},{"label":"B","text":"UDN"},{"label":"C","text":"T"},{"label":"D","text":"TUN"}],"answer":"A","note":"A","key_point":"Hàm SUBSTRING(str, pos, len) trích xuất một chuỗi con bắt đầu từ vị trí pos với chiều dài len.","why_correct":"Hàm SUBSTRING(\u0027FPTUDN\u0027, 1, 3) lấy 3 ký tự bắt đầu từ vị trí 1, cho ra kết quả \u0027FPT\u0027.","why_wrong":[{"label":"B","why":"Nhầm vị trí bắt đầu hoặc chiều dài trích xuất."},{"label":"C","why":"Chỉ lấy đúng 1 ký tự tại vị trí 1."},{"label":"D","why":"Trích xuất sai vị trí và thứ tự các ký tự."}],"vocab":{"word":"SUBSTRING","reading":"","meaning":"Hàm SQL dùng để trích xuất một chuỗi con từ chuỗi gốc."}},{"id":15,"slide":15,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"What is the value of the query:\nSELECT \u0027Agnes\u0027 + NULL + \u0027Allison\u0027","options":[{"label":"A","text":"Agnes"},{"label":"B","text":"Allison"},{"label":"C","text":"NULL"},{"label":"D","text":"Agnes Allison"}],"answer":"C","note":"C","key_point":"Trong SQL, bất kỳ phép toán chuỗi nào kết hợp với NULL đều trả về kết quả là NULL.","why_correct":"Khi sử dụng toán tử cộng chuỗi \u0027+\u0027 trong SQL, nếu có bất kỳ toán hạng nào là NULL, toàn bộ biểu thức sẽ tự động trả về NULL.","why_wrong":[{"label":"A","why":"Nhầm lẫn rằng NULL bị bỏ qua trong phép nối chuỗi."},{"label":"B","why":"Nhầm lẫn rằng chỉ giữ lại chuỗi thứ hai."},{"label":"D","why":"Nhầm lẫn rằng NULL được coi như chuỗi rỗng."}],"vocab":{"word":"NULL","reading":"","meaning":"Giá trị đại diện cho sự thiếu vắng thông tin hoặc dữ liệu chưa biết."}},{"id":16,"slide":16,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which of the following wildcard characters matches any sequence of zero or more characters in a string comparison?","options":[{"label":"A","text":"\u0026"},{"label":"B","text":"$\""},{"label":"C","text":" _"},{"label":"D","text":"%"}],"answer":"D","note":"D","key_point":"Dùng % để match chuỗi bất kỳ gồm 0 hoặc nhiều ký tự trong SQL.","why_correct":"Trong SQL, ký tự % là wildcard đại diện cho một chuỗi gồm zero hoặc nhiều ký tự bất kỳ khi dùng với toán tử LIKE.","why_wrong":[{"label":"A","why":"Không phải là wildcard chuẩn trong SQL."},{"label":"B","why":"Không phải là cú pháp wildcard."},{"label":"C","why":"Ký tự _ đại diện cho đúng một ký tự bất kỳ, không phải zero hoặc nhiều ký tự."}],"vocab":[{"word":"wildcard","reading":"","meaning":"Ký tự đại diện dùng trong tìm kiếm chuỗi với LIKE."},{"word":"LIKE","reading":"","meaning":"Toán tử SQL dùng để so khớp mẫu chuỗi."}]},{"id":17,"slide":17,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which of the following represents Armstrong\u0027s Axiom of Transitivity?","options":[{"label":"A","text":"If A  B, then AC  BC"},{"label":"B","text":"If A  B and B  C, then A  C"},{"label":"C","text":"If A  B, then B  A"},{"label":"D","text":"If A  B, then A  BC"}],"answer":"B","note":"B","key_point":"Transitivity trong Armstrong\u0027s axioms suy diễn functional dependency bắc cầu từ A qua B đến C.","why_correct":"Theo quy tắc Transitivity, nếu A xác định được B và B xác định được C, thì bắc cầu ta có A xác định được C (A -\u003e C).","why_wrong":[{"label":"A","why":"Đây là quy tắc Augmentation."},{"label":"C","why":"Đây không phải là một tiên đề hợp lệ."},{"label":"D","why":"Đây là quy tắc Union hoặc Pseudotransitivity tùy ngữ cảnh mở rộng."}],"vocab":[{"word":"Armstrong\u0027s axioms","reading":"","meaning":"Tập các quy tắc cơ bản để suy luận các functional dependency trong cơ sở dữ liệu."},{"word":"Transitivity","reading":"","meaning":"Tính chất bắc cầu trong các tiên đề Armstrong."}]},{"id":18,"slide":18,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which statement is the best represents Armstrong\u0027s Axiom of Decomposition?","options":[{"label":"A","text":"If A  B and A  C, then A  BC"},{"label":"B","text":"If A  B and B  C, then A  C"},{"label":"C","text":"If A  B, then AC  BC"},{"label":"D","text":"If A  B, then B  C"}],"answer":"A","note":"A\nCâu này đọc hiểu đi chứ đáp án có vd","key_point":"Armstrong\u0027s Decomposition rule: Nếu A -\u003e BC thì A -\u003e B và A -\u003e C.","why_correct":"Axiom of Decomposition cho phép tách một tập thuộc tính ở vế phải của Functional Dependency thành các phần nhỏ hơn. Nếu A xác định được tập BC, thì A chắc chắn xác định được từng thuộc tính B và C riêng lẻ.","why_wrong":[{"label":"B","why":"Đây là tính chất Transitive Rule."},{"label":"C","why":"Đây là tính chất Augmentation Rule."},{"label":"D","why":"Đây không phải là một Axiom hợp lệ."}],"vocab":[{"word":"Functional Dependency","reading":"","meaning":"Sự phụ thuộc hàm giữa các tập thuộc tính trong một relation."},{"word":"Armstrong\u0027s Axioms","reading":"","meaning":"Tập các quy tắc suy diễn dùng để tìm tất cả các Functional Dependency từ một tập cho trước."}]},{"id":19,"slide":19,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"Which of the following SQL statement remove all of the content from a table name “employees” but keep the schema?","options":[{"label":"A","text":"DELETE FROM employees;"},{"label":"B","text":"TRUNCATE * FROM employees;"},{"label":"C","text":"DROP TABLE employees;"},{"label":"D","text":"REMOVE * FROM employees;"}],"answer":"A","note":"A","key_point":"DELETE FROM table xóa dữ liệu nhưng giữ lại cấu trúc schema của bảng.","why_correct":"Lệnh DELETE FROM employees xóa toàn bộ các tuple trong bảng mà không làm thay đổi định nghĩa schema của bảng đó.","why_wrong":[{"label":"B","why":"Cú pháp TRUNCATE không đi kèm dấu * và là DDL, không phải DML."},{"label":"C","why":"DROP TABLE xóa cả dữ liệu lẫn schema của bảng."},{"label":"D","why":"REMOVE không phải là một lệnh hợp lệ trong SQL để xóa dữ liệu."}],"vocab":[{"word":"Schema","reading":"","meaning":"Cấu trúc hoặc thiết kế khung của cơ sở dữ liệu."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) dữ liệu trong bảng."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, nhóm lệnh thao tác dữ liệu như SELECT, INSERT, DELETE."}]},{"id":20,"slide":20,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"Which of the following queries deletes employees who are not assigned to any department?","options":[{"label":"A","text":"DELETE FROM Employees WHERE DepartmentID IS NULL;"},{"label":"B","text":"DELETE FROM Employees WHERE DepartmentID = \u0027\u0027;"},{"label":"C","text":"DELETE FROM Employees WHERE DepartmentID = 0;"},{"label":"D","text":"DELETE FROM Employees WHERE DepartmentID IS NOT NULL;"}],"answer":"A","note":"A","key_point":"Sử dụng IS NULL để kiểm tra giá trị thiếu trong SQL.","why_correct":"Trong SQL, giá trị không xác định hoặc không được gán được biểu diễn bằng NULL. Toán tử IS NULL dùng để lọc chính xác các tuple có thuộc tính DepartmentID chưa được gán.","why_wrong":[{"label":"B","why":"Chuỗi rỗng \u0027\u0027 là một giá trị hợp lệ, không phải là giá trị thiếu (NULL)."},{"label":"C","why":"Số 0 là một giá trị cụ thể, không đại diện cho việc thiếu thông tin."},{"label":"D","why":"IS NOT NULL chọn các nhân viên ĐÃ có department, ngược với yêu cầu đề bài."}],"vocab":[{"word":"NULL","reading":"","meaning":"Giá trị đại diện cho dữ liệu bị thiếu hoặc không xác định trong database."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":21,"slide":21,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which of the following SQL statement returns only matching records between Customers and SalesInvoice based on custID?","options":[{"label":"A","text":"SELECT * FROM Customers LEFT JOIN SalesInvoice ON Customers.custID = SalesInvoice.custID;"},{"label":"B","text":"SELECT * FROM Customers INNER JOIN SalesInvoice ON Customers.custID = SalesInvoice.custID;"},{"label":"C","text":"SELECT * FROM Customers RIGHT JOIN SalesInvoice ON Customers.custID = SalesInvoice.custID;"},{"label":"D","text":"SELECT * FROM Customers FULL JOIN SalesInvoice ON Customers.custID = SalesInvoice.custID;"}],"answer":"B","note":"B","key_point":"INNER JOIN chỉ trả về các tuple có giá trị khớp ở cả hai bảng.","why_correct":"INNER JOIN lọc ra các bản ghi có giá trị custID tồn tại trong cả bảng Customers và SalesInvoice. Đây là cách chuẩn để lấy dữ liệu giao nhau giữa hai bảng.","why_wrong":[{"label":"A","why":"LEFT JOIN trả về tất cả bản ghi từ bảng bên trái, kể cả khi không có khớp ở bảng bên phải."},{"label":"C","why":"RIGHT JOIN trả về tất cả bản ghi từ bảng bên phải, kể cả khi không có khớp ở bảng bên trái."},{"label":"D","why":"FULL JOIN trả về tất cả bản ghi từ cả hai bảng, bất kể có khớp hay không."}],"vocab":[{"word":"INNER JOIN","reading":"","meaning":"Phép kết nối chỉ trả về các hàng có giá trị khớp trong cả hai bảng."},{"word":"tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":22,"slide":22,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which statement is used to change the data type of a column named E in table A?","options":[{"label":"A","text":"ALTER TABLE A ALTER COLUMN E [DataType]"},{"label":"B","text":"ALTER TABLE A ALTER COLUMN E"},{"label":"C","text":"ALTER TABLE A ALTER E [DataType]"},{"label":"D","text":"ALTER TABLE A DROP COLUMN E [DataType]"}],"answer":"A","note":"A","key_point":"Sử dụng ALTER TABLE để thay đổi cấu trúc hoặc kiểu dữ liệu của cột.","why_correct":"Cú pháp ALTER TABLE A ALTER COLUMN E [DataType] là chuẩn SQL để sửa đổi định nghĩa kiểu dữ liệu cho một cột cụ thể trong bảng.","why_wrong":[{"label":"B","why":"Thiếu thông tin về kiểu dữ liệu mới cần áp dụng."},{"label":"C","why":"Thiếu từ khóa COLUMN bắt buộc trong cú pháp ALTER."},{"label":"D","why":"DROP COLUMN dùng để xóa hoàn toàn cột khỏi bảng chứ không phải thay đổi kiểu dữ liệu."}],"vocab":[{"word":"ALTER TABLE","reading":"","meaning":"Câu lệnh SQL dùng để sửa đổi cấu trúc của một bảng đã tồn tại."},{"word":"Data Type","reading":"","meaning":"Kiểu dữ liệu quy định loại giá trị mà một cột có thể lưu trữ."}]},{"id":23,"slide":23,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which statement is used to disable a foreign key constraint named fk_name during INSERT and UPDATE transactions in table B?","options":[{"label":"A","text":"ALTER TABLE B DROP CONSTRAINT fk_name"},{"label":"B","text":"ALTER TABLE B DISABLE CONSTRAINT fk_name"},{"label":"C","text":"ALTER TABLE B DISABLE fk_name"},{"label":"D","text":"ALTER TABLE B NOCHECK CONSTRAINT fk_name"}],"answer":"D","note":"D NOCHECK to disable a specific foreign key constraint (fk_name) temporarily in SQL Server without dropping it.","key_point":"Sử dụng NOCHECK CONSTRAINT để tạm thời vô hiệu hóa ràng buộc mà không xóa bỏ.","why_correct":"Trong SQL Server, cú pháp ALTER TABLE B NOCHECK CONSTRAINT fk_name được dùng để tạm dừng kiểm tra ràng buộc foreign key, cho phép thực hiện các thao tác INSERT hoặc UPDATE mà không bị chặn bởi ràng buộc đó.","why_wrong":[{"label":"A","why":"DROP CONSTRAINT sẽ xóa hoàn toàn ràng buộc khỏi schema thay vì chỉ vô hiệu hóa."},{"label":"B","why":"Cú pháp này không chuẩn trong SQL Server cho mục đích vô hiệu hóa constraint."},{"label":"C","why":"Thiếu từ khóa CONSTRAINT, cú pháp không hợp lệ."}],"vocab":[{"word":"Foreign key","reading":"","meaning":"Ràng buộc tham chiếu giữa các bảng để đảm bảo tính toàn vẹn dữ liệu."},{"word":"Constraint","reading":"","meaning":"Các quy tắc áp dụng trên cột hoặc bảng để giới hạn dữ liệu nhập vào."}]},{"id":24,"slide":24,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which syntax is commonly used for the rename operation in Relational Algebra?","options":[{"label":"A","text":"RENAME relation TO new_relation"},{"label":"B","text":"RENAME attribute IN relation TO new_attribute"},{"label":"C","text":"ALTER TABLE relation RENAME TO new_relation"},{"label":"D","text":"SELECT * FROM relation AS new_relation"}],"answer":"A","note":"A","key_point":"Toán tử rename (ρ) trong Relational Algebra dùng để đổi tên relation hoặc attribute.","why_correct":"Trong lý thuyết Relational Algebra, toán tử ρ (rho) được sử dụng để đổi tên một relation hoặc các attribute của nó, thường được ký hiệu là ρ_{new_name}(relation).","why_wrong":[{"label":"B","why":"Đây là cách diễn đạt không chuẩn cho toán tử rename trong Relational Algebra."},{"label":"C","why":"Đây là cú pháp DDL trong SQL, không phải Relational Algebra."},{"label":"D","why":"Đây là cú pháp truy vấn SQL, không phải Relational Algebra."}],"vocab":[{"word":"Relational Algebra","reading":"","meaning":"Ngôn ngữ truy vấn hình thức dựa trên tập hợp dùng để thao tác trên các relation."},{"word":"Rename operation","reading":"","meaning":"Toán tử dùng để đặt tên mới cho một relation hoặc các attribute của nó."}]},{"id":25,"slide":25,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which SQL statement selects all rows from table called Contest, with column ContestDate having values greater or equal to May 25, 2006?","options":[{"label":"A","text":"SELECT * FROM Contest WHERE ContestDate \u003e= \u002705/25/2006\u0027"},{"label":"B","text":"SELECT * FROM Contest GROUPBY ContestDate \u003e= \u002705/25/2006\u0027"},{"label":"C","text":"SELECT * FROM Contest WHERE ContestDate \u003c= \u002705/25/2006\u0027"},{"label":"D","text":"SELECT * FROM Contest HAVING ContestDate \u003e= \u002705/25/2006\u0027"}],"answer":"A","note":"A","key_point":"Sử dụng mệnh đề WHERE để lọc các tuple thỏa mãn điều kiện cụ thể.","why_correct":"Mệnh đề WHERE lọc các hàng dựa trên điều kiện so sánh. Toán tử \u003e= được dùng để lấy các giá trị lớn hơn hoặc bằng ngày chỉ định.","why_wrong":[{"label":"B","why":"GROUP BY dùng để gom nhóm dữ liệu, không dùng để lọc hàng."},{"label":"C","why":"Toán tử \u003c= lấy các giá trị nhỏ hơn hoặc bằng, ngược với yêu cầu."},{"label":"D","why":"HAVING chỉ dùng để lọc sau khi đã thực hiện GROUP BY."}],"vocab":[{"word":"WHERE clause","reading":"","meaning":"Mệnh đề dùng để lọc các bản ghi thỏa mãn điều kiện trong SQL."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":26,"slide":26,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is correct?","options":[{"label":"A","text":"SELECT datepart(DATE, \u002710-jan-24\u0027)"},{"label":"B","text":"SELECT datepart(\u002710-jan-24\u0027, DATE)"},{"label":"C","text":"SELECT datepart(\u002710-jan-24\u0027, DAY)"},{"label":"D","text":"SELECT datepart(DAY, \u002710-jan-24\u0027)"}],"answer":"D","note":"D","key_point":"Hàm datepart() trích xuất một phần cụ thể (như ngày, tháng, năm) từ một giá trị ngày tháng.","why_correct":"Trong SQL, hàm datepart() yêu cầu chỉ định phần ngày tháng cần trích xuất (ví dụ: DAY, MONTH, YEAR) làm tham số đầu tiên, và giá trị ngày tháng làm tham số thứ hai. Lựa chọn D tuân theo cú pháp này.","why_wrong":[{"label":"A","why":"Lựa chọn A sai vì nó đặt giá trị ngày tháng (\u002710-jan-24\u0027) làm tham số đầu tiên và phần ngày tháng (DATE) làm tham số thứ hai, sai cú pháp."},{"label":"B","why":"Lựa chọn B sai vì nó đặt giá trị ngày tháng (\u002710-jan-24\u0027) làm tham số đầu tiên và DATE làm tham số thứ hai, sai cú pháp."},{"label":"C","why":"Lựa chọn C sai vì nó đặt giá trị ngày tháng (\u002710-jan-24\u0027) làm tham số đầu tiên và DAY làm tham số thứ hai, sai cú pháp."}],"vocab":[{"word":"datepart","reading":"","meaning":"Hàm SQL để trích xuất một phần cụ thể của ngày tháng."},{"word":"DAY","reading":"","meaning":"Một hằng số trong SQL chỉ định phần ngày của một giá trị ngày tháng."}]},{"id":27,"slide":27,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which one of the following SQL statements returns the name of the employee (employeeename, dept_code, salary) receiving the maximum salary in a particular department?","options":[{"label":"A","text":"Select employeeename, dept_code, salary From employee Where employee.salary in (select (salary) from Employee group by dept_code having Max(salary))"},{"label":"B","text":"Select employeeename, dept_code, salary From employee Where employee.salary in (select Max(salary) from Employee group by dept_code)"},{"label":"C","text":"Select employeeename, dept_code, salary From employee Where employee.salary in (select Max(salary)) from Employee group by dept_code having Max(salary))"},{"label":"D","text":"Select employeeename, dept_code, salary From employee Where employee.salary =(select Max(salary) from Employee group by dept_code)."}],"answer":"B","note":"B    SELECT MAX(salary) FROM Employee GROUP BY dept_code: This subquery returns the maximum salary for each dept_code. \nWHERE employee.salary IN (...): The main query then filters to select rows from employee where the salary matches any of the maximum salaries from th","key_point":"Subquery với toán tử IN hoặc = có thể dùng để tìm các bản ghi thỏa mãn điều kiện cực trị theo nhóm.","why_correct":"Câu lệnh B đúng vì subquery `(select Max(salary) from Employee group by dept_code)` trả về danh sách các mức lương cao nhất cho mỗi `dept_code`. Câu lệnh chính sau đó lọc ra các nhân viên có mức lương nằm trong danh sách này.","why_wrong":[{"label":"A","why":"Câu lệnh A sai vì `(salary)` trong subquery là không hợp lệ và `MAX(salary)` không được dùng với `GROUP BY` theo cách này."},{"label":"C","why":"Câu lệnh C sai cú pháp do có `MAX(salary))` thừa và `GROUP BY` không đúng vị trí."},{"label":"D","why":"Câu lệnh D sai vì toán tử `=` yêu cầu subquery trả về đúng một giá trị, trong khi subquery này trả về nhiều giá trị (mức lương cao nhất cho mỗi phòng ban)."}],"vocab":[{"word":"subquery","reading":"","meaning":"Một câu lệnh SELECT lồng bên trong một câu lệnh SQL khác."},{"word":"GROUP BY","reading":"","meaning":"Cụm từ dùng để nhóm các hàng có cùng giá trị trong một hoặc nhiều cột thành một hàng tóm tắt."},{"word":"MAX()","reading":"","meaning":"Hàm tổng hợp trả về giá trị lớn nhất trong một tập hợp các giá trị."}]},{"id":28,"slide":28,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which is the SQL statement that creates an updatable view? In this question, all the tables in the SQL statements are updatable.","options":[{"label":"A","text":"CREATE VIEW Ordered_Product(Product_No) AS SELECT DISTINCT Product_No FROM Order"},{"label":"B","text":"CREATE VIEW Order_List(Order_No, Product_Name, Order_Quantity) AS SELECT Order_No, Product_Name, Order_Quantity FROM Order, Product WHERE Order.Product_No=Product.Product_No"},{"label":"C","text":"CREATE VIEW Product_Order(Product_No, Order_Quantity) AS SELECT Product_No, SUM(Order_Quantity) FROM Order GROUP BY Product_No"},{"label":"D","text":"CREATE VIEW Expensive_Product(Product_No, Product_Name) AS SELECT Product_No, Product_Name FROM Product WHERE Product_Unit_Price\u003e1000"}],"answer":"D","note":"D","key_point":"Một view là updatable nếu nó được tạo từ một single base table và không chứa DISTINCT, GROUP BY, hay aggregate functions.","why_correct":"Option D tạo view `Expensive_Product` từ một single base table (`Product`) và chỉ sử dụng mệnh đề `WHERE` để lọc dữ liệu. View này không chứa `DISTINCT`, `GROUP BY`, `aggregate functions` hay `JOIN` nhiều table, nên nó là updatable.","why_wrong":[{"label":"A","why":"View này sử dụng `DISTINCT`, làm cho nó không updatable."},{"label":"B","why":"View này được tạo từ `JOIN` hai table (`Order` và `Product`), thường không updatable."},{"label":"C","why":"View này sử dụng `GROUP BY` và `aggregate function` (`SUM`), làm cho nó không updatable."}],"vocab":[{"word":"updatable view","reading":"","meaning":"Một view mà bạn có thể thực hiện các thao tác INSERT, UPDATE, DELETE trực tiếp lên nó."},{"word":"single base table","reading":"","meaning":"Một view được định nghĩa chỉ dựa trên một bảng cơ sở duy nhất."},{"word":"DISTINCT","reading":"","meaning":"Từ khóa loại bỏ các hàng trùng lặp trong kết quả truy vấn."},{"word":"GROUP BY","reading":"","meaning":"Mệnh đề nhóm các hàng có cùng giá trị trong một hoặc nhiều cột thành các nhóm."},{"word":"aggregate function","reading":"","meaning":"Hàm thực hiện tính toán trên một tập hợp các hàng và trả về một giá trị duy nhất (ví dụ: SUM, AVG, COUNT)."}]},{"id":29,"slide":29,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which statement is used to remove a column named E into the relation R?","options":[{"label":"A","text":"ALTER TABLE R DROP COLUMN E [DataType]"},{"label":"B","text":"ALTER TABLE R DROP COLUMN E"},{"label":"C","text":"ALTER TABLE R DELETE COLUMN E"},{"label":"D","text":"ALTER TABLE R DELETE COLUMN E [DataType]"}],"answer":"B","note":"B","key_point":"Sử dụng lệnh ALTER TABLE kèm mệnh đề DROP COLUMN để xóa một cột trong bảng.","why_correct":"Cú pháp chuẩn của SQL để xóa một cột khỏi một table là ALTER TABLE R DROP COLUMN E, không cần kèm theo DataType.","why_wrong":[{"label":"A","why":"Thừa phần DataType vì khi xóa cột ta không cần khai báo lại kiểu dữ liệu."},{"label":"C","why":"Dùng từ khóa DELETE thay vì DROP, cú pháp này không hợp lệ trong SQL."},{"label":"D","why":"Dùng từ khóa DELETE và thừa phần DataType."}],"vocab":[{"word":"ALTER TABLE","reading":"","meaning":"Câu lệnh SQL dùng để thay đổi cấu trúc của một table."},{"word":"DROP COLUMN","reading":"","meaning":"Mệnh đề dùng để xóa một cột khỏi table."}]},{"id":30,"slide":30,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"When does the Deleted temporary trigger table become populated?","options":[{"label":"A","text":"With DELETE and INSERT triggers"},{"label":"B","text":"With DELETE triggers only"},{"label":"C","text":"With DELETE, UPDATE, and INSERT triggers"},{"label":"D","text":"With DELETE and UPDATE triggers"}],"answer":"D","note":"D","key_point":"Temporary trigger tables Deleted and Inserted store affected rows during DML operations.","why_correct":"Bảng Deleted tạm thời lưu trữ các hàng bị xóa hoặc giá trị cũ trước khi thay đổi, do đó nó được điền dữ liệu khi thực thi các câu lệnh DELETE và UPDATE.","why_wrong":[{"label":"A","why":"INSERT triggers chỉ làm populate bảng Inserted chứ không làm thay đổi hay xóa dữ liệu cũ."},{"label":"B","why":"Bỏ qua UPDATE triggers, trong khi lệnh UPDATE cũng cần bảng Deleted để lưu giá trị cũ."},{"label":"C","why":"INSERT triggers không làm populate bảng Deleted vì không có hàng nào bị xóa."}],"vocab":[{"word":"trigger","reading":"","meaning":"Đoạn mã tự động thực thi trong cơ sở dữ liệu khi có sự kiện DML xảy ra."},{"word":"Deleted table","reading":"","meaning":"Bảng tạm thời trong SQL Server lưu trữ các bản ghi bị xóa hoặc giá trị trước khi update."}]},{"id":31,"slide":31,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"How to execute a procedure","options":[{"label":"A","text":"execute name_sp \u003cparameter\u003e"},{"label":"B","text":"exe name_sp \u003cparameter\u003e"},{"label":"C","text":"call name_sp \u003cparameter\u003e"},{"label":"D","text":"All the answers above"},{"label":"E","text":"a and b are correct"}],"answer":"E","note":"E","key_point":"Su dung lenh EXECUTE hoac EXEC de thuc thi mot stored procedure trong SQL Server.","why_correct":"Trong SQL Server, ca hai tu khoa EXECUTE va EXEC deu duoc ho tro de goi va thuc thi mot stored procedure kem theo tham so.","why_wrong":[{"label":"A","why":"Chi dung duoc EXECUTE nhung bo qua tu khoa EXEC."},{"label":"B","why":"Chi dung duoc EXEC nhung bo qua tu khoa EXECUTE."},{"label":"C","why":"Tu khoa CALL thuong duoc dung trong cac he he quan tri co so du lieu khac nhu MySQL, khong phai SQL Server."},{"label":"D","why":"Sai vi CALL khong ap dung cho SQL Server."}],"vocab":{"word":"stored procedure","reading":"","meaning":"Tap hop cac cau lenh SQL duoc luu tru san trong database de thuc thi lai."}},{"id":33,"slide":33,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Assuming UserProfile is a table containing a column Profession which accepts NULL value. What is the result of the below query. SET ANSI_NULLS OFF SELECT Profession FROM UserProfile WHERE (Profession \u003c\u003e NULL)","options":[{"label":"A","text":"Gives an error."},{"label":"B","text":"\u003c\u003e is not an operator in SQL Server"},{"label":"C","text":"Returns all Professions which has not null values."},{"label":"D","text":"None of the above."}],"answer":"C","note":"C","key_point":"Khi SET ANSI_NULLS OFF, toán tử so sánh với NULL trả về kết quả hợp lệ.","why_correct":"Đáp án C đúng vì khi bật chế độ SET ANSI_NULLS OFF, biểu thức (Profession \u003c\u003e NULL) cho phép so sánh và trả về các tuple có giá trị khác NULL, tức là các giá trị not null.","why_wrong":[{"label":"A","why":"Không gây lỗi cú pháp trong SQL Server."},{"label":"B","why":"\u003c\u003e là toán tử so sánh khác hợp lệ trong SQL Server."}],"vocab":[{"word":"ANSI_NULLS","reading":"","meaning":"Cài đặt tuân thủ chuẩn ISO cho các phép so sánh với giá trị NULL."},{"word":"NULL","reading":"","meaning":"Đại diện cho giá trị bị thiếu hoặc chưa biết trong database."}]},{"id":34,"slide":34,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"A relation R(X, Y, Z) has functional dependencies XY → Z and Z → Y. Which is the highest normal form that R satisfies, assuming X, Y, Z are single attributes and (X, Y) is the only candidate key?","options":[{"label":"A","text":"First Normal Form (1NF) only"},{"label":"B","text":"Second Normal Form (2NF) but not Third Normal Form (3NF)"},{"label":"C","text":"Third Normal Form (3NF) but not Boyce-Codd Normal Form (BCNF)"},{"label":"D","text":"Boyce-Codd Normal Form (BCNF)"}],"answer":"C","note":"C","key_point":"Kiểm tra các functional dependency để xác định normal form của relation schema.","why_correct":"Relation R đạt 2NF vì tất cả các non-prime attribute phụ thuộc đầy đủ vào candidate key (X, Y). R đạt 3NF vì với Z → Y, Z không phải super key nhưng Y là prime attribute. R không đạt BCNF vì trong Z → Y, Z không chứa candidate key nào.","why_wrong":[{"label":"A","why":"Sai vì R thỏa mãn các điều kiện cao hơn 1NF như 2NF và 3NF."},{"label":"B","why":"Sai vì R thực sự thỏa mãn 3NF do Y là prime attribute."},{"label":"D","why":"Sai vì vướng functional dependency Z → Y mà Z không phải là super key."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Sự phụ thuộc hàm giữa các tập thuộc tính trong relation."},{"word":"candidate key","reading":"","meaning":"Khóa ứng viên định danh duy nhất cho mỗi tuple."},{"word":"normal form","reading":"","meaning":"Dạng chuẩn dùng để đánh giá mức độ chuẩn hóa của cơ sở dữ liệu."}]},{"id":35,"slide":35,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"Assume that the table Cars and it\u0027s columns are ready.","stem":"Which of the following to update the \"colour\" field to \"Silver\" for all records where model is \"Escape\" from Cars table?","options":[{"label":"A","text":"UPDATE Cars\nSET colour = \u0027Silver\u0027\nWHERE model = \u0027Escape\u0027;"},{"label":"B","text":"UPDATE Cars\nSET model = \u0027Escape\u0027\nWHERE colour = \u0027Silver\u0027;"},{"label":"C","text":"UPDATE Cars\nSET colour = \u0027Silver\u0027"},{"label":"D","text":"UPDATE FROM Cars\nSET colour = \u0027Silver\u0027\nWHERE model = \u0027Escape\u0027;"}],"answer":"A","note":"A","key_point":"Sử dụng cú pháp UPDATE và SET để thay đổi giá trị trong bảng.","why_correct":"Option A dùng đúng cú pháp SQL UPDATE với mệnh đề SET để gán giá trị mới \u0027Silver\u0027 cho cột colour, và WHERE để lọc các dòng có model là \u0027Escape\u0027.","why_wrong":[{"label":"B","why":"Nhầm lẫn giữa cột cần cập nhật và điều kiện WHERE."},{"label":"C","why":"Thiếu mệnh đề WHERE nên sẽ cập nhật toàn bộ bảng."},{"label":"D","why":"Sai cú pháp SQL khi dùng FROM ngay sau UPDATE."}],"vocab":[{"word":"UPDATE","reading":"","meaning":"Câu lệnh SQL dùng để cập nhật dữ liệu trong bảng."},{"word":"SET","reading":"","meaning":"Mệnh đề chỉ định giá trị mới cho cột."}]},{"id":36,"slide":36,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Assume that all tables, columns are ready, and each customer can place one or more orders. How can you retrieve all customers who have not made any purchases? (choose two options)","options":[{"label":"A","text":"SELECT c.CustomerID, c.CustomerName, c.Email, c.CreatedDate\nFROM dbo.Customers AS c\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM dbo.Orders AS o\n    WHERE o.CustomerID = c.CustomerID\n);"},{"label":"B","text":"SELECT c.CustomerID, c.CustomerName, c.Email, c.CreatedDate\nFROM dbo.Customers AS c LEFT JOIN dbo.Orders AS o\nON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL;"},{"label":"C","text":"SELECT c.CustomerID, c.CustomerName, c.Email, c.CreatedDate\nFROM dbo.Customers AS c INNER JOIN dbo.Orders AS o\nON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL;"},{"label":"D","text":"SELECT c.CustomerID, c.CustomerName, c.Email, c.CreatedDate\nFROM dbo.Customers AS c RIGHT JOIN dbo.Orders AS o\nON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL;"}],"answer":"AB","note":"AB","key_point":"Dùng NOT EXISTS hoặc LEFT JOIN kết hợp WHERE IS NULL để tìm dữ liệu không khớp.","why_correct":"Option A dùng NOT EXISTS để lọc các customer không xuất hiện trong bảng Orders. Option B dùng LEFT JOIN lấy toàn bộ customers, sau đó lọc những dòng mà phần Orders bị NULL (chứng tỏ không có đơn hàng nào).","why_wrong":[{"label":"C","why":"INNER JOIN chỉ trả về các customer có matching orders, không thể tìm ra customer chưa mua hàng."},{"label":"D","why":"RIGHT JOIN giữ lại tất cả orders và chỉ lấy customers khớp với orders, làm mất các customer không mua hàng."}],"vocab":[{"word":"NOT EXISTS","reading":"","meaning":"Toán tử kiểm tra sự tồn tại, trả về true nếu subquery không trả về dòng nào."},{"word":"LEFT JOIN","reading":"","meaning":"Phép kết nối giữ lại tất cả các dòng ở bảng bên trái."}]},{"id":37,"slide":37,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider the relation:\nR(A,B,C,D,E,F) and functional dependencies :\nA,B → C , B → C → A D ; D → E ; C,F → B","stem":"Which of the following functional dependencies exists in the relation?\nf1: AB → D ; f2: A → E ; f3: C,F → A ; f4: C → E","options":[{"label":"A","text":"f1, f3, f4"},{"label":"B","text":"f1, f2, f3, f4"},{"label":"C","text":"f2, f3, f4"},{"label":"D","text":"f2, f4"},{"label":"E","text":"f1, f2, f4"}],"answer":"A","note":"A","key_point":"Sử dụng luật suy diễn Armstrong để tìm các functional dependency được dẫn xuất.","why_correct":"Dựa vào các functional dependency ban đầu và luật bắc cầu, ta suy ra được AB → D thông qua B → A D, còn f3 và f4 cũng thỏa mãn qua các bước rút gọn và bắc cầu.","why_wrong":[{"label":"B","why":"Chứa f2 (A → E) là không thể suy luận được từ tập functional dependency đã cho."},{"label":"C","why":"Thiếu f1 (AB → D) vốn là một kết quả suy luận đúng."},{"label":"D","why":"Thiếu f1 và f3, vốn đều là các functional dependency đúng."},{"label":"E","why":"Chứa f2 (A → E) là sai."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các thuộc tính trong quan hệ cơ sở dữ liệu."},{"word":"Armstrong\u0027s axioms","reading":"","meaning":"Các luật suy diễn dùng để tìm tập các phụ thuộc hàm logic."}]},{"id":38,"slide":38,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Consider a relation with schema R(A, B, C, D) and FD\u0027s (A → B, B → C, B → D, D → A). Which of the following is the {A}+ ?","options":[{"label":"A","text":"{A}"},{"label":"B","text":"{A B C D}"},{"label":"C","text":"{A B C}"},{"label":"D","text":"{A B}"}],"answer":"B","note":"B (Đọc ở slide số 26 để hiểu)","key_point":"Áp dụng các FD liên tiếp để tìm attribute closure cho đến khi không thể mở rộng.","why_correct":"Bắt đầu từ A, ta dùng A -\u003e B để suy ra B. Từ B, ta dùng B -\u003e C và B -\u003e D để suy ra C và D. Cuối cùng ta thu được tập tất cả các attribute {A B C D}.","why_wrong":[{"label":"A","why":"Chỉ chứa chính nó, quên áp dụng các FD."},{"label":"C","why":"Thiếu attribute D do quên bước B -\u003e D."},{"label":"D","why":"Thiếu các attribute C và D."}],"vocab":[{"word":"functional dependencies","reading":"","meaning":"Phụ thuộc hàm, mô tả mối quan hệ ràng buộc giữa các attribute trong schema."},{"word":"attribute closure","reading":"","meaning":"Tập hợp tất cả các attribute có thể được suy diễn từ một tập attribute cho trước."}]},{"id":39,"slide":39,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider a relation R(A,B,C,D) and FD’s {AB → C, C→D, D → A}","stem":"What are all the keys of R?","options":[{"label":"A","text":"AB, BC, BD"},{"label":"B","text":"AB, BC, AD"},{"label":"C","text":"BC, BD"},{"label":"D","text":"BC, BC, BD"}],"answer":"A","note":"A","key_point":"Candidate key là tập thuộc tính tối thiểu xác định được tất cả thuộc tính khác.","why_correct":"Ta tính closure cho từng tập: (AB)+ = {A,B,C,D}, (BC)+ = {B,C,D,A}, (BD)+ = {B,D,A,C}. Vì cả ba tập đều bao phủ R và không chứa tập con nào có closure tương tự, chúng là các candidate key.","why_wrong":[{"label":"B","why":"AD+ = {A,D,C}, thiếu B nên không phải là key."},{"label":"C","why":"Thiếu AB, tập key chưa đầy đủ."},{"label":"D","why":"Liệt kê trùng lặp BC, không đúng định dạng tập hợp."}],"vocab":[{"word":"Candidate key","reading":"","meaning":"Tập thuộc tính tối thiểu xác định duy nhất mọi thuộc tính trong relation."},{"word":"Functional dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong đó một tập xác định tập khác."},{"word":"Closure","reading":"","meaning":"Tập hợp tất cả các thuộc tính có thể suy ra từ một tập thuộc tính cho trước."}]},{"id":40,"slide":40,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider a relation R(A,B,C,D,E) with functional dependencies:\nAB -\u003e C, B -\u003e C, E -\u003e D and C -\u003e E.\nWhat is/are the key(s) for R","stem":"What is/are the key(s) for R","options":[{"label":"A","text":"AC"},{"label":"B","text":"AD"},{"label":"C","text":"AB"},{"label":"D","text":"AE"}],"answer":"C","note":"C","key_point":"Key là tập thuộc tính tối thiểu có closure chứa tất cả thuộc tính của lược đồ.","why_correct":"Ta có (AB)+ = {A, B, C, E, D} = R. Vì AB là tập tối thiểu (A+ không đủ, B+ không đủ), nên AB là candidate key.","why_wrong":[{"label":"A","why":"(AC)+ = {A, C, E, D}, thiếu B."},{"label":"B","why":"(AD)+ = {A, D}, thiếu B, C, E."},{"label":"D","why":"(AE)+ = {A, E, D}, thiếu B, C."}],"vocab":[{"word":"Functional dependency","reading":"","meaning":"Sự phụ thuộc hàm giữa các tập thuộc tính trong một quan hệ."},{"word":"Closure","reading":"","meaning":"Tập hợp tất cả các thuộc tính có thể suy dẫn được từ một tập thuộc tính cho trước."},{"word":"Candidate key","reading":"","meaning":"Tập thuộc tính tối thiểu xác định duy nhất mọi thuộc tính khác trong lược đồ."}]},{"id":41,"slide":41,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Create a stored procedure named GetEmployeeByID that accepts an EmployeeID as a parameter and returns the corresponding employee\u0027s details.","options":[{"label":"A","text":"CREATE PROCEDURE GetEmployeeByID@EmployeeID INTASBEGINSELECT * FROM Employees WHERE EmployeeID = @EmployeeID;END;"},{"label":"B","text":"CREATE PROCEDURE GetEmployeeByIDDeclare @EmployeeID INTASBEGINSELECT * FROM Employees WHERE EmployeeID = @EmployeeID;END;"},{"label":"C","text":"CREATE PROCEDURE GetEmployeeByID@EmployeeID INTASBEGINSELECT * FROM Employees;END;"},{"label":"D","text":"CREATE PROCEDURE GetEmployeeByIDASBEGINDeclare @EmployeeID INTSELECT * FROM Employees WHERE EmployeeID = @EmployeeID;END;"}],"answer":"A","note":"A","key_point":"Stored procedure sử dụng tham số đầu vào ngay sau tên procedure.","why_correct":"Option A định nghĩa đúng tham số @EmployeeID ngay sau tên procedure và sử dụng nó trong câu lệnh SELECT để lọc dữ liệu.","why_wrong":[{"label":"B","why":"Sai cú pháp vì dùng từ khóa DECLARE để khai báo tham số thay vì khai báo trực tiếp."},{"label":"C","why":"Thiếu điều kiện WHERE, trả về toàn bộ bảng thay vì lọc theo ID."},{"label":"D","why":"Khai báo biến bên trong thân procedure thay vì nhận tham số từ bên ngoài."}],"vocab":[{"word":"Stored procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ trong database để thực thi lại nhiều lần."},{"word":"Parameter","reading":"","meaning":"Tham số truyền vào để procedure xử lý dữ liệu linh hoạt hơn."}]},{"id":42,"slide":42,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider the relation:OrderDetail (orderNumber, productCode, productName, quantity, dateOrdered, salesDiscount)And FDs{ orderNumber, productCode-\u003equantity,orderNumber-\u003edateOrdered,productCode-\u003eproductName, salesDiscount}And the key of OrderDetail is {orderNumber, productCode}","stem":"Which of the following is full dependency on the key?","options":[{"label":"A","text":"orderNumber, productCode-\u003equantity"},{"label":"B","text":"orderNumber-\u003edateOrdered"},{"label":"C","text":"productCode-\u003eproductName"},{"label":"D","text":"productCode-\u003eproductName, salesDiscount"}],"answer":"A","note":"A","key_point":"Full functional dependency yêu cầu thuộc tính phụ thuộc vào toàn bộ khóa, không phải tập con.","why_correct":"Vì {orderNumber, productCode} là khóa, quantity phụ thuộc vào cả hai thuộc tính này. Đây là ví dụ về full functional dependency.","why_wrong":[{"label":"B","why":"Đây là partial dependency vì dateOrdered chỉ phụ thuộc vào một phần của khóa là orderNumber."},{"label":"C","why":"Đây là partial dependency vì productName chỉ phụ thuộc vào productCode."},{"label":"D","why":"Đây là partial dependency vì các thuộc tính này chỉ phụ thuộc vào productCode."}],"vocab":[{"word":"Full functional dependency","reading":"","meaning":"Sự phụ thuộc hàm hoàn toàn vào toàn bộ tập thuộc tính của khóa."},{"word":"Partial dependency","reading":"","meaning":"Sự phụ thuộc hàm vào một tập con thực sự của khóa chính."}]},{"id":43,"slide":43,"section":"Đại số quan hệ","prompt":"","setup":"Consider the two relations from our running movie database:Movies(title, year, length, genre, studioName, producerC#)MovieExec(name, address, cert#, netWorth)The producerC# component of each Movies tuple must also appear in the cert# component of someMovieExec tuple.","stem":"How can we express this integrity constraint in relational algebra?","options":[{"label":"A","text":"Π_(producerC#) (Movies)=Π_(cert#) (MovieExec)"},{"label":"B","text":"Π_(producerC#) (Movies)⊆ Π_(cert#) (MovieExec)"},{"label":"C","text":"Π_(cert#) (MovieExec)⊆ Π_(producerC#) (Movies)"},{"label":"D","text":"Π_(producerC#) (Movies)≠Π_(cert#) (MovieExec)"}],"answer":"B","note":"B","key_point":"Referential integrity constraint yêu cầu tập giá trị Foreign Key phải là tập con của Primary Key.","why_correct":"Constraint yêu cầu mọi producerC# trong Movies phải tồn tại trong tập hợp các cert# của MovieExec. Điều này tương đương với việc tập hợp các producerC# là tập con (⊆) của tập hợp các cert#.","why_wrong":[{"label":"A","why":"Yêu cầu hai tập hợp phải bằng nhau, quá chặt chẽ vì không phải mọi MovieExec đều cần sản xuất phim."},{"label":"C","why":"Đảo ngược logic, yêu cầu mọi MovieExec phải là producer của ít nhất một bộ phim."},{"label":"D","why":"Phép toán bất đẳng thức không mô tả mối quan hệ ràng buộc dữ liệu."}],"vocab":[{"word":"Referential integrity","reading":"","meaning":"Ràng buộc toàn vẹn tham chiếu đảm bảo tính nhất quán giữa các bảng."},{"word":"Foreign key","reading":"","meaning":"Trường dữ liệu tham chiếu đến Primary Key của một bảng khác."}]},{"id":44,"slide":44,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider the relation: R(A,B,C) and functional dependencies: AB → CB ; C → AD ; A → C","stem":"Which set of functional dependencies is equivalent to the original set?","options":[{"label":"A","text":"AB → C, C → A, C → D, A → C"},{"label":"B","text":"A → C, C → D"},{"label":"C","text":"AB → D"},{"label":"D","text":"AB → CBD"},{"label":"E","text":"AB → C, C → A, C → D, A → C, CD → A"}],"answer":"A","note":"A","key_point":"Tập các Functional Dependencies tương đương khi chúng có cùng Closure.","why_correct":"Tập A bao gồm {AB → C, C → A, C → D, A → C}. Từ A → C và C → D suy ra A → D. Từ AB → C và A → C suy ra AB → C. Tập này bao phủ toàn bộ các phụ thuộc ban đầu.","why_wrong":[{"label":"B","why":"Thiếu các phụ thuộc liên quan đến B."},{"label":"C","why":"Chỉ là một hệ quả, không tương đương với toàn bộ tập ban đầu."},{"label":"D","why":"Chỉ là một cách viết gộp, không liệt kê đầy đủ các phụ thuộc cơ bản."},{"label":"E","why":"Chứa phụ thuộc dư thừa CD → A vì C → A đã có sẵn."}],"vocab":[{"word":"Functional Dependencies","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong một relation."},{"word":"Closure","reading":"","meaning":"Tập hợp tất cả các thuộc tính có thể suy ra từ một tập thuộc tính cho trước."}]},{"id":45,"slide":45,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Consider the relation:\nOrderDetail (orderNumber, productCode, productName, quantity, dateOrdered, salesDiscount)\nAnd FDs{ orderNumber, productCode-\u003equantity,\norderNumber-\u003edateOrdered,\nproductCode-\u003eproductName, salesDiscount}\nAnd the key of OrderDetail is {orderNumber, productCode}","stem":"Which of the following is full dependency on the key?","options":[{"label":"A","text":"orderNumber, productCode-\u003equantity"},{"label":"B","text":"orderNumber-\u003edateOrdered"},{"label":"C","text":"productCode-\u003eproductName"},{"label":"D","text":"productCode-\u003eproductName, salesDiscount"}],"answer":"A","note":"A","key_point":"Full functional dependency yêu cầu tập thuộc tính vế trái phải là siêu khóa tối thiểu.","why_correct":"Tùy chọn A đúng vì vế trái là {orderNumber, productCode} chính là primary key đầy đủ của bảng OrderDetail và quyết định thuộc tính quantity.","why_wrong":[{"label":"B","why":"Chỉ phụ thuộc vào một phần của primary key (orderNumber), vi phạm tính full functional dependency."},{"label":"C","why":"Chỉ phụ thuộc vào productCode, đây là partial dependency."},{"label":"D","why":"Vế trái chỉ là productCode, chưa đủ tập primary key của quan hệ."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các tập thuộc tính trong quan hệ."},{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi tuple."}]},{"id":46,"slide":46,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"Given a relation:\nLaptop(model, speed, ram, hd, price)\n\nWhat will this function return when called with dbo.GetLaptopPrice(1)?\n\nCREATE FUNCTION dbo.GetLaptopPrice (@model INT)\nRETURNS BIGINT\nAS\nBEGIN\nDECLARE @price BIGINT\nSELECT @price = price FROM Laptop WHERE model = @model\nRETURN @price\nEND","stem":"What will this function return when called with dbo.GetLaptopPrice(1)?","options":[{"label":"A","text":"The average laptop price with model = 1"},{"label":"B","text":"The price of all laptops"},{"label":"C","text":"The price of laptop with model = 1"},{"label":"D","text":"The model of laptop with price = 1"}],"answer":"C","note":"C","key_point":"Scalar function trả về một giá trị duy nhất dựa trên điều kiện WHERE.","why_correct":"Hàm thực hiện truy vấn SELECT price FROM Laptop WHERE model = @model, nên nó trả về giá trị price của dòng có model bằng 1.","why_wrong":[{"label":"A","why":"Không có hàm tính toán trung bình (AVG) trong câu lệnh SELECT."},{"label":"B","why":"Câu lệnh có điều kiện WHERE model = @model nên chỉ lấy một dòng, không lấy tất cả."},{"label":"D","why":"Câu lệnh SELECT lấy cột price, không phải cột model."}],"vocab":[{"word":"Scalar function","reading":"","meaning":"Hàm trả về một giá trị đơn lẻ."},{"word":"SELECT","reading":"","meaning":"Câu lệnh truy vấn dữ liệu từ bảng."}]},{"id":47,"slide":47,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"If a relation is in BCNF, then it is also in","options":[{"label":"A","text":"1 NF"},{"label":"B","text":"2 NF"},{"label":"C","text":"3 NF"},{"label":"D","text":"All of the mentioned"}],"answer":"D","note":"D","key_point":"BCNF là dạng chuẩn mạnh hơn 3NF, 2NF và 1NF.","why_correct":"Theo hệ thống phân cấp normalization, nếu một relation đạt chuẩn BCNF thì nó đã thỏa mãn tất cả các điều kiện của 3NF, 2NF và 1NF.","why_wrong":[{"label":"A","why":"Chỉ đúng một phần vì BCNF còn thỏa mãn cả 2NF và 3NF."},{"label":"B","why":"Chỉ đúng một phần vì BCNF còn thỏa mãn cả 1NF và 3NF."},{"label":"C","why":"Chỉ đúng một phần vì BCNF còn thỏa mãn cả 1NF và 2NF."}],"vocab":[{"word":"BCNF","reading":"","meaning":"Boyce-Codd Normal Form, dạng chuẩn cao hơn 3NF."},{"word":"Normalization","reading":"","meaning":"Quá trình thiết kế schema để giảm thiểu data redundancy."}]},{"id":48,"slide":48,"section":"Đại số quan hệ","prompt":"","setup":"For the following relation:\nStudent\nID | Name | City | Gender\nSE1234 | Le Hong Phong | HCM | Male\nSE1235 | Le Hong Hanh | HCM | Female\nSE1236 | Tran Binh Trong | HN | Male","stem":"Use Algebraic query language to list all name and city of students in HCM and Male?","options":[{"label":"A","text":"ΠName,City(σCity=\u0027HCM\u0027 AND Gender=\u0027Male\u0027 (Student))"},{"label":"B","text":"ΠName,City(σCity=\u0027HCM\u0027 AND Gender=\u0027Male\u0027 (Student))"},{"label":"C","text":"ΠName,City(σCity=\u0027HCM\u0027 \u0026\u0026 Gender=\u0027Male\u0027 (Student))"},{"label":"D","text":"ΠName,City(σCity=\u0027HCM\u0027 \u0026 Gender=\u0027Male\u0027 (Student))"}],"answer":"A","note":"A\ncâu này đề k bảo khoanh 2 đáp án, này lỗi đề nên A hay B cũng đc","key_point":"Sử dụng phép selection (σ) để lọc tuple và phép projection (Π) để chọn thuộc tính.","why_correct":"Biểu thức `σCity=\u0027HCM\u0027 AND Gender=\u0027Male\u0027 (Student)` chọn các tuple từ relation Student mà City là \u0027HCM\u0027 và Gender là \u0027Male\u0027. Sau đó, `ΠName,City(...)` chiếu (projection) các thuộc tính Name và City từ kết quả đã chọn.","why_wrong":[{"label":"B","why":"B giống hệt A, nên về mặt cú pháp cũng đúng, nhưng A là đáp án được chỉ định."},{"label":"C","why":"Sử dụng `\u0026\u0026` thay vì `AND` cho toán tử logic, không phải cú pháp chuẩn của relational algebra."},{"label":"D","why":"Sử dụng `\u0026` thay vì `AND` cho toán tử logic, không phải cú pháp chuẩn của relational algebra."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Đại số quan hệ, một ngôn ngữ truy vấn thủ tục cho cơ sở dữ liệu quan hệ."},{"word":"projection","reading":"","meaning":"Phép chiếu (Π), chọn các cột (attribute) cụ thể từ một relation."},{"word":"selection","reading":"","meaning":"Phép chọn (σ), lọc các hàng (tuple) từ một relation dựa trên một điều kiện."},{"word":"attribute","reading":"","meaning":"Thuộc tính, tên của một cột trong một relation."},{"word":"tuple","reading":"","meaning":"Bộ, một hàng trong một relation."}]},{"id":49,"slide":49,"section":"Đại số quan hệ","prompt":"","setup":"Employee\nName | City | Gender\nNguyen Trung Truc | HCM | Male\nLe Hong Son | HCM | Male\n\nCustomer\nName | City | Gender\nNguyen Trung Truc | HCM | Male\nTran Tuyet Nhi | HN | Female\n\nand\n\nEmployee \\ Customer","stem":"What is the result of the Difference operation?","options":[{"label":"A","text":"Name | City | Gender\nLe Hong Son | HCM | Male"},{"label":"B","text":"Name | City | Gender\nNguyen Trung Truc | HCM | Male\nTran Tuyet Nhi | HN | Female"},{"label":"C","text":"Name | City | Gender\nNguyen Trung Truc | HCM | Male\nLe Hong Son | HCM | Male"},{"label":"D","text":"Name | City | Gender\nNguyen Trung Truc | HCM | Male\nLe Hong Son | HCM | Male\nTran Tuyet Nhi | HN | Female"}],"answer":"A","note":"A","key_point":"Phép trừ R \\ S trả về các tuple thuộc R nhưng không thuộc S.","why_correct":"Phép toán Employee \\ Customer lấy các dòng chỉ có trong Employee mà không có trong Customer. Tuple \u0027Nguyen Trung Truc\u0027 xuất hiện ở cả hai bảng nên bị loại, chỉ còn lại \u0027Le Hong Son\u0027.","why_wrong":[{"label":"B","why":"Đây là kết quả của phép Customer \\ Employee."},{"label":"C","why":"Đây là toàn bộ bảng Employee ban đầu."},{"label":"D","why":"Đây là kết quả của phép hợp (Union) Employee ∪ Customer."}],"vocab":[{"word":"Difference operation","reading":"","meaning":"Phép toán trừ trong đại số quan hệ."},{"word":"Tuple","reading":"","meaning":"Một dòng (bản ghi) trong quan hệ"}]},{"id":50,"slide":50,"section":"Đại số quan hệ","prompt":"","setup":"For the following relations:\n\nProduct\nmaker | model | type\nAsus | 1 | Laptop\nHP | 2 | Laptop\nHP | 3 | PC\nHP | 4 | Printer\nDell | 5 | Laptop\nDell | 6 | PC\n\nPC\nmodel | speed | ram | hd | price\n3 | 2.00 | 8 | 500 | 10000000\n6 | 3.00 | 16 | 500 | 15000000\n\nLaptop\nmodel | speed | ram | hd | screen | price\n1 | 2.00 | 16 | 256 | 14 | 20000000\n2 | 3.00 | 8 | 512 | 15 | 25000000\n\nPrinter\nmodel | color | type | price\n4 | TRUE | Laser | 8000000\n4 | FALSE | 3D | 30000000","stem":"Use Algebraic query language to find manufactures that sell PCs, but not Laptop\u0027s","options":[{"label":"A","text":"Πmaker (σtype=\u0027Laptop\u0027 (Product)) \\ Πmaker (σtype=\u0027Laptop\u0027 (Product))"},{"label":"B","text":"Πmaker (σtype=\u0027Laptop\u0027 (Product)) \\ Πmaker (σtype=\u0027PC\u0027 (Product))"},{"label":"C","text":"Πmaker (σtype=\u0027PC\u0027 (Product)) \\ Πmaker (σtype=\u0027Laptop\u0027 (Product))"},{"label":"D","text":"Πmaker (σtype=\u0027PC\u0027 (Product)) \\ Πmaker (σtype=\u0027PC\u0027 (Product))"}],"answer":"C","note":"C","key_point":"Dùng phép trừ tập hợp (\\) giữa danh sách maker làm PC và danh sách maker làm Laptop.","why_correct":"Πmaker (σtype=\u0027PC\u0027 (Product)) lấy ra danh sách các maker có sản xuất PC. Phép trừ tập hợp (\\) loại bỏ các maker nằm trong danh sách sản xuất Laptop Πmaker (σtype=\u0027Laptop\u0027 (Product)), cho ra kết quả đúng yêu cầu.","why_wrong":[{"label":"A","why":"Lấy danh sách maker sản xuất Laptop trừ đi chính nó, kết quả luôn ra tập rỗng."},{"label":"B","why":"Tìm các maker sản xuất Laptop nhưng không sản xuất PC, bị ngược yêu cầu đề bài."},{"label":"D","why":"Lấy danh sách maker sản xuất PC trừ đi chính nó, kết quả luôn ra tập rỗng."}],"vocab":[{"word":"set difference","reading":"","meaning":"Phép trừ tập hợp trong đại số quan hệ (ký hiệu \\)"},{"word":"projection","reading":"","meaning":"Phép chiếu chọn các cột thuộc tính (ký hiệu Π)"},{"word":"selection","reading":"","meaning":"Phép chọn các dòng thỏa mãn điều kiện (ký hiệu σ)"}]},{"id":51,"slide":51,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"UPDATE instructor\n___ salary = salary * 1.05;","stem":"Fill in with correct keyword to update the instructor relation.","options":[{"label":"A","text":"Where"},{"label":"B","text":"Set"},{"label":"C","text":"In"},{"label":"D","text":"Select"}],"answer":"B","note":"B","key_point":"Sử dụng từ khóa SET trong câu lệnh UPDATE để gán giá trị mới cho cột.","why_correct":"Cú pháp chuẩn của câu lệnh UPDATE trong SQL yêu cầu mệnh đề SET để chỉ định cột nào cần cập nhật và giá trị mới của nó.","why_wrong":[{"label":"A","why":"WHERE dùng để lọc điều kiện các dòng cần update chứ không dùng để gán giá trị."},{"label":"C","why":"IN dùng trong các điều kiện kiểm tra tập hợp, không dùng trong UPDATE."},{"label":"D","why":"SELECT dùng để truy vấn dữ liệu, không dùng để sửa đổi dữ liệu."}],"vocab":[{"word":"UPDATE","reading":"","meaning":"Câu lệnh SQL dùng để cập nhật dữ liệu trong bảng."},{"word":"SET","reading":"","meaning":"Từ khóa đi kèm với UPDATE để gán giá trị mới cho các cột."}]},{"id":52,"slide":52,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"Insert into Students ______ (32, N\u0027Ilona Bush\u0027, N\u0027Female\u0027);","stem":"In the given query which of the keyword has to be inserted ?","options":[{"label":"A","text":"Into"},{"label":"B","text":"Set"},{"label":"C","text":"Where"},{"label":"D","text":"Values"}],"answer":"D","note":"D","key_point":"Dùng keyword Values khi thêm dữ liệu mới bằng câu lệnh INSERT.","why_correct":"Câu lệnh INSERT INTO yêu cầu mệnh đề Values để chỉ định danh sách giá trị cần thêm vào các cột của table.","why_wrong":[{"label":"A","why":"Dùng từ khóa Into ngay sau INSERT, không đặt ở vị trí này."},{"label":"B","why":"Dùng từ khóa Set trong câu lệnh UPDATE để gán giá trị mới."},{"label":"C","why":"Dùng mệnh đề Where để lọc điều kiện, không dùng để thêm dữ liệu."}],"vocab":[{"word":"INSERT INTO","reading":"","meaning":"Câu lệnh SQL dùng để thêm dòng dữ liệu mới vào table."},{"word":"Values","reading":"","meaning":"Mệnh đề chứa danh sách giá trị tương ứng để thêm vào table."}]},{"id":53,"slide":53,"section":"Mô hình ER","prompt":"","setup":"","stem":"Let E1 and E2 be two entities in an E/R diagram with simple single-valued attributes. R1 and R2 are two relationships between E1 and E2, where R1 is one-to-many and R2 is many-to-many. R1 and R2 do not have any attributes of their own. What is the minimum","options":[{"label":"A","text":"2"},{"label":"B","text":"3"},{"label":"C","text":"4"},{"label":"D","text":"5"}],"answer":"B","note":"B","key_point":"Mỗi relationship không có thuộc tính riêng giữa hai entity sẽ được chuyển thành một relation riêng trong relational schema.","why_correct":"Entity E1 và E2 cần 2 relations. Relationship R1 (one-to-many) gộp vào entity phía \u0027many\u0027 nên không tạo relation mới. Relationship R2 (many-to-many) không có thuộc tính riêng vẫn cần 1 relation chứa các primary key của E1 và E2. Tổng cộng có 2 + 0 + 1 = 3 relations.","why_wrong":[{"label":"A","why":"Chỉ tính 2 entity mà bỏ qua relation many-to-many R2."},{"label":"C","why":"Tính thừa relation cho R1 vốn đã được gộp vào entity phía \u0027many\u0027."},{"label":"D","why":"Đếm sai số lượng relation sinh ra từ mô hình E/R."}],"vocab":[{"word":"relationship","reading":"","meaning":"Mối quan hệ giữa các entity trong mô hình E/R."},{"word":"relation","reading":"","meaning":"Bảng trong cơ sở dữ liệu quan hệ (relational schema)."},{"word":"many-to-many","reading":"","meaning":"Loại quan hệ nhiều-nhiều, luôn cần tạo một relation riêng."}]},{"id":54,"slide":54,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Given following schema R(A, B, C, D) and S = {A → B, B → C, C → D}","stem":"Compute {A}+ ?","options":[{"label":"A","text":"AB"},{"label":"B","text":"ABC"},{"label":"C","text":"ABCD"},{"label":"D","text":"BCD"}],"answer":"C","note":"C","key_point":"Tìm closure của một tập attribute bằng cách áp dụng lặp lại các functional dependency.","why_correct":"Bắt đầu từ A, theo A → B ta có B, tiếp theo từ B → C ta có C, và từ C → D ta có D. Kết quả là {A}+ bao gồm toàn bộ ABCD.","why_wrong":[{"label":"A","why":"Chỉ dừng lại ở AB và bỏ qua các dependency tiếp theo."},{"label":"B","why":"Thiếu attribute D vì quên mất dependency C → D."},{"label":"D","why":"Thiếu attribute A ban đầu trong closure."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các attribute trong relational database."},{"word":"attribute","reading":"","meaning":"Cột hoặc thuộc tính trong một relation schema."}]},{"id":55,"slide":55,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Given relation R(X, Y, Z, W) with the set of functional dependencies:\nF = { X → Y, Y → Z, Z → W }","stem":"Which of the following is a key for R?","options":[{"label":"A","text":"X"},{"label":"B","text":"Y"},{"label":"C","text":"XZ"},{"label":"D","text":"XY"}],"answer":"A","note":"A\nGiải thích: Từ X → Y, Y → Z, Z → W suy ra X+ = {X,Y,Z,W}, nên X là khóa của R.","key_point":"Attribute closure của khóa phải chứa toàn bộ các attribute của relation schema.","why_correct":"Dựa vào F = { X → Y, Y → Z, Z → W }, ta tính attribute closure X+ = {X, Y, Z, W}. Vì X+ chứa tất cả các attribute của R, X là một candidate key.","why_wrong":[{"label":"B","why":"Y+ = {Y, Z, W}, thiếu X nên không xác định được toàn bộ relation."},{"label":"C","why":"XZ+ = {X, Y, Z, W}, nhưng X đã là superkey tối thiểu (minimal), nên XZ chứa thừa attribute."},{"label":"D","why":"XY+ = {X, Y, Z, W}, nhưng Y là thừa vì X đã quyết định Y."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm, ràng buộc giữa hai tập attribute trong một relation."},{"word":"attribute closure","reading":"","meaning":"Tập hợp tất cả các attribute có thể được xác định từ một tập attribute cho trước."}]},{"id":56,"slide":56,"section":"Truy vấn SQL","prompt":"","setup":"Given two relations:Printer(maker, model, type)PC(model, speed, ram, hd, ..., price)","stem":"What does this query return?SELECT makerFROM ProductWHERE model NOT IN (SELECT modelFROM PC);","options":[{"label":"A","text":"Makers of all devices"},{"label":"B","text":"Makers that also build PCs"},{"label":"C","text":"Makers of non-PC devices"},{"label":"D","text":"Makers of PCs only"}],"answer":"C","note":"C","key_point":"Dùng NOT IN với subquery để tìm các maker không sản xuất thiết bị loại PC.","why_correct":"Câu lệnh lấy các maker từ Product mà model của họ không nằm trong danh sách model của bảng PC. Do đó, kết quả trả về là các maker chỉ sản xuất thiết bị non-PC.","why_wrong":[{"label":"A","why":"Bỏ qua điều kiện lọc NOT IN."},{"label":"B","why":"Nhầm với điều kiện IN thay vì NOT IN."},{"label":"D","why":"Nhầm lẫn với các maker chỉ sản xuất PC."}],"vocab":[{"word":"subquery","reading":"","meaning":"Truy vấn con được đặt bên trong một câu lệnh SQL khác."},{"word":"NOT IN","reading":"","meaning":"Toán tử kiểm tra giá trị không nằm trong tập hợp kết quả."}]},{"id":57,"slide":57,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"(Choose 1 answer)If attribute A determines both attributes B and C, then it is also true that:","options":[{"label":"A","text":"(B,C) → A"},{"label":"B","text":"C → A"},{"label":"C","text":"B → A"},{"label":"D","text":"A → B"}],"answer":"D","note":"D","key_point":"Nếu A xác định B và C thì A xác định riêng từng thuộc tính.","why_correct":"Theo luật Decomposition (Phân rã) trong functional dependency, nếu A → (B, C) thì ta có thể suy ra A → B và A → C.","why_wrong":[{"label":"A","why":"Nhầm lẫn hướng của functional dependency thành (B,C) xác định A."},{"label":"B","why":"C không thể xác định A chỉ dựa vào giả thiết."},{"label":"C","why":"B không thể xác định A chỉ dựa vào giả thiết."}],"vocab":{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các thuộc tính trong cơ sở dữ liệu."}},{"id":58,"slide":58,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In a functional dependency A → B, what can be said about B?","options":[{"label":"A","text":"B is also a superkey"},{"label":"B","text":"B is a determinant"},{"label":"C","text":"B is functionally dependent on A"},{"label":"D","text":"B is a foreign key"}],"answer":"C","note":"C","key_point":"Trong A → B, B phụ thuộc hàm vào A.","why_correct":"Theo định nghĩa của functional dependency, nếu A → B thì giá trị của A xác định duy nhất giá trị của B, nghĩa là B phụ thuộc hàm vào A.","why_wrong":[{"label":"A","why":"B không nhất thiết là một superkey vì A có thể không phải là candidate key."},{"label":"B","why":"A mới là determinant, không phải B."},{"label":"D","why":"Functional dependency không ngụ ý quan hệ khóa ngoại giữa các bảng."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Sự phụ thuộc hàm giữa các thuộc tính trong cơ sở dữ liệu."},{"word":"determinant","reading":"","meaning":"Thuộc tính quyết định ở vế trái của một phụ thuộc hàm."}]},{"id":59,"slide":59,"section":"Truy vấn SQL","prompt":"","setup":"SELECT * FROM tblCUSTOMER, tblORDER","stem":"In MS-SQL Server, which of the following is true about join operator?","options":[{"label":"A","text":"Cartesian join"},{"label":"B","text":"Equi-join"},{"label":"C","text":"Natural join"},{"label":"D","text":"Outer join"}],"answer":"A","note":"A","key_point":"Writing SELECT * FROM T1, T2 without WHERE creates a Cartesian join.","why_correct":"Liệt kê các bảng cách nhau bằng dấu phẩy trong FROM mà không có điều kiện kết nối (theta-join hoặc WHERE clause) sẽ tạo ra một Cartesian join (tích Descartes), kết hợp mọi tuple của bảng này với mọi tuple của bảng kia.","why_wrong":[{"label":"B","why":"Equi-join yêu cầu một điều kiện so sánh bằng (=)."},{"label":"C","why":"Natural join tự động kết nối các cột trùng tên, không phải cú pháp dấu phẩy đơn thuần."},{"label":"D","why":"Outer join cần dùng từ khóa LEFT/RIGHT/FULL OUTER JOIN."}],"vocab":[{"word":"Cartesian join","reading":"","meaning":"Phép tích Descartes, kết hợp tất cả các dòng của các bảng với nhau."},{"word":"Equi-join","reading":"","meaning":"Phép kết nối bằng dựa trên điều kiện giá trị bằng nhau giữa các cột."}]},{"id":60,"slide":60,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Identify the correct query for viewing only those records wherein the customers have a phone number? Hoàng Hoàng","options":[{"label":"A","text":"SELECT * from customers where phone IS NOT NULL"},{"label":"B","text":"SELECT * from customers where phone = NOT NULL"},{"label":"C","text":"SELECT * from customers where phone NOT NULL"},{"label":"D","text":"SELECT * from customers where HAVING phone NOT NULL"}],"answer":"A","note":"A","key_point":"Dùng điều kiện IS NOT NULL trong SQL để lọc các record có giá trị tồn tại.","why_correct":"Trong SQL, giá trị NULL đại diện cho dữ liệu thiếu hoặc không xác định. Để kiểm tra một column có giá trị hay không, ta bắt buộc phải dùng toán tử IS NOT NULL.","why_wrong":[{"label":"B","why":"Sai cú pháp vì không dùng dấu bằng (=) với NULL."},{"label":"C","why":"Thiếu từ khóa IS trước NOT NULL, dẫn đến lỗi cú pháp."},{"label":"D","why":"HAVING chỉ dùng kèm với GROUP BY, không thể thay thế cho WHERE ở đây."}],"vocab":{"word":"NULL","reading":"","meaning":"Giá trị rỗng hoặc không xác định trong cơ sở dữ liệu."}},{"id":61,"slide":61,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"In SQL, the statement Select * From R, S is equivalent to which of the following?","options":[{"label":"A","text":"Select * From R inner join S"},{"label":"B","text":"Select * From R natural join S"},{"label":"C","text":"Select * From R cross join S"},{"label":"D","text":"Select * From R union join S"}],"answer":"C","note":"C","key_point":"Cú pháp Select * From R, S thực hiện phép Cartesian product giữa hai bảng.","why_correct":"Trong SQL, việc liệt kê các bảng trong mệnh đề FROM cách nhau bởi dấu phẩy tương đương với phép cross join, tạo ra mọi tổ hợp có thể giữa các tuple của R và S.","why_wrong":[{"label":"A","why":"Inner join yêu cầu điều kiện kết nối (thường qua ON hoặc USING)."},{"label":"B","why":"Natural join tự động kết nối dựa trên các cột có cùng tên."},{"label":"D","why":"Union join không phải là một toán tử chuẩn trong SQL tiêu chuẩn."}],"vocab":[{"word":"Cross join","reading":"","meaning":"Phép toán tạo ra Cartesian product của hai bảng."},{"word":"Cartesian product","reading":"","meaning":"Tập hợp tất cả các cặp tuple có thể có từ hai quan hệ."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":62,"slide":62,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"“SELECT TOP 100 \u003ccolumn name\u003e FROM \u003ctable name\u003e” is the statement and suppose if there are 10 rows in the table then that what will be the result?","options":[{"label":"A","text":"Return 10 rows with data and 90 blank rows without data"},{"label":"B","text":"Return all the rows and all columns in the table"},{"label":"C","text":"Return the field of all the 10 rows"},{"label":"D","text":"Return error"}],"answer":"C","note":"C","key_point":"Mệnh đề SELECT TOP N chỉ giới hạn số dòng trả về tối đa bằng N.","why_correct":"Vì bảng chỉ có 10 dòng, mệnh đề TOP 100 yêu cầu trả về tối đa 100 dòng nhưng thực tế chỉ có 10 dòng, do đó câu lệnh sẽ trả về toàn bộ dữ liệu của 10 dòng đó.","why_wrong":[{"label":"A","why":"Không tạo ra các dòng trống (blank rows) khi số lượng dòng thực tế nhỏ hơn N."},{"label":"B","why":"Chỉ trả về các cột được chỉ định trong câu lệnh SELECT thay vì tất cả các cột."},{"label":"D","why":"Câu lệnh hoàn toàn hợp lệ trong cú pháp SQL Server nên không phát sinh lỗi."}],"vocab":{"word":"SELECT TOP","reading":"","meaning":"Mệnh đề dùng để giới hạn số lượng dòng hoặc phần trăm dòng trả về từ câu truy vấn."}},{"id":63,"slide":63,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Suppose that there is a relation R (A, B, C, D, E, G)\nAnd functional dependencies\nS = {AB → C , D → EG, C → A, BE → C, BC → D, CG → BD, ACD → B, CE → AG}","stem":"Compute {AB}+","options":[{"label":"A","text":"ABCD"},{"label":"B","text":"ABCDE"},{"label":"C","text":"ABCDG"},{"label":"D","text":"ABCDEG"}],"answer":"D","note":"D","key_point":"Closure {X}+ là tập hợp tất cả các thuộc tính suy dẫn được từ X.","why_correct":"Bắt đầu với {AB}+: (1) {AB}+ = {AB}. (2) AB → C nên có {ABC}. (3) BC → D nên có {ABCD}. (4) D → EG nên có {ABCDEG}. Vậy {AB}+ = {ABCDEG}.","why_wrong":[{"label":"A","why":"Thiếu các thuộc tính E và G suy dẫn từ D."},{"label":"B","why":"Thiếu thuộc tính G suy dẫn từ D."},{"label":"C","why":"Thiếu thuộc tính E suy dẫn từ D."}],"vocab":[{"word":"Functional dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong một relation."},{"word":"Closure","reading":"","meaning":"Tập hợp tất cả các thuộc tính có thể suy ra từ một tập thuộc tính cho trước."}]},{"id":64,"slide":64,"section":"Truy vấn SQL","prompt":"","setup":"Suppose relation R1(A, B) has the following tuples:\nA B\n1 a\n2 b\n3 c\n4 d\n5 e\n\nand the relation R2(C, A) has the following tuples:\nC A\n101 1\n102 2\n103 3\n104 1\n105 1","stem":"Which tuple is contained in the result of the following query:\n\nSELECT R1.B, R2.C\nFROM R1\nRIGHT JOIN R2 ON R1.A = R2.A;","options":[{"label":"A","text":"(a, 101) ;
