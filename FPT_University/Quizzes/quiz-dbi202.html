"why":"Primary key dùng để định danh duy nhất từng tuple, không dùng để kết nối các table."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Khóa ngoại dùng để thiết lập mối liên kết giữa hai table."},{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất từng tuple trong một table."}]},{"id":266,"slide":266,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In the relational model, what does \"functional dependency\" imply?","options":[{"label":"A","text":"One attribute uniquely determines another attribute"},{"label":"B","text":"Each relation depends on another relation"},{"label":"C","text":"Relations can be modified without affecting each other"},{"label":"D","text":"All attributes must be independent of each other"}],"answer":"A","note":"A","key_point":"Functional dependency means the value of one attribute uniquely determines the value of another.","why_correct":"Theo định nghĩa chuẩn trong relational model, nếu biết giá trị của attribute A, ta xác định được duy nhất giá trị của attribute B (ký hiệu A -\u003e B).","why_wrong":[{"label":"B","why":"Nhầm lẫn với quan hệ giữa các tables/relations."},{"label":"C","why":"Không phản ánh mối quan hệ phụ thuộc giữa các attributes."},{"label":"D","why":"Trái ngược hoàn toàn với bản chất của functional dependency."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Sự phụ thuộc hàm, thể hiện một attribute xác định duy nhất một attribute khác."},{"word":"attribute","reading":"","meaning":"Thuộc tính hay cột trong relation."}]},{"id":267,"slide":267,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Through VIEW, is it possible to update data in the original table (that VIEW references)?","options":[{"label":"A","text":"Always updateable"},{"label":"B","text":"Can never update"},{"label":"C","text":"Some cases can be updated, some cases cannot"},{"label":"D","text":"If the View sees a table, it can be updated"},{"label":"E","text":"All of the mentioned answers are wrong"}],"answer":"C","note":"C","key_point":"Khong phai moi VIEW deu co the update duoc du lieu.","why_correct":"Mot so VIEW chi doc du lieu duoc (read-only) do co chua cac ham aggregation, GROUP BY, DISTINCT hoac JOIN phuc tap, trong khi cac VIEW don gian dua tren mot table co the update duoc.","why_wrong":[{"label":"A","why":"Sai vi nhieu VIEW phuc tap khong cho phep update."},{"label":"B","why":"Sai vi VIEW don gian van cho phep update."},{"label":"D","why":"Khong chinh xac vi viec update phu thuoc vao cau truc cua VIEW chu khong chi don thuan la thay table."},{"label":"E","why":"Sai vi dap an C la dap an dung."}],"vocab":[{"word":"VIEW","reading":"","meaning":"Bang ao duoc dinh nghia bang mot cau lenh SELECT."},{"word":"aggregation","reading":"","meaning":"Cac ham tong hop nhu SUM, COUNT, AVG."}]},{"id":268,"slide":268,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"The SQL keyword BETWEEN is used:","options":[{"label":"A","text":"None of the above is correct."},{"label":"B","text":"as a wildcard."},{"label":"C","text":"to limit the columns displayed."},{"label":"D","text":"for ranges."}],"answer":"D","note":"D\n\nBETWEEN is used to specify a range of values (e.g., WHERE column BETWEEN value1 AND value2).","key_point":"SQL operator BETWEEN is used to specify a range of values.","why_correct":"The BETWEEN operator checks if a column value falls within a specific range defined by two bounds (inclusive). It is commonly used in WHERE clauses.","why_wrong":[{"label":"A","why":"Option D is correct."},{"label":"B","why":"Wildcards are used with the LIKE operator, such as % or _."},{"label":"C","why":"Columns displayed are limited by specifying them in the SELECT clause."}],"vocab":[{"word":"BETWEEN","reading":"","meaning":"Toán tử SQL dùng để lọc dữ liệu trong một khoảng giá trị xác định."},{"word":"WHERE","reading":"","meaning":"Mệnh đề dùng để lọc các tuple thỏa mãn điều kiện."}]},{"id":269,"slide":269,"section":"Mô hình ER","prompt":"","setup":"","stem":"The conceptual model is:","options":[{"label":"A","text":"Independent of both hardware and software"},{"label":"B","text":"Dependent on both hardware and software"},{"label":"C","text":"Dependent on software."},{"label":"D","text":"Dependent on hardware."}],"answer":"A","note":"A","key_point":"Conceptual model là mô hình trừu tượng, độc lập hoàn toàn với DBMS và phần cứng.","why_correct":"Conceptual model tập trung vào việc mô tả các thực thể và mối quan hệ giữa chúng trong thế giới thực mà không quan tâm đến cách lưu trữ hay xử lý kỹ thuật.","why_wrong":[{"label":"B","why":"Sai vì mô hình này không phụ thuộc vào bất kỳ nền tảng kỹ thuật nào."},{"label":"C","why":"Sai vì sự phụ thuộc vào phần mềm chỉ xuất hiện ở mức Physical hoặc Logical model."},{"label":"D","why":"Sai vì phần cứng không ảnh hưởng đến thiết kế logic của dữ liệu."}],"vocab":[{"word":"Conceptual model","reading":"","meaning":"Mô hình dữ liệu cấp cao mô tả cấu trúc thông tin của hệ thống."},{"word":"DBMS","reading":"","meaning":"Hệ quản trị cơ sở dữ liệu dùng để quản lý và truy xuất dữ liệu."}]},{"id":270,"slide":270,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"The subset of a super key is a candidate key under what condition?","options":[{"label":"A","text":"No proper subset is a super key"},{"label":"B","text":"All subsets are super keys"},{"label":"C","text":"Subset is a super key"},{"label":"D","text":"Each subset is a super key"}],"answer":"A","note":"A","key_point":"Candidate key là super key tối thiểu, không chứa tập con nào là super key.","why_correct":"Candidate key được định nghĩa là một super key tối thiểu. Điều này có nghĩa là nếu ta loại bỏ bất kỳ thuộc tính nào khỏi candidate key, nó sẽ không còn là super key nữa.","why_wrong":[{"label":"B","why":"Nếu tất cả tập con đều là super key thì candidate key đó không tối thiểu."},{"label":"C","why":"Đây là định nghĩa ngược, tập con của super key chưa chắc đã là super key."},{"label":"D","why":"Điều này vi phạm tính tối thiểu của candidate key."}],"vocab":[{"word":"Super key","reading":"","meaning":"Tập hợp các thuộc tính xác định duy nhất một tuple trong quan hệ."},{"word":"Candidate key","reading":"","meaning":"Super key tối thiểu, không chứa tập con thực sự nào cũng là super key."}]},{"id":271,"slide":271,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Transaction processing is associated with everything below except.","options":[{"label":"A","text":"Producing detail, summery, or exception reports"},{"label":"B","text":"Recording a business activity"},{"label":"C","text":"Confirming an action or triggering a response"},{"label":"D","text":"Maintaining data"}],"answer":"A","note":"A","key_point":"Transaction Processing System (TPS) tập trung vào ghi nhận và xử lý dữ liệu giao dịch.","why_correct":"TPS tập trung vào việc ghi nhận dữ liệu (data entry) và xử lý giao dịch thời gian thực, không phải là công cụ để tổng hợp hay phân tích báo cáo quản trị.","why_wrong":[{"label":"B","why":"Đây là chức năng cốt lõi của TPS để ghi lại các hoạt động kinh doanh."},{"label":"C","why":"TPS cần phản hồi ngay lập tức để xác nhận giao dịch đã thành công."},{"label":"D","why":"Duy trì dữ liệu (cập nhật, thêm, xóa) là nhiệm vụ chính của TPS."}],"vocab":{"word":"Transaction Processing System","reading":"","meaning":"Hệ thống xử lý giao dịch dùng để ghi nhận các hoạt động nghiệp vụ hàng ngày."}},{"id":272,"slide":272,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"The DROP TABLE statement:","options":[{"label":"A","text":"deletes the table structure only."},{"label":"B","text":"deletes the table structure along with the table data."},{"label":"C","text":"works whether or not referential integrity constraints would be violated."},{"label":"D","text":"is not an SQL statement."}],"answer":"B","note":"B","key_point":"DROP TABLE xóa hoàn toàn cả cấu trúc schema và dữ liệu của bảng.","why_correct":"Lệnh DROP TABLE loại bỏ định nghĩa bảng khỏi database, đồng nghĩa với việc xóa sạch mọi tuple và cấu trúc lưu trữ của nó.","why_wrong":[{"label":"A","why":"Sai vì nó xóa cả dữ liệu chứ không chỉ cấu trúc."},{"label":"C","why":"Sai vì DROP TABLE thường bị chặn nếu có foreign key constraint tham chiếu đến nó."},{"label":"D","why":"Sai vì đây là lệnh DDL cơ bản trong SQL."}],"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh dùng để định nghĩa cấu trúc database."},{"word":"Referential integrity","reading":"","meaning":"Toàn vẹn tham chiếu đảm bảo mối quan hệ giữa primary key và foreign key."}]},{"id":273,"slide":273,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"The people whose jobs require access to the database for querying, updating, and generating reports; the database primarily exists for their use. What type of this user?","options":[{"label":"A","text":"DBA"},{"label":"B","text":"End users"},{"label":"C","text":"Database designer"},{"label":"D","text":"System Analysts and Application Programmers"}],"answer":"B","note":"B","key_point":"End users là người dùng trực tiếp query, update và generate reports từ database.","why_correct":"Database được xây dựng chủ yếu để phục vụ nhóm End users trong các công việc truy vấn và cập nhật dữ liệu hàng ngày.","why_wrong":[{"label":"A","why":"DBA chịu trách nhiệm quản trị hệ thống database chứ không phải người dùng nghiệp vụ chính."},{"label":"C","why":"Database designer thiết kế cấu trúc database, không phải người sử dụng hệ thống."},{"label":"D","why":"Application Programmers viết ứng dụng, không phải là đối tượng sử dụng chính để query báo cáo."}],"vocab":[{"word":"End users","reading":"","meaning":"Người dùng cuối sử dụng hệ thống database cho công việc hàng ngày."},{"word":"DBA","reading":"","meaning":"Quản trị viên cơ sở dữ liệu."}]},{"id":274,"slide":274,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"To convert a table to First Normal Form (1NF), what step must be taken?","options":[{"label":"A","text":"Remove redundant data"},{"label":"B","text":"Ensure each attribute has a unique value"},{"label":"C","text":"Split the table into smaller tables"},{"label":"D","text":"Ensure each attribute contains atomic values"}],"answer":"D","note":"D","key_point":"1NF yêu cầu mỗi attribute trong relation phải chứa các atomic values.","why_correct":"Để đạt 1NF, tất cả các giá trị trong mỗi cell của bảng phải là atomic (không thể chia nhỏ hơn nữa).","why_wrong":[{"label":"A","why":"Loại bỏ dữ liệu trùng lặp là mục tiêu chung của normalization nhưng không phải định nghĩa của 1NF."},{"label":"B","why":"Mỗi attribute có giá trị duy nhất liên quan đến ràng buộc uniqueness chứ không phải tính nguyên tố của 1NF."},{"label":"C","why":"Tách bảng thành các bảng nhỏ hơn là đặc trưng của 2NF, 3NF hoặc BCNF để khử dependency."}],"vocab":[{"word":"First Normal Form","reading":"","meaning":"Dạng chuẩn 1, yêu cầu các giá trị trong bảng phải là atomic."},{"word":"atomic values","reading":"","meaning":"Giá trị nguyên tử, không thể chia nhỏ thành các thành phần khác."}]},{"id":275,"slide":275,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"The Data Definition Language (DDL) in SQL is used to:","options":[{"label":"A","text":"Insert, update, and delete data from a database"},{"label":"B","text":"Define and modify the structure of database objects such as tables, views, and indexes"},{"label":"C","text":"Query and retrieve data from a database"},{"label":"D","text":"Manage user permissions and access rights"}],"answer":"B","note":"B","key_point":"SQL DDL định nghĩa và thay đổi cấu trúc database objects.","why_correct":"Đáp án B chính xác vì Data Definition Language (DDL) chuyên dùng để thao tác với cấu trúc schema như CREATE, ALTER, DROP các tables, views, và indexes.","why_wrong":[{"label":"A","why":"Thuộc về DML (Data Manipulation Language) dùng để thao tác dữ liệu."},{"label":"C","why":"Thuộc về DQL (Data Query Language) dùng để truy vấn dữ liệu."},{"label":"D","why":"Thuộc về DCL (Data Control Language) dùng để quản lý quyền hạn."}],"vocab":[{"word":"DDL","reading":"","meaning":"Ngôn ngữ định nghĩa dữ liệu dùng để tạo và sửa cấu trúc database."},{"word":"schema","reading":"","meaning":"Cấu trúc tổng thể của cơ sở dữ liệu."}]},{"id":276,"slide":276,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"The Isolation property in transactions ensures that:","options":[{"label":"A","text":"Each transaction is encrypted"},{"label":"B","text":"No two transactions run concurrently"},{"label":"C","text":"Transactions do not interfere with each other"},{"label":"D","text":"Only one user accesses the system"}],"answer":"C","note":"C","key_point":"Isolation đảm bảo các transaction thực thi độc lập, không bị ảnh hưởng bởi transaction khác.","why_correct":"Isolation là một trong bốn thuộc tính ACID, đảm bảo rằng kết quả của các transaction chạy đồng thời giống như khi chúng chạy tuần tự, tránh các hiện tượng như dirty read hay lost update.","why_wrong":[{"label":"A","why":"Encryption là vấn đề bảo mật, không thuộc ACID properties."},{"label":"B","why":"Isolation cho phép chạy đồng thời (concurrency) nhưng đảm bảo kết quả logic như chạy tuần tự."},{"label":"D","why":"Hệ thống database hỗ trợ nhiều user cùng lúc, Isolation chỉ đảm bảo tính nhất quán giữa các transaction."}],"vocab":[{"word":"Isolation","reading":"","meaning":"Tính cô lập, đảm bảo các transaction không can thiệp lẫn nhau."},{"word":"ACID","reading":"","meaning":"Bộ bốn thuộc tính (Atomicity, Consistency, Isolation, Durability) đảm bảo tính toàn vẹn của transaction."},{"word":"Concurrency","reading":"","meaning":"Khả năng thực thi đồng thời nhiều transaction trên cùng một database."}]},{"id":278,"slide":278,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"What is the purpose of the RENAME operation in relational algebra? Choose three answers","options":[{"label":"A","text":"To avoid ambiguity, especially when joining relations with the same attribute names."},{"label":"B","text":"To make query expressions clearer and easier to read."},{"label":"C","text":"To resolve naming conflicts in operations like UNION"},{"label":"D","text":"To search, indexing, and join tables quickly."}],"answer":"ABC","note":"ABC","key_point":"RENAME operator ký hiệu là ρ dùng để đổi tên relation hoặc attribute.","why_correct":"Phép RENAME giúp tránh trùng lặp tên cột khi join, làm câu query dễ đọc hơn và giải quyết xung đột tên trong các phép toán tập hợp như UNION.","why_wrong":{"label":"D","why":"RENAME không liên quan đến việc search, indexing hay tăng tốc độ join."},"vocab":[{"word":"RENAME","reading":"","meaning":"Phép toán đổi tên relation hoặc attribute trong relational algebra."},{"word":"UNION","reading":"","meaning":"Phép hợp hai tập hợp các tuple thỏa mãn điều kiện tương thích schema."}]},{"id":279,"slide":279,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"What is the difference between DELETE and TRUNCATE in SQL?","options":[{"label":"A","text":"DELETE removes rows based on a condition, and TRUNCATE removes all rows from the table"},{"label":"B","text":"DELETE is faster and does not generate logs"},{"label":"C","text":"TRUNCATE allows rollback, but DELETE does not"},{"label":"D","text":"TRUNCATE can delete specific rows, while DELETE removes all rows"}],"answer":"A","note":"A","key_point":"DELETE xóa theo điều kiện, TRUNCATE xóa toàn bộ bảng nhanh chóng.","why_correct":"Lựa chọn A chính xác vì câu lệnh DELETE hỗ trợ mệnh đề WHERE để lọc từng tuple cần xóa, trong khi TRUNCATE xóa toàn bộ dữ liệu mà không cần điều kiện.","why_wrong":[{"label":"B","why":"Nhược điểm tốc độ và không sinh log thuộc về TRUNCATE chứ không phải DELETE."},{"label":"C","why":"Phát biểu ngược lại về tính năng rollback (DELETE hỗ trợ rollback, TRUNCATE thì không)."},{"label":"D","why":"Phát biểu nhầm lẫn chức năng của hai câu lệnh này."}],"vocab":[{"word":"DELETE","reading":"","meaning":"Câu lệnh xóa tuple trong bảng, có hỗ trợ mệnh đề WHERE."},{"word":"TRUNCATE","reading":"","meaning":"Câu lệnh xóa toàn bộ tuple trong bảng một cách nhanh chóng."}]},{"id":280,"slide":280,"section":"Mô hình ER","prompt":"","setup":"","stem":"(Choose 1 answer)\nWhat is a weak entity in an ERD?","options":[{"label":"A","text":"An entity with no attributes"},{"label":"B","text":"An entity that participates in a one-to-many relationship"},{"label":"C","text":"An entity that cannot exist without being related to another entity"},{"label":"D","text":"An entity with a composite key"}],"answer":"C","note":"C","key_point":"Weak entity là thực thể không thể tồn tại độc lập nếu thiếu owner entity.","why_correct":"Weak entity phụ thuộc vào strong entity (owner) thông qua identifying relationship và cần partial key để định danh.","why_wrong":[{"label":"A","why":"Nhầm lẫn với tập thuộc tính rỗng, weak entity vẫn có thuộc tính."},{"label":"B","why":"Mọi loại entity đều có thể tham gia quan hệ one-to-many."},{"label":"D","why":"Weak entity sử dụng partial key kết hợp với foreign key từ owner, không nhất thiết là composite key tự nhiên."}],"vocab":[{"word":"weak entity","reading":"","meaning":"Thực thể yếu, không có primary key riêng và phụ thuộc vào thực thể khác."},{"word":"ERD","reading":"","meaning":"Mô hình thực thể kết hợp (Entity-Relationship Diagram)."}]},{"id":281,"slide":281,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"(Choose 1 answer)\nWhat is Database Normalization?","options":[{"label":"A","text":"A process where by a limit is put on the number of fields a record can contain"},{"label":"B","text":"The process of ensuring that each table has a key"},{"label":"C","text":"The process of ensuring that a relational database has at least two tables in it"},{"label":"D","text":"A process whereby the design of a table (relation) is decomposed into more tables that more precisely fit the relational mode"}],"answer":"D","note":"D","key_point":"Database Normalization decomposes relations into smaller tables fitting the relational model.","why_correct":"Option D correctly defines normalization as the process of decomposing relations to minimize data redundancy and anomalies.","why_wrong":[{"label":"A","why":"Normalization does not limit the number of fields in a record."},{"label":"B","why":"Having a primary key is part of database design, but not the full definition of normalization."},{"label":"C","why":"A normalized database can have any number of tables, even just one if already in high normal form."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu nhằm giảm thiểu dư thừa dữ liệu."},{"word":"relation","reading":"","meaning":"Khái niệm toán học tương đương với một bảng trong cơ sở dữ liệu quan hệ."}]},{"id":282,"slide":282,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"What is an index? Hoàng Hoàng","options":[{"label":"A","text":"An index is a database table attribute, which speeds-up data search within a table"},{"label":"B","text":"An index is the same as alias"},{"label":"C","text":"An index is a special way to join 2 or more tables"},{"label":"D","text":"An index is a database row attribute, which speeds-up data search within a table"}],"answer":"A","note":"A","key_point":"Index giúp tăng tốc độ tìm kiếm dữ liệu trên một attribute của bảng.","why_correct":"Index được tạo trên các attribute (cột) của bảng database để giúp truy vấn tìm kiếm dữ liệu nhanh chóng hơn mà không phải quét toàn bộ bảng.","why_wrong":[{"label":"B","why":"Alias là tên thay thế cho bảng hoặc cột trong câu query, không phải index."},{"label":"C","why":"Index không dùng để join các bảng với nhau."},{"label":"D","why":"Index gắn liền với attribute của bảng (cột), không phải row (dòng)."}],"vocab":[{"word":"index","reading":"","meaning":"Cấu trúc dữ liệu giúp tăng tốc độ truy vấn trên bảng."},{"word":"attribute","reading":"","meaning":"Cột trong bảng database."}]},{"id":283,"slide":283,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What is the difference between a view and a table in SQL?","options":[{"label":"A","text":"Tables can be updated, while the view is displaying data from the query"},{"label":"B","text":"Views can store data permanently, while tables are temporary"},{"label":"C","text":"Tables are created with the CREATE TABLE statement, while views use CREATE VIEW"},{"label":"D","text":"Views and tables are functionally equivalent in SQL"}],"answer":"C","note":"C","key_point":"Tables store data permanently while views store only the query definition.","why_correct":"Tables are created using the CREATE TABLE statement to store actual data, whereas views are created using CREATE VIEW and dynamically execute a query.","why_wrong":[{"label":"A","why":"Views can also be updated in certain conditions (updatable views)."},{"label":"B","why":"It is the exact opposite: tables store data permanently, while standard views do not store data physically."},{"label":"D","why":"Views and tables have different storage mechanisms and use cases."}],"vocab":[{"word":"view","reading":"","meaning":"Một virtual table lưu trữ dưới dạng một câu lệnh SQL query."},{"word":"table","reading":"","meaning":"Bảng dữ liệu thực tế lưu trữ các tuple."}]},{"id":284,"slide":284,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"What are the disadvantages of network data model?","options":[{"label":"A","text":"Not support the high-level query language"},{"label":"B","text":"Not support the relationships between nodes"},{"label":"C","text":"Not support the database management system"},{"label":"D","text":"Not support the storage method of very large amounts of data"}],"answer":"A","note":"A","key_point":"Network data model does not support high-level query languages.","why_correct":"Network data model relies on complex procedural navigation using pointers, lacking a declarative high-level query language like SQL.","why_wrong":[{"label":"B","why":"It actually supports complex many-to-many relationships between nodes using sets and pointers."},{"label":"C","why":"It still utilizes a DBMS to manage data, though navigational."},{"label":"D","why":"It can handle large amounts of data, limited mostly by hardware and pointer overhead rather than architectural inability."}],"vocab":[{"word":"network data model","reading":"","meaning":"Mô hình cơ sở dữ liệu mạng cho phép các bản ghi có nhiều hơn một cha."},{"word":"query language","reading":"","meaning":"Ngôn ngữ truy vấn dùng để tương tác với cơ sở dữ liệu."}]},{"id":285,"slide":285,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"What is Database Normalization?","options":[{"label":"A","text":"A process where by a limit is put on the number of fields a record can contain"},{"label":"B","text":"The process of ensuring that each table has a key"},{"label":"C","text":"The process of ensuring that a relational database has at least two tables in it"},{"label":"D","text":"A process whereby the design of a table (relation) is decomposed into more tables that more precisely fit the relational mode"}],"answer":"D","note":"D","key_point":"Normalization is the process of decomposing tables to fit the relational model.","why_correct":"Option D correctly defines normalization as the systematic approach of decomposing relations to minimize data redundancy and anomalies, ensuring compliance with normal forms.","why_wrong":[{"label":"A","why":"Normalization does not restrict the number of fields in a record."},{"label":"B","why":"Having a primary key is a requirement for relations, but not the full definition of normalization."},{"label":"C","why":"A normalized database can sometimes consist of a single table if it satisfies the normal forms."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu nhằm giảm thiểu dư thừa dữ liệu."},{"word":"relation","reading":"","meaning":"Bảng dữ liệu trong mô hình quan hệ."}]},{"id":286,"slide":286,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"What is a database?","options":[{"label":"A","text":"Organized collection of information that cannot be accessed, updated, and managed"},{"label":"B","text":"Collection of data or information without organizing"},{"label":"C","text":"Organized collection of data or information that can be accessed, updated, and managed"},{"label":"D","text":"Organized collection of data that cannot be updated"}],"answer":"C","note":"C","key_point":"A database is an organized collection of data that is easily managed and accessed.","why_correct":"Đáp án C chính xác vì database được định nghĩa là một tập hợp dữ liệu có tổ chức, cho phép người dùng truy xuất, cập nhật và quản lý một cách hiệu quả.","why_wrong":[{"label":"A","why":"Sai vì dữ liệu trong database hoàn toàn có thể được truy xuất, cập nhật và quản lý."},{"label":"B","why":"Sai vì dữ liệu trong database phải có tổ chức chứ không phải dữ liệu thô chưa tổ chức."},{"label":"D","why":"Sai vì dữ liệu trong database có thể được cập nhật (thêm, sửa, xóa)."}],"vocab":[{"word":"database","reading":"","meaning":"Cơ sở dữ liệu, tập hợp dữ liệu có cấu trúc."},{"word":"access","reading":"","meaning":"Truy xuất hoặc truy cập dữ liệu."}]},{"id":287,"slide":287,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"What is a database? (Choose 1 answer)","options":[{"label":"A","text":"A collection of information that exists over a long period of time. A collection of related data and managed by a database management system."},{"label":"B","text":"The database is built based on the relational data model."},{"label":"C","text":"Database used to create, update and exploit relational databases."},{"label":"D","text":"The database is built based on the relational data model and exploits the relational database."}],"answer":"A","note":"A","key_point":"Database là tập hợp dữ liệu có liên quan được quản lý bởi DBMS.","why_correct":"Database được định nghĩa là tập hợp dữ liệu có liên quan, tồn tại lâu dài và được quản lý bởi một hệ quản trị cơ sở dữ liệu (DBMS).","why_wrong":[{"label":"B","why":"Chỉ đề cập đến relational data model, không phải mọi database đều là relational."},{"label":"C","why":"Đây là chức năng của DBMS, không phải định nghĩa của database."},{"label":"D","why":"Quá hẹp vì giới hạn database chỉ trong relational data model."}],"vocab":[{"word":"Database","reading":"","meaning":"Tập hợp dữ liệu có cấu trúc được lưu trữ và quản lý."},{"word":"DBMS","reading":"","meaning":"Phần mềm dùng để định nghĩa, tạo, duy trì và kiểm soát truy cập database."}]},{"id":288,"slide":288,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"What are logical constraints?","options":[{"label":"A","text":"The relationships between attributes are represented by relational operations."},{"label":"B","text":"The relationships between attributes are represented by comparisons operator."},{"label":"C","text":"The relationships between attributes are represented by mathematical expressions."},{"label":"D","text":"The relationships between attributes are represented by functional dependencies."}],"answer":"D","note":"D","key_point":"Logical constraints trong database thường được biểu diễn thông qua các functional dependencies.","why_correct":"Functional dependencies (FD) định nghĩa mối quan hệ logic giữa các thuộc tính, xác định cách giá trị của một tập thuộc tính quyết định giá trị của tập thuộc tính khác.","why_wrong":[{"label":"A","why":"Relational operations dùng để thao tác dữ liệu, không phải để định nghĩa ràng buộc logic."},{"label":"B","why":"Comparison operators chỉ là công cụ trong biểu thức điều kiện, không mô tả bản chất ràng buộc dữ liệu."},{"label":"C","why":"Mathematical expressions quá rộng và không đặc thù cho việc mô tả ràng buộc logic trong schema."}],"vocab":[{"word":"Functional dependency","reading":"","meaning":"Ràng buộc trong đó giá trị của một tập thuộc tính xác định duy nhất giá trị của tập thuộc tính khác."},{"word":"Logical constraints","reading":"","meaning":"Các quy tắc logic áp đặt lên dữ liệu để đảm bảo tính toàn vẹn và nhất quán."}]},{"id":289,"slide":289,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"What are the disadvantages of network data model?","options":[{"label":"A","text":"Not support the high-level query language"},{"label":"B","text":"Not support the relationships between nodes"},{"label":"C","text":"Not support the database management system"},{"label":"D","text":"Not support the storage method of very large amounts of data"}],"answer":"A","note":"A","key_point":"Network data model does not support high-level query languages.","why_correct":"Network data model relies on procedural navigation through record links, lacking a declarative high-level query language like SQL.","why_wrong":[{"label":"B","why":"It actually supports complex many-to-many relationships between nodes."},{"label":"C","why":"It still operates under a DBMS, just an older architectural type."},{"label":"D","why":"It can handle large datasets, though less efficiently than modern models."}],"vocab":[{"word":"network data model","reading":"","meaning":"Mô hình dữ liệu mạng sử dụng cấu trúc đồ thị để biểu diễn dữ liệu và mối quan hệ."},{"word":"query language","reading":"","meaning":"Ngôn ngữ truy vấn dùng để tương tác với cơ sở dữ liệu."}]},{"id":290,"slide":290,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"What does the attribute domain define in the relational model? (Choose 1 answer)","options":[{"label":"A","text":"The primary key of the table"},{"label":"B","text":"The foreign key references"},{"label":"C","text":"The cardinality of relationships"},{"label":"D","text":"The data type and range of values that an attribute can hold"}],"answer":"D","note":"D","key_point":"Attribute domain defines the allowed data types and value ranges for an attribute.","why_correct":"In the relational model, a domain specifies the set of atomic values permitted for each attribute, which includes both the data type and the valid range.","why_wrong":[{"label":"A","why":"Confuses domain with primary key constraints."},{"label":"B","why":"Confuses domain with referential integrity constraints."},{"label":"C","why":"Confuses domain with ER diagram cardinality."}],"vocab":{"word":"attribute domain","reading":"","meaning":"Tập hợp các giá trị cho phép của một attribute."}},{"id":291,"slide":291,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following is the appropriate characteristic of a database?","options":[{"label":"A","text":"Because a database is created to suit the format of the data, it cannot respond flexibly to data format changes."},{"label":"B","text":"The procedure for making backups is complicated."},{"label":"C","text":"It is difficult to share data between operations due to an exclusive control function."},{"label":"D","text":"It can be accessed by multiple users at the same time due to an exclusive control function."}],"answer":"D","note":"D","key_point":"Database hỗ trợ truy cập đồng thời (concurrency) thông qua cơ chế exclusive control.","why_correct":"Exclusive control (như locking) giúp quản lý việc truy cập đồng thời, đảm bảo tính nhất quán của dữ liệu khi nhiều user cùng thao tác.","why_wrong":[{"label":"A","why":"Sai vì database được thiết kế để có tính độc lập dữ liệu (data independence), dễ dàng thay đổi cấu trúc."},{"label":"B","why":"Sai vì các hệ quản trị database hiện đại cung cấp công cụ backup tự động và đơn giản."},{"label":"C","why":"Sai vì mục tiêu chính của database là chia sẻ dữ liệu (data sharing) giữa các ứng dụng khác nhau."}],"vocab":[{"word":"Exclusive control","reading":"","meaning":"Cơ chế kiểm soát truy cập để đảm bảo tính toàn vẹn khi có nhiều giao dịch đồng thời."},{"word":"Data independence","reading":"","meaning":"Khả năng thay đổi cấu trúc dữ liệu mà không ảnh hưởng đến các ứng dụng truy cập nó."}]},{"id":292,"slide":292,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is not mentioned how does a local variable is defined using T-SQL?","options":[{"label":"A","text":"The name of the local variable should begin with \"@@\" sign as the first character of its name"},{"label":"B","text":"A local variable is defined using T-SQL by using statement \"DECLARE\""},{"label":"C","text":"When a variable is first declared, its value is set to NULL. To assign a value to a variable, use the SET statement"},{"label":"D","text":"The data type of local variable is declared after its name and assigned a system-supplied or user-defined data type and a length"}],"answer":"A","note":"A","key_point":"Local variable trong T-SQL phải bắt đầu bằng ký tự \u0027@\u0027, không phải \u0027@@\u0027.","why_correct":"Trong T-SQL, tiền tố \u0027@@\u0027 được dành riêng cho các system functions (global variables), còn local variable chỉ dùng một ký tự \u0027@\u0027.","why_wrong":[{"label":"B","why":"DECLARE là từ khóa chuẩn để khai báo biến trong T-SQL."},{"label":"C","why":"Biến mới khai báo mặc định là NULL và SET được dùng để gán giá trị."},{"label":"D","why":"Cú pháp khai báo yêu cầu tên biến theo sau là data type."}],"vocab":[{"word":"Local variable","reading":"","meaning":"Biến cục bộ chỉ tồn tại trong phạm vi của một batch hoặc procedure."},{"word":"DECLARE","reading":"","meaning":"Câu lệnh dùng để khai báo biến trong T-SQL."},{"word":"System functions","reading":"","meaning":"Các hàm hệ thống có sẵn, thường bắt đầu bằng \u0027@@\u0027."}]},{"id":293,"slide":293,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which of the following is true about a UNION query?","options":[{"label":"A","text":"Combines the output from multiple queries and must include the same number of columns and data types."},{"label":"B","text":"Combines the output from no more than two queries and must include the same number of columns and data types."},{"label":"C","text":"Combines the output from no more than two queries and does not include the same number of columns and data types."},{"label":"D","text":"Combines the output from multiple queries and does not include the same number of columns and data types."}],"answer":"A","note":"A","key_point":"UNION kết hợp kết quả từ nhiều SELECT với cùng số cột và kiểu dữ liệu.","why_correct":"UNION yêu cầu các query thành phần phải có cùng số lượng cột và kiểu dữ liệu tương ứng để có thể hợp nhất thành một tập kết quả duy nhất.","why_wrong":[{"label":"B","why":"UNION không giới hạn số lượng query tham gia."},{"label":"C","why":"UNION yêu cầu các cột phải tương thích về số lượng và kiểu dữ liệu."},{"label":"D","why":"UNION bắt buộc các query phải có cấu trúc cột giống nhau."}],"vocab":{"word":"UNION","reading":"","meaning":"Toán tử SQL dùng để gộp kết quả của hai hay nhiều SELECT statement."}},{"id":294,"slide":294,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following is the appropriate characteristic of a database?","options":[{"label":"A","text":"Because a database is created to suit the format of the data, it cannot respond flexibly to data format changes."},{"label":"B","text":"The procedure for making backups is complicated."},{"label":"C","text":"It is difficult to share data between operations due to an exclusive control function."},{"label":"D","text":"It can be accessed by multiple users at the same time due to an exclusive control function."}],"answer":"D","note":"D","key_point":"Database hỗ trợ truy cập đồng thời (concurrency) thông qua cơ chế exclusive control.","why_correct":"Exclusive control (như locking) đảm bảo tính nhất quán khi nhiều user cùng truy cập hoặc sửa đổi dữ liệu, cho phép chia sẻ tài nguyên hiệu quả.","why_wrong":[{"label":"A","why":"Sai vì database được thiết kế để có tính độc lập dữ liệu (data independence), dễ dàng thay đổi cấu trúc."},{"label":"B","why":"Sai vì DBMS cung cấp các công cụ backup tự động và đơn giản hóa quy trình quản trị."},{"label":"C","why":"Sai vì mục tiêu chính của database là chia sẻ dữ liệu giữa các ứng dụng và người dùng."}],"vocab":[{"word":"Exclusive control","reading":"","meaning":"Cơ chế kiểm soát truy cập để đảm bảo tính toàn vẹn khi nhiều giao dịch xảy ra đồng thời."},{"word":"Concurrency","reading":"","meaning":"Khả năng xử lý nhiều thao tác truy cập dữ liệu cùng một lúc."}]},{"id":295,"slide":295,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is not mentioned how does a local variable is defined using T-SQL?","options":[{"label":"A","text":"The name of the local variable should begin with \u0027@@\u0027 sign as the first character of its name."},{"label":"B","text":"A local variable is defined using T-SQL by using statement \"DECLARE\"."},{"label":"C","text":"When a variable is first declared, its value is set to NULL. To assign a value to a variable, use the SET statement."},{"label":"D","text":"The data type of local variable is declared after its name and assigned a system-supplied or user-defined data type and a length."}],"answer":"A","note":"A","key_point":"Local variable trong T-SQL phải bắt đầu bằng ký tự \u0027@\u0027, không phải \u0027@@\u0027.","why_correct":"Trong T-SQL, tiền tố \u0027@@\u0027 được dành riêng cho các system functions (global variables), còn local variable chỉ dùng một ký tự \u0027@\u0027.","why_wrong":[{"label":"B","why":"DECLARE là từ khóa chính xác để khai báo biến."},{"label":"C","why":"Đây là cơ chế khởi tạo và gán giá trị chuẩn trong T-SQL."},{"label":"D","why":"Cú pháp khai báo biến yêu cầu chỉ định data type sau tên biến."}],"vocab":[{"word":"Local variable","reading":"","meaning":"Biến cục bộ chỉ tồn tại trong phạm vi của một batch hoặc procedure."},{"word":"T-SQL","reading":"","meaning":"Ngôn ngữ mở rộng của SQL được sử dụng trong Microsoft SQL Server."}]},{"id":296,"slide":296,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is used to define code that is fired when certain actions or event occur?","options":[{"label":"A","text":"You use an application Trigger to fire when certain actions or event occur."},{"label":"B","text":"You use an application Cursor to fire when certain actions or event occur."},{"label":"C","text":"You use an application Replace to fire when certain actions or event occur."},{"label":"D","text":"You use an application Keyword to fire when certain actions or event occur."}],"answer":"A","note":"A","key_point":"Trigger là cơ chế tự động thực thi code khi có sự kiện xảy ra.","why_correct":"Trigger là một database object được thiết kế để tự động kích hoạt (fire) khi các sự kiện DML (INSERT, UPDATE, DELETE) hoặc DDL xảy ra trên bảng.","why_wrong":[{"label":"B","why":"Cursor dùng để duyệt qua từng tuple trong tập kết quả truy vấn."},{"label":"C","why":"Replace không phải là cơ chế kích hoạt code tự động."},{"label":"D","why":"Keyword là các từ khóa dành riêng cho cú pháp SQL."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Một đoạn code tự động thực thi khi một sự kiện cụ thể xảy ra trên database."},{"word":"Cursor","reading":"","meaning":"Công cụ dùng để xử lý từng dòng dữ liệu trong một tập kết quả."}]},{"id":297,"slide":297,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following describes an SQL cursor?","options":[{"label":"A","text":"It allows you to traverse the result set of a query and process each row individually"},{"label":"B","text":"is a precompiled collection of one or more SQL statements that can be executed as a single unit"},{"label":"C","text":"A field within a database"},{"label":"D","text":"Cursors are not related to SQL"}],"answer":"A","note":"A","key_point":"SQL cursor cho phép duyệt và xử lý từng tuple trong result set.","why_correct":"Cursor đóng vai trò như một con trỏ, giúp ứng dụng truy cập và thao tác dữ liệu theo từng dòng (row-by-row) thay vì toàn bộ tập kết quả cùng lúc.","why_wrong":[{"label":"B","why":"Đây là định nghĩa của Stored Procedure."},{"label":"C","why":"Đây là định nghĩa của Column hoặc Attribute."},{"label":"D","why":"Cursor là một thành phần quan trọng trong SQL để xử lý dữ liệu phức tạp."}],"vocab":[{"word":"Cursor","reading":"","meaning":"Cơ chế cho phép duyệt qua các tuple trong một result set."},{"word":"Result set","reading":"","meaning":"Tập hợp các dòng dữ liệu trả về sau khi thực thi một câu lệnh SELECT."}]},{"id":298,"slide":298,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is not mentioned how does a local variable is defined using T-SQL?","options":[{"label":"A","text":"The name of the local variable should begin with \"@@\" sign as the first character of its name."},{"label":"B","text":"A local variable is defined using T-SQL by using statement \"DECLARE\"."},{"label":"C","text":"When a variable is first declared, its value is set to NULL. To assign a value to a variable, use the SET statement."},{"label":"D","text":"The data type of local variable is declared after its name and assigned a system-supplied or user-defined data type and a length."}],"answer":"A","note":"In T-SQL, local variable names begin with a single @ symbol, not @@. The @@ prefix is reserved for global system functions, not for user-defined local variables.","key_point":"Local variables trong T-SQL bắt đầu bằng một ký tự @ duy nhất.","why_correct":"Đáp án A sai vì local variable chỉ dùng một ký tự @. Ký tự @@ được dành riêng cho các system functions (global variables).","why_wrong":[{"label":"B","why":"Đây là cách đúng để khai báo biến trong T-SQL."},{"label":"C","why":"Đây là hành vi mặc định và cách gán giá trị đúng cho biến."},{"label":"D","why":"Đây là cú pháp chuẩn khi định nghĩa data type cho biến."}],"vocab":[{"word":"Local variable","reading":"","meaning":"Biến cục bộ được khai báo và sử dụng trong phạm vi một batch hoặc procedure."},{"word":"System function","reading":"","meaning":"Các hàm hệ thống có sẵn trong SQL Server, thường bắt đầu bằng @@."}]},{"id":299,"slide":299,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is false about database trigger?","options":[{"label":"A","text":"It automatically runs when an event occurs in the database server"},{"label":"B","text":"DML triggers are frequently used for enforcing business rules and data integrity."},{"label":"C","text":"The same trigger action cannot be defined for more than one user action (for example, INSERT and UPDATE) in the same CREATE TRIGGER statement"},{"label":"D","text":"When a trigger fires, results are returned to the calling application, just like with stored procedures."}],"answer":"D","note":"D","key_point":"Trigger là cơ chế tự động thực thi, không trả về kết quả cho ứng dụng.","why_correct":"Trigger được thiết kế để thực thi ngầm định (implicitly) khi có sự kiện xảy ra, nó không trả về kết quả trực tiếp cho ứng dụng như stored procedure.","why_wrong":[{"label":"A","why":"Đây là đặc điểm định nghĩa chính xác của trigger."},{"label":"B","why":"Trigger thường được dùng để kiểm tra ràng buộc phức tạp mà constraint không làm được."},{"label":"C","why":"Nhiều hệ quản trị CSDL cho phép định nghĩa trigger cho nhiều sự kiện (INSERT, UPDATE, DELETE) cùng lúc."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Một đoạn code tự động thực thi khi có sự kiện DML hoặc DDL xảy ra."},{"word":"Stored procedure","reading":"","meaning":"Tập hợp các câu lệnh SQL được lưu trữ và có thể gọi thực thi thủ công."},{"word":"Data integrity","reading":"","meaning":"Tính toàn vẹn của dữ liệu trong CSDL."}]},{"id":300,"slide":300,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following describes an SQL cursor?","options":[{"label":"A","text":"It allows you to traverse the result set of a query and process each row individually"},{"label":"B","text":"is a precompiled collection of one or more SQL statements that can be executed as a single unit"},{"label":"C","text":"A field within a database"},{"label":"D","text":"Cursors are not related to SQL"}],"answer":"A","note":"A","key_point":"SQL cursor là cơ chế duyệt từng tuple trong một result set.","why_correct":"Cursor cung cấp khả năng truy cập tuần tự từng dòng (row-by-row) trong kết quả truy vấn, cho phép xử lý dữ liệu phức tạp mà các câu lệnh SQL thông thường không làm được.","why_wrong":[{"label":"B","why":"Đây là định nghĩa của Stored Procedure."},{"label":"C","why":"Đây là định nghĩa của Column hoặc Attribute."},{"label":"D","why":"Cursor là một thành phần quan trọng trong SQL để xử lý dữ liệu theo dòng."}],"vocab":[{"word":"Cursor","reading":"","meaning":"Đối tượng điều khiển dùng để duyệt qua các tuple trong một result set."},{"word":"Result set","reading":"","meaning":"Tập hợp các dòng dữ liệu trả về sau khi thực thi một câu lệnh SELECT."}]},{"id":301,"slide":301,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which of the following statements about relational databases is true?","options":[{"label":"A","text":"The database is built on a relational data model."},{"label":"B","text":"The database is created from excel software."},{"label":"C","text":"Relational databases are only relations with attributes that are not primary keys."},{"label":"D","text":"Relational database is the relationship between rows and columns in a data table."}],"answer":"A","note":"A","key_point":"Relational database được xây dựng dựa trên relational data model.","why_correct":"Relational database (cơ sở dữ liệu quan hệ) được thiết kế và xây dựng dựa trên lý thuyết của relational data model, trong đó dữ liệu được biểu diễn dưới dạng các bảng (relations).","why_wrong":[{"label":"B","why":"Excel chỉ là phần mềm bảng tính đơn giản, không phải hệ quản trị cơ sở dữ liệu quan hệ."},{"label":"C","why":"Sai vì các quan hệ trong relational database thường bắt buộc phải có primary key để định danh các tuple."},{"label":"D","why":"Định nghĩa sai bản chất; quan hệ ở đây là mối liên kết giữa các bảng/thực thể, không phải giữa dòng và cột."}],"vocab":[{"word":"relational database","reading":"","meaning":"Cơ sở dữ liệu quan hệ"},{"word":"relational data model","reading":"","meaning":"Mô hình dữ liệu quan hệ"}]},{"id":302,"slide":302,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which of the following statements is true about data normalization:","options":[{"label":"A","text":"1NF is a relationship with a primary key and no repeating groups"},{"label":"B","text":"2NF is 1NF without transitive functional dependencies"},{"label":"C","text":"3NF is 1NF without partial functional dependencies"},{"label":"D","text":"All of the above answers are wrong"}],"answer":"D","note":"D\n1NF (First Normal Form): Yêu cầu mỗi cột chứa một giá trị nguyên tố và không có nhóm lặp lại. Đáp án A đúng về việc không có nhóm lặp lại, nhưng nó thiếu yêu cầu về","key_point":"Nắm vững định nghĩa chính xác của các chuẩn 1NF, 2NF và 3NF trong normalization.","why_correct":"Đáp án A thiếu điều kiện giá trị nguyên tố (atomic values) cho các cột, trong khi B và C phát biểu nhầm lẫn giữa định nghĩa của 2NF và 3NF.","why_wrong":[{"label":"A","why":"Thiếu điều kiện mỗi cột phải chứa giá trị nguyên tố (atomic values)."},{"label":"B","why":"Nhầm lẫn khái niệm; loại bỏ transitive functional dependencies là điều kiện của 3NF chứ không phải 2NF."},{"label":"C","why":"Nhầm lẫn khái niệm; loại bỏ partial functional dependencies là điều kiện của 2NF chứ không phải 3NF."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu nhằm giảm thiểu dư thừa dữ liệu."},{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các thuộc tính trong một relation schema."}]},{"id":303,"slide":303,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which of the following is false about a foreign key?","options":[{"label":"A","text":"Whereas only one foreign key is allowed in a table."},{"label":"B","text":"It refers to the field in a table which is the primary key of another table."},{"label":"C","text":"It can contain duplicate values and a table in a relational database."},{"label":"D","text":"It can also contain NULL values."}],"answer":"A","note":"A","key_point":"A table can have multiple foreign keys pointing to different primary keys.","why_correct":"Phát biểu A sai vì một table hoàn toàn có thể chứa nhiều foreign key tùy theo số lượng mối quan hệ với các table khác.","why_wrong":[{"label":"B","why":"Đúng định nghĩa foreign key trỏ tới primary key của table khác."},{"label":"C","why":"Đúng vì foreign key không bắt buộc phải unique trong table chứa nó."},{"label":"D","why":"Đúng vì foreign key cho phép nhận giá trị NULL trừ khi bị ràng buộc bởi NOT NULL."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Khóa ngoại dùng để liên kết dữ liệu giữa hai table."},{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi tuple trong table."}]},{"id":304,"slide":304,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"Which statement best describes the DELETE command?","options":[{"label":"A","text":"Deletes all rows and cannot be rolled back"},{"label":"B","text":"Deletes the table structure and all its data"},{"label":"C","text":"Deletes specific rows and can be rolled back"},{"label":"D","text":"Deletes only columns that exists in DELETE command."}],"answer":"C","note":"C","key_point":"DELETE command removes specific tuples from a table and can be rolled back.","why_correct":"DELETE is a DML statement that targets specific rows (often using a WHERE clause) and modifies data within a transaction, allowing rollback if needed.","why_wrong":[{"label":"A","why":"Confuses DELETE with TRUNCATE, which does not record individual row deletions."},{"label":"B","why":"Describes the DROP TABLE command, which removes both structure and data."},{"label":"D","why":"Incorrect because DELETE removes entire rows (tuples), not individual columns."}],"vocab":[{"word":"DELETE","reading":"","meaning":"Lệnh SQL dùng để xóa các tuple trong bảng."},{"word":"rollback","reading":"","meaning":"Khôi phục trạng thái dữ liệu trước khi transaction được thực thi."}]},{"id":305,"slide":305,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"When is it recommended to use a cursor in SQL?","options":[{"label":"A","text":"Always, as cursors are the most efficient way to process data"},{"label":"B","text":"When processing data row by row is necessary or unavoidable"},{"label":"C","text":"Only when creating complex joins between tables"},{"label":"D","text":"Never, as set-based operations are always more efficient"}],"answer":"B","note":"B","key_point":"Chi nen dung cursor khi xu ly du lieu row by row la bat buoc.","why_correct":"Cursor cho phep duyet qua tung tuple trong tap ket qua, duoc dung khi cac thao tac set-based thong thuong khong dap ung duoc.","why_wrong":[{"label":"A","why":"Sai vi cursor thuong cham hon va ton tai nguyen hon so voi set-based operations."},{"label":"C","why":"Sai vi complex joins nen dung SQL queries thong thuong thay vi cursor."},{"label":"D","why":"Sai vi van co nhung truong hop dac thu bat buoc phai dung cursor."}],"vocab":[{"word":"cursor","reading":"","meaning":"Dung de xu ly du lieu trong bang theo tung row mot."},{"word":"set-based","reading":"","meaning":"Phuong phap xu ly toan bo tap hop du lieu cung luc trong SQL."}]},{"id":306,"slide":306,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"How is User-defined function different from Store Procedure?","options":[{"label":"A","text":"User-defined functions do not have input parameters, Store Procedures do"},{"label":"B","text":"User-defined functions cannot contain transactions, Store Procedures can"},{"label":"C","text":"Store Procedure does not have return results, User-defined function does"},{"label":"D","text":"All of the mentioned answers are incorrect"}],"answer":"B","note":"B","key_point":"Stored Procedure hỗ trợ transaction và thay đổi dữ liệu, User-defined function thì không.","why_correct":"User-defined function (UDF) bị giới hạn không được thực hiện các thao tác thay đổi trạng thái database như transaction, trong khi Stored Procedure cho phép thực hiện các lệnh COMMIT hoặc ROLLBACK.","why_wrong":[{"label":"A","why":"Cả hai đều có thể nhận input parameters."},{"label":"C","why":"Stored Procedure có thể trả về kết quả qua output parameters hoặc result sets."}],"vocab":[{"word":"User-defined function","reading":"","meaning":"Hàm do người dùng tự định nghĩa để tính toán và trả về giá trị."},{"word":"Stored Procedure","reading":"","meaning":"Tập hợp các câu lệnh SQL được lưu trữ để thực hiện các tác vụ nghiệp vụ."},{"word":"Transaction","reading":"","meaning":"Chuỗi các thao tác được thực hiện như một đơn vị công việc duy nhất."}]},{"id":307,"slide":307,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"How are many-to-many relationships typically represented in the relational model?","options":[{"label":"A","text":"By adding attributes to one of the related tables"},{"label":"B","text":"By creating a new table with foreign keys from both related tables"},{"label":"C","text":"By denormalizing the database"},{"label":"D","text":"By creating a new table for each related entity"}],"answer":"B","note":"B","key_point":"Many-to-many relationships require a junction table containing foreign keys from both entities.","why_correct":"Trong relational model, một many-to-many relationship không thể biểu diễn trực tiếp bằng cách thêm cột vào bảng hiện có. Cần tạo một junction table (bảng trung gian) chứa primary key của cả hai bảng gốc làm foreign key để liên kết chúng.","why_wrong":[{"label":"A","why":"Việc thêm attributes vào bảng hiện có chỉ phù hợp cho one-to-many relationship."},{"label":"C","why":"Denormalization là kỹ thuật tối ưu hiệu năng, không phải cách chuẩn để biểu diễn relationship."},{"label":"D","why":"Việc tạo bảng cho mỗi entity là bước thiết kế cơ bản, nhưng chưa đủ để thiết lập mối quan hệ giữa chúng."}],"vocab":[{"word":"Junction table","reading":"","meaning":"Bảng trung gian dùng để phân rã mối quan hệ many-to-many."},{"word":"Foreign key","reading":"","meaning":"Trường dữ liệu dùng để tham chiếu đến primary key của bảng khác."},{"word":"Denormalization","reading":"","meaning":"Quá trình cố tình làm giảm mức độ chuẩn hóa để tăng tốc độ truy vấn."}]},{"id":308,"slide":308,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"A stored procedure in SQL is a ________","options":[{"label":"A","text":"Block of functions"},{"label":"B","text":"Group of Transact-SQL statements compiled into a single execution plan"},{"label":"C","text":"Group of distinct SQL statements"},{"label":"D","text":"None of the mentioned"}],"answer":"B","note":"B | stored procedure in SQL is a precompiled group of one or more Transact-SQL (T-SQL) statements (in SQL Server) or SQL statements (in other databases)","key_point":"Stored procedure là tập hợp các câu lệnh SQL được biên dịch thành một execution plan.","why_correct":"Stored procedure được lưu trữ trong database dưới dạng một execution plan đã biên dịch sẵn, giúp tăng hiệu năng khi thực thi nhiều lần.","why_wrong":[{"label":"A","why":"Không phải là tập hợp các function mà là tập hợp các câu lệnh thực thi."},{"label":"C","why":"Thiếu yếu tố quan trọng là đã được biên dịch (compiled) thành execution plan."}],"vocab":[{"word":"Stored procedure","reading":"","meaning":"Một nhóm các câu lệnh SQL được lưu trữ và biên dịch để tái sử dụng."},{"word":"Execution plan","reading":"","meaning":"Kế hoạch thực thi mà SQL Server tạo ra để tối ưu hóa truy vấn."}]},{"id":309,"slide":309,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"(Choose 1 answer) Choose the correct statement.","options":[{"label":"A","text":"Project operator shows list of the attributes we wish to appear in the result."},{"label":"B","text":"Select operator shows list of the attributes of one relation we wish to appear in the result"},{"label":"C","text":"Union operator shows list of the attributes of two relations we wish to appear in the result"},{"label":"D","text":"Rename operator shows list of the rows of one relation we wish to appear in the result"}],"answer":"A","note":"A","key_point":"Project (Π) chọn cột (attributes), Select (σ) chọn hàng (tuples) thỏa mãn điều kiện.","why_correct":"Toán tử Project (Π) thực hiện phép chiếu, chỉ giữ lại các thuộc tính (attributes) được chỉ định trong danh sách kết quả.","why_wrong":[{"label":"B","why":"Nhầm lẫn với Select (σ), toán tử dùng để lọc các tuple dựa trên điều kiện."},{"label":"C","why":"Union (∪) dùng để gộp các tuple từ hai relation tương thích, không phải chọn thuộc tính."},{"label":"D","why":"Rename (ρ) dùng để đổi tên relation hoặc thuộc tính, không liên quan đến việc chọn hàng."}],"vocab":[{"word":"Project operator","reading":"","meaning":"Toán tử chiếu, dùng để chọn các cột cụ thể từ một relation."},{"word":"Select operator","reading":"","meaning":"Toán tử chọn, dùng để lọc các hàng (tuples) thỏa mãn điều kiện."}]},{"id":310,"slide":310,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Given R as a relation, which of the following statements is correct about normalizing data in 3NF form:","options":[{"label":"A","text":"If R: Has a primary key, no repeating groups, no multivalued attributes/composite attributes"},{"label":"B","text":"If R: Has a primary key, no repeating groups, no multivalued attributes/complex attributes, no partial functional dependencies."},{"label":"C","text":"If R: Has a primary key, no repeating groups, no multivalued/composite attributes, no transitive dependencies."},{"label":"D","text":"If R: Has a primary key, no repeating groups, no multivalued attributes/complex attributes, no transitive functional dependencies."},{"label":"E","text":"If R: has complete functional dependency."}],"answer":"D","note":"D","key_point":"3NF yêu cầu relation đạt 2NF và không có transitive functional dependencies.","why_correct":"Đáp án D chính xác vì định nghĩa chuẩn của 3NF là đạt chuẩn 2NF (không có partial functional dependencies) đồng thời loại bỏ toàn bộ các transitive functional dependencies giữa các non-key attributes.","why_wrong":[{"label":"A","why":"Mô tả điều kiện cơ bản của 1NF."},{"label":"B","why":"Mô tả điều kiện của 2NF (loại bỏ partial functional dependencies)."},{"label":"C","why":"Thiếu chữ functional trong transitive functional dependencies."},{"label":"E","why":"Không đủ điều kiện cấu trúc của 3NF."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu."},{"word":"transitive dependency","reading":"","meaning":"Phụ thuộc bắc cầu giữa các thuộc tính."}]},{"id":311,"slide":311,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"Let ParamountMovies be the VIEW defined from the Movies table:CREATE VIEW ParamountMovies ASSELECT title, yearFROM MoviesWHERE studioName = \u0027Paramount\u0027If you execute the statementDROP VIEW ParamountMovies","stem":"Choose the correct statement for the Movies table:","options":[{"label":"A","text":"Dropping the VIEW does not affect any tuples in the Movies table."},{"label":"B","text":"Dropping the VIEW affects some tuples in the Movies table that belong to the VIEW ParamountMovies."},{"label":"C","text":"Dropping the VIEW ParamountMovies that was created from the Movies table, so we can no longer query the Movies table."},{"label":"D","text":"The Movies table will be drop out the database."}],"answer":"A","note":"A","key_point":"DROP VIEW chỉ xóa định nghĩa view, không ảnh hưởng đến dữ liệu bảng gốc.","why_correct":"VIEW chỉ là một bảng ảo (virtual table) lưu trữ câu lệnh truy vấn. Khi xóa VIEW, chỉ có định nghĩa của VIEW bị loại bỏ khỏi schema, dữ liệu trong bảng Movies vẫn giữ nguyên.","why_wrong":[{"label":"B","why":"VIEW không chứa dữ liệu thực tế, nên không có tuple nào trong bảng gốc bị ảnh hưởng."},{"label":"C","why":"Bảng Movies vẫn tồn tại độc lập và có thể truy vấn bình thường."},{"label":"D","why":"DROP VIEW không có tác động đến cấu trúc hay dữ liệu của bảng cơ sở (base table)."}],"vocab":[{"word":"VIEW","reading":"","meaning":"Bảng ảo được tạo từ kết quả của một câu lệnh SELECT."},{"word":"Base table","reading":"","meaning":"Bảng thực tế lưu trữ dữ liệu trong cơ sở dữ liệu."}]},{"id":312,"slide":312,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"In SQL, what is a view?","options":[{"label":"A","text":"A virtual table based on the result of a SELECT query"},{"label":"B","text":"A physical table containing aggregated data"},{"label":"C","text":"A temporary table used for transactions"},{"label":"D","text":"A stored procedure with read-only access"}],"answer":"A","note":"A","key_point":"A view is a virtual table defined by a SQL SELECT query.","why_correct":"Đáp án A chính xác vì view trong SQL không lưu trữ dữ liệu vật lý mà chỉ lưu trữ và thực thi câu lệnh SELECT khi được truy vấn.","why_wrong":[{"label":"B","why":"Sai vì view là virtual table, không chứa dữ liệu vật lý."},{"label":"C","why":"Sai vì view không phải là temporary table dùng cho transaction."},{"label":"D","why":"Sai vì view là đối tượng schema lưu trữ query, không phải stored procedure."}],"vocab":[{"word":"view","reading":"","meaning":"Bảng ảo dựa trên kết quả của một câu lệnh SELECT."},{"word":"virtual table","reading":"","meaning":"Bảng ảo không chiếm không gian lưu trữ dữ liệu thực tế."}]},{"id":313,"slide":313,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In SQL, Which of the following statements is correct? Hoàng Hoàng","options":[{"label":"A","text":"All relations in 2NF are also in BCNF"},{"label":"B","text":"All relations in 1NF are also in BCNF"},{"label":"C","text":"All relations in 3NF are also in BCNF"},{"label":"D","text":"For any relation schema, there is a dependency-preserving decomposition into 3NF"}],"answer":"D","note":"D","key_point":"Mọi schema quan hệ đều có thể phân rã bảo toàn phụ thuộc về dạng 3NF.","why_correct":"Theo lý thuyết normalization, 3NF luôn đảm bảo tính chất dependency-preserving khi phân rã, trong khi BCNF thì không phải lúc nào cũng làm được điều này.","why_wrong":[{"label":"A","why":"Sai vì 2NF không đảm bảo loại bỏ hết các transitive dependency như BCNF."},{"label":"B","why":"Sai vì 1NF là dạng cơ bản nhất, chưa loại bỏ các partial hay transitive dependency."},{"label":"C","why":"Sai vì BCNF chặt chẽ hơn 3NF, không phải mọi quan hệ 3NF đều đạt chuẩn BCNF."}],"vocab":[{"word":"Normalization","reading":"","meaning":"Quá trình thiết kế schema để giảm thiểu dư thừa dữ liệu và tránh các anomaly."},{"word":"Dependency-preserving","reading":"","meaning":"Tính chất bảo toàn các functional dependency sau khi phân rã quan hệ."},{"word":"BCNF","reading":"","meaning":"Boyce-Codd Normal Form, dạng chuẩn mạnh hơn 3NF."}]},{"id":314,"slide":314,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"In the Select clause, the keyword DISTINCT mean? (Choose 1 answer)","options":[{"label":"A","text":"Specifies that only unique rows can appear in the result set."},{"label":"B","text":"Specifies that duplicate rows can appear in the result set."},{"label":"C","text":"Specifies that only the first row are to be output from the query result set."},{"label":"D","text":"Specifies that only the first 10 percent of the rows are output from the result set."}],"answer":"A","note":"A","key_point":"Dùng DISTINCT trong câu lệnh SQL SELECT để loại bỏ các hàng trùng lặp trong kết quả.","why_correct":"Keyword DISTINCT yêu cầu hệ thống lọc bỏ các tuple trùng nhau, đảm bảo chỉ trả về các unique rows trong result set.","why_wrong":[{"label":"B","why":"Trái ngược với DISTINCT, việc cho phép các hàng trùng lặp là mặc định khi không dùng từ khóa này (tương đương với ALL)."},{"label":"C","why":"Nhầm lẫn với mệnh đề LIMIT hoặc TOP để giới hạn số lượng dòng đầu tiên."},{"label":"D","why":"Nhầm lẫn với cú pháp TOP ... PERCENT trong SQL Server để lấy tỷ lệ phần trăm số dòng."}],"vocab":[{"word":"DISTINCT","reading":"","meaning":"Từ khóa SQL dùng để loại bỏ các hàng trùng lặp trong kết quả truy vấn."},{"word":"result set","reading":"","meaning":"Tập hợp kết quả trả về sau khi thực thi câu lệnh SQL."}]},{"id":315,"slide":315,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In the context of a banking application, which of the following best represents a transaction that violates atomicity? Choose two answers.","options":[{"label":"A","text":"A money transfer where funds are withdrawn from one account but not credited to another due to a crash"},{"label":"B","text":"A funds transfer request fails before any account is updated, so neither the debit nor the credit happens"},{"label":"C","text":"Both the debit from Account A and the credit to Account B are completed successfully"},{"label":"D","text":"Create a new account successfully but can not link it to the customer profile."}],"answer":"AD","note":"AD","key_point":"Atomicity yêu cầu tất cả các thao tác trong transaction phải cùng thành công hoặc cùng thất bại.","why_correct":"Đáp án A và D vi phạm atomicity vì chỉ có một phần của transaction được thực hiện trước khi hệ thống gặp lỗi hoặc thất bại.","why_wrong":[{"label":"B","why":"Thỏa mãn atomicity vì không có thay đổi nào được thực hiện khi request thất bại."},{"label":"C","why":"Thỏa mãn atomicity vì cả hai thao tác debit và credit đều hoàn thành thành công."}],"vocab":[{"word":"atomicity","reading":"","meaning":"Tính nguyên tử trong ACID, đảm bảo transaction diễn ra trọn vẹn hoặc không có gì."},{"word":"transaction","reading":"","meaning":"Đơn vị thực thi các thao tác cơ sở dữ liệu."}]},{"id":316,"slide":316,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"In MS-SQL Server, there are three primary SQL commands (INSERT, UPDATE, and DELETE) to modify data in a table. Which of the following is false about function of these commands?","options":[{"label":"A","text":"These commands allow you to change the data type of a column, add or drop columns, and rename columns, among other operations."},{"label":"B","text":"These commands enable the alteration of data within database tables."},{"label":"C","text":"Each command has its specific syntax, usage, and allowing you to insert new rows, modifies existing rows, and remove rows from the table."},{"label":"D","text":"These commands belong to the Data Manipulation Language (DML) subset of SQL."}],"answer":"A","note":"A","key_point":"INSERT, UPDATE, và DELETE là các câu lệnh DML dùng để thao tác dữ liệu bên trong bảng.","why_correct":"Đáp án A sai vì việc thay đổi cấu trúc bảng (thêm/xóa cột, đổi kiểu dữ liệu) là chức năng của DDL với lệnh ALTER TABLE, chứ không phải DML.","why_wrong":[{"label":"B","why":"Đúng với chức năng chung của nhóm lệnh DML là chỉnh sửa dữ liệu."},{"label":"C","why":"Đúng vì INSERT thêm mới, UPDATE sửa, và DELETE xóa các row."},{"label":"D","why":"Đúng vì các lệnh này thuộc tập lệnh Data Manipulation Language (DML)."}],"vocab":[{"word":"Data Manipulation Language","reading":"","meaning":"Nhóm câu lệnh SQL dùng để thêm, sửa, xóa dữ liệu trong bảng."},{"word":"Data Definition Language","reading":"","meaning":"Nhóm câu lệnh SQL dùng để định nghĩa và thay đổi cấu trúc cơ sở dữ liệu."}]},{"id":317,"slide":317,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"In the relational DBMS, what is the difference between PRIMARY KEY and UNIQUE KEY?\n(Choose 1 answer)","options":[{"label":"A","text":"UNIQUE KEY doesn’t accept the NULL value but PRIMARY KEY does"},{"label":"B","text":"UNIQUE KEY and PRIMARY KEY are the same"},{"label":"C","text":"A table can have more than one PRIMARY KEY constraint but only one UNIQUE KEY"},{"label":"D","text":"A table can have more than one UNIQUE KEY constraint but only one PRIMARY KEY"}],"answer":"D","note":"D","key_point":"Một table chỉ có một PRIMARY KEY nhưng có thể có nhiều UNIQUE KEY.","why_correct":"PRIMARY KEY dùng để định danh duy nhất cho mỗi tuple và không chấp nhận giá trị NULL. Trong khi đó, một table có thể có nhiều cột hoặc tập cột mang tính duy nhất khác nhau nên cho phép nhiều UNIQUE KEY.","why_wrong":[{"label":"A","why":"Ngược lại, PRIMARY KEY tuyệt đối không chấp nhận NULL còn một số RDBMS cho phép UNIQUE KEY nhận một giá trị NULL."},{"label":"B","why":"Sai hoàn toàn vì chúng có ràng buộc và số lượng cho phép khác nhau trong table."},{"label":"C","why":"Sai vì mỗi table chỉ được phép có duy nhất một PRIMARY KEY constraint."}],"vocab":[{"word":"PRIMARY KEY","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi tuple trong table."},{"word":"UNIQUE KEY","reading":"","meaning":"Ràng buộc đảm bảo các giá trị trong cột là duy nhất không trùng lặp."},{"word":"NULL","reading":"","meaning":"Giá trị rỗng hoặc không xác định trong cơ sở dữ liệu."}]},{"id":318,"slide":318,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"In relational algebra, the natural join operation can be viewed as:","options":[{"label":"A","text":"A projection followed by a union"},{"label":"B","text":"A selection followed by a projection"},{"label":"C","text":"A Cartesian product followed by a selection and projection"},{"label":"D","text":"A product followed by a union"}],"answer":"C","note":"C","key_point":"Natural join là Cartesian product kết hợp với selection trên các thuộc tính chung và projection.","why_correct":"Natural join thực chất được định nghĩa tương đương bằng cách lấy Cartesian product của hai relation, lọc các tuple có giá trị bằng nhau ở các common attributes qua selection, và loại bỏ các cột trùng lặp bằng projection.","why_wrong":[{"label":"A","why":"Union dùng để gộp các tuple từ hai relation cùng schema, không phải bản chất của natural join."},{"label":"B","why":"Thiếu bước kết hợp dữ liệu từ hai relation ban đầu thông qua Cartesian product."},{"label":"D","why":"Union không liên quan đến phép toán kết hợp bảng (join)."}],"vocab":[{"word":"natural join","reading":"","meaning":"Phép kết nối tự nhiên giữa hai relation dựa trên các thuộc tính có cùng tên."},{"word":"Cartesian product","reading":"","meaning":"Phép tích Descartes nhân mọi tuple của relation này với mọi tuple của relation kia."},{"word":"selection","reading":"","meaning":"Phép chọn lọc các tuple thỏa mãn điều kiện."},{"word":"projection","reading":"","meaning":"Phép chiếu lấy ra các cột cụ thể."}]},{"id":319,"slide":319,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Generally, what parts does a data model include in the context of a database?","options":[{"label":"A","text":"Structure of the data, operations of the data, and constraints on the data"},{"label":"B","text":"Metadata of the data, action logs, and data files"},{"label":"C","text":"Keys on the table, records accepted in the table, and attributes of the table"},{"label":"D","text":"Data schema, domain of attributes, and keys"}],"answer":"A","note":"A","key_point":"A data model includes data structure, data operations, and data constraints.","why_correct":"Theo lý thuyết cơ sở dữ liệu, một data model hoàn chỉnh luôn bao gồm ba thành phần chính: cấu trúc dữ liệu (structure), các phép toán thao tác dữ liệu (operations), và các ràng buộc toàn vẹn (constraints).","why_wrong":[{"label":"B","why":"Nhầm lẫn với các thành phần lưu trữ vật lý và quản trị hệ thống."},{"label":"C","why":"Chỉ liệt kê các khái niệm cụ thể của bảng thay vì cấu trúc tổng quát của mô hình."},{"label":"D","why":"Quá hẹp, chỉ tập trung vào schema và khóa mà bỏ qua các phép toán (operations)."}],"vocab":[{"word":"data model","reading":"","meaning":"Mô hình dữ liệu gồm cấu trúc, phép toán và ràng buộc."},{"word":"constraints","reading":"","meaning":"Các quy tắc ràng buộc toàn vẹn trên dữ liệu."}]},{"id":320,"slide":320,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Regarding difference between a primary key vs. unique key, which of the following is false?","options":[{"label":"A","text":"There can be only one unique key for a table"},{"label":"B","text":"A primary key is a key that uniquely identifies each record in a table but cannot store NULL values"},{"label":"C","text":"A unique key prevents duplicate values in a column and can store NULL values"},{"label":"D","text":"Only one primary key is allowed to use in a table"}],"answer":"A","note":"A","key_point":"A table can have only one primary key, but multiple unique keys.","why_correct":"Option A sai vì một bảng có thể có nhiều unique key khác nhau, trong khi chỉ được phép có một primary key duy nhất. Do đó phát biểu này là phát biểu không đúng (false).","why_wrong":[{"label":"B","why":"Đúng vì primary key định danh duy nhất mỗi tuple và không chấp nhận giá trị NULL."},{"label":"C","why":"Đúng vì unique key ngăn chặn trùng lặp dữ liệu và cho phép chứa một giá trị NULL."},{"label":"D","why":"Đúng vì một schema chỉ cho phép định nghĩa duy nhất một primary key cho mỗi table."}],"vocab":[{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi record trong table."},{"word":"unique key","reading":"","meaning":"Khóa duy nhất đảm bảo các column không chứa giá trị trùng lặp."}]},{"id":321,"slide":321,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Select the most correct answer","options":[{"label":"A","text":"An index is not a data structure used to speed access to tuples of a relation, given values of one or more attributes."},{"label":"B","text":"The key to index cannot be any attribute or set of attributes, and need not be the key to the relation."},{"label":"C","text":"We can think of the index as a binary search tree of (key, locations) pairs in which a key a is not associated with a set of locations of the tuples."},{"label":"D","text":"An index is a data structure used to speed access to tuples of a relation, given values of one or more attributes."}],"answer":"D","note":"D","key_point":"Index là cấu trúc dữ liệu giúp tăng tốc độ truy xuất tuple trong relation.","why_correct":"Đáp án D đúng định nghĩa về index, giúp tăng tốc độ tìm kiếm tuple dựa trên giá trị của các attribute mà không cần duyệt toàn bộ relation.","why_wrong":[{"label":"A","why":"Phủ định sai bản chất của index."},{"label":"B","why":"Key của index có thể là bất kỳ attribute nào, không bắt buộc phải là primary key của relation."},{"label":"C","why":"Key trong index thực tế được liên kết với các location của tuple."}],"vocab":[{"word":"index","reading":"","meaning":"Cấu trúc dữ liệu dùng để tăng tốc độ tìm kiếm dữ liệu trong database."},{"word":"tuple","reading":"","meaning":"Một dòng (row) trong bảng dữ liệu quan hệ."}]},{"id":322,"slide":322,"section":"Mô hình ER","prompt":"","setup":"","stem":"To convert from ER Diagram to Relational Model, 1-M relationship:","options":[{"label":"A","text":"Put key attribute of one-side to M-side"},{"label":"B","text":"Put key attribute of M-side to one-side"},{"label":"C","text":"Generate 1 relation, Primary key of this relation combined from two relations"},{"label":"D","text":"Build a table with two columns, one column for each participating entity set\u0027s primary key."}],"answer":"A","note":"A","key_point":"Trong quan hệ 1-M, đưa Primary Key của bên 1 vào làm Foreign Key bên M.","why_correct":"Để duy trì tính toàn vẹn dữ liệu, ta thêm Primary Key của thực thể bên \u00271\u0027 vào bảng của thực thể bên \u0027M\u0027 như một Foreign Key.","why_wrong":[{"label":"B","why":"Sai vì đưa Foreign Key vào bên \u00271\u0027 sẽ gây dư thừa dữ liệu hoặc vi phạm quy tắc 1-M."},{"label":"C","why":"Đây là cách làm cho quan hệ M-N, không phải 1-M."},{"label":"D","why":"Đây là cách tạo bảng trung gian cho quan hệ M-N."}],"vocab":[{"word":"Primary Key","reading":"","meaning":"Thuộc tính định danh duy nhất cho mỗi tuple trong một relation."},{"word":"Foreign Key","reading":"","meaning":"Thuộc tính dùng để liên kết dữ liệu giữa hai relation."},{"word":"Relation","reading":"","meaning":"Bảng dữ liệu trong mô hình quan hệ."}]},{"id":323,"slide":323,"section":"Mô hình ER","prompt":"","setup":"","stem":"The key for a weak entity set is _?","options":[{"label":"A","text":"Zero or more attributes"},{"label":"B","text":"The set of attributes of supporting relationships"},{"label":"C","text":"It is possible for an entity set\u0027s key to be composed of attributes, some or all of which belong to another entity set"},{"label":"D","text":"The set of attributes of supporting entity sets"}],"answer":"C","note":"C","key_point":"Weak entity set key gồm partial key kết hợp với primary key của owner entity.","why_correct":"Weak entity không có đủ thuộc tính để tự định danh. Key của nó là sự kết hợp giữa partial key (discriminator) của chính nó và primary key của owner entity set thông qua supporting relationship.","why_wrong":[{"label":"A","why":"Sai vì weak entity bắt buộc phải có owner entity để xác định danh tính."},{"label":"B","why":"Sai vì relationship không chứa thuộc tính định danh, nó chỉ kết nối các entity."},{"label":"D","why":"Sai vì key không phải là toàn bộ thuộc tính của owner, mà chỉ là primary key của owner."}],"vocab":[{"word":"Weak entity set","reading":"","meaning":"Entity set không có primary key riêng, phụ thuộc vào owner entity set."},{"word":"Partial key","reading":"","meaning":"Tập hợp các thuộc tính dùng để phân biệt các entity trong một weak entity set."},{"word":"Owner entity set","reading":"","meaning":"Entity set cung cấp primary key để định danh cho weak entity set."}]},{"id":324,"slide":324,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"The % wildcard when used with the LIKE keyword is used to represent a string of characters:","options":[{"label":"A","text":"Has a minimum length of 0 characters"},{"label":"B","text":"Has a minimum length of 1 character, a maximum length of n characters"},{"label":"C","text":"Has a minimum length of 1 character, a maximum length of 255 characters"},{"label":"D","text":"Has a minimum length of 1 character, a maximum length of 256 characters"},{"label":"E","text":"None of the above answers"}],"answer":"A","note":"A","key_point":"Wildcard % trong SQL LIKE đại diện cho chuỗi có độ dài từ 0 trở lên.","why_correct":"Ký tự % khớp với bất kỳ chuỗi nào, bao gồm cả chuỗi rỗng (độ dài 0).","why_wrong":[{"label":"B","why":"Sai vì % có thể khớp với chuỗi rỗng (độ dài 0)."},{"label":"C","why":"Sai vì % không giới hạn độ dài tối đa là 255."},{"label":"D","why":"Sai vì % không giới hạn độ dài tối đa là 256."}],"vocab":[{"word":"Wildcard","reading":"","meaning":"Ký tự đặc biệt dùng để thay thế cho một hoặc nhiều ký tự khác trong chuỗi."},{"word":"LIKE","reading":"","meaning":"Toán tử trong SQL dùng để so khớp mẫu (pattern matching) cho các giá trị chuỗi."}]},{"id":326,"slide":326,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"(Choose 3 answers) Which one of the following is NOT a DDL command? Choose correct answers.","options":[{"label":"A","text":"DELETE"},{"label":"B","text":"CREATE DATABASE"},{"label":"C","text":"INSERT"},{"label":"D","text":"USE"}],"answer":"ACD","note":"ACD","key_point":"DDL định nghĩa cấu trúc schema, DML thao tác trên dữ liệu (tuple).","why_correct":"DELETE và INSERT là các lệnh DML dùng để thao tác dữ liệu, còn USE là lệnh điều khiển ngữ cảnh (session), không thuộc nhóm DDL.","why_wrong":{"label":"B","why":"CREATE DATABASE là lệnh DDL dùng để tạo cấu trúc cơ sở dữ liệu."},"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, dùng để định nghĩa cấu trúc database."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, dùng để truy vấn và thao tác dữ liệu."}]},{"id":327,"slide":327,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which of the following is NOT a type of join?","options":[{"label":"A","text":"a. Inner join"},{"label":"B","text":"b. Outer join"},{"label":"C","text":"c. Cross join"},{"label":"D","text":"d. Supper join"}],"answer":"D","note":"D","key_point":"Các loại join cơ bản trong SQL gồ
