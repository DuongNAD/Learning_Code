el":"A","text":"OPEN"},{"label":"B","text":"DECLARE"},{"label":"C","text":"CREATE CURSOR"},{"label":"D","text":"BEGIN CURSOR"}],"answer":"B","note":"B   DECLARE statement is used to declare a cursor.","key_point":"Dùng DECLARE để khai báo cursor trong SQL.","why_correct":"Lệnh DECLARE được sử dụng cú pháp chuẩn để định nghĩa và khai báo một cursor cùng với câu lệnh SELECT tương ứng.","why_wrong":[{"label":"A","why":"OPEN dùng để mở cursor đã được khai báo, không dùng để khai báo."},{"label":"C","why":"CREATE CURSOR không phải là cú pháp hợp lệ để khai báo cursor."},{"label":"D","why":"BEGIN CURSOR không tồn tại trong chuẩn cú pháp SQL."}],"vocab":{"word":"cursor","reading":"","meaning":"Con trỏ cơ sở dữ liệu dùng để duyệt qua từng dòng kết quả truy vấn."}},{"id":130,"slide":130,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which SQL command is used to define a table schema?","options":[{"label":"A","text":"ALTER TABLE"},{"label":"B","text":"SELECT"},{"label":"C","text":"CREATE TABLE"},{"label":"D","text":"INSERT"}],"answer":"C","note":"C","key_point":"Sử dụng CREATE TABLE để định nghĩa schema cho một bảng mới.","why_correct":"Lệnh CREATE TABLE trong SQL dùng để tạo một bảng mới và định nghĩa các cột cũng như kiểu dữ liệu và ràng buộc của chúng.","why_wrong":[{"label":"A","why":"ALTER TABLE dùng để sửa đổi cấu trúc của bảng đã tồn tại."},{"label":"B","why":"SELECT dùng để truy vấn dữ liệu từ database."},{"label":"D","why":"INSERT dùng để thêm dữ liệu mới vào bảng."}],"vocab":[{"word":"CREATE TABLE","reading":"","meaning":"Lệnh SQL dùng để tạo bảng mới."},{"word":"schema","reading":"","meaning":"Cấu trúc định nghĩa cơ sở dữ liệu hoặc bảng."}]},{"id":131,"slide":131,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which SQL clause is used to add a new column to an existing table?","options":[{"label":"A","text":"ADD COLUMN"},{"label":"B","text":"ALTER TABLE ADD COLUMN"},{"label":"C","text":"INSERT INTO"},{"label":"D","text":"CREATE COLUMN"}],"answer":"B","note":"B","key_point":"Su dung ALTER TABLE kem menh de ADD de them cot moi vao table.","why_correct":"Dung cau truc ALTER TABLE ten_table ADD ten_cot kieu_du_lieu de bo sung mot column vao table da ton tai.","why_wrong":[{"label":"A","why":"Thieu menh de ALTER TABLE."},{"label":"C","why":"Dung de them row moi, khong phai them column."},{"label":"D","why":"Cu phap CREATE COLUMN khong ton tai trong SQL."}],"vocab":{"word":"ALTER TABLE","reading":"","meaning":"Cau lenh SQL DDL dung de sua doi cau truc cua mot table."}},{"id":132,"slide":132,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which keyword is used in SQL to filter grouped results?","options":[{"label":"A","text":"WHERE"},{"label":"B","text":"TOP"},{"label":"C","text":"GROUP BY"},{"label":"D","text":"HAVING"}],"answer":"D","note":"D","key_point":"Sử dụng HAVING để lọc kết quả sau khi đã GROUP BY.","why_correct":"Keyword HAVING được thiết kế để áp dụng điều kiện lọc trên các aggregate function sau khi câu lệnh GROUP BY đã gom nhóm dữ liệu.","why_wrong":[{"label":"A","why":"Dùng WHERE để lọc các row trước khi gom nhóm, không lọc được kết quả của aggregate function."},{"label":"B","why":"Dùng TOP để giới hạn số lượng dòng trả về."},{"label":"C","why":"Dùng GROUP BY để gom nhóm dữ liệu chứ không phải để lọc."}],"vocab":[{"word":"HAVING","reading":"","meaning":"Mệnh đề dùng để lọc dữ liệu đã được gom nhóm."},{"word":"GROUP BY","reading":"","meaning":"Mệnh đề gom nhóm các row có cùng giá trị."}]},{"id":133,"slide":133,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which command is used to remove a relation from an SQL?","options":[{"label":"A","text":"Drop table"},{"label":"B","text":"Delete"},{"label":"C","text":"Purge"},{"label":"D","text":"Remove"}],"answer":"A","note":"A","key_point":"Dùng DROP TABLE để xóa hoàn toàn cấu trúc và dữ liệu của một relation.","why_correct":"Lệnh DROP TABLE được thiết kế để xóa bỏ hoàn toàn định nghĩa của bảng (schema) và tất cả dữ liệu bên trong khỏi database.","why_wrong":[{"label":"B","why":"DELETE chỉ xóa các tuple bên trong bảng, không xóa cấu trúc bảng."},{"label":"C","why":"PURGE không phải là lệnh chuẩn trong SQL để xóa bảng."},{"label":"D","why":"REMOVE không tồn tại trong cú pháp SQL để thao tác với relation."}],"vocab":[{"word":"Relation","reading":"","meaning":"Một bảng (table) trong mô hình dữ liệu quan hệ."},{"word":"Schema","reading":"","meaning":"Cấu trúc định nghĩa các cột và kiểu dữ liệu của bảng."}]},{"id":134,"slide":134,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Which indexes can be automatically created by defining constraints in a table? (Choose two correct answers)","options":[{"label":"A","text":"PRIMARY KEY"},{"label":"B","text":"CHECK"},{"label":"C","text":"UNIQUE"},{"label":"D","text":"FOREIGN KEY"}],"answer":"AC","note":"AC","key_point":"PRIMARY KEY và UNIQUE constraint tự động tạo index để đảm bảo tính duy nhất.","why_correct":"Cả PRIMARY KEY và UNIQUE đều yêu cầu giá trị không trùng lặp, nên DBMS tự động tạo index để kiểm tra tính duy nhất nhanh chóng.","why_wrong":[{"label":"B","why":"CHECK constraint chỉ kiểm tra điều kiện logic trên giá trị, không yêu cầu index."},{"label":"D","why":"FOREIGN KEY không tự động tạo index trong hầu hết các hệ quản trị CSDL."}],"vocab":[{"word":"Constraint","reading":"","meaning":"Các quy tắc ràng buộc dữ liệu trong bảng."},{"word":"Index","reading":"","meaning":"Cấu trúc dữ liệu giúp truy xuất dữ liệu nhanh hơn."}]},{"id":135,"slide":135,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which data model introduced the concept of tables with rows and columns?","options":[{"label":"A","text":"Hierarchical Model"},{"label":"B","text":"Network Model"},{"label":"C","text":"Object-Oriented Model"},{"label":"D","text":"Relational Model"}],"answer":"D","note":"D","key_point":"Relational Model tổ chức dữ liệu dưới dạng các bảng (tables) gồm hàng và cột.","why_correct":"Relational Model dựa trên lý thuyết tập hợp và logic vị từ, sử dụng cấu trúc bảng (relation) để biểu diễn dữ liệu và mối quan hệ giữa chúng.","why_wrong":[{"label":"A","why":"Hierarchical Model tổ chức dữ liệu theo cấu trúc cây (phân cấp)."},{"label":"B","why":"Network Model sử dụng cấu trúc đồ thị với các bản ghi liên kết theo dạng mạng."},{"label":"C","why":"Object-Oriented Model lưu trữ dữ liệu dưới dạng các đối tượng (objects) có thuộc tính và phương thức."}],"vocab":[{"word":"Relational Model","reading":"","meaning":"Mô hình dữ liệu dựa trên các bảng (relations) có hàng và cột."},{"word":"Hierarchical Model","reading":"","meaning":"Mô hình dữ liệu phân cấp theo cấu trúc cha-con (cây)."},{"word":"Network Model","reading":"","meaning":"Mô hình dữ liệu cho phép một bản ghi có nhiều bản ghi cha."}]},{"id":136,"slide":136,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which relational algebra operator removes attributes from a relation?","options":[{"label":"A","text":"Selection (σ)"},{"label":"B","text":"Projection (π)"},{"label":"C","text":"Join (⋈)"},{"label":"D","text":"Union (∪)"}],"answer":"B","note":"B","key_point":"Projection (π) được dùng để chọn các cột (attributes) cụ thể từ một relation.","why_correct":"Phép toán Projection (π) cho phép lọc bỏ các attributes không cần thiết và chỉ giữ lại các attributes được chỉ định trong danh sách.","why_wrong":[{"label":"A","why":"Selection (σ) lọc các dòng (tuples) dựa trên điều kiện, không thay đổi số lượng cột."},{"label":"C","why":"Join (⋈) kết hợp các relation, thường làm tăng số lượng attributes."},{"label":"D","why":"Union (∪) kết hợp các tuples từ hai relation có cùng schema."}],"vocab":[{"word":"Projection","reading":"","meaning":"Phép toán chọn lọc các cột từ một bảng."},{"word":"Attribute","reading":"","meaning":"Thuộc tính hay cột trong một relation."},{"word":"Relation","reading":"","meaning":"Bảng dữ liệu trong mô hình quan hệ."}]},{"id":137,"slide":137,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which key does not accept the null value?","options":[{"label":"A","text":"Unique Key"},{"label":"B","text":"Primary Key"},{"label":"C","text":"Foreign Key"},{"label":"D","text":"Candidate key"}],"answer":"B","note":"B","key_point":"Primary Key phải đảm bảo tính Entity Integrity, không được chứa giá trị NULL.","why_correct":"Primary Key dùng để định danh duy nhất mỗi tuple trong bảng, do đó nó bắt buộc phải có giá trị và không được phép là NULL.","why_wrong":[{"label":"A","why":"Unique Key cho phép chứa giá trị NULL (tùy hệ quản trị)."},{"label":"C","why":"Foreign Key thường cho phép giá trị NULL để biểu diễn quan hệ tùy chọn."},{"label":"D","why":"Candidate key là tập hợp các thuộc tính có thể làm Primary Key, nhưng chỉ khi được chọn làm Primary Key mới bị cấm NULL."}],"vocab":[{"word":"Primary Key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất một bản ghi trong bảng."},{"word":"Entity Integrity","reading":"","meaning":"Quy tắc toàn vẹn thực thể yêu cầu khóa chính không được NULL."}]},{"id":138,"slide":138,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which property of a transaction ensures that the execution of a transaction should not be interfered with by any other transactions executing concurrently?","options":[{"label":"A","text":"Atomicity"},{"label":"B","text":"Durability"},{"label":"C","text":"Isolation"},{"label":"D","text":"Consistency"}],"answer":"C","note":"C","key_point":"Isolation đảm bảo các transaction thực thi độc lập, không bị can thiệp bởi transaction khác.","why_correct":"Isolation là thuộc tính trong ACID ngăn chặn các hiệu ứng phụ khi nhiều transaction chạy đồng thời, đảm bảo kết quả giống như khi thực thi tuần tự.","why_wrong":[{"label":"A","why":"Atomicity đảm bảo transaction thực hiện toàn bộ hoặc không thực hiện gì cả."},{"label":"B","why":"Durability đảm bảo thay đổi của transaction đã commit được lưu vĩnh viễn."},{"label":"D","why":"Consistency đảm bảo database chuyển từ trạng thái hợp lệ này sang trạng thái hợp lệ khác."}],"vocab":[{"word":"Isolation","reading":"","meaning":"Tính cô lập, đảm bảo các transaction không thấy dữ liệu trung gian của nhau."},{"word":"ACID","reading":"","meaning":"Bộ 4 thuộc tính quan trọng của transaction: Atomicity, Consistency, Isolation, Durability."}]},{"id":139,"slide":139,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which operation is commonly used to display all the properties derived from the original property?","options":[{"label":"A","text":"Union"},{"label":"B","text":"Intersection"},{"label":"C","text":"Closure"},{"label":"D","text":"Projection"}],"answer":"C","note":"C","key_point":"Closure (F+) là tập hợp tất cả các Functional Dependency suy diễn được từ F.","why_correct":"Closure của một tập Functional Dependency F, ký hiệu là F+, chứa tất cả các dependencies có thể suy ra từ F bằng cách sử dụng Armstrong\u0027s axioms.","why_wrong":[{"label":"A","why":"Union là phép toán tập hợp kết hợp các tuple từ hai relation."},{"label":"B","why":"Intersection là phép toán tập hợp lấy các tuple chung giữa hai relation."},{"label":"D","why":"Projection là phép toán trong Relational Algebra để chọn ra các cột cụ thể."}],"vocab":[{"word":"Closure","reading":"","meaning":"Tập hợp tất cả các Functional Dependency có thể suy diễn được từ một tập cho trước."},{"word":"Functional Dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong một relation."},{"word":"Armstrong\u0027s axioms","reading":"","meaning":"Các quy tắc suy diễn cơ bản để tìm Closure của các Functional Dependency."}]},{"id":140,"slide":140,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which type of user-defined function in SQL returns a single value?","options":[{"label":"A","text":"Scalar function"},{"label":"B","text":"Table-valued function"},{"label":"C","text":"Inline function"},{"label":"D","text":"Aggregate function"}],"answer":"A","note":"A","key_point":"Scalar function trả về duy nhất một giá trị đơn lẻ.","why_correct":"Scalar function được thiết kế để nhận đầu vào và trả về một giá trị duy nhất (ví dụ: kiểu int, varchar, date), phù hợp với yêu cầu của câu hỏi.","why_wrong":[{"label":"B","why":"Table-valued function trả về một tập hợp các hàng dưới dạng một table."},{"label":"C","why":"Inline function là một dạng của table-valued function, trả về kết quả của một câu lệnh SELECT."},{"label":"D","why":"Aggregate function thực hiện tính toán trên một tập hợp các giá trị để trả về một giá trị tổng hợp, không phải là user-defined function thông thường."}],"vocab":[{"word":"Scalar function","reading":"","meaning":"Hàm trả về một giá trị đơn lẻ duy nhất."},{"word":"Table-valued function","reading":"","meaning":"Hàm trả về kết quả dưới dạng một bảng (table)."}]},{"id":141,"slide":141,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which normalization level ensures that there are no repeating groups in tables?","options":[{"label":"A","text":"First Normal Form (1NF)"},{"label":"B","text":"Second Normal Form (2NF)"},{"label":"C","text":"Third Normal Form (3NF)"},{"label":"D","text":"Boyce-Codd Normal Form (BCNF)"}],"answer":"A","note":"A","key_point":"1NF yêu cầu mỗi thuộc tính chỉ chứa giá trị nguyên tử và không có repeating groups.","why_correct":"1NF là mức cơ bản nhất của normalization, yêu cầu mỗi cell trong table chỉ chứa một giá trị duy nhất và không có các cột lặp lại.","why_wrong":[{"label":"B","why":"2NF yêu cầu đạt 1NF và loại bỏ partial functional dependency."},{"label":"C","why":"3NF yêu cầu đạt 2NF và loại bỏ transitive dependency."},{"label":"D","why":"BCNF là dạng chuẩn mạnh hơn 3NF, tập trung vào các functional dependency liên quan đến candidate key."}],"vocab":[{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm dư thừa và đảm bảo tính toàn vẹn."},{"word":"Repeating groups","reading":"","meaning":"Các nhóm dữ liệu lặp lại trong một record, vi phạm tính nguyên tử của 1NF."},{"word":"Atomic value","reading":"","meaning":"Giá trị không thể chia nhỏ hơn được nữa trong một cell."}]},{"id":142,"slide":142,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which normalization level ensures that each attribute is dependent only on the primary key?","options":[{"label":"A","text":"First Normal Form (1NF)"},{"label":"B","text":"Second Normal Form (2NF)"},{"label":"C","text":"Third Normal Form (3NF)"},{"label":"D","text":"Boyce-Codd Normal Form (BCNF)"}],"answer":"C","note":"C","key_point":"Third Normal Form (3NF) loại bỏ các transitive dependency, đảm bảo thuộc tính phụ thuộc hoàn toàn vào primary key.","why_correct":"Định nghĩa của Third Normal Form (3NF) là mọi non-key attribute phải phụ thuộc trực tiếp vào primary key, không qua một non-key attribute trung gian nào (không có transitive dependency).","why_wrong":[{"label":"A","why":"1NF chỉ yêu cầu các giá trị trong mỗi cột là atomic."},{"label":"B","why":"2NF loại bỏ các partial dependency đối với composite primary key."},{"label":"D","why":"BCNF là dạng chuẩn mạnh hơn 3NF, yêu cầu mọi determinant phải là super key."}],"vocab":[{"word":"Third Normal Form","reading":"","meaning":"Dạng chuẩn 3, yêu cầu không có phụ thuộc bắc cầu."},{"word":"transitive dependency","reading":"","meaning":"Phụ thuộc bắc cầu giữa các thuộc tính không phải primary key."}]},{"id":143,"slide":143,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which normalization form eliminates transitive dependency?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"BCNF"}],"answer":"C","note":"C","key_point":"3NF loại bỏ tất cả các transitive dependency khỏi relation schema.","why_correct":"Theo định nghĩa chuẩn, 3NF yêu cầu relation đã đạt 2NF và không có thuộc tính không khóa nào phụ thuộc bắc cầu (transitive dependency) vào primary key.","why_wrong":[{"label":"A","why":"1NF chỉ loại bỏ các giá trị lặp (repeating groups) và đảm bảo tính nguyên tử."},{"label":"B","why":"2NF chỉ loại bỏ partial dependency (phụ thuộc hàm từng phần)."},{"label":"D","why":"BCNF là chuẩn mạnh hơn 3NF, loại bỏ các anomaly do phụ thuộc hàm mà bên trái không phải là super key."}],"vocab":[{"word":"transitive dependency","reading":"","meaning":"Phụ thuộc bắc cầu giữa các thuộc tính trong một relation."},{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu để giảm dư thừa."}]},{"id":144,"slide":144,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which property of a transaction ensures that the execution of a transaction should not be interfered with by any other transactions executing concurrently?","options":[{"label":"A","text":"Atomicity"},{"label":"B","text":"Durability"},{"label":"C","text":"Isolation"},{"label":"D","text":"Consistency"}],"answer":"C","note":"C","key_point":"Isolation đảm bảo các transaction chạy đồng thời không bị ảnh hưởng lẫn nhau.","why_correct":"Isolation (Tính cô lập) ngăn chặn các transaction chạy song song can thiệp vào trạng thái dữ liệu của nhau, đảm bảo kết quả giống như chạy tuần tự.","why_wrong":[{"label":"A","why":"Atomicity đảm bảo transaction thực hiện toàn bộ hoặc không gì cả."},{"label":"B","why":"Durability đảm bảo dữ liệu đã commit được lưu trữ vĩnh viễn."},{"label":"D","why":"Consistency đảm bảo database chuyển từ trạng thái hợp lệ này sang trạng thái hợp lệ khác."}],"vocab":[{"word":"Isolation","reading":"","meaning":"Tính cô lập, đảm bảo các transaction chạy độc lập khi thực thi đồng thời."},{"word":"Transaction","reading":"","meaning":"Giao dịch, một chuỗi các thao tác cơ sở dữ liệu được xử lý như một thể thống nhất."}]},{"id":145,"slide":145,"section":"Mô hình ER","prompt":"","setup":"","stem":"Which type of relationship connects two entities where one entity can have multiple associations with another entity, but the second entity can only have one association with the first entity?","options":[{"label":"A","text":"One-to-One"},{"label":"B","text":"One-to-Many"},{"label":"C","text":"Many-to-Many"},{"label":"D","text":"Many-to-One"}],"answer":"B","note":"B. One-to-Many (1:N): Một thực thể A có thể liên kết với nhiều thực thể B, nhưng mỗi B chỉ liên kết với một A.","key_point":"Mối quan hệ One-to-Many cho phép một thực thể liên kết với nhiều thực thể khác.","why_correct":"Đáp án B chính xác vì một thực thể bên phía \"One\" có thể kết nối với nhiều thực thể bên phía \"Many\", nhưng ngược lại mỗi thực thể bên \"Many\" chỉ gắn với duy nhất một thực thể bên \"One\".","why_wrong":[{"label":"A","why":"Dành cho quan hệ 1:1, nơi mỗi thực thể chỉ gắn với đúng một thực thể ở phía bên kia."},{"label":"C","why":"Dành cho quan hệ M:N, nơi cả hai bên đều có thể có nhiều mối liên kết qua lại."},{"label":"D","why":"Đảo ngược lại chiều của quan hệ One-to-Many."}],"vocab":[{"word":"One-to-Many","reading":"","meaning":"Mối quan hệ một-nhiều giữa hai thực thể trong ER model."},{"word":"ER model","reading":"","meaning":"Mô hình thực thể kết hợp dùng để thiết kế cơ sở dữ liệu."}]},{"id":146,"slide":146,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which operation is not typically associated with relational data manipulation?","options":[{"label":"A","text":"Deleting attributes"},{"label":"B","text":"Inserting tuples into a relation"},{"label":"C","text":"Modifying tuples in a relation"},{"label":"D","text":"Deleting tuples from a relation"}],"answer":"A","note":"A","key_point":"Relational data manipulation involves tuples, not deleting attributes.","why_correct":"Relational model operations manipulate data instances (tuples), whereas changing attributes (columns) is a schema-level alteration (ALTER TABLE), not data manipulation.","why_wrong":[{"label":"B","why":"Inserting tuples is a standard data manipulation operation (INSERT)."},{"label":"C","why":"Modifying tuples is a standard data manipulation operation (UPDATE)."},{"label":"D","why":"Deleting tuples is a standard data manipulation operation (DELETE)."}],"vocab":[{"word":"tuple","reading":"","meaning":"Một dòng dữ liệu trong relation."},{"word":"relation","reading":"","meaning":"Một bảng dữ liệu trong cơ sở dữ liệu quan hệ."}]},{"id":147,"slide":147,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following is an example of NoSQL database systems, which are not based on the relational model?","options":[{"label":"A","text":"MySQL"},{"label":"B","text":"PostgreSQL"},{"label":"C","text":"MongoDB"},{"label":"D","text":"Oracle Database"}],"answer":"C","note":"C","key_point":"MongoDB là hệ quản trị cơ sở dữ liệu NoSQL không dựa trên relational model.","why_correct":"MongoDB lưu trữ dữ liệu dưới dạng document thay vì bảng (table) quan hệ như các hệ thống RDBMS truyền thống.","why_wrong":[{"label":"A","why":"Đây là hệ quản trị cơ sở dữ liệu quan hệ (RDBMS)."},{"label":"B","why":"Đây là một hệ quản trị cơ sở dữ liệu quan hệ mã nguồn mở phổ biến."},{"label":"D","why":"Đây là một hệ quản trị cơ sở dữ liệu quan hệ thương mại lớn."}],"vocab":[{"word":"NoSQL","reading":"","meaning":"Hệ cơ sở dữ liệu phi quan hệ, lưu trữ dữ liệu linh hoạt không theo cấu trúc bảng truyền thống."},{"word":"relational model","reading":"","meaning":"Mô hình quan hệ dựa trên các bảng (table) gồm các hàng và cột."}]},{"id":148,"slide":148,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"How many joins are required for 6 tables to join straight?","options":[{"label":"A","text":"4"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"12"}],"answer":"B","note":"B","key_point":"Số lượng join để nối n bảng thẳng hàng luôn là n - 1.","why_correct":"Để kết nối 6 tables lại với nhau một cách trực tiếp, ta cần đúng 5 phép toán join (n - 1 = 6 - 1 = 5).","why_wrong":[{"label":"A","why":"Số lượng join này chỉ đủ cho 5 bảng."},{"label":"C","why":"Nhầm lẫn số bảng bằng số lượng join."},{"label":"D","why":"Con số quá lớn, không đúng quy tắc kết nối bảng."}],"vocab":[{"word":"join","reading":"","meaning":"Phép kết nối dữ liệu từ nhiều bảng dựa trên điều kiện chung."},{"word":"table","reading":"","meaning":"Bảng lưu trữ dữ liệu trong cơ sở dữ liệu quan hệ gồm các hàng và cột."}]},{"id":149,"slide":149,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"How can you invoke a user-defined function in a SQL query?","options":[{"label":"A","text":"Using the EXECUTE statement"},{"label":"B","text":"Using the CALL statement"},{"label":"C","text":"Using the SELECT statement"},{"label":"D","text":"Using the RUN statement"}],"answer":"C","note":"C | user-defined function (UDF) directly within a SELECT statement, typically as part of an expression or to retrieve a calculated","key_point":"User-defined function được gọi trực tiếp trong câu lệnh SELECT.","why_correct":"User-defined function trả về một giá trị hoặc bảng, cho phép gọi trực tiếp bên trong SELECT statement giống như các built-in function.","why_wrong":[{"label":"A","why":"EXECUTE thường dùng cho stored procedure hoặc dynamic SQL, không dùng để gọi function trong query."},{"label":"B","why":"CALL được dùng để gọi stored procedure."},{"label":"D","why":"RUN không phải là từ khóa chuẩn trong SQL để thực thi function."}],"vocab":[{"word":"user-defined function","reading":"","meaning":"Hàm do người dùng tự định nghĩa trong cơ sở dữ liệu."},{"word":"SELECT statement","reading":"","meaning":"Câu lệnh dùng để truy vấn dữ liệu."}]},{"id":150,"slide":150,"section":"Mô hình ER","prompt":"","setup":"","stem":"How are weak entity sets represented in an Entity Relationship Diagram (ERD)?","options":[{"label":"A","text":"With rectangle"},{"label":"B","text":"With diamond shape"},{"label":"C","text":"With a double-line rectangle"},{"label":"D","text":"With a dashed oval"}],"answer":"C","note":"C","key_point":"Weak entity sets được biểu diễn bằng hình chữ nhật có đường viền kép trong ERD.","why_correct":"Theo quy ước chuẩn của mô hình ER, các weak entity set không có primary key riêng nên được ký hiệu bằng hình chữ nhật nét đôi để phân biệt với strong entity set.","why_wrong":[{"label":"A","why":"Đây là ký hiệu cho strong entity set."},{"label":"B","why":"Đây là ký hiệu cho relationship set."},{"label":"D","why":"Đây là ký hiệu cho derived attribute."}],"vocab":[{"word":"Weak entity set","reading":"","meaning":"Entity set không có đủ thuộc tính để tạo thành primary key."},{"word":"ERD","reading":"","meaning":"Sơ đồ mô hình hóa dữ liệu gồm entities, attributes và relationships."}]},{"id":151,"slide":151,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"How many types of variables are there in Stored Procedure","options":[{"label":"A","text":"Default variable and input variable"},{"label":"B","text":"Default variable and output variable"},{"label":"C","text":"Input variable and output variable"},{"label":"D","text":"Local variables and global variables"}],"answer":"C","note":"C","key_point":"Stored Procedure sử dụng các tham số IN và OUT để truyền dữ liệu.","why_correct":"Stored Procedure hỗ trợ các tham số đầu vào (IN) để nhận giá trị và tham số đầu ra (OUT) để trả về kết quả sau khi thực thi.","why_wrong":[{"label":"A","why":"Default không phải là một loại biến tham số chính trong Stored Procedure."},{"label":"B","why":"Thiếu tham số đầu vào (IN) là thành phần bắt buộc để truyền dữ liệu."},{"label":"D","why":"Đây là phân loại biến trong lập trình thông thường, không phải tham số của Stored Procedure."}],"vocab":[{"word":"Stored Procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ trong database để thực thi như một chương trình."},{"word":"Input variable","reading":"","meaning":"Tham số truyền giá trị vào Stored Procedure."},{"word":"Output variable","reading":"","meaning":"Tham số dùng để trả kết quả từ Stored Procedure ra ngoài."}]},{"id":152,"slide":152,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"When no specific join type between multiple tables in a query\u0027s from clause is specified, what type of JOIN is assumed?","options":[{"label":"A","text":"INNER"},{"label":"B","text":"RIGHT"},{"label":"C","text":"LEFT"},{"label":"D","text":"FULL"}],"answer":"A","note":"A specified between multiple tables in a query\u0027s FROM clause INNER JOIN","key_point":"Mặc định trong mệnh đề FROM khi liệt kê nhiều bảng là INNER JOIN.","why_correct":"Khi liệt kê các bảng cách nhau bởi dấu phẩy trong FROM, SQL thực hiện phép toán Cartesian product, tương đương với INNER JOIN khi kết hợp với điều kiện lọc trong WHERE.","why_wrong":[{"label":"B","why":"RIGHT JOIN yêu cầu từ khóa cụ thể để giữ lại các hàng từ bảng bên phải."},{"label":"C","why":"LEFT JOIN yêu cầu từ khóa cụ thể để giữ lại các hàng từ bảng bên trái."},{"label":"D","why":"FULL JOIN yêu cầu từ khóa cụ thể để kết hợp tất cả các hàng từ cả hai bảng."}],"vocab":[{"word":"INNER JOIN","reading":"","meaning":"Phép kết nối chỉ trả về các hàng có giá trị khớp ở cả hai bảng."},{"word":"Cartesian product","reading":"","meaning":"Phép toán kết hợp mọi hàng của bảng này với mọi hàng của bảng kia."}]},{"id":153,"slide":153,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"We can use these ______ in SQL queries and other statements to perform computations that cannot be done with SQL alone.","options":[{"label":"A","text":"Trigger"},{"label":"B","text":"View"},{"label":"C","text":"Index"},{"label":"D","text":"Stored-procedure"}],"answer":"D","note":"D","key_point":"Stored-procedure cho phép thực thi logic lập trình phức tạp bên trong cơ sở dữ liệu.","why_correct":"Stored-procedure hỗ trợ các cấu trúc điều khiển như vòng lặp, điều kiện (if-else) và biến, giúp thực hiện các tính toán mà SQL thuần túy không làm được.","why_wrong":[{"label":"A","why":"Trigger chỉ tự động thực thi khi có sự kiện DML xảy ra."},{"label":"B","why":"View chỉ là bảng ảo dùng để lưu trữ truy vấn SELECT."},{"label":"C","why":"Index chỉ dùng để tăng tốc độ truy xuất dữ liệu."}],"vocab":[{"word":"Stored-procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được biên dịch sẵn để thực hiện một tác vụ cụ thể."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, bao gồm các lệnh như INSERT, UPDATE, DELETE."}]},{"id":154,"slide":154,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"A(n) ______ is a property of the entire relation, rather than of the individual tuples in which each tuple is unique.","options":[{"label":"A","text":"Row"},{"label":"B","text":"Key"},{"label":"C","text":"Attribute"},{"label":"D","text":"Field"}],"answer":"B","note":"B","key_point":"Key là ràng buộc toàn cục đảm bảo tính duy nhất của mỗi tuple trong relation.","why_correct":"Key (như Primary Key) là thuộc tính hoặc tập thuộc tính dùng để định danh duy nhất mỗi tuple trong toàn bộ relation, không phải đặc điểm của riêng một tuple đơn lẻ.","why_wrong":[{"label":"A","why":"Row là một tuple cụ thể, không phải thuộc tính định danh của cả relation."},{"label":"C","why":"Attribute là cột dữ liệu, không tự thân đảm bảo tính duy nhất của tuple."},{"label":"D","why":"Field là một giá trị tại giao điểm của row và column, không phải ràng buộc toàn cục."}],"vocab":[{"word":"Relation","reading":"","meaning":"Bảng dữ liệu trong mô hình quan hệ."},{"word":"Tuple","reading":"","meaning":"Một dòng dữ liệu trong bảng."},{"word":"Key","reading":"","meaning":"Tập thuộc tính dùng để phân biệt các tuple."}]},{"id":155,"slide":155,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"______ is a relation name, together with the attributes of that relation.","options":[{"label":"A","text":"Schemas"},{"label":"B","text":"Instance"},{"label":"C","text":"Database"},{"label":"D","text":"Attributes"}],"answer":"A","note":"A","key_point":"Database Schema định nghĩa cấu trúc logic của các relation trong database.","why_correct":"Schema mô tả khung sườn của database, bao gồm tên relation và tập hợp các attribute tương ứng.","why_wrong":[{"label":"B","why":"Instance là tập hợp các tuple cụ thể tại một thời điểm nhất định."},{"label":"C","why":"Database là tập hợp tổng thể các dữ liệu có liên quan."},{"label":"D","why":"Attribute chỉ là các cột đơn lẻ mô tả đặc tính của dữ liệu."}],"vocab":[{"word":"Schema","reading":"","meaning":"Cấu trúc logic định nghĩa các bảng và mối quan hệ trong database."},{"word":"Instance","reading":"","meaning":"Trạng thái dữ liệu thực tế tại một thời điểm cụ thể."},{"word":"Attribute","reading":"","meaning":"Các cột hoặc thuộc tính mô tả dữ liệu trong một relation."}]},{"id":156,"slide":156,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"An ________ is a statement that gives the user a number of different options in the event, condition, and action parts","options":[{"label":"A","text":"Trigger"},{"label":"B","text":"Stored-function"},{"label":"C","text":"Index"},{"label":"D","text":"Stored-procedure"}],"answer":"A","note":"A","key_point":"Trigger là cơ chế tự động thực thi hành động dựa trên điều kiện xác định.","why_correct":"Trigger cho phép định nghĩa các sự kiện (event), điều kiện (condition) và hành động (action) phức tạp, hỗ trợ nhiều lựa chọn xử lý khác nhau khi dữ liệu thay đổi.","why_wrong":[{"label":"B","why":"Stored-function tập trung vào việc tính toán và trả về một giá trị duy nhất."},{"label":"C","why":"Index dùng để tối ưu hóa tốc độ truy vấn, không chứa logic điều kiện hay hành động."},{"label":"D","why":"Stored-procedure là tập hợp các câu lệnh được gọi thủ công, không tự động kích hoạt bởi sự kiện."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Đối tượng cơ sở dữ liệu tự động thực thi khi một sự kiện DML xảy ra."},{"word":"Stored-procedure","reading":"","meaning":"Thủ tục lưu trữ chứa các câu lệnh SQL được biên dịch sẵn."}]},{"id":157,"slide":157,"section":"Mô hình ER","prompt":"","setup":"","stem":"An E/R diagram is a graphical representation of sets, _______ ?","options":[{"label":"A","text":"Entity"},{"label":"B","text":"Attributes"},{"label":"C","text":"Relationships"},{"label":"D","text":"All of the others"}],"answer":"D","note":"D","key_point":"E/R diagram mô tả cấu trúc dữ liệu thông qua Entity, Attributes và Relationships.","why_correct":"E/R diagram là công cụ mô hình hóa dữ liệu bao gồm ba thành phần chính: Entity (thực thể), Attributes (thuộc tính) và Relationships (mối quan hệ).","why_wrong":[{"label":"A","why":"Chỉ đề cập đến một thành phần, thiếu Attributes và Relationships."},{"label":"B","why":"Chỉ đề cập đến một thành phần, thiếu Entity và Relationships."},{"label":"C","why":"Chỉ đề cập đến một thành phần, thiếu Entity và Attributes."}],"vocab":[{"word":"Entity","reading":"","meaning":"Đối tượng hoặc khái niệm trong thế giới thực được lưu trữ thông tin."},{"word":"Attributes","reading":"","meaning":"Các đặc tính hoặc thông tin chi tiết mô tả cho một Entity."},{"word":"Relationships","reading":"","meaning":"Sự liên kết hoặc tương tác giữa các Entity với nhau."}]},{"id":158,"slide":158,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"A person or persons responsible for the structure or schema of the database is ____","options":[{"label":"A","text":"A User"},{"label":"B","text":"A Coder"},{"label":"C","text":"A Customer"},{"label":"D","text":"A database administrator"}],"answer":"D","note":"D","key_point":"Database Administrator (DBA) chịu trách nhiệm thiết kế, quản lý và bảo trì database schema.","why_correct":"DBA là người có quyền hạn và chuyên môn để định nghĩa cấu trúc (schema), quản lý quyền truy cập và đảm bảo tính toàn vẹn của database.","why_wrong":[{"label":"A","why":"User chỉ là người truy vấn hoặc thao tác dữ liệu thông qua ứng dụng."},{"label":"B","why":"Coder tập trung viết code ứng dụng, không trực tiếp thiết kế schema hệ thống."},{"label":"C","why":"Customer là người yêu cầu nghiệp vụ, không tham gia vào kỹ thuật database."}],"vocab":[{"word":"Database Administrator","reading":"","meaning":"Người quản trị cơ sở dữ liệu, chịu trách nhiệm vận hành và cấu trúc hệ thống."},{"word":"Schema","reading":"","meaning":"Cấu trúc logic mô tả các bảng, cột và mối quan hệ trong database."}]},{"id":159,"slide":159,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"A Delete command operates on _____ relation.","options":[{"label":"A","text":"One"},{"label":"B","text":"Two"},{"label":"C","text":"Several"},{"label":"D","text":"Null"}],"answer":"A","note":"A    DELETE command is used to remove rows from a single specified table.","key_point":"Lệnh DELETE trong SQL chuẩn luôn chỉ tác động lên một relation duy nhất.","why_correct":"Cú pháp SQL chuẩn của lệnh DELETE có dạng `DELETE FROM table_name`, trong đó chỉ có một relation được chỉ định làm mục tiêu xóa. Do đó, nó chỉ thao tác trên duy nhất một relation tại một thời điểm.","why_wrong":[{"label":"B","why":"Nhầm với lệnh DELETE mở rộng có chứa truy vấn JOIN, nhưng dữ liệu bị xóa vẫn chỉ áp dụng cho một relation chỉ định."},{"label":"C","why":"Chuẩn SQL không cho phép lệnh DELETE xóa dữ liệu đồng thời trên nhiều relation."},{"label":"D","why":"Lệnh DELETE bắt buộc phải chỉ định tên một relation cụ thể để thực hiện thao tác."}],"vocab":[{"word":"DELETE command","reading":"","meaning":"Lệnh dùng để xóa một hoặc nhiều hàng dữ liệu trong bảng SQL."},{"word":"relation","reading":"","meaning":"Bảng dữ liệu (table) trong mô hình dữ liệu quan hệ."}]},{"id":160,"slide":160,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"A data model is a notation for describing data or information. The description generally consists _____?","options":[{"label":"A","text":"Structure of the data"},{"label":"B","text":"Operations on the data"},{"label":"C","text":"Constraints on the data"},{"label":"D","text":"All of the others"}],"answer":"D","note":"D","key_point":"A data model consists of data structure, operations, and constraints.","why_correct":"Một data model hoàn chỉnh bao gồm ba thành phần cốt lõi: cấu trúc của dữ liệu (structure), các phép toán thao tác trên dữ liệu (operations), và các ràng buộc toàn vẹn (constraints).","why_wrong":[{"label":"A","why":"Chỉ đề cập đến cấu trúc nhưng bỏ qua các thành phần khác."},{"label":"B","why":"Chỉ đề cập đến các phép toán thao tác trên dữ liệu."},{"label":"C","why":"Chỉ đề cập đến các ràng buộc dữ liệu."}],"vocab":[{"word":"data model","reading":"","meaning":"Mô hình dữ liệu, dùng để mô tả cấu trúc, operations và constraints."},{"word":"constraints","reading":"","meaning":"Các ràng buộc toàn vẹn trên dữ liệu."}]},{"id":161,"slide":161,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Consider the join of a relation R with relation S. If R has m tuples and S has n tuples, then the maximum size of join is:","options":[{"label":"A","text":"mn"},{"label":"B","text":"m + n"},{"label":"C","text":"(m + n) / 2"},{"label":"D","text":"2(m + n)"}],"answer":"A","note":"A","key_point":"Số tuple tối đa của một join giữa R và S là tích số tuple mn.","why_correct":"Trong trường hợp xấu nhất (mỗi tuple ở R đều match với mọi tuple ở S), kết quả join tạo ra tích Descartes với số tuple là m nhân n.","why_wrong":[{"label":"B","why":"Nhầm lẫn với phép union hoặc tổng số tuple."},{"label":"C","why":"Không phản ánh đúng quy tắc tổ hợp của phép join."},{"label":"D","why":"Đưa ra con số vượt quá giới hạn tích Descartes."}],"vocab":[{"word":"tuple","reading":"","meaning":"Một dòng dữ liệu trong bảng relational database."},{"word":"join","reading":"","meaning":"Phép toán kết hợp dữ liệu từ hai hay nhiều relation."}]},{"id":162,"slide":162,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Database data models usually have a way to go describe limitations on what the data can be, is called","options":[{"label":"A","text":"Constraints on the data"},{"label":"B","text":"Operations on the data"},{"label":"C","text":"Structure of the data"},{"label":"D","text":"definition of data"}],"answer":"A","note":"A","key_point":"Database data models use constraints to describe limitations on valid data.","why_correct":"Constraints trong data model định nghĩa các quy tắc và giới hạn (như primary key, foreign key, check) để đảm bảo tính toàn vẹn của dữ liệu.","why_wrong":[{"label":"B","why":"Operations mô tả cách thao tác, truy vấn dữ liệu chứ không giới hạn giá trị."},{"label":"C","why":"Structure mô tả cách tổ chức dữ liệu thành các bảng, schema."},{"label":"D","why":"Definition of data là khái niệm chung chung, không đặc tả giới hạn hợp lệ."}],"vocab":[{"word":"Constraints","reading":"","meaning":"Các ràng buộc dùng để giới hạn giá trị dữ liệu hợp lệ trong database."},{"word":"Data models","reading":"","meaning":"Mô hình dữ liệu định nghĩa cấu trúc, thao tác và ràng buộc."}]},{"id":163,"slide":163,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Domain constraints, functional dependency and referential integrity are special forms of _________.","options":[{"label":"A","text":"Foreign key"},{"label":"B","text":"Primary key"},{"label":"C","text":"Assertion"},{"label":"D","text":"Referential constraint"}],"answer":"C","note":"C","key_point":"Domain constraints, functional dependencies, and referential integrity are special forms of assertion.","why_correct":"Trong lý thuyết cơ sở dữ liệu, Assertion là một quy tắc tổng quát cho phép định nghĩa bất kỳ điều kiện nào mà database phải tuân thủ, bao gồm cả domain constraints, functional dependencies và referential integrity.","why_wrong":[{"label":"A","why":"Foreign key chỉ là một dạng cụ thể dùng để đảm bảo referential integrity."},{"label":"B","why":"Primary key chỉ dùng để đảm bảo tính duy nhất và không null cho entity."},{"label":"D","why":"Referential constraint chỉ đề cập riêng đến mối quan hệ giữa foreign key và primary key."}],"vocab":[{"word":"Assertion","reading":"","meaning":"Quy tắc toàn vẹn tổng quát trong cơ sở dữ liệu."},{"word":"Domain constraint","reading":"","meaning":"Ràng buộc trên miền giá trị hợp lệ của thuộc tính."},{"word":"Referential integrity","reading":"","meaning":"Tính toàn vẹn tham chiếu giữa các bảng."}]},{"id":164,"slide":164,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Foreign key is the one in which the ______ of one relation is referenced in another relation.","options":[{"label":"A","text":"Foreign key"},{"label":"B","text":"Primary key"},{"label":"C","text":"References"},{"label":"D","text":"Check constraint"}],"answer":"B","note":"B","key_point":"Foreign key tham chiếu đến primary key của một relation khác.","why_correct":"Foreign key trong một bảng luôn trỏ tới primary key hoặc candidate key của bảng được tham chiếu nhằm đảm bảo tính toàn vẹn tham chiếu.","why_wrong":[{"label":"A","why":"Khái niệm foreign key không thể tự tham chiếu chính nó theo cách này."},{"label":"C","why":"References là từ khóa trong SQL chứ không phải là thuộc tính."},{"label":"D","why":"Check constraint dùng để giới hạn giá trị của cột thay vì tham chiếu bảng khác."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Khóa ngoại dùng để liên kết giữa hai bảng."},{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi tuple trong bảng."}]},{"id":165,"slide":165,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Foreign key constraints are created by using the \"______\" keyword to refer to the primary key of another table.","options":[{"label":"A","text":"Refer"},{"label":"B","text":"References"},{"label":"C","text":"Referential"},{"label":"D","text":"All of the others"}],"answer":"B","note":"B","key_point":"Su dung tu khoa REFERENCES de khai bao foreign key lien ket toi primary key.","why_correct":"Trong SQL, tu khoa REFERENCES duoc su dung trong dinh nghia bang de chi dinh rang cot do la mot foreign key tham chieu toi primary key cua bang khac.","why_wrong":[{"label":"A","why":"Refer khong phai la tu khoa hop le trong cu phap tao foreign key cua SQL."},{"label":"C","why":"Referential la mot phan cua cu phap toan ven tham chieu (referential integrity) nhung khong dung lam tu khoa khai bao."},{"label":"D","why":"Chi co dap an B la dung cu phap SQL."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Khoa ngoai dung de lien ket hai bang voi nhau."},{"word":"primary key","reading":"","meaning":"Khoa chinh dung de xac dinh duy nhat moi tuple trong bang."}]},{"id":166,"slide":166,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Foreign key constraints are created by using the \"______\" keyword to refer to the primary key of another table.","options":[{"label":"A","text":"Refer"},{"label":"B","text":"References"},{"label":"C","text":"Referential"},{"label":"D","text":"All of the others"}],"answer":"B","note":"B","key_point":"Su dung tu khoa REFERENCES de khai bao foreign key trong SQL.","why_correct":"Trong cau lenh SQL, tu khoa REFERENCES duoc dung de lien ket foreign key cua bang nay toi primary key cua bang khac.","why_wrong":[{"label":"A","why":"Tu Refer khong phai la cu phap chuan trong SQL cho rang buoc nay."},{"label":"C","why":"Tu Referential thuong dung trong referential integrity nhung khong dung lam tu khoa khai bao."},{"label":"D","why":"Chi co dap an B la tu khoa dung."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Khoa ngoai dung de lien ket hai bang voi nhau."},{"word":"primary key","reading":"","meaning":"Khoa chinh dung de xac dinh duy nhat moi tuple trong bang."}]},{"id":167,"slide":167,"section":"Mô hình ER","prompt":"","setup":"","stem":"If R is neither many-one from E to F or from F to E, then we say R is.","options":[{"label":"A","text":"Many - one"},{"label":"B","text":"One - one"},{"label":"C","text":"Many - many"},{"label":"D","text":"All of the others"}],"answer":"C","note":"C","key_point":"Relationship types in ER model are classified by cardinality: one-one, many-one, and many-many.","why_correct":"Nếu relationship R không phải là many-one theo cả hai chiều (E sang F hoặc F sang E), thì R phải là dạng many-many.","why_wrong":[{"label":"A","why":"Sai vì many-one xảy ra khi một entity ở phía này liên kết với nhiều entity ở phía kia và ngược lại."},{"label":"B","why":"Sai vì one-one nghĩa là một entity chỉ liên kết tối đa với một entity ở mỗi phía."},{"label":"D","why":"Sai vì chỉ có đáp án C là đúng."}],"vocab":[{"word":"ER model","reading":"","meaning":"Mô hình thực thể kết hợp dùng để thiết kế cơ sở dữ liệu."},{"word":"cardinality","reading":"","meaning":"Ràng buộc số lượng tham gia trong một relationship."}]},{"id":168,"slide":168,"section":"Mô hình ER","prompt":"","setup":"","stem":"Given that Cartoons and Murder Mysteries are special Movie genres, what is the relationship between entities Cartoons, Murder Mysteries and Movie?","options":[{"label":"A","text":"isa relationship"},{"label":"B","text":"ais relationship"},{"label":"C","text":"supporting relationship"},{"label":"D","text":"referential integrity relationship"}],"answer":"A","note":"A","key_point":"Mối quan hệ isa (is-a) biểu diễn tính kế thừa trong ER model.","why_correct":"Cartoons và Murder Mysteries là các tập con chuyên biệt của Movie, nên chúng có quan hệ isa với Movie (một Cartoons là một Movie).","why_wrong":[{"label":"B","why":"Đây không phải là thuật ngữ chuẩn trong ER model."},{"label":"C","why":"Supporting relationship không phải là khái niệm định nghĩa phân cấp kế thừa."},{"label":"D","why":"Referential integrity liên quan đến Foreign Key trong mô hình quan hệ, không phải phân cấp thực thể."}],"vocab":[{"word":"isa relationship","reading":"","meaning":"Mối quan hệ kế thừa giữa thực thể cha (supertype) và thực thể con (subtype)."},{"word":"ER model","reading":"","meaning":"Mô hình thực thể liên kết dùng để thiết kế cơ sở dữ liệu ở mức khái niệm."}]},{"id":169,"slide":169,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"NULL is:","options":[{"label":"A","text":"Not a value"},{"label":"B","text":"The same as 0 for integer and blank for character"},{"label":"C","text":"The same as blank for character"},{"label":"D","text":"The same as 0 for integer"}],"answer":"A","note":"A","key_point":"NULL đại diện cho giá trị chưa biết hoặc không áp dụng, không phải là giá trị cụ thể.","why_correct":"NULL không phải là một giá trị (như 0 hay chuỗi rỗng) mà là một trạng thái chỉ sự thiếu vắng dữ liệu.","why_wrong":[{"label":"B","why":"Nhầm lẫn NULL với giá trị mặc định của kiểu dữ liệu."},{"label":"C","why":"Chuỗi rỗng (\u0027\u0027) là một giá trị có độ dài bằng 0, khác với NULL."},{"label":"D","why":"Số 0 là một giá trị số hợp lệ, trong khi NULL biểu thị sự không tồn tại dữ liệu."}],"vocab":{"word":"NULL","reading":"","meaning":"Trạng thái biểu thị giá trị bị thiếu hoặc không xác định trong một field."}},{"id":170,"slide":170,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Problems such as redundancy that occur when we try to cram too much into a single relation are called\n_____","options":[{"label":"A","text":"Normal Form"},{"label":"B","text":"Anomalies"},{"label":"C","text":"Decomposing Relations"},{"label":"D","text":"None of the others"}],"answer":"B","note":"B","key_point":"Redundancy trong một relation dẫn đến các vấn đề gọi là Anomalies.","why_correct":"Anomalies (bất thường) là các vấn đề phát sinh như insertion, deletion, hoặc update anomalies khi dữ liệu bị dư thừa trong một relation.","why_wrong":[{"label":"A","why":"Normal Form là các quy tắc chuẩn hóa để loại bỏ redundancy, không phải là vấn đề."},{"label":"C","why":"Decomposing Relations là giải pháp để khắc phục Anomalies, không phải là tên gọi của vấn đề."}],"vocab":[{"word":"Anomalies","reading":"","meaning":"Các lỗi phát sinh khi thao tác dữ liệu do cấu trúc bảng không hợp lý."},{"word":"Redundancy","reading":"","meaning":"Sự dư thừa dữ liệu khi cùng một thông tin được lưu trữ nhiều lần."}]},{"id":171,"slide":171,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Suppose that we have a relation that possesses data about an individual entity. In Addition, it should not have any multi-valued dependencies.\nWhich of the following is the highest normal form for this relation?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"4NF"}],"answer":"D","note":"D","key_point":"4NF loại bỏ các multi-valued dependencies không tầm thường trong một relation.","why_correct":"Một relation đạt 4NF nếu nó đã đạt BCNF và không chứa bất kỳ multi-valued dependency không tầm thường nào. Vì đề bài yêu cầu không có multi-valued dependencies, 4NF là mức cao nhất phù hợp.","why_wrong":[{"label":"A","why":"1NF chỉ yêu cầu giá trị thuộc tính là atomic, chưa xử lý các dependency phức tạp."},{"label":"B","why":"2NF chỉ loại bỏ partial functional dependencies, chưa xét đến multi-valued dependencies."},{"label":"C","why":"3NF chỉ loại bỏ transitive dependencies, chưa đủ điều kiện để loại bỏ multi-valued dependencies."}],"vocab":[{"word":"Multi-valued dependency","reading":"","meaning":"Sự phụ thuộc trong đó một thuộc tính xác định một tập hợp các giá trị của thuộc tính khác."},{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm thiểu dư thừa và tránh các anomalies."},{"word":"4NF","reading":"","meaning":"Mức chuẩn hóa yêu cầu relation đạt BCNF và không có multi-valued dependencies."}]},{"id":172,"slide":172,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Suppose that we have a relation:\nR(ID, full name, address) and FDs {ID -\u003e full name, ID -\u003e address}","stem":"What is the highest normal form of R in relational database design?\nChoose correct answers?","options":[{"label":"A","text":"2NF"},{"label":"B","text":"1NF"},{"label":"C","text":"3NF"},{"label":"D","text":"BCNF"}],"answer":"CD","note":"CD","key_point":"R đạt BCNF nếu mọi FD X -\u003e Y đều có X là superkey.","why_correct":"Trong R, ID là candidate key duy nhất. Vì ID -\u003e full name và ID -\u003e address đều có vế trái là superkey, R thỏa mãn cả 3NF và BCNF.","why_wrong":[{"label":"A","why":"2NF là điều kiện cần nhưng chưa đủ vì R đã đạt đến mức cao hơn."},{"label":"B","why":"1NF là mức cơ bản nhất, R đã vượt qua mức này."}],"vocab":[{"word":"BCNF","reading":"","meaning":"Boyce-Codd Normal Form, dạng chuẩn cao hơn 3NF."},{"word":"Functional Dependency","reading":"","meaning":"Phụ thuộc hàm, mối quan hệ giữa các thuộc tính trong một relation."},{"word":"Superkey","reading":"","meaning":"Tập thuộc tính xác định duy nhất mọi thuộc tính khác trong relation."}]},{"id":174,"slide":174,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"Insert into Students ____ (32, N\u0027iona Bush\u0027, N\u0027Female\u0027);","stem":"In the given query which of the keyword has to be inserted?","options":[{"label":"A","text":"Into"},{"label":"B","text":"Set"},{"label":"C","text":"Where"},{"label":"D","text":"Values"}],"answer":"D","note":"D","key_point":"Cú pháp lệnh INSERT INTO yêu cầu từ khóa VALUES để chỉ định dữ liệu.","why_correct":"Trong SQL, lệnh INSERT INTO được sử dụng để thêm hàng mới vào bảng, và từ khóa VALUES là bắt buộc để liệt kê các giá trị tương ứng với các cột.","why_wrong":[{"label":"A","why":"INTO đã xuất hiện ngay sau INSERT."},{"label":"B","why":"SET được dùng trong lệnh UPDATE để gán giá trị mới."},{"label":"C","why":"WHERE dùng để lọc dữ liệu trong các lệnh SELECT, UPDATE hoặc DELETE."}],"vocab":[{"word":"INSERT INTO","reading":"","meaning":"Câu lệnh SQL dùng để thêm dữ liệu mới vào một bảng."},{"word":"VALUES","reading":"","meaning":"Từ khóa chỉ định danh sách các giá trị cần chèn vào các cột."}]},{"id":175,"slide":175,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"If a relation is in BCNF, then it is also in","options":[{"label":"A","text":"1 NF"},{"label":"B","text":"2 NF"},{"label":"C","text":"3 NF"},{"label":"D","text":"All of the mentioned"}],"answer":"D","note":"D","key_point":"BCNF là dạng chuẩn mạnh nhất trong các dạng chuẩn cơ bản (1NF, 2NF, 3NF).","why_correct":"Theo hệ thống phân cấp của normalization, một relation đạt chuẩn BCNF thì mặc định đã thỏa mãn các điều kiện khắt khe của 3NF, 2NF và 1NF.","why_wrong":[{"label":"A","why":"Chưa đủ vì BCNF còn thỏa mãn cả 2NF và 3NF."},{"label":"B","why":"Chưa đủ vì BCNF còn thỏa mãn cả 3NF."},{"label":"C","why":"Chưa đủ vì BCNF còn thỏa mãn cả 1NF và 2NF."}],"vocab":[{"word":"BCNF","reading":"","meaning":"Boyce-Codd Normal Form, dạng chuẩn loại bỏ mọi phụ thuộc hàm không tầm thường."},{"word":"Normalization","reading":"","meaning":"Quá trình thiết kế database nhằm giảm dư thừa dữ liệu và tránh các anomaly."}]},{"id":176,"slide":176,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"If there is more than one key for relation schema in DBMS then each key relation schema is classified as","options":[{"label":"A","text":"Prime key"},{"label":"B","text":"Super key"},{"label":"C","text":"Candidate key"},{"label":"D","text":"Primary key"}],"answer":"C","note":"C","key_point":"Mỗi khóa tối thiểu trong relation schema đều được phân loại là Candidate key.","why_correct":"Khi một relation schema có nhiều hơn một key có khả năng định danh duy nhất các tuple, mỗi key đó được gọi là Candidate key. Trong các Candidate key này, chỉ có một key được chọn làm Primary key.","why_wrong":[{"label":"A","why":"Thuật ngữ prime thường dùng cho prime attribute (thuộc tính thuộc candidate key), không phải tên phân loại khóa."},{"label":"B","why":"Super key là siêu khóa có thể chứa các thuộc tính dư thừa, không dùng để chỉ từng khóa tối thiểu cụ thể."},{"label":"D","why":"Primary key chỉ là DUY NHẤT một candidate key được người thiết kế chọn làm khóa chính."}],"vocab":[{"word":"Candidate key","reading":"","meaning":"Khóa ứng viên, tập thuộc tính tối thiểu định danh duy nhất một tuple."},{"word":"Primary key","reading":"","meaning":"Khóa chính, candidate key được chọn duy nhất để quản lý bảng."},{"word":"Super key","reading":"","meaning":"Siêu khóa, tập thuộc tính phân biệt các tuple nhưng có thể không tối thiểu."}]},{"id":177,"slide":177,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"If A → B and B → C, which rule allows us to infer A → C?","options":[{"label":"A","text":"Reflexivity"},{"label":"B","text":"Augmentation"},{"label":"C","text":"Transitivity"},{"label":"D","text":"Projection"}],"answer":"C","note":"C","key_point":"Quy tắc Transitivity cho phép suy ra A → C từ A → B và B → C.","why_correct":"Trong Armstrong\u0027s Axioms, quy tắc Transitivity (bắc cầu) khẳng định rằng nếu A xác định hàm B và B xác định hàm C, thì A sẽ xác định hàm C.","why_wrong":[{"label":"A","why":"Reflexivity (tính phản xạ) phát biểu rằng nếu Y ⊆ X thì X → Y."},{"label":"B","why":"Augmentation (tính tăng cường) phát biểu rằng nếu X → Y thì XZ → YZ."},{"label":"D","why":"Projection (phép chiếu) là một phép toán trong relational algebra, không phải luật Armstrong."}],"vocab":[{"word":"Armstrong\u0027s Axioms","reading":"","meaning":"Tập các quy tắc diễn dịch cơ bản cho phụ thuộc hàm."},{"word":"Transitivity","reading":"","meaning":"Quy tắc bắc cầu trong phụ thuộc hàm."}]},{"id":178,"slide":178,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In the context of a relational database, what is correct option for the statement below? Statement: A set of changes that must be all made together","options":[{"label":"A","text":"Consistency"},{"label":"B","text":"Concurrency"},{"label":"C","text":"Transaction"},{"label":"D","text":"Atom"}],"answer":"C","note":"C","key_point":"Transaction là tập hợp các thay đổi phải được thực hiện hoàn toàn cùng nhau.","why_correct":"Transaction đảm bảo tính chất all-or-nothing (Atomicity), nghĩa là hoặc tất cả các thay đổi được thực hiện thành công, hoặc không có thay đổi nào được áp dụng vào database.","why_wrong":[{"label":"A","why":"Consistency đảm bảo database chuyển từ trạng thái hợp lệ này sang trạng thái hợp lệ khác."},{"label":"B","why":"Concurrency liên quan đến việc xử lý nhiều transaction đồng thời."},{"label":"D","why":"Atom (hay Atomicity) là tính chất của transaction chứ không phải là tên gọi của tập hợp thay đổi."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực hiện như một đơn vị logic duy nhất."},{"word":"Atomicity","reading":"","meaning":"Tính nguyên tử, đảm bảo mọi thao tác trong transaction phải hoàn thành hoặc không gì cả."}]},{"id":179,"slide":179,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"In the relational model of data, what is the result of an algebraic query language?","options":[{"label":"A","text":"Data series"},{"label":"B","text":"Data file"},{"label":"C","text":"Relation"},{"label":"D","text":"database"}],"answer":"C","note":"C","key_point":"Kết quả của một phép toán relational algebra luôn là một relation mới.","why_correct":"Relational algebra hoạt động trên các relation đầu vào và trả về một relation mới làm kết quả, đảm bảo tính closure.","why_wrong":[{"label":"A","why":"Data series không phải là khái niệm trong relational model."},{"label":"B","why":"Data file liên quan đến physical storage thay vì abstract relational model."},{"label":"D","why":"Database là tập hợp nhiều relation, không phải là kết quả đơn lẻ của một query."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Ngôn ngữ hình thức dùng để thao tác trên các relation trong cơ sở dữ liệu."},{"word":"relation","reading":"","meaning":"Bảng dữ liệu gồm các tuple và attribute trong relational model."}]},{"id":180,"slide":180,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In relational database design, which normal form of a relation eliminates multi-valued attributes and ensures that data is organized at a fundamental level?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"4NF"}],"answer":"A","note":"A","key_point":"1NF yêu cầu các attribute chứa giá trị đơn (atomic) và loại bỏ multi-valued attributes.","why_correct":"1NF (First Normal Form) là mức cơ bản nhất trong normalization, đảm bảo mỗi cell trong bảng chỉ chứa một giá trị đơn duy nhất và loại bỏ các multi-valued attributes.","why_wrong":[{"label":"B","why":"Nhầm lẫn với việc loại bỏ partial dependency (yêu cầu của 2NF)."},{"label":"C","why":"Nhầm lẫn với việc loại bỏ transitive dependency (yêu cầu của 3NF)."},{"label":"D","why":"Nhầm lẫn với việc loại bỏ multi-valued dependency (yêu cầu của 4NF)."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu."},{"word":"1NF","reading":"","meaning":"Dạng chuẩn 1, yêu cầu các thuộc tính có giá trị nguyên tử."}]},{"id":181,"slide":181,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In a student registration system, which normal form is violated if one field contains multiple course IDs for the same student?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"4NF"}],"answer":"A","note":"A","key_point":"1NF yêu cầu mỗi ô trong bảng chỉ chứa một giá trị đơn (atomic).","why_correct":"Khi một trường chứa nhiều course ID cho cùng một học sinh, giá trị đó không còn atomic và vi phạm quy tắc của 1NF.","why_wrong":[{"label":"B","why":"Vi phạm phụ thuộc hàm trên khóa phức hợp, không liên quan đến giá trị đa trị."},{"label":"C","why":"Vi phạm phụ thuộc bắc cầu, không liên quan đến giá trị đa trị."},{"label":"D","why":"Liên quan đến đa phụ thuộc (multivalued dependency), cấp cao hơn nhiều so với 1NF."}],"vocab":[{"word":"1NF","reading":"","meaning":"Dạng chuẩn 1, yêu cầu các giá trị trong bảng phải là atomic."},{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu để giảm dư thừa."}]},{"id":182,"slide":182,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"In relational database design, which of the following is known as a set of entities of the same type that share the same properties or attributes?","options":[{"label":"A","text":"Entity Relation model"},{"label":"B","text":"Entity set"},{"label":"C","text":"Field set"},{"label":"D","text":"Record set"}],"answer":"B","note":"B","key_point":"Entity set là tập hợp các entity cùng loại có chung thuộc tính.","why_correct":"Theo định nghĩa chuẩn trong ER model, tập hợp các entity có cùng các thuộc tính được gọi là Entity set.","why_wrong":[{"label":"A","why":"Entity Relation model là mô hình dữ liệu, không phải tập hợp các entity."},{"label":"C","why":"Field set không phải là thuật ngữ chuẩn để chỉ tập hợp các entity."},{"label":"D","why":"Record set thường dùng trong lập trình ứng dụng (như kết quả truy vấn), không phải khái niệm thiết kế ER."}],"vocab":{"word":"Entity set","reading":"","meaning":"Tập hợp các thực thể cùng loại có chung các thuộc tính."}},{"id":183,"slide":183,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"(Choose 1 answer)In the relational model of data, what is the result of an algebraic query language?","options":[{"label":"A","text":"Data series"},{"label":"B","text":"Data file"},{"label":"C","text":"Relation"},{"label":"D","text":"database"}],"answer":"C","note":"C","key_point":"Ket qua cua moi phep toan trong relational algebra luon la mot relation moi.","why_correct":"Trong relational model, cac phep toan cua relational algebra nhan dau vao la mot hoac nhieu relation va luon tra ve mot relation moi lam ket qua.","why_wrong":[{"label":"A","why":"Data series khong phai la khai niem chuan trong relational model."},{"label":"B","why":"Data file la cach luu tru vat ly duoi o cung, khong phai ket qua logic cua algebra query."},{"label":"D","why":"Database la tap hop nhieu relation, trong khi ket qua cua mot query chi la mot relation."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Dai so quan he, ngon ngu truy van hinh thuc trong relational model."},{"word":"relation","reading":"","meaning":"Bang du lieu gom cac tuple va attribute trong relational model."}]},{"id":184,"slide":184,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"In a relational database, which SQL command is used to modify the structure of an existing table?","options":[{"label":"A","text":"UPDATE"},{"label":"B","text":"ALTER"},{"label":"C","text":"MODIFY"},{"label":"D","text":"CHANGE"}],"answer":"B","note":"B","key_point":"Sử dụng ALTER để thay đổi cấu trúc của một table đã tồn tại.","why_correct":"Lệnh ALTER (thuộc DDL) dùng để thêm, xóa hoặc sửa đổi các cột và ràng buộc trên một table hiện có.","why_wrong":[{"label":"A","why":"UPDATE là lệnh DML dùng để sửa đổi dữ liệu (tuples) bên trong table, không phải cấu trúc."},{"label":"C","why":"MODIFY không phải là một lệnh độc lập chuẩn trong SQL để sửa cấu trúc table (thường là mệnh đề đi kèm với ALTER)."},{"label":"D","why":"CHANGE cũng là từ khóa đi kèm trong ALTER của một số hệ quản trị CSDL như MySQL, không phải câu lệnh chính."}],"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh định nghĩa dữ liệu như CREATE, ALTER, DROP."},{"word":"ALTER","reading":"","meaning":"Lệnh SQL dùng để chỉnh sửa cấu trúc của một schema."}]},{"id":185,"slide":185,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"In a relation, rows are called:","options":[{"label":"A","text":"Attributes"},{"label":"B","text":"Fields"},{"label":"C","text":"Tuples"},{"label":"D","text":"Keys"}],"answer":"C","note":"C","key_point":"Trong relational model, các hàng trong một relation được gọi là tuple.","why_correct":"Theo thuật ngữ của relational model, mỗi hàng (row) trong một relation biểu diễn một record và được gọi là tuple, trong khi mỗi cột (column) được gọi là attribute.","why_wrong":[{"label":"A","why":"Nhầm lẫn với thuật ngữ chỉ cột (column)."},{"label":"B","why":"Chỉ cột (field) tương đương với attribute."},{"label":"D","why":"Dùng để xác định hoặc định danh dữ liệu, không phải là tên gọi của hàng."}],"vocab":[{"word":"tuple","reading":"","meaning":"Một hàng (row) dữ liệu trong relation."},{"word":"attribute","reading":"","meaning":"Một cột (column) dữ liệu trong relation."}]},{"id":186,"slide":186,"section":"Mô hình ER","prompt":"","setup":"","stem":"In the entity-relationship model, what is the entity?","options":[{"label":"A","text":"Relationships"},{"label":"B","text":"Relationships between objects"},{"label":"C","text":"Objects and relationships between objects"},{"label":"D","text":"Data objects"}],"answer":"D","note":"D","key_point":"Entity trong ER model đại diện cho các data objects có thực trong thế giới thực.","why_correct":"Trong ER model, entity là một đối tượng hoặc khái niệm cụ thể (data object) có thể phân biệt được với các đối tượng khác.","why_wrong":[{"label":"A","why":"Relationships là các liên kết giữa các entities, không phải bản thân entity."},{"label":"B","why":"Đây là định nghĩa của Relationship, không phải Entity."},{"label":"C","why":"Đây là định nghĩa tổng quát của ER model, bao gồm cả entity và relationship."}],"vocab":[{"word":"Entity","reading":"","meaning":"Đối tượng hoặc khái niệm có thực trong hệ thống cần lưu trữ thông tin."},{"word":"ER model","reading":"","meaning":"Mô hình thực thể kết hợp dùng để thiết kế cơ sở dữ liệu mức khái niệm."}]},{"id":187,"slide":187,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"In query compiler, which unit transforms the initial query plan into the best available sequence of operations on the actual data? Hoàng Hoàng","options":[{"label":"A","text":"A query parser"},{"label":"B","text":"A query preprocessor"},{"label":"C","text":"A query optimizer"},{"label":"D","text":"A query processor"}],"answer":"C","note":"C","key_point":"Query optimizer chịu trách nhiệm tìm kiếm kế hoạch thực thi hiệu quả nhất.","why_correct":"Query optimizer phân tích các phương án thực thi khác nhau và chọn ra kế hoạch có chi phí thấp nhất dựa trên thống kê dữ liệu.","why_wrong":[{"label":"A","why":"Query parser chỉ kiểm tra cú pháp và tính hợp lệ của câu truy vấn."},{"label":"B","why":"Query preprocessor thực hiện các công việc chuẩn bị như mở rộng view hoặc kiểm tra quyền."},{"label":"D","why":"Query processor là thuật ngữ chung chỉ toàn bộ hệ thống thực thi truy vấn."}],"vocab":[{"word":"Query optimizer","reading":"","meaning":"Thành phần tối ưu hóa truy vấn để đạt hiệu suất cao nhất."},{"word":"Query plan","reading":"","meaning":"Kế hoạch thực thi các thao tác truy vấn trên cơ sở dữ liệu."}]},{"id":188,"slide":188,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"In query compiler, which unit builds a tree structure from the text form of the query?","options":[{"label":"A","text":"A query parser"},{"label":"B","text":"A query preprocessor"},{"label":"C","text":"A query optimizer"},{"label":"D","text":"A query processor"}],"answer":"A","note":"A","key_point":"Query parser chuyển đổi câu lệnh SQL thành cấu trúc cây (parse tree).","why_correct":"Query parser thực hiện phân tích cú pháp (syntax analysis) để kiểm tra cấu trúc câu lệnh và tạo ra một parse tree làm đầu vào cho các bước tiếp theo.","why_wrong":[{"label":"B","why":"Query preprocessor thường xử lý các macro hoặc mở rộng view trước khi phân tích cú pháp."},{"label":"C","why":"Query optimizer tìm kiếm kế hoạch thực thi tối ưu nhất dựa trên parse tree."},{"label":"D","why":"Query processor là thuật ngữ chung cho toàn bộ hệ thống thực thi truy vấn."}],"vocab":[{"word":"Query parser","reading":"","meaning":"Thành phần phân tích cú pháp của câu lệnh truy vấn."},{"word":"Parse tree","reading":"","meaning":"Cấu trúc cây biểu diễn cú pháp của câu lệnh truy vấn."},{"word":"Query optimizer","reading":"","meaning":"Thành phần chọn kế hoạch thực thi truy vấn hiệu quả nhất."}]},{"id":189,"slide":189,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"In query compiler, which unit transforms the initial query plan into the best available sequence of operations on the actual data?","options":[{"label":"A","text":"A query parser"},{"label":"B","text":"A query preprocessor"},{"label":"C","text":"A query optimizer"},{"label":"D","text":"A query processor"}],"answer":"C","note":"C","key_point":"Query optimizer chọn kế hoạch thực thi tối ưu nhất dựa trên chi phí.","why_correct":"Query optimizer phân tích các kế hoạch thực thi khác nhau và chọn ra sequence of operations có chi phí thấp nhất để truy xuất dữ liệu.","why_wrong":[{"label":"A","why":"Query parser chỉ kiểm tra cú pháp và tính hợp lệ của câu lệnh."},{"label":"B","why":"Query preprocessor thực hiện các công việc chuẩn bị như mở rộng view hoặc kiểm tra quyền."},{"label":"D","why":"Query processor là thuật ngữ tổng quát cho toàn bộ hệ thống thực thi truy vấn."}],"vocab":[{"word":"Query optimizer","reading":"","meaning":"Thành phần chọn kế hoạch thực thi hiệu quả nhất cho truy vấn."},{"word":"Query plan","reading":"","meaning":"Trình tự các thao tác đại số quan hệ để thực hiện truy vấn."}]},{"id":190,"slide":190,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"In a network data model, a child node can be linked to multiple parent nodes. What is this relationship called?","options":[{"label":"A","text":"many-to-one"},{"label":"B","text":"one-to-many"},{"label":"C","text":"many-to-many"},{"label":"D","text":"one-to-one"}],"answer":"C","note":"C","key_point":"Network data model cho phép một child node có nhiều parent node (many-to-many).","why_correct":"Trong network data model, cấu trúc dạng đồ thị cho phép một record (child) liên kết với nhiều record khác (parents), tạo nên quan hệ many-to-many.","why_wrong":[{"label":"A","why":"Chỉ mô tả quan hệ một chiều từ nhiều con về một cha."},{"label":"B","why":"Đây là đặc trưng của hierarchical data model (một cha nhiều con)."},{"label":"D","why":"Quá hạn chế, không phản ánh được tính chất đa liên kết của network model."}],"vocab":[{"word":"network data model","reading":"","meaning":"Mô hình dữ liệu dạng đồ thị cho phép các record có nhiều quan hệ."},{"word":"child node","reading":"","meaning":"Record ở phía dưới trong cấu trúc phân cấp hoặc liên kết."},{"word":"parent node","reading":"","meaning":"Record ở phía trên đóng vai trò chủ sở hữu trong liên kết."}]},{"id":191,"slide":191,"section":"Mô hình ER","prompt":"","setup":"","stem":"In an ERD, what does a line connecting two entities represent?","options":[{"label":"A","text":"An attribute"},{"label":"B","text":"A relationship"},{"label":"C","text":"A primary key"},{"label":"D","text":"A foreign key"}],"answer":"B","note":"B","key_point":"Đường nối giữa hai entity trong ERD biểu diễn một relationship.","why_correct":"Trong mô hình ER, các entity được kết nối với nhau bằng các đường thẳng để thể hiện sự tương tác hoặc mối liên hệ logic giữa chúng, gọi là relationship.","why_wrong":[{"label":"A","why":"Attribute được biểu diễn bằng hình bầu dục nối với entity."},{"label":"C","why":"Primary key là một thuộc tính (attribute) được gạch chân, không phải đường nối giữa hai entity."},{"label":"D","why":"Foreign key là khái niệm thuộc về mô hình quan hệ (Relational Model), không phải ERD."}],"vocab":[{"word":"ERD","reading":"","meaning":"Sơ đồ thực thể liên kết dùng để thiết kế cơ sở dữ liệu."},{"word":"Entity","reading":"","meaning":"Đối tượng hoặc khái niệm trong thế giới thực cần lưu trữ thông tin."},{"word":"Relationship","reading":"","meaning":"Mối liên hệ logic giữa các entity."}]},{"id":192,"slide":192,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"In an employee table to include the attributes whose value always have some value which of the following constraint must be used?","options":[{"label":"A","text":"Null"},{"label":"B","text":"Not null"},{"label":"C","text":"Unique"},{"label":"D","text":"Distinct"}],"answer":"B","note":"B | NOT NULL constraint ensures that a column cannot have a NULL value, meaning it must always have a value.","key_point":"Sử dụng constraint NOT NULL để đảm bảo cột không bao giờ chứa giá trị NULL.","why_correct":"Constraint NOT NULL bắt buộc mọi tuple trong bảng phải có giá trị cụ thể cho cột đó, không được để trống.","why_wrong":[{"label":"A","why":"NULL là trạng thái thiếu giá trị, không phải là một constraint để ép buộc dữ liệu."},{"label":"C","why":"UNIQUE chỉ đảm bảo các giá trị không trùng lặp, nhưng vẫn cho phép giá trị NULL."},{"label":"D","why":"DISTINCT là từ khóa trong SELECT để loại bỏ các hàng trùng lặp, không phải là một constraint."}],"vocab":[{"word":"NOT NULL","reading":"","meaning":"Constraint đảm bảo cột không được phép chứa giá trị rỗng."},{"word":"NULL","reading":"","meaning":"Giá trị đại diện cho sự thiếu hụt hoặc không xác định của dữ liệu."},{"word":"Constraint","reading":"","meaning":"Các quy tắc áp dụng trên cột hoặc bảng để đảm bảo tính toàn vẹn dữ liệu."}]},{"id":193,"slide":193,"section":"Mô hình ER","prompt":"","setup":"","stem":"In which of the following is a single-entity instance of one type related to many entity instances of another type?","options":[{"label":"A","text":"One-to-One Relationship"},{"label":"B","text":"One-to-Many Relationship"},{"label":"C","text":"Many-to-Many Relationship"},{"label":"D","text":"Composite Relationship"}],"answer":"B","note":"B","key_point":"One-to-Many relationship mô tả một instance của entity A liên kết với nhiều instance của entity B.","why_correct":"Định nghĩa của One-to-Many là một instance ở phía \u0027One\u0027 có thể kết nối với nhiều instance ở phía \u0027Many\u0027.","why_wrong":[{"label":"A","why":"One-to-One chỉ cho phép một instance liên kết với duy nhất một instance khác."},{"label":"C","why":"Many-to-Many cho phép nhiều instance ở cả hai phía liên kết với nhau."},{"label":"D","why":"Composite relationship không phải là thuật ngữ chuẩn để mô tả cardinality trong ER model."}],"vocab":[{"word":"Entity","reading":"","meaning":"Đối tượng thực tế hoặc khái niệm được lưu trữ thông tin trong database."},{"word":"Cardinality","reading":"","meaning":"Số lượng instance tối đa hoặc tối thiểu của một entity liên kết với entity khác."}]},{"id":194,"slide":194,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"In query optimization, why is it beneficial for the database engine to use indexes?","options":[{"label":"A","text":"To reduce table size"},{"label":"B","text":"To enforce foreign key constraints"},{"label":"C","text":"To speed up data retrieval"},{"label":"D","text":"To convert text to binary"}],"answer":"C","note":"C","key_point":"Indexes speed up data retrieval by avoiding full table scans.","why_correct":"Indexes create a separate sorted structure pointing to the rows, allowing the database engine to locate data much faster.","why_wrong":[{"label":"A","why":"Indexes actually consume extra storage space rather than reducing table size."},{"label":"B","why":"Foreign key constraints are enforced by constraints, not index structures."},{"label":"D","why":"Indexes do not convert text to binary format."}],"vocab":[{"word":"index","reading":"","meaning":"Cấu trúc dữ liệu phụ trợ giúp tăng tốc độ tìm kiếm dữ liệu."},{"word":"table scan","reading":"","meaning":"Quá trình duyệt toàn bộ các row trong bảng."}]},{"id":195,"slide":195,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In order to undo the work of transaction after last commit which one should be used?","options":[{"label":"A","text":"View"},{"label":"B","text":"Commit"},{"label":"C","text":"Rollback"},{"label":"D","text":"Flashback"}],"answer":"C","note":"C","key_point":"Dùng Rollback để hủy bỏ công việc của transaction kể từ lần commit cuối.","why_correct":"Lệnh Rollback hoàn tác mọi thay đổi chưa được lưu (commit) trong transaction hiện tại, đưa database về trạng thái ổn định trước đó.","why_wrong":[{"label":"A","why":"View là một virtual table, không dùng để quản lý transaction."},{"label":"B","why":"Commit dùng để lưu vĩnh viễn các thay đổi chứ không phải hủy bỏ."},{"label":"D","why":"Flashback là tính năng khôi phục dữ liệu ở mức hệ thống/database từ các điểm thời gian trong quá khứ."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực hiện như một đơn vị logic duy nhất."},{"word":"Rollback","reading":"","meaning":"Lệnh hủy bỏ các thay đổi của transaction chưa được commit."},{"word":"Commit","reading":"","meaning":"Lệnh lưu vĩnh viễn các thay đổi của transaction vào cơ sở dữ liệu."}]},{"id":196,"slide":196,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"In SQL, after grouping data using the GROUP BY clause, the _________ clause is used to filter the groups based on specific conditions. It allows the use of aggregate functions and selects only the groups that satisfy the given criteria.","options":[{"label":"A","text":"Where"},{"label":"B","text":"Having"},{"label":"C","text":"Group by"},{"label":"D","text":"With"}],"answer":"B","note":"B HAVING : Được sử dụng để lọc các nhóm dựa trên điều kiện, đặc biệt là với các hàm tổng hợp.","key_point":"Sử dụng HAVING để lọc các nhóm sau khi đã dùng GROUP BY với aggregate functions.","why_correct":"Mệnh đề HAVING được thiết kế đặc biệt để lọc dữ liệu đã qua GROUP BY và có thể chứa các aggregate functions như SUM, COUNT, AVG.","why_wrong":[{"label":"A","why":"WHERE chỉ lọc dữ liệu thô trước khi GROUP BY và không cho phép dùng aggregate functions."},{"label":"C","why":"GROUP BY dùng để gom nhóm dữ liệu, không dùng để lọc."},{"label":"D","why":"WITH không phải là mệnh đề dùng để lọc nhóm trong SQL."}],"vocab":[{"word":"HAVING","reading":"","meaning":"Mệnh đề lọc các nhóm dữ liệu sau khi GROUP BY."},{"word":"aggregate functions","reading":"","meaning":"Các hàm tổng hợp như SUM, COUNT, AVG, MAX, MIN."}]},{"id":197,"slide":197,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"(Choose 1 answer)\nIn SQL, to update a relation\u0027s schema, which one of the following statements can be used?","options":[{"label":"A","text":"Insert"},{"label":"B","text":"Update"},{"label":"C","text":"Alter"},{"label":"D","text":"Alter table"}],"answer":"D","note":"D","key_point":"Sử dụng Alter table để thay đổi schema của một relation trong SQL.","why_correct":"Câu lệnh Alter table thuộc nhóm DDL, dùng để chỉnh sửa cấu trúc của bảng như thêm, xóa hoặc sửa cột.","why_wrong":[{"label":"A","why":"Dùng để thêm dữ liệu (tuple) mới vào bảng, không sửa schema."},{"label":"B","why":"Dùng để sửa đổi dữ liệu bên trong bảng, không đổi schema."},{"label":"C","why":"Thiếu từ khóa table nên cú pháp SQL không hợp lệ."}],"vocab":[{"word":"Alter table","reading":"","meaning":"Câu lệnh DDL dùng để thay đổi cấu trúc bảng"},{"word":"schema","reading":"","meaning":"Lược đồ cơ sở dữ liệu hoặc cấu trúc quan hệ"}]},{"id":198,"slide":198,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"In The Relational Model of Data, a data model is a notation for describing data or information. What are the three descriptions of data and information? Choose three answers","options":[{"label":"A","text":"Structure"},{"label":"B","text":"Relationship"},{"label":"C","text":"Constraints"},{"label":"D","text":"Operations"}],"answer":"ACD","note":"ACD","key_point":"The Relational Model comprises three core components: Structure, Constraints, and Operations.","why_correct":"Theo định nghĩa chuẩn của Relational Model, một data model bao gồm Structure để tổ chức dữ liệu, Constraints để đảm bảo tính toàn vẹn, và Operations để thao tác trên dữ liệu.","why_wrong":{"label":"B","why":"Relationship là một khái niệm trong ER model, không phải là một trong ba thành phần cốt lõi của Relational Model."},"vocab":[{"word":"Relational Model","reading":"","meaning":"Mô hình quan hệ dùng để quản lý dữ liệu dưới dạng các bảng."},{"word":"Constraints","reading":"","meaning":"Các ràng buộc toàn vẹn trong cơ sở dữ liệu."},{"word":"Operations","reading":"","meaning":"Các phép toán thao tác trên dữ liệu."}]},{"id":199,"slide":199,"section":"Mô hình ER","prompt":"","setup":"","stem":"Let E1 and E2 be two entities in an E/R diagram with simple single-valued attributes. R1 and R2 are two relationships between E1 and E2, where R1 is one-to-many and R2 is many-to-many. R1 and R2 do not have any attributes of their own. What is the minimum number of tables required to represent this situation in the relational model?","options":[{"label":"A"
