,"text":"2"},{"label":"B","text":"3"},{"label":"C","text":"4"},{"label":"D","text":"5"}],"answer":"B","note":"B","key_point":"Mỗi entity set cần 1 table, mối quan hệ many-to-many cần 1 table riêng.","why_correct":"Ta cần 2 tables cho 2 entity E1 và E2. Mối quan hệ one-to-many (R1) được gộp vào table của entity phía \u0027many\u0027. Mối quan hệ many-to-many (R2) cần thêm 1 table riêng chứa khóa chính của cả hai entity. Tổng cộng là 2 + 1 = 3 tables.","why_wrong":[{"label":"A","why":"Thiếu table cho mối quan hệ many-to-many (R2)."},{"label":"C","why":"Thừa table vì one-to-many không cần tạo table riêng."},{"label":"D","why":"Tính toán sai số lượng table cần thiết cho mô hình."}],"vocab":[{"word":"entity","reading":"","meaning":"Đối tượng thực thể trong mô hình E/R."},{"word":"relationship","reading":"","meaning":"Mối quan hệ giữa các entity sets."},{"word":"one-to-many","reading":"","meaning":"Mối quan hệ một-nhiều."},{"word":"many-to-many","reading":"","meaning":"Mối quan hệ nhiều-nhiều."}]},{"id":200,"slide":200,"section":"Mô hình ER","prompt":"","setup":"","stem":"If two entities in an ER model share the same attribute name but represent different meanings, what should be done during schema transformation?","options":[{"label":"A","text":"Always add entity name to the attribute name to make the meaning clear."},{"label":"B","text":"Rename one of the attributes to avoid ambiguity"},{"label":"C","text":"Merge both entities"},{"label":"D","text":"Ignore the attribute names"}],"answer":"B","note":"B","key_point":"Rename attributes with duplicate names but different meanings to avoid schema ambiguity.","why_correct":"Khi chuyển đổi ER model sang relational schema, các attribute trùng tên nhưng khác ngữ nghĩa phải được đổi tên để tránh nhầm lẫn và xung đột trong table.","why_wrong":[{"label":"A","why":"Việc thêm tên entity vào mọi attribute là không cần thiết nếu không có sự trùng lặp nghĩa."},{"label":"C","why":"Không thể merge hai entity khác nhau chỉ vì chúng trùng tên attribute."},{"label":"D","why":"Bỏ qua attribute names sẽ làm mất dữ liệu quan trọng của schema."}],"vocab":[{"word":"ER model","reading":"","meaning":"Mô hình thực thể kết hợp dùng để thiết kế cơ sở dữ liệu."},{"word":"schema transformation","reading":"","meaning":"Quá trình chuyển đổi từ mô hình ER sang các relational schema."}]},{"id":202,"slide":202,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"To ensure that each row in a table refers to a valid entry in another table, which constraint should be used?","options":[{"label":"A","text":"CHECK"},{"label":"B","text":"UNIQUE"},{"label":"C","text":"PRIMARY KEY"},{"label":"D","text":"FOREIGN KEY"}],"answer":"D","note":"D","key_point":"FOREIGN KEY ensures referential integrity between two tables.","why_correct":"FOREIGN KEY đảm bảo rằng giá trị trong cột của bảng này phải khớp với giá trị khóa chính (primary key) ở bảng khác.","why_wrong":[{"label":"A","why":"Dùng để kiểm tra điều kiện dữ liệu trên một cột."},{"label":"B","why":"Đảm bảo các giá trị trong cột là duy nhất nhưng không liên kết bảng khác."},{"label":"C","why":"Định danh duy nhất từng tuple trong bảng chính."}],"vocab":[{"word":"FOREIGN KEY","reading":"","meaning":"Khóa ngoại dùng để liên kết hai bảng và duy trì tính toàn vẹn tham chiếu."},{"word":"PRIMARY KEY","reading":"","meaning":"Khóa chính định danh duy nhất cho mỗi tuple trong bảng."}]},{"id":203,"slide":203,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"To modify the schema of an existing relation use _________ Hoàng Hoàng","options":[{"label":"A","text":"Create table"},{"label":"B","text":"Modify table"},{"label":"C","text":"Alter table"},{"label":"D","text":"Drop table"}],"answer":"C","note":"C Modify =\u003e Alter","key_point":"Sử dụng Alter table để thay đổi schema của một relation đã tồn tại.","why_correct":"Lệnh Alter table trong SQL DDL dùng để thực hiện các thay đổi cấu trúc bảng như thêm, xóa hoặc sửa cột.","why_wrong":[{"label":"A","why":"Dùng để tạo bảng mới hoàn toàn."},{"label":"B","why":"Không phải là cú pháp hợp lệ trong SQL chuẩn để sửa schema."},{"label":"D","why":"Dùng để xóa hoàn toàn bảng khỏi database."}],"vocab":[{"word":"Alter table","reading":"","meaning":"Lệnh DDL dùng để thay đổi schema của một bảng có sẵn."},{"word":"Schema","reading":"","meaning":"Cấu trúc định nghĩa của cơ sở dữ liệu hoặc bảng."}]},{"id":204,"slide":204,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"There is a foreign-key F in Relation1 that references set of attributes G of Relation2. Suppose a tuple t of Relation1 has non-NULL values in all the attributes of F, call the list of t\u0027s values in these attributes t[F], then in Relation2 there must be some tuple that ___ with t[F] on the attributes G.","options":[{"label":"A","text":"agrees"},{"label":"B","text":"disagrees"},{"label":"C","text":"is not relative"},{"label":"D","text":"differs with"}],"answer":"A","note":"A","key_point":"Foreign key constraint yêu cầu giá trị tham chiếu phải tồn tại trong bảng đích.","why_correct":"Theo định nghĩa Referential Integrity, nếu một tuple trong Relation1 có giá trị foreign key không NULL, thì giá trị đó phải khớp (agrees) với giá trị của primary key hoặc candidate key tương ứng trong Relation2.","why_wrong":[{"label":"B","why":"Sai vì foreign key yêu cầu sự trùng khớp dữ liệu, không phải sự khác biệt."},{"label":"C","why":"Sai vì các bảng liên quan thông qua foreign key luôn có mối quan hệ logic."},{"label":"D","why":"Sai vì \u0027differs\u0027 trái ngược với yêu cầu về tính toàn vẹn tham chiếu."}],"vocab":[{"word":"Foreign key","reading":"","meaning":"Trường dữ liệu dùng để liên kết hai bảng với nhau."},{"word":"Referential integrity","reading":"","meaning":"Quy tắc đảm bảo tính nhất quán của dữ liệu giữa các bảng liên quan."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":205,"slide":205,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"The ______ operator is used to produce a new relation from a relation R that contains only some of R\u0027s columns.","options":[{"label":"A","text":"Selection"},{"label":"B","text":"Projection"},{"label":"C","text":"Intersection"},{"label":"D","text":"All of the others"}],"answer":"B","note":"B","key_point":"Projection (Π) chọn các cột (attributes) cụ thể từ một relation.","why_correct":"Toán tử Projection (Π) được thiết kế để lọc các cột, tạo ra một relation mới chỉ chứa các thuộc tính được chỉ định từ relation gốc.","why_wrong":[{"label":"A","why":"Selection (σ) dùng để lọc các dòng (tuples) dựa trên điều kiện."},{"label":"C","why":"Intersection (∩) dùng để tìm các tuple chung giữa hai relation cùng schema."},{"label":"D","why":"Sai vì chỉ có Projection thực hiện chức năng chọn cột."}],"vocab":[{"word":"Projection","reading":"","meaning":"Toán tử đại số quan hệ dùng để chọn các cột từ một relation."},{"word":"Selection","reading":"","meaning":"Toán tử đại số quan hệ dùng để chọn các dòng thỏa mãn điều kiện."},{"word":"Relation","reading":"","meaning":"Một bảng dữ liệu trong mô hình quan hệ."}]},{"id":206,"slide":206,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Two concurrent executing transactions T1 and T2 are allowed to update the same record in an uncontrolled manner. In such a scenario. The following problem may not occur if database system has no concurrency module and allows concurrent execution of above two transactions. Which of the following is correct in this case?","options":[{"label":"A","text":"Transaction failure"},{"label":"B","text":"Dirty read problem"},{"label":"C","text":"Lost update problem"},{"label":"D","text":"Inconsistent database state"}],"answer":"C","note":"C","key_point":"Concurrency control prevents anomalies like Lost Update, Dirty Read, and Inconsistent State.","why_correct":"Câu hỏi hỏi về vấn đề KHÔNG nhất thiết xảy ra nếu không có concurrency control. Lost update là một lỗi logic xảy ra khi hai transaction ghi đè lên nhau, nhưng nó không phải là lỗi hệ thống bắt buộc phải xảy ra trong mọi kịch bản thực thi song song.","why_wrong":[{"label":"A","why":"Transaction failure là lỗi hệ thống hoặc logic, không phụ thuộc vào concurrency control."},{"label":"B","why":"Dirty read xảy ra khi một transaction đọc dữ liệu chưa commit từ transaction khác."},{"label":"D","why":"Inconsistent database state là hậu quả chung của việc vi phạm các quy tắc toàn vẹn dữ liệu."}],"vocab":[{"word":"Concurrency control","reading":"","meaning":"Cơ chế quản lý việc thực thi đồng thời các transaction để đảm bảo tính toàn vẹn."},{"word":"Lost update","reading":"","meaning":"Hiện tượng cập nhật của một transaction bị ghi đè bởi transaction khác."},{"word":"Dirty read","reading":"","meaning":"Hiện tượng đọc dữ liệu chưa được commit từ một transaction khác."}]},{"id":207,"slide":207,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"The _______ operation allows the combining of two relations by merging pairs of tuples, one from each relation, into a single tuple.","options":[{"label":"A","text":"Select"},{"label":"B","text":"Join"},{"label":"C","text":"Union"},{"label":"D","text":"Intersection"}],"answer":"B","note":"B","key_point":"Join kết hợp các tuple từ hai relation dựa trên điều kiện chung.","why_correct":"Join (⋈) kết hợp các tuple từ hai relation khác nhau thành một tuple duy nhất dựa trên các giá trị khớp nhau ở các thuộc tính chung.","why_wrong":[{"label":"A","why":"Select (σ) chỉ lọc các tuple trong cùng một relation dựa trên điều kiện."},{"label":"C","why":"Union (∪) gộp các tuple từ hai relation có cùng schema thành một tập hợp duy nhất."},{"label":"D","why":"Intersection (∩) chỉ lấy các tuple xuất hiện trong cả hai relation."}],"vocab":[{"word":"Join","reading":"","meaning":"Phép toán kết hợp dữ liệu từ nhiều bảng dựa trên thuộc tính liên kết."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."},{"word":"Relation","reading":"","meaning":"Một bảng (table) trong mô hình dữ liệu quan hệ."}]},{"id":208,"slide":208,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"The ORDER BY clause can only be used in cases _________","options":[{"label":"A","text":"GROUP BY queries"},{"label":"B","text":"SELECT queries"},{"label":"C","text":"HAVING queries"},{"label":"D","text":"None of the others"}],"answer":"B","note":"B","key_point":"ORDER BY chỉ được sử dụng trong các câu lệnh SELECT để sắp xếp kết quả.","why_correct":"ORDER BY là mệnh đề dùng để định dạng thứ tự hiển thị của tập kết quả trả về từ câu lệnh SELECT.","why_wrong":[{"label":"A","why":"ORDER BY có thể dùng độc lập mà không cần GROUP BY."},{"label":"C","why":"HAVING là mệnh đề lọc nhóm, không phải là nơi duy nhất dùng được ORDER BY."},{"label":"D","why":"Đáp án B đã đúng nên D sai."}],"vocab":[{"word":"ORDER BY","reading":"","meaning":"Mệnh đề dùng để sắp xếp dữ liệu theo thứ tự tăng dần hoặc giảm dần."},{"word":"SELECT","reading":"","meaning":"Câu lệnh dùng để truy vấn và lấy dữ liệu từ database."}]},{"id":209,"slide":209,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"The ______ operation allows the combining of two relations by merging pairs of tuples, one from each relation, into a single tuple.","options":[{"label":"A","text":"Select"},{"label":"B","text":"Join"},{"label":"C","text":"Union"},{"label":"D","text":"Intersection"}],"answer":"B","note":"B","key_point":"Join kết hợp các tuple từ hai relation dựa trên điều kiện chung.","why_correct":"Phép Join (⋈) kết hợp các tuple từ hai relation khác nhau thành một tuple duy nhất dựa trên các thuộc tính chung, tạo ra một relation mới chứa thông tin kết hợp.","why_wrong":[{"label":"A","why":"Select (σ) chỉ lọc các tuple trong cùng một relation dựa trên điều kiện."},{"label":"C","why":"Union (∪) gộp các tuple từ hai relation có cùng schema thành một tập hợp."},{"label":"D","why":"Intersection (∩) chỉ lấy các tuple xuất hiện trong cả hai relation."}],"vocab":[{"word":"Join","reading":"","meaning":"Phép toán kết hợp dữ liệu từ hai relation dựa trên thuộc tính chung."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."},{"word":"Relation","reading":"","meaning":"Một bảng (table) trong mô hình quan hệ."}]},{"id":210,"slide":210,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"The SQL keyword BETWEEN is used:","options":[{"label":"A","text":"for ranges."},{"label":"B","text":"as a wildcard."},{"label":"C","text":"to limit the columns displayed."},{"label":"D","text":"None of the others"}],"answer":"A","note":"A","key_point":"BETWEEN được dùng để lọc dữ liệu trong một khoảng giá trị xác định.","why_correct":"BETWEEN bao gồm cả hai giá trị biên (inclusive) và thường được dùng trong mệnh đề WHERE để kiểm tra xem giá trị có nằm trong khoảng từ X đến Y hay không.","why_wrong":[{"label":"B","why":"Wildcard thường dùng với LIKE (như % hoặc _)."},{"label":"C","why":"Việc giới hạn cột được thực hiện bởi danh sách sau SELECT."},{"label":"D","why":"Vì A đã đúng nên D sai."}],"vocab":[{"word":"BETWEEN","reading":"","meaning":"Toán tử SQL dùng để kiểm tra giá trị nằm trong một khoảng."},{"word":"Wildcard","reading":"","meaning":"Ký tự đại diện dùng để thay thế cho một hoặc nhiều ký tự khác."}]},{"id":211,"slide":211,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"The SQL ALTER statement can be used to:","options":[{"label":"A","text":"delete rows from the table."},{"label":"B","text":"add rows to the table."},{"label":"C","text":"change the table data."},{"label":"D","text":"change the table structure."}],"answer":"D","note":"D","key_point":"SQL ALTER statement is used to modify the structure of an existing table.","why_correct":"ALTER thuộc nhóm DDL (Data Definition Language) dùng để thay đổi cấu trúc bảng như thêm, xóa hoặc sửa cột.","why_wrong":[{"label":"A","why":"dùng lệnh DELETE để xóa rows."},{"label":"B","why":"dùng lệnh INSERT để thêm rows."},{"label":"C","why":"dùng lệnh UPDATE để thay đổi table data."}],"vocab":[{"word":"ALTER","reading":"","meaning":"Lệnh SQL dùng để thay đổi cấu trúc của một database object như table."},{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh quản lý cấu trúc dữ liệu."}]},{"id":212,"slide":212,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"The ability to query data, as well as insert, delete, and alter tuples, is offered by _______","options":[{"label":"A","text":"TCL (Transaction Control Language)"},{"label":"B","text":"DCL (Data Control Language)"},{"label":"C","text":"DDL (Data Definition Language)"},{"label":"D","text":"DML (Data Manipulation Language)"}],"answer":"D","note":"D DDL (Data Definition Language) là ngôn ngữ định nghĩa dữ liệu, được sử dụng để định nghĩa cấu trúc của cơ sở dữ liệu, bao gồm việc tạo, sửa đổi và xóa các bảng và các đối tượng khác.","key_point":"DML dùng để thao tác dữ liệu (CRUD) trong khi DDL dùng để định nghĩa cấu trúc.","why_correct":"DML (Data Manipulation Language) cung cấp các lệnh như SELECT, INSERT, UPDATE, DELETE để truy vấn và thay đổi nội dung các tuple trong bảng.","why_wrong":[{"label":"A","why":"TCL dùng để quản lý giao dịch (COMMIT, ROLLBACK)."},{"label":"B","why":"DCL dùng để quản lý quyền truy cập (GRANT, REVOKE)."},{"label":"C","why":"DDL dùng để định nghĩa schema (CREATE, ALTER, DROP bảng)."}],"vocab":[{"word":"DML","reading":"","meaning":"Ngôn ngữ thao tác dữ liệu dùng để truy vấn và cập nhật dữ liệu."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."}]},{"id":213,"slide":213,"section":"Mô hình ER","prompt":"","setup":"","stem":"The descriptive property possessed by each entity set is _______","options":[{"label":"A","text":"Entity"},{"label":"B","text":"Attribute"},{"label":"C","text":"Relation"},{"label":"D","text":"Model"}],"answer":"B","note":"B  For example, in an \"Employee\" entity set, attributes might include properties like \"Name,\" \"EmployeeID,\" or \"Department.\"","key_point":"Các descriptive property của một entity set được gọi là attribute.","why_correct":"Trong ER model, mỗi entity set có các descriptive property để mô tả đặc điểm của các entity trong tập hợp đó. Các property này chính là attribute. Ví dụ, entity set \"Employee\" có thể có các attribute như \"Name\", \"EmployeeID\", \"Department\".","why_wrong":[{"label":"A","why":"Entity là một đối tượng riêng biệt trong thế giới thực, không phải là descriptive property."},{"label":"C","why":"Relation là một bảng trong relational model, không phải là descriptive property của entity set."},{"label":"D","why":"Model là một cấu trúc trừu tượng để biểu diễn dữ liệu, không phải là descriptive property của entity set."}],"vocab":[{"word":"Entity set","reading":"","meaning":"Một tập hợp các entity cùng loại có chung các attribute."},{"word":"Attribute","reading":"","meaning":"Một thuộc tính mô tả đặc điểm của một entity trong entity set."},{"word":"Entity","reading":"","meaning":"Một đối tượng riêng biệt trong thế giới thực được biểu diễn trong cơ sở dữ liệu."},{"word":"ER model","reading":"","meaning":"Một mô hình dữ liệu cấp cao dùng để thiết kế cơ sở dữ liệu, biểu diễn dữ liệu dưới dạng entity và relationship."}]},{"id":214,"slide":214,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"The deadlock state can be changed back to stable state by using ________ statement.","options":[{"label":"A","text":"Delete"},{"label":"B","text":"Deadlock"},{"label":"C","text":"Commit"},{"label":"D","text":"Rollback"}],"answer":"D","note":"D Rollback: Cancels a transaction and undoes any changes made during the transaction, helping to resolve the deadlock and bring the system back to a stable state.","key_point":"Rollback statement cancels a transaction and undoes changes to resolve deadlock.","why_correct":"Khi xảy ra deadlock, database system sẽ chọn một transaction làm victim và thực hiện Rollback để hủy bỏ các thay đổi, giải phóng lock và đưa hệ thống về trạng thái ổn định.","why_wrong":[{"label":"A","why":"Delete chỉ là câu lệnh xóa dữ liệu, không giải quyết được vấn đề deadlock."},{"label":"B","why":"Deadlock không phải là một SQL statement."},{"label":"C","why":"Commit lưu các thay đổi vĩnh viễn, không dùng để giải quyết deadlock."}],"vocab":[{"word":"deadlock","reading":"","meaning":"Tình trạng hai hay nhiều transaction chờ tài nguyên của nhau dẫn đến bị kẹt."},{"word":"Rollback","reading":"","meaning":"Hủy bỏ transaction và hoàn tác các thay đổi chưa được lưu."}]},{"id":215,"slide":215,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"The values appearing in given attributes of any tuple in the referencing relation must likewise occur in specified attributes of at least one tuple in the referenced relation, according to ________ integrity constraint.","options":[{"label":"A","text":"Referential"},{"label":"B","text":"Primary"},{"label":"C","text":"Referencing"},{"label":"D","text":"Specific"}],"answer":"A","note":"A","key_point":"Foreign key values must match primary key values in the referenced table.","why_correct":"Referential integrity constraint ensures that a foreign key value in the referencing relation always points to a valid, existing tuple in the referenced relation.","why_wrong":[{"label":"B","why":"Primary integrity is not a standard term; primary key ensures uniqueness and non-nullability."},{"label":"C","why":"Referencing is the name of the relation, not the integrity constraint itself."},{"label":"D","why":"Specific is a distractor term with no relation to database integrity types."}],"vocab":[{"word":"Referential integrity","reading":"","meaning":"Ràng buộc toàn vẹn tham chiếu đảm bảo tính hợp lệ của foreign key."},{"word":"Referencing relation","reading":"","meaning":"Bảng chứa foreign key tham chiếu đến bảng khác."}]},{"id":216,"slide":216,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"The result which operation contains all pairs of tuples from the two relations, regardless of whether their attribute values match.","options":[{"label":"A","text":"Join"},{"label":"B","text":"Cartesian product"},{"label":"C","text":"Intersection"},{"label":"D","text":"Set difference"}],"answer":"B","note":"B","key_point":"Cartesian product combines all possible pairs of tuples from two relations without matching.","why_correct":"Cartesian product (ký hiệu là X) kết hợp mọi tuple của relation này với mọi tuple của relation kia mà không cần điều kiện match.","why_wrong":[{"label":"A","why":"Join chỉ kết hợp các tuple thỏa mãn điều kiện match."},{"label":"C","why":"Intersection chỉ lấy các tuple chung xuất hiện ở cả hai relation."},{"label":"D","why":"Set difference lấy các tuple thuộc relation này nhưng không thuộc relation kia."}],"vocab":[{"word":"Cartesian product","reading":"","meaning":"Phép nhân Descartes, kết hợp mọi cặp tuple từ hai relation."},{"word":"Tuple","reading":"","meaning":"Một dòng (row) trong bảng relational."}]},{"id":217,"slide":217,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"The rows of a relation, other than the header row containing the attribute names, are called _____.","options":[{"label":"A","text":"Schemas"},{"label":"B","text":"Tuples"},{"label":"C","text":"Domains"},{"label":"D","text":"Attributes"}],"answer":"B","note":"B","key_point":"Các hàng trong một relation đại diện cho các thực thể và được gọi là tuple.","why_correct":"Trong relational model, mỗi hàng của relation chứa một tập hợp giá trị tương ứng với các attribute và được gọi là tuple (hoặc record/row).","why_wrong":[{"label":"A","why":"Schema là cấu trúc định nghĩa tên và kiểu dữ liệu của relation, không phải các hàng dữ liệu."},{"label":"C","why":"Domain là tập hợp các giá trị cho phép của một attribute."},{"label":"D","why":"Attribute là các cột (column) của relation, không phải hàng."}],"vocab":[{"word":"tuple","reading":"","meaning":"Một hàng (row) dữ liệu trong relation."},{"word":"schema","reading":"","meaning":"Cấu trúc logic của relation."},{"word":"attribute","reading":"","meaning":"Một cột (column) trong relation."},{"word":"domain","reading":"","meaning":"Tập giá trị hợp lệ cho một attribute."}]},{"id":218,"slide":218,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"The relations are constructed by the SQL language processor when it performs its job of executing queries and data modifications, and then thrown away and not stored, are called ______.","options":[{"label":"A","text":"Stored relations"},{"label":"B","text":"Temporary tables"},{"label":"C","text":"Relationships"},{"label":"D","text":"Procedures"}],"answer":"B","note":"B","key_point":"Các bảng được tạo tạm thời trong quá trình thực thi truy vấn gọi là Temporary tables.","why_correct":"Temporary tables là các bảng được hệ quản trị cơ sở dữ liệu tạo ra trong bộ nhớ để xử lý truy vấn rồi sau đó bị xóa đi và không lưu trữ vĩnh viễn.","why_wrong":[{"label":"A","why":"Stored relations là các bảng được lưu trữ lâu dài trên đĩa cứng."},{"label":"C","why":"Relationships là mối quan hệ giữa các bảng trong mô hình thực thể kết hợp."},{"label":"D","why":"Procedures là tập hợp các câu lệnh SQL được lưu trữ để thực thi sau."}],"vocab":[{"word":"Temporary tables","reading":"","meaning":"Bảng tạm thời được tạo trong quá trình thực thi câu lệnh SQL."},{"word":"Stored relations","reading":"","meaning":"Quan hệ được lưu trữ vĩnh viễn trong cơ sở dữ liệu."}]},{"id":219,"slide":219,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"The primary key is selected from the:","options":[{"label":"A","text":"foreign keys."},{"label":"B","text":"candidate keys"},{"label":"C","text":"determinants."},{"label":"D","text":"composite keys."}],"answer":"B","note":"B","key_point":"Primary key được chọn từ tập hợp các candidate keys của relation.","why_correct":"Trong relational model, primary key được chọn bằng cách định danh một candidate key bất kỳ không chứa giá trị null làm khóa chính.","why_wrong":[{"label":"A","why":"Foreign key dùng để liên kết giữa các tables chứ không phải để chọn làm primary key."},{"label":"C","why":"Determinant là thuộc tính quyết định trong functional dependency, khái niệm rộng hơn candidate key."},{"label":"D","why":"Composite key là khóa gồm nhiều thuộc tính, có thể là candidate key nhưng không phải mọi primary key đều là composite key."}],"vocab":[{"word":"primary key","reading":"","meaning":"Thuộc tính hoặc tập thuộc tính định danh duy nhất mỗi tuple trong relation."},{"word":"candidate key","reading":"","meaning":"Thuộc tính hoặc tập thuộc tính có khả năng định danh duy nhất tuple và là tối thiểu."}]},{"id":220,"slide":220,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"The name of a relation and the set of attributes for a relation is called _____.","options":[{"label":"A","text":"Schema"},{"label":"B","text":"Tuple"},{"label":"C","text":"Domain"},{"label":"D","text":"Attribute"}],"answer":"A","note":"A","key_point":"Tên quan hệ và tập hợp các attributes của nó tạo thành một relation schema.","why_correct":"Đáp án A chính xác vì relation schema định nghĩa cấu trúc gồm tên quan hệ và danh sách các attributes.","why_wrong":[{"label":"B","why":"Tuple là một hàng (row) dữ liệu cụ thể trong relation."},{"label":"C","why":"Domain là tập hợp các giá trị hợp lệ mà một attribute có thể nhận."},{"label":"D","why":"Attribute là một cột đơn lẻ trong relation, không phải tên và tập hợp các attributes."}],"vocab":[{"word":"Schema","reading":"","meaning":"Cấu trúc định nghĩa tên quan hệ và các attributes của nó."},{"word":"Tuple","reading":"","meaning":"Một hàng hoặc bản ghi trong relation."},{"word":"Domain","reading":"","meaning":"Tập hợp các giá trị cho phép của một attribute."}]},{"id":221,"slide":221,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"The intersection operator is used to get the ______ tuples.","options":[{"label":"A","text":"Different"},{"label":"B","text":"Common"},{"label":"C","text":"All"},{"label":"D","text":"Repeating"}],"answer":"B","note":"B","key_point":"Phep intersection tra ve cac tuple chung xuat hien trong ca hai relation.","why_correct":"Phep intersection (giao) chi lay cac tuple xuat hien dong thoi trong ca hai relation tham gia vao phep toan, tuc la cac tuple chung.","why_wrong":[{"label":"A","why":"Nham voi phep difference (tru) hoac phep toan tim cac tuple khac nhau."},{"label":"C","why":"Nham voi phep union (hop) hoac cartesian product lay toan bo tuple."},{"label":"D","why":"Khong phai la muc dich cua phep intersection."}],"vocab":{"word":"intersection","reading":"","meaning":"Phep giao trong relational algebra, tim cac tuple chung giua hai relation."}},{"id":222,"slide":222,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Queries and other DML actions are grouped into ______, which are units that must be executed atomically and in isolation from one another.","options":[{"label":"A","text":"Transactions"},{"label":"B","text":"Query compiler"},{"label":"C","text":"Data files"},{"label":"D","text":"Buffer manager"}],"answer":"A","note":"A","key_point":"Transactions are atomic, isolated execution units for DML actions and queries.","why_correct":"Transaction là đơn vị thực thi gồm các thao tác DML và query đảm bảo tính nguyên vẹn (atomicity) và độc lập (isolation).","why_wrong":[{"label":"B","why":"Query compiler dùng để biên dịch câu lệnh SQL, không phải đơn vị thực thi."},{"label":"C","why":"Data files là nơi lưu trữ dữ liệu vật lý trên đĩa cứng."},{"label":"D","why":"Buffer manager quản lý việc chuyển đổi dữ liệu giữa bộ nhớ và đĩa."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Giao dịch, đơn vị thực thi các thao tác database đảm bảo tính ACID."},{"word":"Atomicity","reading":"","meaning":"Tính nguyên tử của transaction (thực hiện tất cả hoặc không gì cả)."},{"word":"Isolation","reading":"","meaning":"Tính cô lập, đảm bảo các transaction thực hiện độc lập không ảnh hưởng lẫn nhau."}]},{"id":223,"slide":223,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"View definitions can be modified using the __________ statement while view data can be modified using the __________ statement.","options":[{"label":"A","text":"ALTER VIEW, ALTER"},{"label":"B","text":"ALTER VIEW, EDIT"},{"label":"C","text":"ALTER VIEW, UPDATE"},{"label":"D","text":"UPDATE, ALTER VIEW"}],"answer":"C","note":"C","key_point":"ALTER VIEW thay đổi định nghĩa, còn UPDATE thay đổi dữ liệu trong view.","why_correct":"ALTER VIEW được dùng để thay đổi cấu trúc hoặc định nghĩa của một view đã tồn tại. Các thao tác DML như UPDATE được dùng để thay đổi dữ liệu bên trong các bảng cơ sở thông qua view.","why_wrong":[{"label":"A","why":"ALTER không phải là lệnh DML chuẩn để sửa dữ liệu."},{"label":"B","why":"EDIT không phải là một SQL statement hợp lệ."},{"label":"D","why":"Thứ tự các lệnh bị đảo ngược và UPDATE không dùng để sửa định nghĩa view."}],"vocab":[{"word":"View","reading":"","meaning":"Bảng ảo được tạo ra từ kết quả của một câu truy vấn."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, nhóm lệnh dùng để thao tác dữ liệu."}]},{"id":224,"slide":224,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"While executing a join operation between two tables, what type of join returns all rows from the left table and matched rows from the right table?","options":[{"label":"A","text":"Inner Join"},{"label":"B","text":"Right Join"},{"label":"C","text":"Full Outer Join"},{"label":"D","text":"Left Join"}],"answer":"D","note":"D","key_point":"Left Join trả về tất cả hàng từ bảng trái và các hàng khớp từ bảng phải.","why_correct":"Left Join giữ lại toàn bộ dữ liệu của bảng bên trái (bảng đứng trước từ khóa LEFT JOIN). Nếu không tìm thấy hàng khớp ở bảng bên phải, các cột của bảng đó sẽ nhận giá trị NULL.","why_wrong":[{"label":"A","why":"Inner Join chỉ trả về các hàng có giá trị khớp ở cả hai bảng."},{"label":"B","why":"Right Join ưu tiên giữ lại toàn bộ dữ liệu từ bảng bên phải."},{"label":"C","why":"Full Outer Join trả về tất cả hàng từ cả hai bảng, bất kể có khớp hay không."}],"vocab":[{"word":"Left Join","reading":"","meaning":"Phép kết nối giữ lại toàn bộ bảng bên trái và các hàng khớp từ bảng bên phải."},{"word":"NULL","reading":"","meaning":"Giá trị đại diện cho dữ liệu bị thiếu hoặc không xác định."}]},{"id":226,"slide":226,"section":"Mô hình ER","prompt":"","setup":"","stem":"What is the purpose of a foreign key in an ERD?","options":[{"label":"A","text":"It defines the data type of attributes"},{"label":"B","text":"It determines the cardinality of relationships"},{"label":"C","text":"It serves as the primary identifier for a table"},{"label":"D","text":"It establishes a link between two tables"}],"answer":"D","note":"D","key_point":"Foreign key thiết lập mối quan hệ logic giữa hai bảng trong database.","why_correct":"Foreign key là một attribute hoặc tập hợp các attribute trong một bảng trỏ đến primary key của bảng khác, giúp duy trì referential integrity và liên kết dữ liệu giữa các bảng.","why_wrong":[{"label":"A","why":"Data type được định nghĩa bởi schema của từng attribute, không phải bởi foreign key."},{"label":"B","why":"Cardinality được xác định bởi các quy tắc nghiệp vụ và ký hiệu trên các đường nối trong ERD."},{"label":"C","why":"Primary key mới là định danh duy nhất cho mỗi tuple trong một bảng."}],"vocab":[{"word":"Foreign key","reading":"","meaning":"Trường dữ liệu dùng để liên kết bảng này với primary key của bảng khác."},{"word":"Referential integrity","reading":"","meaning":"Quy tắc đảm bảo tính nhất quán của dữ liệu giữa các bảng liên quan."},{"word":"Primary key","reading":"","meaning":"Thuộc tính dùng để định danh duy nhất cho mỗi tuple trong một relation."}]},{"id":227,"slide":227,"section":"Mô hình ER","prompt":"","setup":"","stem":"What is a composite key in an ERD?","options":[{"label":"A","text":"A key that represents a many-to-many relationship"},{"label":"B","text":"A key that uniquely identifies each record in a table"},{"label":"C","text":"A key used to link two entities"},{"label":"D","text":"A key made up of multiple attributes"}],"answer":"D","note":"D","key_point":"Composite key là khóa được tạo thành từ hai hoặc nhiều attributes.","why_correct":"Composite key được định nghĩa là một khóa bao gồm nhiều hơn một attribute để đảm bảo tính duy nhất cho mỗi tuple trong một entity hoặc relation.","why_wrong":[{"label":"A","why":"Nhầm lẫn với khái niệm associative entity trong quan hệ many-to-many."},{"label":"B","why":"Đây là định nghĩa chung của Primary Key, không nhất thiết phải là composite."},{"label":"C","why":"Đây là chức năng của Foreign Key."}],"vocab":[{"word":"Composite key","reading":"","meaning":"Khóa bao gồm nhiều attributes kết hợp lại để xác định duy nhất một record."},{"word":"Attribute","reading":"","meaning":"Thuộc tính hoặc đặc điểm của một entity."},{"word":"Primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất cho mỗi tuple trong bảng."}]},{"id":228,"slide":228,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"What is the most useful index we can put on a relation?","options":[{"label":"A","text":"Index on a unique attribute"},{"label":"B","text":"Index not on the key"},{"label":"C","text":"Index on its key"},{"label":"D","text":"Index on a numeric attribute"}],"answer":"C","note":"C","key_point":"Index trên primary key giúp tối ưu hóa truy vấn tìm kiếm theo giá trị duy nhất.","why_correct":"Index trên primary key (key) là hữu ích nhất vì nó hỗ trợ tìm kiếm nhanh các tuple cụ thể và đảm bảo tính duy nhất của dữ liệu.","why_wrong":[{"label":"A","why":"Chỉ đúng một phần vì không phải mọi thuộc tính unique đều là key của relation."},{"label":"B","why":"Index không trên key thường ít hiệu quả hơn do độ chọn lọc (selectivity) thấp."},{"label":"D","why":"Kiểu dữ liệu numeric không quyết định hiệu quả của index bằng vai trò của thuộc tính đó trong schema."}],"vocab":[{"word":"Index","reading":"","meaning":"Cấu trúc dữ liệu giúp tăng tốc độ truy xuất dữ liệu từ bảng."},{"word":"Primary key","reading":"","meaning":"Thuộc tính hoặc tập thuộc tính định danh duy nhất cho mỗi tuple trong relation."},{"word":"Selectivity","reading":"","meaning":"Độ chọn lọc, đo lường số lượng giá trị khác biệt trong một cột."}]},{"id":229,"slide":229,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What is a database trigger in SQL Server?","options":[{"label":"A","text":"A stored procedure that runs automatically in response to certain events on a table or view"},{"label":"B","text":"A scheduled job that runs at specific times"},{"label":"C","text":"A function that can be called by other stored procedures"},{"label":"D","text":"A query that retrieves data from the database"}],"answer":"A","note":"A","key_point":"Trigger là stored procedure tự động thực thi khi có sự kiện DML hoặc DDL.","why_correct":"Trigger được kích hoạt tự động bởi SQL Server khi các sự kiện như INSERT, UPDATE, hoặc DELETE xảy ra trên một table hoặc view cụ thể.","why_wrong":[{"label":"B","why":"Đây là mô tả của SQL Server Agent Job, không phải trigger."},{"label":"C","why":"Đây là mô tả của User-Defined Function (UDF), không tự động chạy theo sự kiện."},{"label":"D","why":"Đây là định nghĩa chung của một câu lệnh SELECT hoặc query thông thường."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Đối tượng cơ sở dữ liệu tự động thực thi khi có thay đổi dữ liệu."},{"word":"Stored procedure","reading":"","meaning":"Tập hợp các câu lệnh SQL được lưu trữ để thực thi lại nhiều lần."},{"word":"DML","reading":"","meaning":"Data Manipulation Language (INSERT, UPDATE, DELETE)."}]},{"id":230,"slide":230,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"What is the main disadvantage of having too many indexes on a table?","options":[{"label":"A","text":"Improved query performance"},{"label":"B","text":"Increased storage space"},{"label":"C","text":"Enhanced data integrity"},{"label":"D","text":"Fast data modification operations"}],"answer":"B","note":"B","key_point":"Index giúp tăng tốc truy vấn nhưng làm chậm thao tác cập nhật và tốn dung lượng.","why_correct":"Mỗi index là một cấu trúc dữ liệu bổ sung lưu trữ giá trị cột và con trỏ, do đó tốn thêm dung lượng lưu trữ trên đĩa.","why_wrong":[{"label":"A","why":"Đây là ưu điểm, không phải nhược điểm."},{"label":"C","why":"Index không liên quan trực tiếp đến việc đảm bảo data integrity."},{"label":"D","why":"Ngược lại, nhiều index làm chậm các thao tác INSERT, UPDATE, DELETE do phải cập nhật index."}],"vocab":[{"word":"Index","reading":"","meaning":"Cấu trúc dữ liệu giúp tìm kiếm dữ liệu nhanh hơn trong bảng."},{"word":"Data integrity","reading":"","meaning":"Tính toàn vẹn của dữ liệu trong cơ sở dữ liệu."}]},{"id":231,"slide":231,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"What is the primary goal of normalization in database design?","options":[{"label":"A","text":"To increase data redundancy"},{"label":"B","text":"To simplify data retrieval"},{"label":"C","text":"To introduce duplicate data"},{"label":"D","text":"To violate functional dependencies"}],"answer":"B","note":"B","key_point":"Normalization giúp giảm thiểu data redundancy và đảm bảo data integrity.","why_correct":"Normalization tổ chức lại schema để loại bỏ các anomaly, giúp việc truy vấn và cập nhật dữ liệu trở nên nhất quán và hiệu quả hơn.","why_wrong":[{"label":"A","why":"Normalization làm giảm, không phải tăng data redundancy."},{"label":"C","why":"Mục tiêu là loại bỏ duplicate data, không phải tạo ra nó."},{"label":"D","why":"Normalization tuân thủ các functional dependencies để tránh data inconsistency."}],"vocab":[{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm redundancy và cải thiện data integrity."},{"word":"Data redundancy","reading":"","meaning":"Sự dư thừa dữ liệu khi cùng một thông tin được lưu trữ ở nhiều nơi."},{"word":"Functional dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các attribute trong một relation."}]},{"id":232,"slide":232,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"What is relational algebra?","options":[{"label":"A","text":"Relational algebra is a set of operations on relations."},{"label":"B","text":"Relational algebra is the decomposition of relations."},{"label":"C","text":"Relational algebra is eliminated from relations."},{"label":"D","text":"Relational algebra is gone from relations."}],"answer":"A","note":"A","key_point":"Relational algebra consists of operations applied to relations to yield new relations.","why_correct":"Relational algebra is a procedural query language that takes relations as input and produces new relations as output through various operators.","why_wrong":[{"label":"B","why":"Decomposition relates to normalization, not the definition of relational algebra."},{"label":"C","why":"Nonsensical statement regarding relations."},{"label":"D","why":"Nonsensical statement regarding relations."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Ngôn ngữ truy vấn thủ tục gồm tập hợp các phép toán trên relation."},{"word":"relation","reading":"","meaning":"Bảng dữ liệu trong mô hình quan hệ."}]},{"id":233,"slide":233,"section":"Mô hình ER","prompt":"","setup":"","stem":"What is a derived attribute in an ERD?","options":[{"label":"A","text":"An attribute that is calculated from other attributes"},{"label":"B","text":"An attribute that cannot be calculated"},{"label":"C","text":"An attribute that is the primary key of an entity"},{"label":"D","text":"An attribute that represents a relationship"}],"answer":"A","note":"A","key_point":"Derived attribute là thuộc tính có giá trị được tính toán từ các thuộc tính khác.","why_correct":"Derived attribute được biểu diễn bằng hình elip nét đứt trong ERD và giá trị của nó suy ra từ các thuộc tính hoặc entity liên quan.","why_wrong":[{"label":"B","why":"Trái ngược với định nghĩa, derived attribute hoàn toàn có thể tính toán được."},{"label":"C","why":"Nhầm lẫn với primary key, đây là thuộc tính định danh cho entity."},{"label":"D","why":"Nhầm lẫn với relationship hoặc descriptive attribute của mối quan hệ."}],"vocab":[{"word":"derived attribute","reading":"","meaning":"Thuộc tính dẫn xuất, có giá trị được tính toán từ các thuộc tính khác."},{"word":"ERD","reading":"","meaning":"Mô hình thực thể kết hợp (Entity Relationship Diagram)."}]},{"id":234,"slide":234,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which files are created automatically by SQL Server when you create a new database?","options":[{"label":"A","text":"primary data file and secondary data file"},{"label":"B","text":"primary data file and log file"},{"label":"C","text":"index file and log file"},{"label":"D","text":"secondary data file and log file"},{"label":"E","text":"backup file and metadata file"}],"answer":"B","note":"B","key_point":"Mỗi database trong SQL Server luôn tự động tạo một primary data file và một log file.","why_correct":"Khi tạo database mới, SQL Server bắt buộc phải tạo ít nhất một primary data file (.mdf) để chứa dữ liệu và một log file (.ldf) để lưu transaction log.","why_wrong":[{"label":"A","why":"Secondary data file là tùy chọn, không tự động tạo."},{"label":"C","why":"Index file không được tạo riêng biệt tự động như vậy."},{"label":"D","why":"Thiếu primary data file vốn là bắt buộc."},{"label":"E","why":"Backup file chỉ được tạo khi thực hiện lệnh backup."}],"vocab":[{"word":"primary data file","reading":"","meaning":"Tệp dữ liệu chính của database trong SQL Server, mang phần mở rộng .mdf."},{"word":"log file","reading":"","meaning":"Tệp ghi lại các giao dịch và thay đổi trong database, mang phần mở rộng .ldf."}]},{"id":235,"slide":235,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"What happens if an error occurs during a transaction and it is not explicitly handled or rolled back?","options":[{"label":"A","text":"The transaction is automatically committed"},{"label":"B","text":"The transaction is automatically rolled back"},{"label":"C","text":"The database becomes read-only"},{"label":"D","text":"The transaction remains in a pending state"}],"answer":"B","note":"B","key_point":"Transactions ensure atomicity; unhandled errors trigger automatic rollback.","why_correct":"Theo tính chất atomicity của transaction, nếu xảy ra lỗi mà không được xử lý hoặc commit, Database Management System (DBMS) sẽ tự động rollback để đảm bảo tính nhất quán của dữ liệu.","why_wrong":[{"label":"A","why":"Sai vì hệ thống không bao giờ tự động commit khi có lỗi xảy ra."},{"label":"C","why":"Sai vì lỗi trong transaction không làm database chuyển sang chế độ read-only."},{"label":"D","why":"Sai vì transaction sẽ bị abort và rollback thay vì giữ nguyên ở trạng thái pending."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực hiện như một đơn vị logic duy nhất."},{"word":"rollback","reading":"","meaning":"Hoàn tác các thay đổi của transaction chưa hoàn thành để đưa database về trạng thái trước đó."},{"word":"atomicity","reading":"","meaning":"Tính nguyên tử, đảm bảo mọi thao tác trong transaction cùng thành công hoặc cùng thất bại."}]},{"id":236,"slide":236,"section":"Mô hình ER","prompt":"","setup":"","stem":"What happens to derived attributes when converting an ERD to a relational model?","options":[{"label":"A","text":"They become primary keys in the related tables"},{"label":"B","text":"They are calculated and stored as regular attributes in the related tables"},{"label":"C","text":"They become foreign keys in the related tables"},{"label":"D","text":"They are ignored during the conversion process"}],"answer":"D","note":"D","key_point":"Derived attributes are omitted during the ERD to relational model conversion process.","why_correct":"Trong ERD, derived attributes có giá trị được tính toán từ các attribute khác nên không cần lưu trữ vật lý trong relational model mà sẽ được tính trực tiếp khi cần.","why_wrong":[{"label":"A","why":"Derived attribute không bao giờ đóng vai trò primary key."},{"label":"B","why":"Derived attribute không được lưu trữ trực tiếp trong bảng."},{"label":"C","why":"Derived attribute không dùng để liên kết các bảng nên không phải foreign key."}],"vocab":[{"word":"derived attribute","reading":"","meaning":"Thuộc tính dẫn xuất, có giá trị được tính toán từ các thuộc tính khác."},{"word":"relational model","reading":"","meaning":"Mô hình quan hệ dùng để tổ chức dữ liệu thành các bảng."}]},{"id":238,"slide":238,"section":"Mô hình ER","prompt":"","setup":"","stem":"Which of the following best describes a \"many-to-many\" relationship?","options":[{"label":"A","text":"One entity is related to one other entity"},{"label":"B","text":"One entity is related to many other entities"},{"label":"C","text":"Many entities are related to many other entities"},{"label":"D","text":"None of the others"}],"answer":"C","note":"C","key_point":"Many-to-many relationship nghĩa là nhiều instances ở cả hai phía entity đều có liên kết với nhau.","why_correct":"Option C định nghĩa chính xác rằng nhiều entities trong tập này có thể liên kết với nhiều entities trong tập kia.","why_wrong":[{"label":"A","why":"Đây là mô tả của one-to-one relationship."},{"label":"B","why":"Đây là mô tả của one-to-many relationship."},{"label":"D","why":"Sai vì option C đã đúng."}],"vocab":[{"word":"many-to-many","reading":"","meaning":"Mối quan hệ nhiều-nhiều giữa các entities trong ER model."},{"word":"ER model","reading":"","meaning":"Mô hình thực thể kết hợp dùng để thiết kế cơ sở dữ liệu."}]},{"id":239,"slide":239,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which of the following best describes an anomaly that normalization helps to eliminate in relational database design?","options":[{"label":"A","text":"Inconsistent data types within a table"},{"label":"B","text":"Redundant data that leads to storage inefficiency"},{"label":"C","text":"Insertion, update, or deletion anomalies"},{"label":"D","text":"Lack of referential integrity between tables"}],"answer":"C","note":"C","key_point":"Normalization loại bỏ các anomaly (insertion, update, deletion) phát sinh từ dữ liệu dư thừa.","why_correct":"Normalization được thiết kế để phân rã các relation nhằm loại bỏ các dependency không mong muốn, từ đó ngăn chặn các anomaly khi thực hiện thao tác dữ liệu.","why_wrong":[{"label":"A","why":"Đây là vấn đề về data type constraint, không phải mục tiêu chính của normalization."},{"label":"B","why":"Dù normalization giảm dư thừa, nhưng mục tiêu cốt lõi là đảm bảo tính nhất quán (consistency) và tránh anomaly."},{"label":"D","why":"Referential integrity được đảm bảo bởi foreign key constraint, không phải normalization."}],"vocab":[{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm dư thừa và tránh các anomaly."},{"word":"Anomaly","reading":"","meaning":"Các lỗi hoặc sự bất thường xảy ra khi cập nhật, chèn hoặc xóa dữ liệu."},{"word":"Referential integrity","reading":"","meaning":"Quy tắc đảm bảo mối quan hệ giữa các bảng luôn hợp lệ thông qua foreign key."}]},{"id":240,"slide":240,"section":"Mô hình ER","prompt":"","setup":"","stem":"Which of the following statements is correct when converting from the ERD model to the relational model?","options":[{"label":"A","text":"The order of the columns is not important"},{"label":"B","text":"The order of both rows and columns is important"},{"label":"C","text":"The order of the rows is important"},{"label":"D","text":"The order of the columns is important"}],"answer":"A","note":"A","key_point":"Trong relational model, thứ tự của các columns và rows đều không quan trọng.","why_correct":"Theo định nghĩa của relational model dựa trên lý thuyết tập hợp, relations (tables) là tập hợp các tuples (rows) và attributes (columns) không có thứ tự cố định.","why_wrong":[{"label":"B","why":"Sai vì cả thứ tự rows và columns đều không quan trọng."},{"label":"C","why":"Sai vì thứ tự của rows trong bảng không quan trọng."},{"label":"D","why":"Sai vì thứ tự của columns trong bảng không quan trọng."}],"vocab":[{"word":"relational model","reading":"","meaning":"Mô hình quan hệ dùng để tổ chức dữ liệu thành các tables gồm rows và columns."},{"word":"tuple","reading":"","meaning":"Một dòng dữ liệu trong bảng (row)."},{"word":"attribute","reading":"","meaning":"Một cột dữ liệu trong bảng (column)."}]},{"id":241,"slide":241,"section":"Mô hình ER","prompt":"","setup":"","stem":"Which of the following is expressed by an E-R diagram?","options":[{"label":"A","text":"Relation between process and relationship"},{"label":"B","text":"Relation between entity and process"},{"label":"C","text":"Relation between processes"},{"label":"D","text":"Relation between entities"}],"answer":"D","note":"D","key_point":"E-R diagram biểu diễn mối quan hệ giữa các entities trong hệ thống cơ sở dữ liệu.","why_correct":"E-R diagram (Entity-Relationship diagram) tập trung mô tả các entities (thực thể) và relationships (mối quan hệ) giữa chúng.","why_wrong":[{"label":"A","why":"Nhầm lẫn với Data Flow Diagram khi đề cập đến process."},{"label":"B","why":"E-R diagram không mô tả process."},{"label":"C","why":"Process thuộc về sơ đồ tiến trình, không phải E-R diagram."}],"vocab":[{"word":"Entity","reading":"","meaning":"Thực thể trong mô hình dữ liệu."},{"word":"Relationship","reading":"","meaning":"Mối quan hệ giữa các thực thể."}]},{"id":242,"slide":242,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which of the following statements is true regarding Third Normal Form (3NF)?","options":[{"label":"A","text":"It eliminates transitive dependencies"},{"label":"B","text":"It allows for redundant data"},{"label":"C","text":"It only considers partial dependencies"},{"label":"D","text":"It doesn\u0027t address any anomalies in a database"}],"answer":"A","note":"A","key_point":"3NF loại bỏ toàn bộ các transitive dependencies trong relation schema.","why_correct":"Một relation đạt chuẩn 3NF khi nó đã đạt 2NF và không có non-key attribute nào phụ thuộc bắc cầu vào primary key.","why_wrong":[{"label":"B","why":"Mục đích của normalization là giảm thiểu redundant data, không phải cho phép nó."},{"label":"C","why":"Partial dependencies là vấn đề của 2NF, trong khi 3NF xử lý transitive dependencies."},{"label":"D","why":"3NF giúp giải quyết các update anomalies, insert anomalies và delete anomalies."}],"vocab":[{"word":"Third Normal Form","reading":"","meaning":"Dạng chuẩn 3, yêu cầu loại bỏ các phụ thuộc bắc cầu."},{"word":"transitive dependency","reading":"","meaning":"Phụ thuộc bắc cầu giữa các thuộc tính không khóa với khóa chính."}]},{"id":243,"slide":243,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is true about stored procedure in MS-SQL Server?","options":[{"label":"A","text":"They include procedural and SQL statements."},{"label":"B","text":"They are stored in Rules folder"},{"label":"C","text":"They do not need to have a unique name"},{"label":"D","text":"They are same as void function"}],"answer":"A","note":"A","key_point":"Stored procedure trong MS-SQL Server chứa cả câu lệnh SQL và procedural statements.","why_correct":"Stored procedure cho phép kết hợp các câu lệnh SQL với các thành phần procedural (như biến, vòng lặp, điều kiện IF/ELSE).","why_wrong":[{"label":"B","why":"Chúng được lưu trong thư mục Programmability -\u003e Stored Procedures chứ không phải Rules folder."},{"label":"C","why":"Tên của stored procedure phải là duy nhất trong phạm vi schema của database."},{"label":"D","why":"Stored procedure khác hàm void vì nó có thể trả về giá trị qua tham số OUTPUT và status code."}],"vocab":{"word":"stored procedure","reading":"","meaning":"Đoạn mã SQL được biên dịch sẵn và lưu trữ trong database server."}},{"id":244,"slide":244,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which of the following accurately represents the purpose of a transaction in a database system? Choose two answers.","options":[{"label":"A","text":"To maintain data integrity and consistency."},{"label":"B","text":"To define access permissions"},{"label":"C","text":"To ensure a sequence of operations is completed fully or not at all"},{"label":"D","text":"To allow concurrent modifications without restrictions"}],"answer":"AC","note":"AC","key_point":"Transaction giúp đảm bảo data integrity và tính toàn vẹn thông qua các thuộc tính ACID.","why_correct":"Transaction nhóm các operations lại để thực thi toàn bộ hoặc không có gì (atomicity), giúp maintain data integrity và consistency cho database.","why_wrong":[{"label":"B","why":"Thuộc về authorization và security, không phải transaction."},{"label":"D","why":"Concurrency cần được kiểm soát bằng locking/isolation, không phải modifications không giới hạn."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác được coi là một đơn vị công việc duy nhất."},{"word":"data integrity","reading":"","meaning":"Tính toàn vẹn của dữ liệu trong database."}]},{"id":245,"slide":245,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which two statements correctly describe stored procedures? (Choose two correct answers)","options":[{"label":"A","text":"They can return multiple result sets"},{"label":"B","text":"They are compiled each time they run"},{"label":"C","text":"They support conditional logic like IF ...ELSE"},{"label":"D","text":"They replace the need for triggers"}],"answer":"AC","note":"AC","key_point":"Stored procedures support multiple result sets and conditional logic like IF...ELSE.","why_correct":"Stored procedures có khả năng trả về nhiều result sets và hỗ trợ cú pháp lập trình thủ tục như IF...ELSE để xử lý logic phức tạp.","why_wrong":[{"label":"B","why":"Chúng được biên dịch sẵn (pre-compiled) lần đầu tiên thực thi chứ không phải biên dịch lại mỗi lần chạy."},{"label":"D","why":"Stored procedures không thay thế cho triggers vì triggers hoạt động tự động dựa trên các sự kiện DML."}],"vocab":[{"word":"stored procedure","reading":"","meaning":"Một đoạn mã SQL được lưu trữ sẵn trong database server để thực thi các tác vụ."},{"word":"result set","reading":"","meaning":"Tập hợp các hàng dữ liệu trả về từ một câu lệnh query."}]},{"id":246,"slide":246,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"How are composite attributes represented in the relational model?","options":[{"label":"A","text":"As individual attributes in the related tables"},{"label":"B","text":"By creating a new table for each composite attribute"},{"label":"C","text":"By using a single attribute in the related tables"},{"label":"D","text":"By using a composite key in the related tables"}],"answer":"A","note":"A","key_point":"Composite attributes are flattened into individual simple attributes in the relational model.","why_correct":"Trong relational model, các composite attribute (như họ tên gồm họ và tên đệm, tên) được tách thành các simple attribute riêng biệt trong cùng một table.","why_wrong":[{"label":"B","why":"Không tạo bảng mới cho composite attribute mà chỉ tách thành các cột."},{"label":"C","why":"Không gộp chung thành một attribute đơn nếu chúng cần được truy vấn riêng."},{"label":"D","why":"Nhầm lẫn với composite primary key, là khóa chính gồm nhiều cột."}],"vocab":[{"word":"composite attribute","reading":"","meaning":"Thuộc tính phức hợp, có thể chia nhỏ thành các thuộc tính đơn."},{"word":"relational model","reading":"","meaning":"Mô hình cơ sở dữ liệu quan hệ dựa trên các bảng."}]},{"id":247,"slide":247,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"A key:","options":[{"label":"A","text":"must always be composed of two or more columns."},{"label":"B","text":"can only be one column."},{"label":"C","text":"identifies a row."},{"label":"D","text":"identifies a column."}],"answer":"C","note":"C","key_point":"Một key là tập hợp các thuộc tính dùng để định danh duy nhất một tuple.","why_correct":"Key (như superkey, candidate key, primary key) được thiết kế để phân biệt các tuple khác nhau trong cùng một relation.","why_wrong":[{"label":"A","why":"Key có thể chỉ gồm một column duy nhất (simple key)."},{"label":"B","why":"Key có thể là composite key gồm nhiều column kết hợp lại."},{"label":"D","why":"Key định danh dữ liệu trong hàng (tuple), không phải định danh column."}],"vocab":[{"word":"tuple","reading":"","meaning":"Một hàng dữ liệu trong bảng."},{"word":"candidate key","reading":"","meaning":"Tập hợp các thuộc tính có thể định danh duy nhất một tuple."},{"word":"composite key","reading":"","meaning":"Key được tạo thành từ hai hoặc nhiều column."}]},{"id":248,"slide":248,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"A primary key is combined with a foreign key creates:","options":[{"label":"A","text":"Parent-Child relationship between the tables that connect them."},{"label":"B","text":"Many to many relationship between the tables that connect them."},{"label":"C","text":"Network model between the tables that connect them."},{"label":"D","text":"None of the mentioned."}],"answer":"A","note":"A","key_point":"Foreign key tham chiếu đến primary key thiết lập mối quan hệ Parent-Child giữa các bảng.","why_correct":"Foreign key trong bảng con (child) tham chiếu tới primary key của bảng cha (parent), tạo ra ràng buộc tham chiếu (referential integrity) xác định mối quan hệ giữa chúng.","why_wrong":[{"label":"B","why":"Many-to-many yêu cầu một bảng trung gian (junction table) chứ không chỉ đơn thuần là foreign key."},{"label":"C","why":"Network model là mô hình dữ liệu cũ, không liên quan đến cách thiết lập foreign key trong Relational Database."},{"label":"D","why":"Phương án A đã mô tả chính xác bản chất của mối quan hệ này."}],"vocab":[{"word":"Primary key","reading":"","meaning":"Thuộc tính định danh duy nhất cho mỗi tuple trong một bảng."},{"word":"Foreign key","reading":"","meaning":"Thuộc tính dùng để liên kết dữ liệu giữa hai bảng thông qua primary key."},{"word":"Referential integrity","reading":"","meaning":"Ràng buộc đảm bảo giá trị foreign key phải tồn tại trong bảng cha."}]},{"id":249,"slide":249,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"Assume that you are required to develop an application to manage courses at the university, which requires: Structured data (tables, rows, columns), strict consistency, and the need to use complex queries. The enforcement of ACID properties (Atomicity, Consistency, Isolation, Durability).","stem":"In the context of databases, which most appropriate data model should you choose for developing this application?","options":[{"label":"A","text":"relational data model (example: Microsoft SQL Server, MySQL, ...)"},{"label":"B","text":"document-based data model (example: MongoDB, Cassandra, Couch DB)"},{"label":"C","text":"key-value data model (example: Redis, DynamoDB, Riak)"},{"label":"D","text":"Hierarchical data model"}],"answer":"A","note":"A","key_point":"Relational data model là lựa chọn tối ưu cho dữ liệu có cấu trúc và ACID.","why_correct":"Relational data model hỗ trợ tốt các bảng (tables) có cấu trúc chặt chẽ, đảm bảo tính nhất quán (consistency) và hỗ trợ các truy vấn phức tạp thông qua SQL.","why_wrong":[{"label":"B","why":"Document-based model phù hợp với dữ liệu phi cấu trúc hoặc bán cấu trúc, không ưu tiên ACID nghiêm ngặt."},{"label":"C","why":"Key-value model tối ưu cho tốc độ truy xuất đơn giản, không phù hợp cho các truy vấn phức tạp."},{"label":"D","why":"Hierarchical model là mô hình cũ, thiếu tính linh hoạt và không hỗ trợ tốt các truy vấn quan hệ phức tạp."}],"vocab":[{"word":"ACID","reading":"","meaning":"Tập hợp các thuộc tính đảm bảo giao dịch cơ sở dữ liệu được xử lý tin cậy."},{"word":"Relational data model","reading":"","meaning":"Mô hình tổ chức dữ liệu dưới dạng các bảng có quan hệ với nhau."}]},{"id":250,"slide":250,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"According to the technology deployed by the database management system, which of the following is correct?","options":[{"label":"A","text":"Locks are used to maintain transactional integrity and consistency."},{"label":"B","text":"Cursors are used to maintain transactional integrity and consistency."},{"label":"C","text":"Procedures are used to maintain transactional integrity and consistency."},{"label":"D","text":"Functions are used to maintain transactional integrity and consistency."}],"answer":"A","note":"A","key_point":"Locks là cơ chế chính để đảm bảo tính toàn vẹn và nhất quán trong transaction.","why_correct":"Locks kiểm soát quyền truy cập đồng thời vào dữ liệu, ngăn chặn các xung đột như lost update hoặc dirty read, từ đó duy trì tính nhất quán (Consistency) của database.","why_wrong":[{"label":"B","why":"Cursors dùng để duyệt qua từng tuple trong kết quả truy vấn, không phải để quản lý transaction."},{"label":"C","why":"Procedures là các khối code thực thi logic nghiệp vụ, không trực tiếp đảm bảo tính nhất quán."},{"label":"D","why":"Functions được dùng để tính toán và trả về giá trị, không có chức năng quản lý transaction."}],"vocab":[{"word":"Locks","reading":"","meaning":"Cơ chế khóa dữ liệu để kiểm soát truy cập đồng thời."},{"word":"Consistency","reading":"","meaning":"Tính nhất quán, đảm bảo database chuyển từ trạng thái hợp lệ này sang trạng thái khác."}]},{"id":251,"slide":251,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"During database design, why is it necessary to identify candidate keys? Choose two answers","options":[{"label":"A","text":"To reduce data type complexity."},{"label":"B","text":"To normalize tables faster"},{"label":"C","text":"To select the most appropriate primary key"},{"label":"D","text":"To remove NULL values"}],"answer":"B","note":"B","key_point":"Candidate keys xác định các tập thuộc tính định danh duy nhất cho mỗi tuple.","why_correct":"Việc xác định candidate keys là bước nền tảng để thực hiện normalization, giúp loại bỏ các dependency không mong muốn. Nó cũng là cơ sở để chọn primary key phù hợp nhất cho table.","why_wrong":[{"label":"A","why":"Candidate keys không liên quan đến việc giảm độ phức tạp của data type."},{"label":"D","why":"Việc loại bỏ NULL values liên quan đến integrity constraints, không phải mục đích chính của candidate keys."}],"vocab":[{"word":"Candidate key","reading":"","meaning":"Tập thuộc tính tối thiểu định danh duy nhất một tuple trong relation."},{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm dư thừa và tránh các anomalies."},{"word":"Primary key","reading":"","meaning":"Candidate key được chọn làm định danh chính cho table."}]},{"id":252,"slide":252,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Can a stored procedure call another stored procedure?","options":[{"label":"A","text":"Yes, a stored procedure can call another stored procedure"},{"label":"B","text":"No, stored procedures cannot call each other"},{"label":"C","text":"Only if both procedures are in the same schema"},{"label":"D","text":"Only if one procedure is a system procedure"}],"answer":"A","note":"A","key_point":"Stored procedure có thể gọi các stored procedure khác (nested stored procedures).","why_correct":"Stored procedure hỗ trợ tính module hóa bằng cách cho phép gọi các procedure khác bên trong thân của nó để tái sử dụng code.","why_wrong":[{"label":"B","why":"Sai vì cơ chế nesting là tính năng cơ bản của hầu hết các hệ quản trị CSDL."},{"label":"C","why":"Sai vì việc gọi procedure không bị giới hạn bởi schema nếu có đủ quyền truy cập."},{"label":"D","why":"Sai vì không có quy định bắt buộc một trong hai phải là system procedure."}],"vocab":[{"word":"Stored procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ trong CSDL để thực thi như một đơn vị."},{"word":"Nested","reading":"","meaning":"Lồng nhau, chỉ việc một đối tượng nằm bên trong một đối tượng cùng loại."}]},{"id":253,"slide":253,"section":"Truy vấn SQL","prompt":"","setup":"Given the table Student(StudId, StudName), table Subject(SubId, SubName) and test score table\n(StudId, SubName, MarkExam).","stem":"Suppose we need to query: \"Find students who have never taken the Arithmetic exam\",\nWhich of the following operations can we use in SQL statements?","options":[{"label":"A","text":"not in"},{"label":"B","text":"not exists"},{"label":"C","text":"not in or not exists"},{"label":"D","text":"not in and not exists at the same time"},{"label":"E","text":"None of the mentioned answers"}],"answer":"C","note":"C","key_point":"Sử dụng NOT IN hoặc NOT EXISTS để tìm các bản ghi không tồn tại trong tập hợp.","why_correct":"Cả NOT IN và NOT EXISTS đều là các kỹ thuật chuẩn trong SQL để thực hiện phép trừ tập hợp (set difference), giúp lọc ra các StudId không xuất hiện trong bảng điểm với SubName là \u0027Arithmetic\u0027.","why_wrong":[{"label":"A","why":"Chỉ là một trong hai cách, chưa đủ bao quát."},{"label":"B","why":"Chỉ là một trong hai cách, chưa đủ bao quát."},{"label":"D","why":"Sử dụng đồng thời cả hai là dư thừa và sai cú pháp logic."}],"vocab":[{"word":"NOT IN","reading":"","meaning":"Toán tử kiểm tra giá trị không nằm trong danh sách kết quả của subquery."},{"word":"NOT EXISTS","reading":"","meaning":"Toán tử kiểm tra sự không tồn tại của bản ghi thỏa mãn điều kiện trong subquery."}]},{"id":254,"slide":254,"section":"Mô hình ER","prompt":"","setup":"","stem":"In SQL, converting an E/R design to a relational database schema is including:","options":[{"label":"A","text":"Turn each entity set into a relation with the same set of attributes."},{"label":"B","text":"Replace a relationship by a relation whose attributes are the keys for the connected entity sets."},{"label":"C","text":"All of the others."},{"label":"D","text":"None of the others"}],"answer":"C","note":"C","key_point":"Chuyển đổi E/R sang relational schema bao gồm ánh xạ entity sets và relationships.","why_correct":"Việc chuyển đổi E/R sang relational schema yêu cầu chuyển entity thành các relation và các relationship thành các relation chứa foreign key tương ứng.","why_wrong":[{"label":"A","why":"Chỉ đúng một phần vì thiếu bước xử lý relationship."},{"label":"B","why":"Chỉ đúng một phần vì thiếu bước xử lý entity set."},{"label":"D","why":"Sai vì các phương án A và B đều là các bước chuẩn trong quá trình chuyển đổi."}],"vocab":[{"word":"Entity set","reading":"","meaning":"Tập hợp các thực thể cùng loại trong mô hình E/R."},{"word":"Relational schema","reading":"","meaning":"Cấu trúc logic của cơ sở dữ liệu bao gồm các bảng và ràng buộc."},{"word":"Relationship","reading":"","meaning":"Mối quan hệ giữa các entity set trong mô hình E/R."}]},{"id":255,"slide":255,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"In SQL, what is the primary advantage of using stored procedures?","options":[{"label":"A","text":"They allow for the creation of tables"},{"label":"B","text":"They enhance security by restricting access to data"},{"label":"C","text":"They provide a way to encapsulate and reuse a set of SQL statements"},{"label":"D","text":"They are more efficient than regular SQL queries"}],"answer":"C","note":"C","key_point":"Stored procedures giúp đóng gói và tái sử dụng một tập hợp các câu lệnh SQL.","why_correct":"Stored procedures cho phép bạn nhóm nhiều câu lệnh SQL thành một đơn vị logic, có thể được lưu trữ và gọi lại nhiều lần. Điều này giúp tăng khả năng tái sử dụng code, dễ dàng bảo trì và quản lý các tác vụ phức tạp.","why_wrong":[{"label":"A","why":"Stored procedures không phải là công cụ chính để tạo bảng; các câu lệnh DDL (Data Definition Language) như CREATE TABLE làm điều đó."},{"label":"B","why":"Mặc dù stored procedures có thể góp phần tăng cường security bằng cách hạn chế quyền truy cập trực tiếp vào bảng, nhưng đây không phải là primary advantage của chúng."},{"label":"D","why":"Stored procedures có thể cải thiện efficiency do được pre-compiled và giảm lưu lượng mạng, nhưng đây là một lợi ích phụ, không phải primary advantage như khả năng encapsulate và reuse."}],"vocab":[{"word":"stored procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ trong cơ sở dữ liệu và có thể được gọi để thực thi."},{"word":"encapsulate","reading":"","meaning":"Đóng gói các câu lệnh SQL thành một đơn vị duy nhất."},{"word":"reuse","reading":"","meaning":"Tái sử dụng code bằng cách gọi procedure nhiều lần."}]},{"id":256,"slide":256,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In which objects can Transaction be used?","options":[{"label":"A","text":"View, User-defined function"},{"label":"B","text":"User-defined function, Store Procedure"},{"label":"C","text":"Store Procedure, Trigger, View"},{"label":"D","text":"User-defined function, Store Procedure, Trigger"},{"label":"E","text":"All of the mentioned answers are wrong"}],"answer":"E","note":"E","key_point":"Transaction control không thể dùng trong View và User-defined function.","why_correct":"Các đáp án A, B, C, D đều liệt kê View hoặc User-defined function (UDF) - hai đối tượng không cho phép chứa các câu lệnh quản lý transaction như BEGIN TRANSACTION, COMMIT, hay ROLLBACK. Do đó, tất cả các lựa chọn trên đều sai.","why_wrong":[{"label":"A","why":"Cả View và User-defined function đều không hỗ trợ các câu lệnh quản lý transaction."},{"label":"B","why":"User-defined function không được phép chứa các câu lệnh transaction control."},{"label":"C","why":"View không cho phép sử dụng các câu lệnh quản lý transaction."},{"label":"D","why":"User-defined function không cho phép thực hiện các lệnh transaction control."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Giao tác bao gồm một hoặc nhiều thao tác dữ liệu được thực thi như một đơn vị duy nhất."},{"word":"User-defined function","reading":"","meaning":"Hàm do người dùng định nghĩa trong CSDL, không thể chứa lệnh quản lý transaction."}]},{"id":257,"slide":257,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"In SQL, what is the purpose of the CLOSE statement in relation to cursors?","options":[{"label":"A","text":"To close the database connection"},{"label":"B","text":"To close the cursor and release associated resources"},{"label":"C","text":"To close the transaction"},{"label":"D","text":"To close the result set"}],"answer":"B","note":"B | CLOSE specifically relates to ending the use of a cursor and releasing its resources.","key_point":"Lệnh CLOSE trong cursor dùng để đóng cursor và giải phóng tài nguyên liên quan.","why_correct":"Khi thao tác với cursor hoàn tất, lệnh CLOSE được gọi để giải phóng bộ nhớ và tài nguyên hệ thống mà cursor đang chiếm giữ.","why_wrong":[{"label":"A","why":"Nhầm lẫn với việc đóng kết nối database."},{"label":"C","why":"Nhầm lẫn với việc kết thúc transaction qua COMMIT hoặc ROLLBACK."},{"label":"D","why":"Không chính xác vì result set chỉ là tập kết quả được fetch từ cursor."}],"vocab":[{"word":"cursor","reading":"","meaning":"Con trỏ dùng để duyệt qua từng dòng kết quả truy vấn trong SQL."},{"word":"result set","reading":"","meaning":"Tập hợp các dòng dữ liệu trả về từ câu lệnh SELECT."}]},{"id":258,"slide":258,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"In SQL, when does a BEFORE INSERT trigger fire","options":[{"label":"A","text":"Before the execution of a SELECT statement"},{"label":"B","text":"Before a new record is inserted into a table"},{"label":"C","text":"Before a transaction is committed"},{"label":"D","text":"Before a table is dropped"}],"answer":"B","note":"B","key_point":"BEFORE INSERT trigger fires before a new record is inserted into a table.","why_correct":"Trigger loại này được kích hoạt tự động ngay trước khi một câu lệnh INSERT thực sự ghi dữ liệu mới vào bảng, cho phép kiểm tra hoặc chỉnh sửa dữ liệu.","why_wrong":[{"label":"A","why":"Nhầm lẫn với câu lệnh SELECT vốn không kích hoạt INSERT trigger."},{"label":"C","why":"Nhầm lẫn với thời điểm kết thúc transaction (COMMIT)."},{"label":"D","why":"Nhầm lẫn với lệnh DROP table vốn thuộc nhóm DDL."}],"vocab":[{"word":"trigger","reading":"","meaning":"Đoạn mã tự động chạy khi có sự kiện INSERT, UPDATE, hoặc DELETE trên bảng."},{"word":"INSERT","reading":"","meaning":"Thao tác thêm dòng dữ liệu mới vào bảng."}]},{"id":259,"slide":259,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"In an UPDATE statement, what does the WHERE clause determine?","options":[{"label":"A","text":"The order of update"},{"label":"B","text":"The columns to be updated"},{"label":"C","text":"The condition for selecting rows to be updated"},{"label":"D","text":"The table to be updated"}],"answer":"C","note":"C","key_point":"Dung WHERE trong UPDATE de xac dinh cac tuple nao se bi thay doi.","why_correct":"Menh de WHERE trong cau lenh UPDATE chi dinh dieu kien de loc ra chinh xac nhung row nao trong table se duoc cap nhat du lieu.","why_wrong":[{"label":"A","why":"Thu tu update duoc quyet dinh boi database engine, khong phai WHERE."},{"label":"B","why":"Cac cot duoc update duoc liet ke sau tu khoa SET."},{"label":"D","why":"Table duoc cap nhat duoc chi dinh ngay sau tu khoa UPDATE."}],"vocab":[{"word":"UPDATE","reading":"","meaning":"Cau lenh SQL dung de sua doi du lieu hien co trong table."},{"word":"WHERE","reading":"","meaning":"Menh de dung de loc du lieu theo dieu kien."}]},{"id":260,"slide":260,"section":"Mô hình ER","prompt":"","setup":"","stem":"In an ERD, what role does a primary key play?","options":[{"label":"A","text":"It uniquely identifies each record in a table"},{"label":"B","text":"It establishes relationships between tables"},{"label":"C","text":"It determines the data type of attributes"},{"label":"D","text":"It defines the cardinality of relationships"}],"answer":"A","note":"A","key_point":"Primary key uniquely identifies each tuple trong một table.","why_correct":"Primary key đảm bảo tính duy nhất và không chứa giá trị null cho mỗi record trong table.","why_wrong":[{"label":"B","why":"Đây là vai trò của foreign key."},{"label":"C","why":"Data type được định nghĩa bởi domain của attribute."},{"label":"D","why":"Cardinality liên quan đến số lượng tham gia trong relationship."}],"vocab":[{"word":"primary key","reading":"","meaning":"Khóa chính dùng để định danh duy nhất mỗi record trong table."},{"word":"foreign key","reading":"","meaning":"Khóa ngoại dùng để liên kết giữa các table."}]},{"id":261,"slide":261,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In which scenario would denormalization be considered a good design choice?","options":[{"label":"A","text":"When maximizing disk usage is a priority"},{"label":"B","text":"When minimizing data redundancy is the main goal"},{"label":"C","text":"When performance of read-heavy queries is critical"},{"label":"D","text":"When multiple developers are working on schema design"}],"answer":"C","note":"C","key_point":"Denormalization cải thiện performance cho read-heavy queries bằng cách đánh đổi data redundancy.","why_correct":"Denormalization gộp các table lại để giảm số lượng join operations, từ đó tăng tốc độ truy vấn dữ liệu trong hệ thống read-heavy.","why_wrong":[{"label":"A","why":"Lãng phí ổ cứng không bao giờ là mục tiêu thiết kế tối ưu."},{"label":"B","why":"Đây là mục tiêu của normalization, trái ngược với denormalization."},{"label":"D","why":"Số lượng developer không ảnh hưởng đến việc quyết định denormalization."}],"vocab":[{"word":"denormalization","reading":"","meaning":"Quá trình gộp bảng để tăng performance đọc, chấp nhận dư thừa dữ liệu."},{"word":"data redundancy","reading":"","meaning":"Hiện tượng dư thừa dữ liệu trong database."}]},{"id":262,"slide":262,"section":"Mô hình ER","prompt":"","setup":"","stem":"In an ERD, which of the following best describes a one-to-many (1:M) relationship?","options":[{"label":"A","text":"Each instance of Entity A is related to exactly one instance of Entity B"},{"label":"B","text":"Each instance of Entity A is related to many instances of Entity B"},{"label":"C","text":"Each instance of both entities is related to exactly one other instance"},{"label":"D","text":"Entities are not related at all"}],"answer":"B","note":"B","key_point":"Hiểu đúng định nghĩa quan hệ một-nhiều (1:M) trong ERD.","why_correct":"Trong quan hệ 1:M, một instance ở phía 1 có thể liên kết với nhiều instance ở phía M, nhưng một instance ở phía M chỉ thuộc về đúng một instance ở phía 1.","why_wrong":[{"label":"A","why":"Mô tả quan hệ một-một (1:1)."},{"label":"C","why":"Mô tả quan hệ một-một (1:1)."},{"label":"D","why":"Sai hoàn toàn vì hai thực thể có tồn tại quan hệ."}],"vocab":[{"word":"ERD","reading":"","meaning":"Sơ đồ thực thể kết hợp, dùng để thiết kế cơ sở dữ liệu."},{"word":"Entity","reading":"","meaning":"Thực thể trong cơ sở dữ liệu."}]},{"id":263,"slide":263,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In database transactions, which isolation level is most restrictive?","options":[{"label":"A","text":"READ UNCOMMITTED"},{"label":"B","text":"READ COMMITTED"},{"label":"C","text":"REPEATABLE READ"},{"label":"D","text":"SERIALIZABLE"}],"answer":"D","note":"D","key_point":"SERIALIZABLE là isolation level cao nhất và nghiêm ngặt nhất trong transactions.","why_correct":"Option D đúng vì SERIALIZABLE ngăn chặn hoàn toàn các hiện tượng tranh chấp dữ liệu như dirty read, non-repeatable read và phantom read bằng cách thực thi tuần tự hóa các transaction.","why_wrong":[{"label":"A","why":"Cho phép đọc dữ liệu chưa được commit, mức độ cô lập thấp nhất."},{"label":"B","why":"Chỉ tránh được dirty read nhưng vẫn cho phép non-repeatable read."},{"label":"C","why":"Tránh được non-repeatable read nhưng vẫn có thể gặp phantom read."}],"vocab":[{"word":"isolation level","reading":"","meaning":"Mức độ cô lập trong transaction để kiểm soát tranh chấp dữ liệu."},{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực hiện như một thể thống nhất."}]},{"id":264,"slide":264,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"In the context of a DBMS, what is meant by \"data integrity\"?","options":[{"label":"A","text":"The ability to perform multiple queries simultaneously"},{"label":"B","text":"Ensuring data is consistent, accurate, and reliable"},{"label":"C","text":"The ability to recover data after a failure"},{"label":"D","text":"Encrypting data to protect it from unauthorized access"}],"answer":"B","note":"B","key_point":"Data integrity đảm bảo tính chính xác, nhất quán và độ tin cậy của dữ liệu.","why_correct":"Data integrity đề cập đến độ chính xác và tính hợp lệ của dữ liệu trong suốt vòng đời của nó, đảm bảo dữ liệu tuân thủ các quy tắc ràng buộc.","why_wrong":[{"label":"A","why":"Nhầm lẫn với concurrency control."},{"label":"C","why":"Nhầm lẫn với recovery management."},{"label":"D","why":"Nhầm lẫn với data security và encryption."}],"vocab":[{"word":"data integrity","reading":"","meaning":"Tính toàn vẹn của dữ liệu"},{"word":"concurrency control","reading":"","meaning":"Điều khiển đồng thời"}]},{"id":265,"slide":265,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"In the relational model, how are relationships represented between tables?","options":[{"label":"A","text":"By adding attributes to each table"},{"label":"B","text":"By creating a new table for each relationship"},{"label":"C","text":"By adding foreign keys to related tables"},{"label":"D","text":"By creating a primary key in each table"}],"answer":"C","note":"C","key_point":"Relationships between tables in the relational model are represented using foreign keys.","why_correct":"Trong relational model, mối liên kết giữa các table được thể hiện bằng cách đưa foreign key vào table tham chiếu để trỏ tới primary key của table đích.","why_wrong":[{"label":"A","why":"Việc thêm attributes tùy tiện không đảm bảo tính toàn vẹn tham chiếu."},{"label":"B","why":"Chỉ tạo table mới khi biểu diễn mối quan hệ many-to-many, không phải quy tắc chung cho mọi relationship."},{"label":"D",
