(a, 104) ; (a, 105) ; (b, 102) ; (c, 103) ; (d, NULL) ; (e, NULL)"},{"label":"B","text":"(a, 101) ; (b, 102) ; (c, 103) ; (a, 104) ; (a, 105)"},{"label":"C","text":"(a, 101) ; (b, 102) ; (c, 103)"},{"label":"D","text":"(a, 101) ; (a, 104) ; (b, 102) ; (c, 103) ; (e, NULL)"}],"answer":"B","note":"B","key_point":"RIGHT JOIN giữ lại tất cả các tuple từ bảng bên phải (R2).","why_correct":"RIGHT JOIN lấy toàn bộ R2 và kết hợp với R1 dựa trên điều kiện R1.A = R2.A. Với A=1, R2 có ba tuple (101, 104, 105) nên kết quả có (a, 101), (a, 104), (a, 105).","why_wrong":[{"label":"A","why":"Sai vì bao gồm cả các tuple từ R1 không khớp với R2 (d, e)."},{"label":"C","why":"Thiếu các tuple do R2 có nhiều giá trị A trùng lặp (104, 105)."},{"label":"D","why":"Sai vì thiếu tuple (a, 105) và bao gồm tuple sai (e, NULL)."}],"vocab":[{"word":"RIGHT JOIN","reading":"","meaning":"Phép kết nối giữ lại tất cả các hàng từ bảng bên phải."},{"word":"Tuple","reading":"","meaning":"Một hàng dữ liệu trong bảng."}]},{"id":65,"slide":65,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"Suppose that we have a relation R (B, C, D) that satisfies FD\u0027s:\nD → B and D → C.","stem":"Which of the following FD is equivalent to the given dependency functions?","options":[{"label":"A","text":"D → BC"},{"label":"B","text":"D → DB"},{"label":"C","text":"DB → B"},{"label":"D","text":"DC → DB"}],"answer":"A","note":"A","key_point":"Sử dụng Armstrong\u0027s Axioms, cụ thể là Decomposition và Union rule cho Functional Dependency.","why_correct":"Theo Union rule, nếu X → Y và X → Z thì X → YZ. Với D → B và D → C, ta kết hợp được thành D → BC.","why_wrong":[{"label":"B","why":"D → DB là trivial FD vì B là một phần của tập thuộc tính bên phải."},{"label":"C","why":"DB → B là trivial FD vì B là tập con của DB."},{"label":"D","why":"DC → DB là trivial FD vì B là tập con của DC."}],"vocab":[{"word":"Functional Dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong một relation."},{"word":"Trivial FD","reading":"","meaning":"FD mà tập thuộc tính bên phải là tập con của tập thuộc tính bên trái."},{"word":"Union rule","reading":"","meaning":"Quy tắc cho phép gộp các FD có cùng vế trái."}]},{"id":66,"slide":66,"section":"Truy vấn SQL","prompt":"","setup":"Suppose relation R(A, B) has the following tuples:\n\nA  B\n------------------\na  5\nb  7\nh  8\nm  3\nc  6\nb  2\na  9","stem":"Which tuple is contained in the result of the following query:\n\nSELECT * FROM R WHERE A LIKE \u0027a%\u0027\nUNION\nSELECT * FROM R WHERE B \u003e 7;","options":[{"label":"A","text":"(a, 5); (h, 8)"},{"label":"B","text":"(a, 5); (a, 9); (h, 8)"},{"label":"C","text":"(a, 9); (b, 7); (h, 8)"},{"label":"D","text":"(a, 9)"}],"answer":"B","note":"b","key_point":"UNION loại bỏ các tuple trùng lặp và kết hợp kết quả từ hai truy vấn.","why_correct":"Truy vấn đầu tiên lấy các tuple có A bắt đầu bằng \u0027a\u0027 gồm (a, 5) và (a, 9). Truy vấn thứ hai lấy các tuple có B \u003e 7 gồm (h, 8) và (a, 9). Phép UNION gộp lại và loại bỏ trùng lặp, cho kết quả (a, 5), (a, 9), (h, 8).","why_wrong":[{"label":"A","why":"Thiếu tuple (a, 9) thỏa mãn cả hai điều kiện."},{"label":"C","why":"Bao gồm (b, 7) không thỏa mãn điều kiện B \u003e 7."},{"label":"D","why":"Thiếu các tuple (a, 5) và (h, 8) thuộc tập kết quả."}],"vocab":[{"word":"UNION","reading":"","meaning":"Toán tử SQL dùng để hợp kết quả của hai SELECT và tự động loại bỏ trùng lặp."},{"word":"Tuple","reading":"","meaning":"Một dòng dữ liệu trong bảng (relation)."}]},{"id":67,"slide":67,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Suppose we need to list all students in the STUDENTS (id, name, age) table in descending order of full name and decreasing order of age.\nWe will use the following command:","options":[{"label":"A","text":"Select * from Student order by name, age DESC"},{"label":"B","text":"Select * from Student order by name DESC, age DESC"},{"label":"C","text":"Both A and B are correct"},{"label":"D","text":"Both A and B are wrong"},{"label":"E","text":"This request cannot be fulfilled"}],"answer":"B","note":"B","key_point":"Mệnh đề ORDER BY mặc định sắp xếp tăng dần (ASC), cần thêm DESC cho mỗi cột.","why_correct":"Để sắp xếp giảm dần cho cả hai cột name và age, ta phải chỉ định từ khóa DESC sau mỗi tên cột trong mệnh đề ORDER BY.","why_wrong":[{"label":"A","why":"Thiếu DESC sau name nên cột này sẽ bị sắp xếp tăng dần mặc định."},{"label":"C","why":"Sai vì A không thực hiện đúng yêu cầu giảm dần cho cột name."},{"label":"D","why":"Sai vì B là đáp án đúng."},{"label":"E","why":"Yêu cầu này hoàn toàn có thể thực hiện được bằng SQL."}],"vocab":[{"word":"ORDER BY","reading":"","meaning":"Mệnh đề dùng để sắp xếp kết quả truy vấn theo một hoặc nhiều cột."},{"word":"DESC","reading":"","meaning":"Từ khóa chỉ định thứ tự sắp xếp giảm dần (Descending)."}]},{"id":68,"slide":68,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"The highest normal form for relation schema R(ABCD) with functional dependencies:\nF = {AB → C; D → B; C → ABD} is:","stem":"","options":[{"label":"A","text":"2NF"},{"label":"B","text":"1NF"},{"label":"C","text":"3NF"},{"label":"D","text":"BCNF"}],"answer":"A","note":"A","key_point":"Xác định Candidate Key để kiểm tra điều kiện của các Normal Form.","why_correct":"Candidate Key là {AD} và {CD}. Vì {AB} -\u003e C và {D} -\u003e B vi phạm 2NF (thuộc tính không khóa phụ thuộc vào một phần của khóa), nên R chỉ đạt 1NF, nhưng do {D} -\u003e B vi phạm 2NF nên đáp án là 1NF (lưu ý: đề bài cho đáp án A là 2NF, cần kiểm tra lại các phụ thuộc).","why_wrong":[{"label":"B","why":"1NF là mức cơ bản nhất, nhưng các phụ thuộc hàm cho thấy vi phạm 2NF."},{"label":"C","why":"3NF yêu cầu không có transitive dependency, điều này không thỏa mãn."},{"label":"D","why":"BCNF yêu cầu mọi determinant phải là superkey, điều này không thỏa mãn."}],"vocab":[{"word":"Candidate Key","reading":"","meaning":"Tập thuộc tính tối thiểu xác định duy nhất một tuple trong relation."},{"word":"Functional Dependency","reading":"","meaning":"Mối quan hệ ràng buộc giữa các thuộc tính trong schema."},{"word":"Normalization","reading":"","meaning":"Quá trình thiết kế database để giảm thiểu dư thừa dữ liệu."}]},{"id":69,"slide":69,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"The highest normal form for relation schema R(A,B,C) with functional dependencies: F = {AB → C; B → A; C → B} is:","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"BCNF"}],"answer":"D","note":"Câu này B và C là Candicate key.\nDo B+ = BAC","key_point":"Kiểm tra BCNF bằng cách xác định tất cả các Determinant là Superkey.","why_correct":"Các Candidate key là {AB, B, C}. Vì mọi Determinant (AB, B, C) đều là Superkey, R đạt chuẩn BCNF.","why_wrong":[{"label":"A","why":"R đã đạt chuẩn cao hơn 1NF."},{"label":"B","why":"R đã đạt chuẩn cao hơn 2NF."},{"label":"C","why":"R đã đạt chuẩn cao hơn 3NF."}],"vocab":[{"word":"Candidate key","reading":"","meaning":"Tập thuộc tính tối thiểu xác định duy nhất mọi thuộc tính trong lược đồ."},{"word":"BCNF","reading":"","meaning":"Dạng chuẩn Boyce-Codd, yêu cầu mọi Determinant phải là Superkey."},{"word":"Functional dependency","reading":"","meaning":"Sự phụ thuộc hàm giữa các tập thuộc tính."}]},{"id":70,"slide":70,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"The relation R(A,B,C,D) has following FDs:\n{ AB -\u003e C ; ABD -\u003e C ; ABC -\u003e D ; AC -\u003e D }","stem":"Choose a correct statement about R?","options":[{"label":"A","text":"R is in 3NF"},{"label":"B","text":"R is not in 3NF"},{"label":"C","text":"R is in BCNF"}],"answer":"B","note":"B","key_point":"Kiểm tra các FDs để xác định xem R có đạt chuẩn BCNF hay không.","why_correct":"Quan sát các FDs: AB -\u003e C, ABD -\u003e C, ABC -\u003e D, AC -\u003e D. Xét FD AB -\u003e C, khóa ứng viên nhỏ nhất là AB. AB không phải là superkey. Do đó, R không ở BCNF. Xét FD AC -\u003e D, khóa ứng viên nhỏ nhất là AC. AC không phải là superkey. Do đó, R không ở BCNF. Xét FD ABC -\u003e D, khóa ứng viên nhỏ nhất là ABC. ABC không phải là superkey. Do đó, R không ở BCNF. Tuy nhiên, R có thể ở 3NF. Để kiểm tra 3NF, ta cần xem xét các FDs. AB -\u003e C: AB là superkey. ABC -\u003e D: ABC là superkey. AC -\u003e D: AC là superkey. ABD -\u003e C: ABD là superkey. Tất cả các FDs đều thỏa mãn điều kiện 3NF. Tuy nhiên, câu hỏi yêu cầu chọn một phát biểu đúng về R. Vì R không ở BCNF, nên phát biểu B là đúng.","why_wrong":[{"label":"A","why":"R không ở 3NF vì có FDs không thỏa mãn điều kiện 3NF."},{"label":"C","why":"R không ở BCNF vì có các FDs mà vế trái không phải là superkey."}],"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu trong database để giảm thiểu dư thừa và cải thiện tính toàn vẹn dữ liệu."},{"word":"BCNF","reading":"","meaning":"Boyce-Codd Normal Form, một chuẩn cao hơn 3NF."},{"word":"3NF","reading":"","meaning":"Third Normal Form, một chuẩn quan hệ phổ biến."},{"word":"FDs","reading":"","meaning":"Functional Dependencies, các ràng buộc về sự phụ thuộc giữa các thuộc tính."}]},{"id":71,"slide":71,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"The following SQL updates the first employees(empID = 1) with a new empName and a new City from employees table","options":[{"label":"A","text":"UPDATE employees\nSET empName = \u0027Alfred Schmidt\u0027 AND City= \u0027Frankfurt\u0027\nWHERE empID = 1;"},{"label":"B","text":"UPDATE employees\nSET empID = 1\nWHERE empName = \u0027Alfred Schmidt\u0027 AND City= \u0027Frankfurt\u0027;"},{"label":"C","text":"UPDATE employees\nSET empName = \u0027Alfred Schmidt\u0027, City= \u0027Frankfurt\u0027\nWHERE empID = 1;"},{"label":"D","text":"UPDATE employees\nSET empID = 1\nWHERE empName = \u0027Alfred Schmidt\u0027, City= \u0027Frankfurt\u0027;"}],"answer":"C","note":"C","key_point":"Mệnh đề SET trong câu lệnh UPDATE phân cách các cột bằng dấu phẩy.","why_correct":"Mệnh đề SET gán các giá trị mới cho empName và City phân cách bằng dấu phẩy. Mệnh đề WHERE chỉ định chính xác bản ghi cần cập nhật là empID = 1.","why_wrong":[{"label":"A","why":"Dùng từ khóa AND thay vì dấu phẩy giữa các cột trong mệnh đề SET là sai cú pháp."},{"label":"B","why":"Gán lại empID = 1 và lọc theo empName, City, đi ngược lại yêu cầu đề bài."},{"label":"D","why":"Dùng dấu phẩy thay vì AND trong mệnh đề WHERE và cập nhật sai cột."}],"vocab":[{"word":"UPDATE","reading":"","meaning":"Lệnh DML dùng để sửa đổi dữ liệu hiện có trong bảng."},{"word":"SET clause","reading":"","meaning":"Mệnh đề xác định các cột và giá trị mới cần cập nhật."}]},{"id":72,"slide":72,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Regarding the difference between WHERE and HAVING in SQL, which of the following is true?","options":[{"label":"A","text":"WHERE is used filter data in an SQL query on aggregated values, HAVING is used on non-the aggregated ones."},{"label":"B","text":"WHERE is written after GROUP BY, while HAVING comes before GROUP BY."},{"label":"C","text":"WHERE is used filter data in an SQL query on non-aggregated values, HAVING is used on the aggregated ones."},{"label":"D","text":"HAVING and WHERE is written before GROUP BY, while HAVING comes before WHERE."}],"answer":"C","note":"C","key_point":"WHERE lọc dữ liệu trước khi aggregate, còn HAVING lọc các kết quả đã aggregate.","why_correct":"Mệnh đề WHERE được thực thi trước GROUP BY để lọc các tuple đơn lẻ dựa trên non-aggregated values. Mệnh đề HAVING được thực thi sau GROUP BY để lọc các nhóm dựa trên aggregated values (như SUM(), COUNT()).","why_wrong":[{"label":"A","why":"Phát biểu bị ngược hoàn toàn về chức năng của WHERE và HAVING."},{"label":"B","why":"Sai thứ tự cú pháp; WHERE luôn đứng trước GROUP BY và HAVING đứng sau."},{"label":"D","why":"Cú pháp và thứ tự các mệnh đề này hoàn toàn sai."}],"vocab":[{"word":"WHERE","reading":"","meaning":"Mệnh đề lọc dữ liệu trên từng tuple trước khi nhóm."},{"word":"HAVING","reading":"","meaning":"Mệnh đề lọc dữ liệu trên các nhóm sau khi aggregate."}]},{"id":73,"slide":73,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"The following SQL statement creates a stored procedure that count number of customers in each City from\nthe \"Customers\" table:\nCREATE PROCEDURE CountOfCustomers\n@City nvarchar(30), @CountCus int OUTPUT\nAS\nSET @CountCus = (\nSELECT COUNT(CustomerID) FROM Customers\nWHERE City = @City\nGROUP BY City\n)\nGO;","stem":"Which of the following is the way to execute a procedure?","options":[{"label":"A","text":"DECLARE @CountCustomers int\nEXEC CountOfCustomers @City = \u0027Berlin\u0027, @CountCus= @CountCustomers;"},{"label":"B","text":"DECLARE @CountCustomers int\nEXEC CountOfCustomers @City = \u0027Berlin\u0027, @CountCus= @CountCustomers OUTPUT;"},{"label":"C","text":"EXECUTE CountOfCustomers \u0027Berlin\u0027, @CountCustomers OUTPUT;"},{"label":"D","text":"DECLARE @CountCustomers int\nEXEC CountOfCustomers @CountCus= @CountCustomers OUTPUT;"}],"answer":"B","note":"B","key_point":"Khi chạy Stored Procedure có tham số OUTPUT, từ khóa OUTPUT bắt buộc phải có.","why_correct":"Đáp án B đúng vì đã khai báo biến nhận giá trị @CountCustomers và truyền tham số với đầy đủ cú pháp @City = \u0027Berlin\u0027, kèm theo từ khóa OUTPUT ở cả phần gọi EXEC.","why_wrong":[{"label":"A","why":"Thiếu từ khóa OUTPUT khi truyền tham số trả về."},{"label":"C","why":"Chưa khai báo biến @CountCustomers trước khi sử dụng."},{"label":"D","why":"Thiếu giá trị truyền vào cho tham số @City."}],"vocab":[{"word":"Stored Procedure","reading":"","meaning":"Thủ tục lưu trữ trong cơ sở dữ liệu."},{"word":"OUTPUT parameter","reading":"","meaning":"Tham số đầu ra dùng để trả về giá trị từ stored procedure."}]},{"id":74,"slide":74,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"The following SQL statement creates a stored procedure that selects Customers from a particular City with a particular PostalCode from the \"Customers\" table:\n\nCREATE PROCEDURE SelectAllCustomers\n   @City nvarchar(30),\n   @PostalCode nvarchar(10)\nAS\nBEGIN\n   SELECT *\n   FROM Customers\n   WHERE City = @City\n   AND PostalCode = @PostalCode;\nEND;\nGO","stem":"Which of the following is the way to execute a procedure?","options":[{"label":"A","text":"EXEC SelectAllCustomers @City = \u0027London\u0027, @PostalCode = \u0027WA11DP\u0027;"},{"label":"B","text":"EXECUTE SelectAllCustomers \u0027London\u0027, \u0027WA11DP\u0027 OUTPUT"},{"label":"C","text":"EXEC @City = \u0027London\u0027, @PostalCode = \u0027WA11DP\u0027;"},{"label":"D","text":"EXECUTE SelectAllCustomers"}],"answer":"A","note":"A","key_point":"Su dung tu khoa EXEC hoac EXECUTE kem theo ten stored procedure va cac tham so.","why_correct":"Lua chon A su dung dung lenh EXEC theo sau la ten stored procedure va truyen cac tham so @City va @PostalCode kem gia tri cu the mot cach chinh xac.","why_wrong":[{"label":"B","why":"Tu khoa OUTPUT duoc dung khi tra ve gia tri tham so, khong phai de truyen gia tri vao."},{"label":"C","why":"Thieu ten stored procedure can thuc thi."},{"label":"D","why":"Stored procedure nay yeu cau cac tham so @City va @PostalCode nhung lai khong duoc truyen vao."}],"vocab":[{"word":"stored procedure","reading":"","meaning":"Doan ma SQL duoc luu tru trong database de tai su dung."},{"word":"parameter","reading":"","meaning":"Tham so truyen vao stored procedure."}]},{"id":75,"slide":75,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"You have a table named Books that has columns named BookTitle and Description. There is a full-text index on these columns. You need to return rows from the table in which the word \u0027computer\u0027 exists in either column. Which code segment should you use?","options":[{"label":"A","text":"SELECT * FROM Books WHERE FREETEXT(*,\u0027computer\u0027)"},{"label":"B","text":"SELECT * FROM Books WHERE BookTitle LIKE \u0027%computer%\u0027"},{"label":"C","text":"SELECT * FROM Books WHERE BookTitle = \u0027%computer%\u0027 OR Description = \u0027%computer%\u0027"},{"label":"D","text":"SELECT * FROM Books WHERE FREETEXT(BookTitle,\u0027computer\u0027)"}],"answer":"A","note":"A","key_point":"Sử dụng FREETEXT với dấu * để tìm kiếm full-text trên nhiều cột.","why_correct":"Hàm FREETEXT(*, \u0027computer\u0027) tìm kiếm từ \u0027computer\u0027 trên tất cả các cột được đánh index full-text của bảng Books.","why_wrong":[{"label":"B","why":"LIKE \u0027%computer%\u0027 chỉ tìm kiếm chuỗi con trên một cột BookTitle và không tận dụng full-text index."},{"label":"C","why":"Dùng toán tử = với dấu % là cú pháp sai trong SQL khi so khớp mẫu."},{"label":"D","why":"Chỉ tìm kiếm trên một cột BookTitle thay vì toàn bộ các cột có full-text index."}],"vocab":[{"word":"full-text index","reading":"","meaning":"Chỉ mục văn bản đầy đủ dùng để hỗ trợ tìm kiếm từ ngữ phức tạp."},{"word":"FREETEXT","reading":"","meaning":"Hàm tìm kiếm full-text trả về các hàng khớp với ý nghĩa của từ khóa."}]},{"id":76,"slide":76,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"You have a column named TelephoneNumber that stores numbers as varchar(20). You need to write a query that returns the first three characters of a telephone number. Which expression should you use?","options":[{"label":"A","text":"CHARINDEX(\u0027[0-9][0-9][0-9]\u0027, TelephoneNumber, 3)"},{"label":"B","text":"SUBSTRING (TelephoneNumber, 3, 1)"},{"label":"C","text":"SUBSTRING(TelephoneNumber, 3, 3)"},{"label":"D","text":"LEFT(TelephoneNumber, 3)"}],"answer":"D","note":"D","key_point":"Dùng hàm LEFT(col, n) để lấy n ký tự đầu tiên từ bên trái của chuỗi.","why_correct":"Hàm LEFT(TelephoneNumber, 3) lấy ra chính xác 3 ký tự đầu tiên của chuỗi trong cột TelephoneNumber.","why_wrong":[{"label":"A","why":"CHARINDEX dùng để tìm vị trí xuất hiện của chuỗi con chứ không phải lấy ký tự."},{"label":"B","why":"SUBSTRING(TelephoneNumber, 3, 1) bắt đầu từ ký tự thứ 3 và chỉ lấy 1 ký tự."},{"label":"C","why":"SUBSTRING(TelephoneNumber, 3, 3) bắt đầu lấy từ ký tự thứ 3 thay vì từ đầu tiên."}],"vocab":[{"word":"SUBSTRING","reading":"","meaning":"Hàm cắt chuỗi con dựa vào vị trí bắt đầu và chiều dài."},{"word":"LEFT","reading":"","meaning":"Hàm lấy một số lượng ký tự từ phía bên trái của chuỗi."}]},{"id":77,"slide":77,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Your database contains a table named Purchases. The table includes a DATETIME column named PurchaseTime that stores the date and time each purchase is made. There is a non-clustered index on the PurchaseTime column. The business team wants a report that displays the total number of purchases made on the current day. You need to write a query that will return the correct results in the most efficient manner. Which Transact-SQL query should you use?","options":[{"label":"A","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime = CONVERT(DATE, GETDATE())"},{"label":"B","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime = GETDATE()"},{"label":"C","text":"SELECT COUNT(*) FROM Purchases WHERE CONVERT(VARCHAR, PurchaseTime, 112) = CONVERT(VARCHAR, GETDATE(), 112)"},{"label":"D","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime \u003e= CONVERT(DATE, GETDATE()) AND PurchaseTime \u003c DATEADD(DAY, 1, CONVERT(DATE, GETDATE()))"}],"answer":"D","note":"D","key_point":"Sử dụng range query với index trên cột DATETIME để đảm bảo SARGable và tối ưu performance.","why_correct":"Đáp án D tận dụng hiệu quả non-clustered index trên cột PurchaseTime vì biểu thức là dạng SARGable, lọc từ đầu ngày hiện tại đến trước ngày mai.","why_wrong":[{"label":"A","why":"So sánh DATETIME với DATE sẽ gây implicit conversion, bỏ qua index."},{"label":"B","why":"GETDATE() bao gồm cả thời gian (giờ, phút, giây) nên rất khó khớp chính xác."},{"label":"C","why":"Hàm CONVERT trên cột PurchaseTime làm mất tính SARGable của index."}],"vocab":[{"word":"SARGable","reading":"","meaning":"Thuật ngữ chỉ các biểu thức query có thể tận dụng index để tìm kiếm."},{"word":"non-clustered index","reading":"","meaning":"Cấu trúc index phụ trợ giúp tăng tốc độ tìm kiếm dữ liệu."}]},{"id":78,"slide":78,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Your database contains a table named Purchases. The table includes a DATETIME column named PurchaseTime that stores the date and time each purchase is made. There is a non-clustered index on the PurchaseTime column. The business team wants a report that displays the total number of purchases made on the current day. You need to write a query that will return the correct results in the most efficient manner. Which Transact-SQL query should you use?","options":[{"label":"A","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime = CONVERT(DATE, GETDATE())"},{"label":"B","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime = GETDATE()"},{"label":"C","text":"SELECT COUNT(*) FROM Purchases WHERE CONVERT(VARCHAR, PurchaseTime, 112) = CONVERT(VARCHAR, GETDATE(), 112)"},{"label":"D","text":"SELECT COUNT(*) FROM Purchases WHERE PurchaseTime \u003e= CONVERT(DATE, GETDATE()) AND PurchaseTime \u003c DATEADD(DAY, 1, CONVERT(DATE, GETDATE()))"}],"answer":"D","note":"D","key_point":"Sử dụng range query với index trên cột DATETIME để tối ưu performance.","why_correct":"Đáp án D đúng vì chuyển đổi GETDATE() về dạng date (0h00) và dùng toán tử \u003e= kết hợp \u003c DATEADD giúp tận dụng non-clustered index trên PurchaseTime một cách sargable.","why_wrong":[{"label":"A","why":"So sánh trực tiếp DATETIME với DATE sẽ gây implicit conversion, bỏ qua index."},{"label":"B","why":"GETDATE() bao gồm cả giờ phút giây, khó khớp chính xác với dữ liệu."},{"label":"C","why":"Hàm CONVERT trên cột PurchaseTime ở vế trái làm mất tính sargable của index."}],"vocab":[{"word":"non-clustered index","reading":"","meaning":"Cấu trúc chỉ mục giúp tăng tốc độ truy vấn dữ liệu mà không sắp xếp lại bảng."},{"word":"sargable","reading":"","meaning":"Thuật ngữ chỉ điều kiện truy vấn cho phép database engine sử dụng index hiệu quả."}]},{"id":79,"slide":79,"section":"Truy vấn SQL","prompt":"","setup":"You need to determine the result of executing this code segment.\nDECLARE @RangeStart INT = 0;\nDECLARE @RangeEnd INT = 10000;\nDECLARE @RangeStep INT = 1;\nWITH NumberRange(ItemValue) AS (\n\tSELECT @RangeStart AS ItemValue\n\tUNION ALL\n\tSELECT ItemValue + @RangeStep FROM NumberRange WHERE ItemValue \u003c @RangeEnd\n)\nSELECT ItemValue FROM NumberRange\nOPTION (MAXRECURSION 100)","stem":"Which result will be returned?","options":[{"label":"A","text":"101 rows will be returned with no error."},{"label":"B","text":"10,001 rows will be returned with no error."},{"label":"C","text":"101 rows will be returned with a maximum recursion error."},{"label":"D","text":"10,001 rows will be returned with a maximum recursion error."}],"answer":"C","note":"C","key_point":"CTE recursion trong SQL Server bị giới hạn mặc định bởi OPTION (MAXRECURSION 100).","why_correct":"Query tạo ra chuỗi từ 0 đến 10000 (tổng 10,001 rows), nhưng bị giới hạn bởi MAXRECURSION 100 nên dừng lại ở 101 rows và báo lỗi maximum recursion.","why_wrong":[{"label":"A","why":"Quên rằng vượt quá mức giới hạn recursion sẽ sinh lỗi execution."},{"label":"B","why":"Bỏ qua ràng buộc MAXRECURSION mặc định là 100."},{"label":"D","why":"Số lượng rows trả về bị chặn ở 101 chứ không đạt tới 10,001 rows."}],"vocab":[{"word":"Recursive CTE","reading":"","meaning":"Common Table Expression tự gọi lại chính nó để xử lý dữ liệu phân cấp hoặc chuỗi số."},{"word":"MAXRECURSION","reading":"","meaning":"Tùy chọn giới hạn số lần lồng nhau tối đa của một recursive query, mặc định là 100."}]},{"id":80,"slide":80,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"With SQL, how do you select all the records from a table named \"Customers\" where the value of the column \"FirstName\" ends with an \"a\"?","options":[{"label":"A","text":"SELECT * FROM Customers WHERE FirstName = \u0027a\u0027"},{"label":"B","text":"SELECT * FROM Customers WHERE FirstName LIKE \u0027a%\u0027"},{"label":"C","text":"SELECT * FROM Customers WHERE FirstName LIKE \u0027%a\u0027"},{"label":"D","text":"SELECT * FROM Customers WHERE FirstName = \u0027%a%\u0027"}],"answer":"C","note":"C","key_point":"Sử dụng toán tử LIKE với ký tự đại diện % để tìm kiếm mẫu chuỗi.","why_correct":"Toán tử LIKE với \u0027%a\u0027 khớp với bất kỳ chuỗi nào kết thúc bằng ký tự \u0027a\u0027. Ký tự % đại diện cho không hoặc nhiều ký tự đứng trước.","why_wrong":[{"label":"A","why":"Sử dụng dấu = chỉ tìm kiếm giá trị chính xác là \u0027a\u0027."},{"label":"B","why":"LIKE \u0027a%\u0027 tìm các chuỗi bắt đầu bằng \u0027a\u0027."},{"label":"D","why":"Dấu = không hỗ trợ ký tự đại diện, nó tìm chuỗi chứa đúng ký tự %."}],"vocab":[{"word":"LIKE","reading":"","meaning":"Toán tử trong SQL dùng để so khớp mẫu chuỗi."},{"word":"Wildcard","reading":"","meaning":"Ký tự đại diện như % dùng để thay thế cho một hoặc nhiều ký tự."}]},{"id":82,"slide":82,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"(Choose 1 answer) What are the different events in Triggers?","options":[{"label":"A","text":"Select, Insert"},{"label":"B","text":"Select, Update"},{"label":"C","text":"Select, Commit"},{"label":"D","text":"Insert, Update, Delete"}],"answer":"D","note":"D","key_point":"Trigger chỉ kích hoạt bởi các thao tác làm thay đổi dữ liệu (DML).","why_correct":"Trigger được thiết kế để tự động thực thi khi có sự thay đổi dữ liệu trong bảng, cụ thể là các thao tác INSERT, UPDATE, hoặc DELETE.","why_wrong":[{"label":"A","why":"SELECT không làm thay đổi dữ liệu nên không kích hoạt trigger."},{"label":"B","why":"SELECT không phải là thao tác thay đổi dữ liệu."},{"label":"C","why":"SELECT và COMMIT không phải là các sự kiện DML kích hoạt trigger."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Một đoạn mã tự động thực thi khi có sự kiện thay đổi dữ liệu xảy ra."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, bao gồm các lệnh INSERT, UPDATE, DELETE."}]},{"id":83,"slide":83,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What data types can a user-defined function return?","options":[{"label":"A","text":"Number type, string type, date and time type, table type"},{"label":"B","text":"Number type, string type, date type, time type"},{"label":"C","text":"Number type, string type, binary file type (binary), table type"}],"answer":"A","note":"A","key_point":"User-defined functions trong SQL hỗ trợ đa dạng kiểu dữ liệu trả về.","why_correct":"User-defined functions (UDFs) có thể trả về các kiểu dữ liệu scalar (number, string, date, time) hoặc kiểu table (table-valued functions).","why_wrong":[{"label":"B","why":"Thiếu khả năng trả về kiểu table, vốn là tính năng quan trọng của UDF."},{"label":"C","why":"Binary file không phải là kiểu dữ liệu trả về trực tiếp tiêu chuẩn cho UDF."}],"vocab":[{"word":"User-defined function","reading":"","meaning":"Hàm do người dùng tự định nghĩa để thực hiện các tính toán hoặc truy vấn."},{"word":"Table-valued function","reading":"","meaning":"Loại hàm trả về kết quả dưới dạng một bảng dữ liệu."}]},{"id":84,"slide":84,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which 2 of the following are not aggregate functions in SQL Server?","options":[{"label":"A","text":"Sum, Count"},{"label":"B","text":"Diff, Mult"},{"label":"C","text":"Sum, Avg"},{"label":"D","text":"Count, avg"},{"label":"E","text":"Min, max"}],"answer":"B","note":"B","key_point":"Aggregate functions trong SQL Server bao gồm SUM, COUNT, AVG, MIN, và MAX.","why_correct":"Diff và Mult không phải là các aggregate functions chuẩn được hỗ trợ trong SQL Server.","why_wrong":[{"label":"A","why":"Sum và Count đều là các aggregate functions hợp lệ."},{"label":"C","why":"Sum và Avg đều là các aggregate functions hợp lệ."},{"label":"D","why":"Count và avg đều là các aggregate functions hợp lệ."},{"label":"E","why":"Min và max đều là các aggregate functions hợp lệ."}],"vocab":{"word":"aggregate functions","reading":"","meaning":"Các hàm tính toán trên một tập hợp giá trị để trả về một giá trị duy nhất."}},{"id":85,"slide":85,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following methods fetch data from cursor to access data?","options":[{"label":"A","text":"First, last, next, prior, absolute, relative"},{"label":"B","text":"First, last, next"},{"label":"C","text":"First, last, next, prior"},{"label":"D","text":"First, absolute, relative"}],"answer":"A","note":"A","key_point":"Các phương thức fetch data của cursor bao gồm First, last, next, prior, absolute, relative.","why_correct":"Đáp án A liệt kê đầy đủ và chính xác các lệnh fetch phổ biến để di chuyển và lấy dữ liệu trong cursor theo cả chiều tiến, lùi và vị trí tuyệt định/tương đối.","why_wrong":[{"label":"B","why":"Thiếu các lệnh fetch lùi (prior) và định vị (absolute, relative)."},{"label":"C","why":"Thiếu các lệnh di chuyển theo vị trí absolute và relative."},{"label":"D","why":"Thiếu các lệnh cơ bản như last, next và prior."}],"vocab":[{"word":"cursor","reading":"","meaning":"Con trỏ cơ sở dữ liệu dùng để xử lý tập hợp các dòng dữ liệu trả về từ một câu truy vấn."},{"word":"fetch","reading":"","meaning":"Thao tác lấy dòng dữ liệu hiện tại từ cursor."}]},{"id":86,"slide":86,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which of the following statement removes dbsale and dbsupplier database by using data definition language (DDL)?","options":[{"label":"A","text":"DROP DATABASE dbSale, dbsupplier"},{"label":"B","text":"DROP DATABASE dbSale and dbsupplier"},{"label":"C","text":"DROP DATABASE dbSale; dbsupplier"},{"label":"D","text":"DROP DATABASE dbSale + dbsupplier"}],"answer":"A","note":"A","key_point":"Use DROP DATABASE followed by comma-separated database names to delete multiple databases.","why_correct":"Lệnh DROP DATABASE cho phép xóa một hoặc nhiều database bằng cách liệt kê tên chúng cách nhau bằng dấu phẩy.","why_wrong":[{"label":"B","why":"Sai cú pháp vì dùng từ \u0027and\u0027."},{"label":"C","why":"Sai cú pháp vì dấu chấm phẩy kết thúc lệnh quá sớm trước tên database thứ hai."},{"label":"D","why":"Sai cú pháp vì dùng toán tử cộng (+) không hợp lệ trong câu lệnh DROP."}],"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh SQL dùng để định nghĩa cấu trúc dữ liệu như CREATE, DROP, ALTER."},{"word":"DROP DATABASE","reading":"","meaning":"Câu lệnh SQL dùng để xóa hoàn toàn một database có sẵn."}]},{"id":87,"slide":87,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which of the following belongs to DDL (data definition language)?","options":[{"label":"A","text":"create, alter, drop"},{"label":"B","text":"Insert, update, delete, select"},{"label":"C","text":"Truncate, select, invoke"},{"label":"D","text":"Deny, create, drop"}],"answer":"A","note":"A\nGiải thích: CREATE, ALTER, DROP thuộc nhóm DDL (Data Definition Language).","key_point":"DDL dùng để định nghĩa hoặc thay đổi cấu trúc của database schema.","why_correct":"CREATE, ALTER, và DROP là các lệnh dùng để tạo, sửa đổi, hoặc xóa các database objects như table, index, hoặc view.","why_wrong":[{"label":"B","why":"Đây là các lệnh DML (Data Manipulation Language) dùng để thao tác dữ liệu."},{"label":"C","why":"SELECT là lệnh DML, còn invoke không phải lệnh chuẩn của SQL."},{"label":"D","why":"DENY thuộc nhóm DCL (Data Control Language) dùng để quản lý quyền truy cập."}],"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, dùng để định nghĩa cấu trúc dữ liệu."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, dùng để truy vấn và thao tác dữ liệu."},{"word":"DCL","reading":"","meaning":"Data Control Language, dùng để quản lý quyền truy cập hệ thống."}]},{"id":88,"slide":88,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following methods fetch data from cursor to access data?","options":[{"label":"A","text":"First, last, next, prior, absolute, relative"},{"label":"B","text":"First, last, next"},{"label":"C","text":"First, last, next, prior"},{"label":"D","text":"First, absolute, relative"}],"answer":"A","note":"A","key_point":"Cursor fetch methods allow navigation through result sets using various positioning techniques.","why_correct":"Các phương thức First, last, next, prior, absolute, và relative là tập hợp đầy đủ các lệnh điều hướng để truy xuất dữ liệu từ một scrollable cursor.","why_wrong":[{"label":"B","why":"Thiếu các phương thức quan trọng như prior, absolute và relative."},{"label":"C","why":"Thiếu các phương thức định vị absolute và relative."},{"label":"D","why":"Thiếu các phương thức cơ bản như last, next và prior."}],"vocab":[{"word":"Cursor","reading":"","meaning":"Một cấu trúc điều khiển dùng để duyệt qua các hàng trong tập kết quả truy vấn."},{"word":"Scrollable cursor","reading":"","meaning":"Loại cursor cho phép di chuyển tiến và lùi trong tập kết quả."}]},{"id":89,"slide":89,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"Choose the correct statement that belongs to DML.","options":[{"label":"A","text":"SELECT, DELETE, INSERT"},{"label":"B","text":"CREATE, UPDATE, SELECT"},{"label":"C","text":"TRUNCAT, DELETE, UPDATE"},{"label":"D","text":"UPDATE, DELETE, ALTER"}],"answer":"A","note":"A","key_point":"DML (Data Manipulation Language) dùng để truy vấn và thao tác dữ liệu trong bảng.","why_correct":"SELECT, DELETE, và INSERT là các lệnh chuẩn thuộc nhóm DML vì chúng tác động trực tiếp lên dữ liệu (rows) trong database.","why_wrong":[{"label":"B","why":"CREATE là lệnh DDL (Data Definition Language) dùng để định nghĩa cấu trúc bảng."},{"label":"C","why":"TRUNCATE là lệnh DDL vì nó reset cấu trúc bảng và không ghi log từng dòng."},{"label":"D","why":"ALTER là lệnh DDL dùng để thay đổi cấu trúc (schema) của bảng."}],"vocab":[{"word":"DML","reading":"","meaning":"Ngôn ngữ thao tác dữ liệu dùng để truy vấn, thêm, sửa, xóa dữ liệu."},{"word":"DDL","reading":"","meaning":"Ngôn ngữ định nghĩa dữ liệu dùng để tạo, thay đổi, xóa cấu trúc bảng."}]},{"id":90,"slide":90,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"The transaction methods is used with the Connection object to save or cancel changes made to the data source.","options":[{"label":"A","text":"Begin Transaction , Rollback Transaction"},{"label":"B","text":"Begin Transaction , Commit Transaction"},{"label":"C","text":"Begin Transaction , Commit Transaction , Rollback Transaction"},{"label":"D","text":"Commit Transaction , Rollback Transaction"}],"answer":"C","note":"C","key_point":"Transaction control requires starting, saving (commit), and cancelling (rollback) operations.","why_correct":"Một transaction hoàn chỉnh cần Begin để bắt đầu, Commit để lưu vĩnh viễn các thay đổi và Rollback để hoàn tác khi có lỗi.","why_wrong":[{"label":"A","why":"Thiếu Commit để lưu thay đổi vào database."},{"label":"B","why":"Thiếu Rollback để xử lý khi transaction thất bại."},{"label":"D","why":"Thiếu Begin Transaction để khởi tạo phiên làm việc."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Một chuỗi các thao tác được thực hiện như một đơn vị logic duy nhất."},{"word":"Commit","reading":"","meaning":"Xác nhận và lưu vĩnh viễn các thay đổi của transaction vào database."},{"word":"Rollback","reading":"","meaning":"Hoàn tác các thay đổi, đưa database về trạng thái trước khi transaction bắt đầu."}]},{"id":91,"slide":91,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"The ACID Properties of transactions refer to","options":[{"label":"A","text":"Atomicity , consistency , isolation , database"},{"label":"B","text":"Atomicity , consistency , isolation , durability"},{"label":"C","text":"Atomicity , consistency , inconsistent , durability"},{"label":"D","text":"Atomicity , concurrency , isolation , durability"}],"answer":"B","note":"B","key_point":"ACID là bốn thuộc tính đảm bảo tính toàn vẹn của transaction trong database.","why_correct":"ACID là viết tắt của Atomicity (tính nguyên tử), Consistency (tính nhất quán), Isolation (tính cô lập) và Durability (tính bền vững).","why_wrong":[{"label":"A","why":"Sai vì \u0027database\u0027 không phải là một thuộc tính của ACID."},{"label":"C","why":"Sai vì \u0027inconsistent\u0027 trái ngược với tính chất nhất quán của transaction."},{"label":"D","why":"Sai vì \u0027concurrency\u0027 là vấn đề cần giải quyết, không phải thuộc tính ACID."}],"vocab":[{"word":"ACID","reading":"","meaning":"Tập hợp các thuộc tính đảm bảo giao dịch được xử lý tin cậy."},{"word":"Transaction","reading":"","meaning":"Một đơn vị công việc logic thực hiện trên database."}]},{"id":92,"slide":92,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"What are the ACID properties of DBMS Transactions?","options":[{"label":"A","text":"Atomicity, Consistency, Isolation, Durability"},{"label":"B","text":"Atomicity, Consistency, Interpolate, Database"},{"label":"C","text":"Atomicity, Consistency, Inconsistent, Durability"},{"label":"D","text":"Automatic, Concurrent, Inconsistent, Deadlock-freedom"}],"answer":"A","note":"A","key_point":"ACID là bốn thuộc tính đảm bảo tính toàn vẹn của Transaction trong DBMS.","why_correct":"ACID là viết tắt của Atomicity (tính nguyên tử), Consistency (tính nhất quán), Isolation (tính cô lập) và Durability (tính bền vững). Đây là các tiêu chuẩn bắt buộc để đảm bảo giao dịch được thực hiện an toàn.","why_wrong":[{"label":"B","why":"Interpolate và Database không phải là các thuộc tính của giao dịch."},{"label":"C","why":"Inconsistent (không nhất quán) là trạng thái cần tránh, không phải thuộc tính."},{"label":"D","why":"Các từ này mô tả các khái niệm rời rạc, không phải bộ thuộc tính ACID chuẩn."}],"vocab":[{"word":"Atomicity","reading":"","meaning":"Giao dịch thực hiện toàn bộ hoặc không thực hiện gì cả."},{"word":"Consistency","reading":"","meaning":"Giao dịch đưa database từ trạng thái hợp lệ này sang trạng thái hợp lệ khác."},{"word":"Isolation","reading":"","meaning":"Các giao dịch đồng thời không được làm ảnh hưởng lẫn nhau."},{"word":"Durability","reading":"","meaning":"Dữ liệu đã commit phải được lưu trữ vĩnh viễn ngay cả khi hệ thống lỗi."}]},{"id":93,"slide":93,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"The predicate in a where clause can involve Boolean operations such as and. The result of true and unknown is _____ false and unknown is _____ while unknown and unknown is _____.","options":[{"label":"A","text":"Unknown, unknown, false"},{"label":"B","text":"True, false, unknown"},{"label":"C","text":"True, unknown, unknown"},{"label":"D","text":"Unknown, false, unknown"}],"answer":"D","note":"D","key_point":"Three-valued logic (True, False, Unknown) tuân theo quy tắc logic của SQL.","why_correct":"Trong SQL, phép AND với Unknown tuân theo quy tắc: True AND Unknown = Unknown, False AND Unknown = False, và Unknown AND Unknown = Unknown.","why_wrong":[{"label":"A","why":"Sai kết quả của True AND Unknown."},{"label":"B","why":"Sai kết quả của True AND Unknown và False AND Unknown."},{"label":"C","why":"Sai kết quả của True AND Unknown và False AND Unknown."}],"vocab":[{"word":"Three-valued logic","reading":"","meaning":"Hệ thống logic bao gồm ba giá trị: True, False và Unknown (thường do NULL)."},{"word":"Predicate","reading":"","meaning":"Biểu thức điều kiện trả về giá trị logic trong mệnh đề WHERE."}]},{"id":94,"slide":94,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In which objects can Transaction be used?","options":[{"label":"A","text":"View, User-defined function"},{"label":"B","text":"User-defined function, Store Procedure"},{"label":"C","text":"Store Procedure, Trigger, View"},{"label":"D","text":"User-defined function, Store Procedure, Trigger"},{"label":"E","text":"All of the mentioned answers are wrong"}],"answer":"E","note":"E","key_point":"Transaction không thể sử dụng trực tiếp bên trong View, Trigger hoặc User-defined function.","why_correct":"Transaction chỉ được phép sử dụng trong các batch script hoặc Stored Procedure, không áp dụng cho các đối tượng như View, Trigger hay User-defined function do các hạn chế về side-effect.","why_wrong":[{"label":"A","why":"View và User-defined function không hỗ trợ Transaction."},{"label":"B","why":"User-defined function không hỗ trợ Transaction."},{"label":"C","why":"View và Trigger không hỗ trợ Transaction."},{"label":"D","why":"User-defined function và Trigger không hỗ trợ Transaction."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Một đơn vị công việc logic bao gồm một hoặc nhiều thao tác trên database."},{"word":"Stored Procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ để thực thi lại nhiều lần."},{"word":"Trigger","reading":"","meaning":"Một loại stored procedure đặc biệt tự động thực thi khi có sự kiện thay đổi dữ liệu."}]},{"id":95,"slide":95,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"In SQL query, choose the correct statement about the order of execution.","options":[{"label":"A","text":"SELECT - FROM - WHERE - GROUP BY - HAVING - ORDER BY"},{"label":"B","text":"SELECT - FROM - GROUP BY - WHERE - HAVING - ORDER BY"},{"label":"C","text":"SELECT - FROM - HAVING - GROUP BY - WHERE - ORDER BY"},{"label":"D","text":"SELECT - FROM - OREDER BY - WHERE - HAVING - GROUP BY"}],"answer":"A","note":"A","key_point":"Thứ tự thực thi các mệnh đề trong SQL query là cố định và quan trọng để hiểu kết quả.","why_correct":"Thứ tự thực thi đúng là FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. Đầu tiên, FROM xác định các bảng. Sau đó, WHERE lọc các hàng riêng lẻ. Tiếp theo, GROUP BY nhóm các hàng, và HAVING lọc các nhóm. Cuối cùng, SELECT chọn các cột và ORDER BY sắp xếp kết quả.","why_wrong":[{"label":"B","why":"WHERE phải thực thi trước GROUP BY để lọc các hàng riêng lẻ trước khi chúng được nhóm lại."},{"label":"C","why":"HAVING phải thực thi sau GROUP BY vì nó lọc các nhóm, không phải các hàng riêng lẻ. WHERE cũng phải trước GROUP BY."},{"label":"D","why":"ORDER BY luôn là mệnh đề cuối cùng được thực thi để sắp xếp kết quả cuối cùng. Các mệnh đề khác cũng sai thứ tự."}],"vocab":[{"word":"SELECT clause","reading":"","meaning":"Mệnh đề chọn các cột để hiển thị trong kết quả."},{"word":"FROM clause","reading":"","meaning":"Mệnh đề chỉ định các bảng dữ liệu sẽ được truy vấn."},{"word":"WHERE clause","reading":"","meaning":"Mệnh đề lọc các hàng dựa trên một điều kiện cụ thể."},{"word":"GROUP BY clause","reading":"","meaning":"Mệnh đề nhóm các hàng có giá trị giống nhau trong một hoặc nhiều cột thành các nhóm tóm tắt."},{"word":"HAVING clause","reading":"","meaning":"Mệnh đề lọc các nhóm được tạo bởi GROUP BY dựa trên một điều kiện tổng hợp."},{"word":"ORDER BY clause","reading":"","meaning":"Mệnh đề sắp xếp các hàng trong tập kết quả theo thứ tự tăng dần hoặc giảm dần."}]},{"id":96,"slide":96,"section":"Mô hình ER","prompt":"","setup":"","stem":"In SQL, ERD use three types of principle elements to form relationships:","options":[{"label":"A","text":"Entity sets, Constraints and Relationships"},{"label":"B","text":"Attributes, Constraints, and Relationships"},{"label":"C","text":"Entity sets, Attributes, and Relationships"},{"label":"D","text":"Entity sets, Attributes and Constraints"}],"answer":"C","note":"C","key_point":"Mô hình ERD dựa trên 3 thành phần chính: Entity sets, Attributes và Relationships.","why_correct":"Mô hình ER (Entity-Relationship) được cấu thành từ ba yếu tố cơ bản nhất là Entity sets (tập thực thể), Attributes (thuộc tính của thực thể) và Relationships (mối quan hệ giữa các thực thể).","why_wrong":[{"label":"A","why":"Constraints (ràng buộc) không phải là thành phần cốt lõi cấu tạo nên mô hình ER."},{"label":"B","why":"Constraints là các quy tắc dữ liệu chứ không phải yếu tố cấu trúc chính của mô hình ER."},{"label":"D","why":"Thiếu Relationships, thành phần bắt buộc để thể hiện sự liên kết giữa các thực thể."}],"vocab":[{"word":"Entity set","reading":"","meaning":"Tập thực thể, đại diện cho tập hợp các đối tượng cùng loại"},{"word":"Attribute","reading":"","meaning":"Thuộc tính mô tả đặc điểm của đối tượng"},{"word":"Relationship","reading":"","meaning":"Mối quan hệ kết nối giữa các thực thể"}]},{"id":97,"slide":97,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In SQL, what does the acronym ACID stand for concerning transactions?","options":[{"label":"A","text":"Atomicity, Consistency, Isolation, Durability"},{"label":"B","text":"Association, Concurrency, Integrity, Database"},{"label":"C","text":"Aggregate, Criteria, Index, Delete"},{"label":"D","text":"All Columns, Insertion, Deletion"}],"answer":"A","note":"A","key_point":"ACID stand for Atomicity, Consistency, Isolation, và Durability trong transaction.","why_correct":"Đây là 4 tính chất cốt lõi đảm bảo tính toàn vẹn và độ tin cậy của transaction trong cơ sở dữ liệu. Atomicity đảm bảo thực hiện toàn bộ hoặc không gì cả, Consistency giữ dữ liệu hợp lệ, Isolation ngăn chặn nhiễu giữa các transaction đồng thời, và Durability đảm bảo dữ liệu không bị mất khi đã commit.","why_wrong":[{"label":"B","why":"Nhầm lẫn với các khái niệm tổng quát không phải tên chuẩn của ACID."},{"label":"C","why":"Chứa các thuật ngữ SQL thông thường nhưng không liên quan đến định nghĩa transaction."},{"label":"D","why":"Định nghĩa sai lệch hoàn toàn về mặt lý thuyết cơ sở dữ liệu."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác được coi là một đơn vị công việc logic duy nhất."},{"word":"Atomicity","reading":"","meaning":"Tính nguyên tử: Tất cả các thao tác trong transaction phải cùng thành công hoặc cùng thất bại."},{"word":"Consistency","reading":"","meaning":"Tính nhất quán: Transaction đưa cơ sở dữ liệu từ trạng thái hợp lệ này sang trạng thái hợp lệ khác."},{"word":"Durability","reading":"","meaning":"Tính bền vững: Dữ liệu đã commit sẽ được lưu trữ vĩnh viễn ngay cả khi hệ thống sập."}]},{"id":99,"slide":99,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"What is the result of a CROSS JOIN in SQL?","options":[{"label":"A","text":"Union of tables"},{"label":"B","text":"Intersection of tables"},{"label":"C","text":"Cartesian product"},{"label":"D","text":"Natural join"}],"answer":"C","note":"C","key_point":"CROSS JOIN trong SQL tạo ra Cartesian product giữa hai tables.","why_correct":"CROSS JOIN kết hợp từng row của table thứ nhất với mọi row của table thứ hai, tạo thành Cartesian product.","why_wrong":[{"label":"A","why":"Union là phép toán tập hợp gộp các rows lại, không phải CROSS JOIN."},{"label":"B","why":"Intersection chỉ lấy các rows chung giữa hai tables."},{"label":"D","why":"Natural join tự động join dựa trên các cột có tên trùng nhau."}],"vocab":[{"word":"CROSS JOIN","reading":"","meaning":"Phép tích Descartes kết hợp mọi row của hai tables."},{"word":"Cartesian product","reading":"","meaning":"Tích Descartes của hai tập hợp hoặc tables."}]},{"id":100,"slide":100,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"________ has a right side that is a subset of its left side","options":[{"label":"A","text":"A trivial FD"},{"label":"B","text":"A non_trivial FD"},{"label":"C","text":"A key of relation"},{"label":"D","text":"A super key of relation"}],"answer":"A","note":"A | trivial functional dependency (FD) is one in which the right side (dependent attribute) is a subset of the left side (determinant attribute).","key_point":"A trivial functional dependency (FD) has a right-hand side that is a subset of its left-hand side.","why_correct":"Theo định nghĩa chuẩn, một functional dependency dạng X -\u003e Y là trivial FD khi tập thuộc tính Y nằm trong hoặc bằng tập thuộc tính X.","why_wrong":[{"label":"B","why":"Non-trivial FD có vế phải không phải là tập con của vế trái."},{"label":"C","why":"Key là một tập thuộc tính tối thiểu xác định duy nhất mọi tuple trong relation."},{"label":"D","why":"Super key là tập thuộc tính xác định duy nhất mọi tuple nhưng không nhất thiết phải tối thiểu."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các tập thuộc tính trong relation."},{"word":"trivial FD","reading":"","meaning":"Phụ thuộc hàm hiển nhiên với vế phải là tập con của vế trái."}]},{"id":101,"slide":101,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"__________ is a set of one or more attributes taken collectively to uniquely identify a record.","options":[{"label":"A","text":"Primary Key"},{"label":"B","text":"Foreign key"},{"label":"C","text":"Super key"},{"label":"D","text":"Candidate key"}],"answer":"C","note":"C","key_point":"Super key là tập hợp một hoặc nhiều attribute giúp uniquely identify một tuple.","why_correct":"Super key là khái niệm tổng quát nhất bao gồm mọi tập attribute có khả năng xác định duy nhất một record trong relation.","why_wrong":[{"label":"A","why":"Primary key là một candidate key được chọn để định danh tuple, không phải tập tổng quát."},{"label":"B","why":"Foreign key dùng để liên kết giữa các table chứ không dùng để identify record."},{"label":"D","why":"Candidate key là super key tối thiểu (không chứa thừa attribute nào)."}],"vocab":[{"word":"Super key","reading":"","meaning":"Tập hợp một hoặc nhiều attribute xác định duy nhất một record."},{"word":"Candidate key","reading":"","meaning":"Super key tối thiểu không chứa tập con dư thừa."},{"word":"Primary key","reading":"","meaning":"Candidate key được chọn làm khóa chính của relation."},{"word":"Foreign key","reading":"","meaning":"Attribute tham chiếu đến primary key của table khác."}]},{"id":102,"slide":102,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"__________ has a right side that is a subset of its left side","options":[{"label":"A","text":"A trivial FD"},{"label":"B","text":"A non_trivial FD"},{"label":"C","text":"A key of relation"},{"label":"D","text":"A super key of relation"}],"answer":"A","note":"A","key_point":"A trivial functional dependency has the right side as a subset of the left side.","why_correct":"Theo định nghĩa, một functional dependency dạng X -\u003e Y là trivial khi tập thuộc tính Y nằm trong hoặc bằng tập thuộc tính X.","why_wrong":[{"label":"B","why":"Non-trivial FD có vế phải không phải là tập con của vế trái."},{"label":"C","why":"Key của relation là tập thuộc tính xác định duy nhất mọi thuộc tính, không phải định nghĩa của trivial FD."},{"label":"D","why":"Super key là tập thuộc tính chứa ít nhất một key, không liên quan trực tiếp đến định nghĩa trivial FD."}],"vocab":[{"word":"functional dependency","reading":"","meaning":"Phụ thuộc hàm giữa các tập thuộc tính trong relation"},{"word":"trivial FD","reading":"","meaning":"Phụ thuộc hàm tầm thường có vế phải là tập con của vế trái"}]},{"id":103,"slide":103,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"_________ returns a relation instance containing all tuples that occur in both R and S","options":[{"label":"A","text":"Intersection"},{"label":"B","text":"Set-difference"},{"label":"C","text":"Union"},{"label":"D","text":"Cross-product"}],"answer":"A","note":"A","key_point":"Phép toán Intersection trả về các tuple xuất hiện ở cả hai relation R và S.","why_correct":"Phép Intersection (giao) chỉ giữ lại những tuple có mặt đồng thời trong cả hai relation R và S.","why_wrong":[{"label":"B","why":"Set-difference trả về các tuple chỉ có trong R mà không có trong S."},{"label":"C","why":"Union trả về tập hợp tất cả các tuple từ cả R lẫn S."},{"label":"D","why":"Cross-product kết hợp mọi tuple của R với mọi tuple của S."}],"vocab":[{"word":"Intersection","reading":"","meaning":"Phép giao giữa hai relation."},{"word":"Tuple","reading":"","meaning":"Một dòng (hàng) trong relation."}]},{"id":104,"slide":104,"section":"Mô hình ER","prompt":"","setup":"","stem":"_________ Real-world thing, distinguishable from other objects, in ERD","options":[{"label":"A","text":"Entity"},{"label":"B","text":"Diagram"},{"label":"C","text":"Relationship"},{"label":"D","text":"Primary entity"}],"answer":"A","note":"A","key_point":"Entity là một đối tượng thực tế trong thế giới thực, có thể phân biệt với các đối tượng khác.","why_correct":"Trong ERD, khái niệm \u0027Real-world thing, distinguishable from other objects\u0027 định nghĩa chính xác về một Entity (Thực thể).","why_wrong":[{"label":"B","why":"Diagram là mô hình tổng thể, không phải là đối tượng đơn lẻ."},{"label":"C","why":"Relationship là mối quan hệ giữa các entities."},{"label":"D","why":"Primary entity không phải là thuật ngữ chuẩn trong ER model."}],"vocab":[{"word":"Entity","reading":"","meaning":"Thực thể, một đối tượng có thật trong thế giới thực."},{"word":"Relationship","reading":"","meaning":"Mối quan hệ giữa các entities trong ER model."}]},{"id":105,"slide":105,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"(Choose 1 answer)\n_________ is a set of one or more attributes taken collectively to uniquely identify a record.","options":[{"label":"A","text":"Primary Key"},{"label":"B","text":"Foreign key"},{"label":"C","text":"Super key"},{"label":"D","text":"Candidate key"}],"answer":"C","note":"C","key_point":"Super key là tập hợp một hoặc nhiều attribute giúp định danh duy nhất một tuple.","why_correct":"Super key bao gồm bất kỳ tập hợp attribute nào có tính năng phân biệt duy nhất các tuple trong relation, là định nghĩa tổng quát nhất.","why_wrong":[{"label":"A","why":"Primary key là một Super key được chọn lọc và tối thiểu."},{"label":"B","why":"Foreign key dùng để liên kết giữa các table chứ không dùng để định danh record."},{"label":"D","why":"Candidate key là Super key tối thiểu, không chứa tập con dư thừa."}],"vocab":[{"word":"Super key","reading":"","meaning":"Tập hợp một hoặc nhiều attribute xác định duy nhất một tuple."},{"word":"Candidate key","reading":"","meaning":"Super key tối thiểu không chứa tập con nào có tính chất xác định duy nhất."}]},{"id":106,"slide":106,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"__________ A variable is local, and its value is not preserved by the DBMS after a run-ning of the function or procedure.","options":[{"label":"A","text":"DECLARE"},{"label":"B","text":"RETURN"},{"label":"C","text":"CALL"},{"label":"D","text":"EXEC"}],"answer":"A","note":"A","key_point":"DECLARE được dùng để khai báo biến cục bộ trong phạm vi khối lệnh.","why_correct":"Biến được khai báo bằng DECLARE chỉ tồn tại trong phạm vi của stored procedure hoặc function và sẽ bị hủy sau khi thực thi xong.","why_wrong":[{"label":"B","why":"RETURN dùng để trả về giá trị từ hàm."},{"label":"C","why":"CALL dùng để gọi thực thi một procedure."},{"label":"D","why":"EXEC là lệnh viết tắt của EXECUTE để chạy procedure hoặc dynamic SQL."}],"vocab":[{"word":"DECLARE","reading":"","meaning":"Lệnh khai báo biến hoặc con trỏ trong SQL."},{"word":"Local variable","reading":"","meaning":"Biến chỉ có hiệu lực trong phạm vi khối lệnh được khai báo."}]},{"id":107,"slide":107,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"A __________ is a stored program that is attached to a table or a view.","options":[{"label":"A","text":"pseudofile"},{"label":"B","text":"embedded SELECT statement"},{"label":"C","text":"trigger"},{"label":"D","text":"None of the mentioned is correct."}],"answer":"C","note":"C","key_point":"Trigger là stored program tự động thực thi khi có sự kiện trên table/view.","why_correct":"Trigger được định nghĩa để tự động kích hoạt (fire) khi các thao tác DML như INSERT, UPDATE, hoặc DELETE xảy ra trên một table hoặc view cụ thể.","why_wrong":[{"label":"A","why":"Pseudofile không phải là khái niệm chuẩn trong database để chỉ stored program."},{"label":"B","why":"Embedded SELECT statement là câu lệnh truy vấn nằm trong code ứng dụng, không phải là đối tượng lưu trữ trong database."}],"vocab":[{"word":"Trigger","reading":"","meaning":"Một đoạn code tự động thực thi khi một sự kiện cụ thể xảy ra trên bảng."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, bao gồm các lệnh INSERT, UPDATE, DELETE."}]},{"id":108,"slide":108,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What is an SQL virtual table that is constructed from other tables?","options":[{"label":"A","text":"Just another table"},{"label":"B","text":"A view"},{"label":"C","text":"A relation"},{"label":"D","text":"Query results"}],"answer":"B","note":"B","key_point":"View là một virtual table được định nghĩa bởi một câu lệnh SELECT.","why_correct":"View không lưu trữ dữ liệu vật lý mà chỉ lưu trữ định nghĩa truy vấn, nó được tính toán động khi truy vấn.","why_wrong":[{"label":"A","why":"Table thông thường lưu trữ dữ liệu vật lý trên đĩa."},{"label":"C","why":"Relation là khái niệm lý thuyết trong Relational Model, không phải đối tượng SQL cụ thể."},{"label":"D","why":"Query results là tập kết quả tạm thời, không phải là một đối tượng schema được lưu trữ."}],"vocab":[{"word":"View","reading":"","meaning":"Bảng ảo được tạo ra từ kết quả của một câu lệnh truy vấn."},{"word":"Virtual table","reading":"","meaning":"Bảng không chứa dữ liệu thực mà chỉ là kết quả truy vấn được lưu dưới dạng cấu trúc."}]},{"id":109,"slide":109,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"What is the full form of DBMS?","options":[{"label":"A","text":"Data of Binary Management System"},{"label":"B","text":"Database Management System"},{"label":"C","text":"Database Management Service"},{"label":"D","text":"Data Backup Management System"}],"answer":"B","note":"B","key_point":"DBMS là viết tắt của Database Management System.","why_correct":"Đây là định nghĩa chuẩn xác nhất về phần mềm quản lý cơ sở dữ liệu.","why_wrong":[{"label":"A","why":"Sai thuật ngữ, không liên quan đến Binary."},{"label":"C","why":"Sai từ Service, DBMS là một hệ thống quản lý chứ không phải dịch vụ."},{"label":"D","why":"Sai từ Backup, đây chỉ là một chức năng nhỏ, không phải bản chất của DBMS."}],"vocab":{"word":"DBMS","reading":"","meaning":"Phần mềm quản lý, lưu trữ và truy xuất dữ liệu trong Database."}},{"id":110,"slide":110,"section":"Mô hình ER","prompt":"","setup":"","stem":"What is the relationship between a weak entity set and its owner entity in an E/R diagram?","options":[{"label":"A","text":"One-to-one relationship."},{"label":"B","text":"Many-to-many relationship."},{"label":"C","text":"Many-to-one relationship."},{"label":"D","text":"One-to-many relationship."}],"answer":"C","note":"C","key_point":"Weak entity set luôn có Many-to-one relationship với owner entity set.","why_correct":"Một weak entity phụ thuộc vào owner entity để tồn tại. Nhiều weak entity có thể cùng thuộc về một owner entity duy nhất, tạo thành quan hệ Many-to-one.","why_wrong":[{"label":"A","why":"Sai vì một owner entity thường có nhiều weak entity liên kết."},{"label":"B","why":"Sai vì weak entity không thể có nhiều owner entity cùng lúc."},{"label":"D","why":"Sai vì đây là chiều ngược lại, không phản ánh đúng sự phụ thuộc của weak entity."}],"vocab":[{"word":"Weak entity set","reading":"","meaning":"Entity set không có primary key riêng, phụ thuộc vào owner entity."},{"word":"Owner entity","reading":"","meaning":"Entity set cung cấp các thuộc tính để định danh cho weak entity."}]},{"id":111,"slide":111,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"What is information?","options":[{"label":"A","text":"A collection of unprocessed data"},{"label":"B","text":"A collection of processed data"},{"label":"C","text":"A collection of processed information"},{"label":"D","text":"A collection of unprocessed information"}],"answer":"B","note":"B","key_point":"Information là kết quả của việc xử lý data để có ý nghĩa.","why_correct":"Information được tạo ra khi data thô được xử lý, sắp xếp hoặc phân tích để trở nên có ý nghĩa đối với người dùng.","why_wrong":[{"label":"A","why":"Đây là định nghĩa của data thô (raw data)."},{"label":"C","why":"Định nghĩa này bị lặp từ và không chính xác về mặt logic."},{"label":"D","why":"Thông tin không thể là tập hợp của chính nó ở dạng chưa xử lý."}],"vocab":[{"word":"Data","reading":"","meaning":"Các sự kiện, con số hoặc ký hiệu thô chưa qua xử lý."},{"word":"Information","reading":"","meaning":"Dữ liệu đã được xử lý để mang lại giá trị và ý nghĩa."}]},{"id":112,"slide":112,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"What is the purpose of data normalization in the context of the database design?","options":[{"label":"A","text":"Ensure data security"},{"label":"B","text":"Avoid information anomalies"},{"label":"C","text":"Make sure data is inherited"},{"label":"D","text":"Ensuring better data storage"}],"answer":"B","note":"B","key_point":"Normalization giúp giảm thiểu data redundancy và ngăn chặn các loại update anomalies.","why_correct":"Mục tiêu chính của normalization là tổ chức lại schema để loại bỏ các dependency không cần thiết, từ đó tránh các lỗi như insertion, deletion, và update anomalies.","why_wrong":[{"label":"A","why":"Security được quản lý qua access control, không phải normalization."},{"label":"C","why":"Inheritance là khái niệm trong Object-Oriented, không liên quan đến relational database design."},{"label":"D","why":"Normalization thường làm tăng số lượng table, có thể làm giảm hiệu suất lưu trữ thay vì tối ưu nó."}],"vocab":[{"word":"Normalization","reading":"","meaning":"Quá trình thiết kế database để giảm thiểu redundancy và đảm bảo data integrity."},{"word":"Anomalies","reading":"","meaning":"Các lỗi phát sinh khi thao tác dữ liệu do cấu trúc bảng không hợp lý."},{"word":"Redundancy","reading":"","meaning":"Sự dư thừa dữ liệu khi cùng một thông tin bị lặp lại nhiều lần."}]},{"id":113,"slide":113,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"What does an RDBMS consist of?","options":[{"label":"A","text":"Collection of Tables"},{"label":"B","text":"Collection of Records"},{"label":"C","text":"Collection of Keys"},{"label":"D","text":"Collection of Fields"}],"answer":"A","note":"A","key_point":"RDBMS là hệ quản trị cơ sở dữ liệu dựa trên mô hình quan hệ (Tables).","why_correct":"RDBMS lưu trữ dữ liệu dưới dạng các Tables (quan hệ), nơi các hàng và cột tạo thành cấu trúc logic để quản lý dữ liệu.","why_wrong":[{"label":"B","why":"Records chỉ là các hàng đơn lẻ bên trong một Table."},{"label":"C","why":"Keys là công cụ để định danh hoặc liên kết, không phải là thành phần cấu tạo chính."},{"label":"D","why":"Fields chỉ là các cột (thuộc tính) cấu thành nên một Table."}],"vocab":[{"word":"RDBMS","reading":"","meaning":"Hệ quản trị cơ sở dữ liệu quan hệ."},{"word":"Table","reading":"","meaning":"Cấu trúc dữ liệu gồm hàng và cột trong mô hình quan hệ."}]},{"id":114,"slide":114,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"What data type is best suited for Vietnamese name? (in SQL Server)","options":[{"label":"A","text":"Varchar(30)"},{"label":"B","text":"Nvarchar(30)"},{"label":"C","text":"Text(30)"},{"label":"D","text":"Char(30)"}],"answer":"B","note":"B","key_point":"Use Nvarchar cho các chuỗi chứa ký tự tiếng Việt có dấu.","why_correct":"Nvarchar hỗ trợ bảng mã Unicode, cho phép lưu trữ chính xác các ký tự tiếng Việt có dấu mà không bị lỗi font.","why_wrong":[{"label":"A","why":"Varchar chỉ lưu được ký tự ASCII, gây mất dấu tiếng Việt."},{"label":"C","why":"Text là kiểu dữ liệu cũ và không nhận độ dài (30) như vậy."},{"label":"D","why":"Char là kiểu dữ liệu fix-length, tốn bộ nhớ và không hỗ trợ Unicode."}],"vocab":[{"word":"Nvarchar","reading":"","meaning":"Kiểu dữ liệu chuỗi có độ dài thay đổi hỗ trợ Unicode."},{"word":"Varchar","reading":"","meaning":"Kiểu dữ liệu chuỗi có độ dài thay đổi không hỗ trợ Unicode."}]},{"id":115,"slide":115,"section":"Mô hình ER","prompt":"","setup":"","stem":"What type of attribute in an ER diagram is represented with a dashed oval?","options":[{"label":"A","text":"Multivalued attribute"},{"label":"B","text":"Derived attribute"},{"label":"C","text":"Composite attribute"},{"label":"D","text":"Primary attribute"}],"answer":"B","note":"B","key_point":"Derived attribute được biểu diễn bằng hình oval nét đứt trong ER diagram.","why_correct":"Derived attribute là thuộc tính có giá trị được tính toán từ các thuộc tính khác, không lưu trữ trực tiếp trong database.","why_wrong":[{"label":"A","why":"Multivalued attribute được biểu diễn bằng hình oval nét đôi."},{"label":"C","why":"Composite attribute được biểu diễn bằng hình oval phân nhánh."},{"label":"D","why":"Primary attribute (thường là Primary key) được biểu diễn bằng hình oval có gạch chân."}],"vocab":[{"word":"Derived attribute","reading":"","meaning":"Thuộc tính có giá trị suy ra từ các thuộc tính khác."},{"word":"Multivalued attribute","reading":"","meaning":"Thuộc tính có thể chứa nhiều giá trị cho một thực thể."},{"word":"Composite attribute","reading":"","meaning":"Thuộc tính có thể chia nhỏ thành các thành phần con."}]},{"id":116,"slide":116,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"What data structure will be represented for the hierarchical data model?","options":[{"label":"A","text":"Array structure"},{"label":"B","text":"Table structure"},{"label":"C","text":"Tree structure"},{"label":"D","text":"Pointers structure"}],"answer":"C","note":"C / The data structure commonly used in a Hierarchical model is a tree structure.","key_point":"Hierarchical model sử dụng cấu trúc Tree để biểu diễn mối quan hệ dữ liệu.","why_correct":"Mô hình Hierarchical tổ chức dữ liệu theo phân cấp, trong đó mỗi record có một parent và có thể có nhiều child, tạo thành cấu trúc Tree.","why_wrong":[{"label":"A","why":"Array là cấu trúc lưu trữ tuyến tính, không thể hiện được quan hệ phân cấp."},{"label":"B","why":"Table là cấu trúc đặc trưng của Relational model."},{"label":"D","why":"Pointers là cơ chế cài đặt bên dưới, không phải là mô hình dữ liệu logic."}],"vocab":[{"word":"Hierarchical model","reading":"","meaning":"Mô hình dữ liệu phân cấp tổ chức thông tin theo dạng cây."},{"word":"Tree structure","reading":"","meaning":"Cấu trúc dữ liệu phân cấp gồm các node có quan hệ parent-child."}]},{"id":117,"slide":117,"section":"Mô hình ER","prompt":"","setup":"","stem":"Which of the following is known as a set of entities of the same type that share same properties, or attributes?","options":[{"label":"A","text":"Relation set"},{"label":"B","text":"Tuples"},{"label":"C","text":"Entity set"},{"label":"D","text":"Entity Relation model"}],"answer":"C","note":"C | set of entites","key_point":"Entity set là tập hợp các entity cùng loại và có chung các attribute.","why_correct":"Trong ER model, entity set bao gồm các đối tượng (entity) có cùng bản chất và chia sẻ chung danh sách đặc tính (attribute). Ví dụ: tập hợp tất cả nhân viên tạo thành entity set Employee.","why_wrong":[{"label":"A","why":"Không phải thuật ngữ chuẩn trong ER model (thuật ngữ đúng là relationship set)."},{"label":"B","why":"Tuple chỉ đại diện cho một dòng dữ liệu đơn lẻ trong cơ sở dữ liệu quan hệ."},{"label":"D","why":"Entity Relation model là tên mô hình khái niệm chung chứ không phải là một tập hợp thực thể."}],"vocab":[{"word":"Entity set","reading":"","meaning":"Tập hợp thực thể cùng kiểu"},{"word":"Attribute","reading":"","meaning":"Thuộc tính của thực thể"},{"word":"Tuple","reading":"","meaning":"Một bộ dữ liệu (hàng) trong bảng"}]},{"id":118,"slide":118,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Which SQL statement is used to remove an existing index from a table?","options":[{"label":"A","text":"DROP INDEX"},{"label":"B","text":"REMOVE INDEX"},{"label":"C","text":"DELETE INDEX"},{"label":"D","text":"UNINDEX TABLE"}],"answer":"A","note":"A","key_point":"Su dung lenh DROP INDEX de xoa bo mot index khoi table.","why_correct":"Trong SQL, cau lenh DROP INDEX duoc su dung dung cu phap de xoa mot index da ton tai trong database.","why_wrong":[{"label":"B","why":"Tu khoa REMOVE khong duoc su dung cho index trong SQL."},{"label":"C","why":"Tu khoa DELETE dung de xoa du lieu (tuple/row), khong dung cho index."},{"label":"D","why":"UNINDEX TABLE khong phai la cu phap hop le trong SQL."}],"vocab":{"word":"DROP INDEX","reading":"","meaning":"Lenh SQL dung de xoa bo mot index khoi schema."}},{"id":119,"slide":119,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"(Choose 1 answer)Which of the following is not a typical trigger action?","options":[{"label":"A","text":"Insert"},{"label":"B","text":"Select"},{"label":"C","text":"Update"},{"label":"D","text":"Delete"}],"answer":"B","note":"B","key_point":"Trigger chỉ được kích hoạt bởi các câu lệnh thay đổi dữ liệu: Insert, Update, Delete.","why_correct":"Lựa chọn B (Select) đúng vì Select chỉ đọc dữ liệu và không làm thay đổi state của database, nên không thể dùng làm trigger action.","why_wrong":[{"label":"A","why":"Insert là một trigger action phổ biến khi thêm dòng mới."},{"label":"C","why":"Update là một trigger action phổ biến khi sửa dữ liệu."},{"label":"D","why":"Delete là một trigger action phổ biến khi xóa dữ liệu."}],"vocab":{"word":"Trigger","reading":"","meaning":"Đoạn mã tự động thực thi trong database khi có sự kiện Insert, Update hoặc Delete xảy ra."}},{"id":120,"slide":120,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which of the following makes the transaction permanent in the database?","options":[{"label":"A","text":"View"},{"label":"B","text":"Commit"},{"label":"C","text":"Rollback"},{"label":"D","text":"Flashback"}],"answer":"B","note":"B","key_point":"Lệnh Commit lưu trữ vĩnh viễn mọi thay đổi của transaction vào database.","why_correct":"Sau khi thực thi các thao tác DML, lệnh Commit chính thức xác nhận và lưu các thay đổi đó vĩnh viễn vào database, không thể hoàn tác.","why_wrong":[{"label":"A","why":"View là một bảng ảo dùng để lưu câu lệnh SELECT chứ không lưu transaction."},{"label":"C","why":"Rollback dùng để hủy bỏ các thay đổi và đưa database về trạng thái trước đó."},{"label":"D","why":"Flashback là tính năng khôi phục dữ liệu về một thời điểm trong quá khứ."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực thi như một đơn vị duy nhất."},{"word":"Commit","reading":"","meaning":"Lệnh xác nhận và lưu vĩnh viễn các thay đổi của transaction."},{"word":"Rollback","reading":"","meaning":"Lệnh hủy bỏ các thay đổi chưa được commit trong transaction."}]},{"id":121,"slide":121,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following aggregate functions does not ignore nulls in its results?","options":[{"label":"A","text":"MIN"},{"label":"B","text":"MAX"},{"label":"C","text":"COUNT (*)"},{"label":"D","text":"COUNT"}],"answer":"C","note":"C","key_point":"COUNT(*) đếm tất cả các tuple trong bảng, bao gồm cả các tuple có giá trị NULL.","why_correct":"COUNT(*) đếm số lượng hàng trong bảng mà không kiểm tra giá trị của từng cột, do đó nó bao gồm cả các hàng có giá trị NULL.","why_wrong":[{"label":"A","why":"MIN bỏ qua các giá trị NULL khi tìm giá trị nhỏ nhất."},{"label":"B","why":"MAX bỏ qua các giá trị NULL khi tìm giá trị lớn nhất."},{"label":"D","why":"COUNT(column_name) chỉ đếm các giá trị khác NULL trong cột được chỉ định."}],"vocab":[{"word":"Aggregate functions","reading":"","meaning":"Các hàm tính toán trên một tập hợp giá trị để trả về một kết quả duy nhất."},{"word":"NULL","reading":"","meaning":"Giá trị đại diện cho dữ liệu bị thiếu hoặc không xác định trong database."}]},{"id":122,"slide":122,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which of the following makes the transaction permanent in the database?","options":[{"label":"A","text":"View"},{"label":"B","text":"Commit"},{"label":"C","text":"Rollback"},{"label":"D","text":"Flashback"}],"answer":"B","note":"B","key_point":"Lệnh Commit xác nhận và lưu vĩnh viễn mọi thay đổi của transaction vào database.","why_correct":"Commit là thao tác kết thúc transaction thành công, đảm bảo tính Durability trong ACID, khiến các thay đổi trở thành vĩnh viễn.","why_wrong":[{"label":"A","why":"View là bảng ảo dùng để truy vấn dữ liệu, không liên quan đến quản lý transaction."},{"label":"C","why":"Rollback dùng để hủy bỏ các thay đổi và đưa database về trạng thái trước khi transaction bắt đầu."},{"label":"D","why":"Flashback là tính năng khôi phục dữ liệu về một thời điểm trong quá khứ, không phải lệnh kết thúc transaction."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Một đơn vị công việc logic bao gồm chuỗi các thao tác trên database."},{"word":"Commit","reading":"","meaning":"Lệnh xác nhận lưu lại các thay đổi của transaction vào bộ nhớ vĩnh viễn."},{"word":"ACID","reading":"","meaning":"Bộ bốn thuộc tính (Atomicity, Consistency, Isolation, Durability) đảm bảo tính toàn vẹn của transaction."}]},{"id":123,"slide":123,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following best defines a database?","options":[{"label":"A","text":"A collection of unorganized files"},{"label":"B","text":"A program used to analyze data"},{"label":"C","text":"A structured collection of data"},{"label":"D","text":"A spreadsheet"}],"answer":"C","note":"C","key_point":"A database is a structured collection of data stored electronically.","why_correct":"Đáp án C chính xác vì database được định nghĩa chuẩn là một tập hợp dữ liệu có cấu trúc, được tổ chức để dễ dàng truy xuất và quản lý.","why_wrong":[{"label":"A","why":"Sai vì dữ liệu trong database có tổ chức rõ ràng chứ không phải unorganized files."},{"label":"B","why":"Sai vì đây là chức năng của phần mềm phân tích chứ không phải định nghĩa của database."},{"label":"D","why":"Sai vì spreadsheet là công cụ bảng tính dạng phẳng, khác với cấu trúc phức tạp của database."}],"vocab":[{"word":"database","reading":"","meaning":"Cơ sở dữ liệu, một tập hợp dữ liệu có cấu trúc."},{"word":"spreadsheet","reading":"","meaning":"Bảng tính (như Excel), không phải là hệ quản trị cơ sở dữ liệu."}]},{"id":124,"slide":124,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which of the commands below undoes the current transaction?","options":[{"label":"A","text":"SAVEPOINT"},{"label":"B","text":"ALTER"},{"label":"C","text":"ROLLBACK"},{"label":"D","text":"COMMIT"}],"answer":"C","note":"C","key_point":"ROLLBACK được dùng để hủy bỏ các thay đổi của transaction hiện tại.","why_correct":"Lệnh ROLLBACK hoàn tác mọi thao tác DML chưa được commit, đưa database về trạng thái trước khi transaction bắt đầu.","why_wrong":[{"label":"A","why":"SAVEPOINT chỉ tạo một điểm đánh dấu để rollback một phần."},{"label":"B","why":"ALTER là lệnh DDL dùng để thay đổi cấu trúc bảng."},{"label":"D","why":"COMMIT dùng để lưu vĩnh viễn các thay đổi của transaction."}],"vocab":[{"word":"Transaction","reading":"","meaning":"Một đơn vị công việc logic bao gồm một hoặc nhiều thao tác database."},{"word":"ROLLBACK","reading":"","meaning":"Lệnh hủy bỏ các thay đổi chưa được lưu trong transaction."},{"word":"COMMIT","reading":"","meaning":"Lệnh xác nhận và lưu vĩnh viễn các thay đổi của transaction."}]},{"id":125,"slide":125,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following is not a feature of DBMS?","options":[{"label":"A","text":"Minimum duplication of data"},{"label":"B","text":"Redundancy of data"},{"label":"C","text":"Single-user access only"},{"label":"D","text":"Support ACID Property"}],"answer":"C","note":"C","key_point":"DBMS hỗ trợ multi-user access thay vì chỉ cho phép single-user access.","why_correct":"Đáp án C đúng vì DBMS hiện đại được thiết kế để hỗ trợ nhiều người dùng truy cập đồng thời, do đó \u0027Single-user access only\u0027 không phải là tính năng của DBMS.","why_wrong":[{"label":"A","why":"DBMS giảm thiểu sự trùng lặp dữ liệu (Minimum duplication) thông qua việc normalization."},{"label":"B","why":"Redundancy of data được kiểm soát hoặc giảm thiểu trong hệ thống cơ sở dữ liệu."},{"label":"D","why":"DBMS hỗ trợ ACID property để đảm bảo tính toàn vẹn của transaction."}],"vocab":[{"word":"DBMS","reading":"","meaning":"Hệ quản trị cơ sở dữ liệu"},{"word":"ACID Property","reading":"","meaning":"Tính chất đảm bảo độ tin cậy của transaction gồm Atomicity, Consistency, Isolation, Durability"},{"word":"Redundancy","reading":"","meaning":"Sự dư thừa dữ liệu"}]},{"id":126,"slide":126,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which of the following operations cannot be used in relational algebra? Choose two answers","options":[{"label":"A","text":"Union"},{"label":"B","text":"Divide"},{"label":"C","text":"Select"},{"label":"D","text":"Loop"}],"answer":"BD","note":"BD","key_point":"Relational algebra does not include procedural control structures like loops.","why_correct":"Loop không phải là toán tử trong relational algebra vì relational algebra là ngôn ngữ khai báo tập hợp, không có vòng lặp thủ tục. Divide (Division) thực chất tồn tại trong cơ bản relational algebra.","why_wrong":[{"label":"A","why":"Union là một phép toán tập hợp cơ bản trong relational algebra."},{"label":"C","why":"Select (σ) là một trong các phép toán cơ bản của relational algebra."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Đại số quan hệ, hệ thống các phép toán hình thức trên quan hệ."},{"word":"Union","reading":"","meaning":"Phép hợp trong tập hợp và đại số quan hệ."},{"word":"Select","reading":"","meaning":"Phép chọn các tuple thỏa mãn điều kiện."}]},{"id":127,"slide":127,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"Which of the following is not a data model in the database?","options":[{"label":"A","text":"Conceptual data model"},{"label":"B","text":"Object-Oriented data model"},{"label":"C","text":"Network data model"},{"label":"D","text":"Hierarchical data model"}],"answer":"A","note":"A","key_point":"Conceptual model là mô hình trừu tượng cấp cao, không phải là database data model cụ thể.","why_correct":"Conceptual data model là cấp độ thiết kế trừu tượng (như ERD), không lưu trữ dữ liệu trực tiếp trong DBMS như các database data model thực tế.","why_wrong":[{"label":"B","why":"Object-Oriented data model là một data model hợp lệ trong database."},{"label":"C","why":"Network data model là một data model cổ điển hợp lệ trong database."},{"label":"D","why":"Hierarchical data model là một data model cổ điển hợp lệ trong database."}],"vocab":[{"word":"Conceptual data model","reading":"","meaning":"Mô hình dữ liệu khái niệm dùng để mô tả cấu trúc logic cấp cao của dữ liệu."},{"word":"Relational data model","reading":"","meaning":"Mô hình dữ liệu quan hệ dựa trên các bảng (tables)."}]},{"id":128,"slide":128,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"Which SQL command is used to undo changes made by a transaction?","options":[{"label":"A","text":"COMMIT"},{"label":"B","text":"ROLLBACK"},{"label":"C","text":"SAVEPOINT"},{"label":"D","text":"UNDO"}],"answer":"B","note":"B","key_point":"ROLLBACK command undos changes made by a transaction.","why_correct":"Câu lệnh ROLLBACK được dùng để hoàn tác (undo) các thay đổi chưa được lưu (commit) trong transaction hiện tại, đưa database về trạng thái trước đó.","why_wrong":[{"label":"A","why":"COMMIT dùng để lưu vĩnh viễn các thay đổi của transaction, không phải undo."},{"label":"C","why":"SAVEPOINT dùng để tạo một điểm mốc để rollback một phần, không phải toàn bộ transaction."},{"label":"D","why":"UNDO không phải là SQL command chuẩn cho việc này."}],"vocab":[{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác SQL được thực thi như một đơn vị logic duy nhất."},{"word":"ROLLBACK","reading":"","meaning":"Lệnh hoàn tác các thay đổi của transaction."},{"word":"COMMIT","reading":"","meaning":"Lệnh xác nhận và lưu vĩnh viễn các thay đổi của transaction."}]},{"id":129,"slide":129,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which SQL statement is used to declare a cursor?","options":[{"lab
