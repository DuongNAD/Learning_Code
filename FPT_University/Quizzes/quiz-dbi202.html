m Inner, Outer (Left/Right/Full) và Cross join.","why_correct":"Supper join không phải là một thuật ngữ chuẩn trong SQL, nó là một từ sai chính tả hoặc không tồn tại trong lý thuyết cơ sở dữ liệu.","why_wrong":[{"label":"A","why":"Inner join là loại join phổ biến nhất, chỉ lấy các hàng khớp điều kiện ở cả hai bảng."},{"label":"B","why":"Outer join (Left, Right, Full) lấy tất cả các hàng từ một hoặc cả hai bảng kể cả khi không khớp."},{"label":"C","why":"Cross join tạo ra Cartesian product của hai bảng."}],"vocab":[{"word":"Join","reading":"","meaning":"Phép toán kết hợp dữ liệu từ hai hoặc nhiều bảng dựa trên cột chung."},{"word":"Cartesian product","reading":"","meaning":"Phép toán kết hợp mọi hàng của bảng này với mọi hàng của bảng kia."}]},{"id":328,"slide":328,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which of the following is NOT true about an aggregate function?","options":[{"label":"A","text":"All aggregate functions are nondeterministic."},{"label":"B","text":"Performs a calculation on a set of values and returns a single value."},{"label":"C","text":"Aggregate functions COUNT(*) ignore null values."},{"label":"D","text":"Aggregate functions are often used with the GROUP BY clause of the SELECT statement."}],"answer":"A","note":"A","key_point":"Aggregate functions are deterministic and return a single value from a set.","why_correct":"Phát biểu A sai vì các aggregate function như SUM, AVG, COUNT là deterministic; với cùng một tập dữ liệu đầu vào, chúng luôn trả về cùng một kết quả.","why_wrong":[{"label":"B","why":"Đây là định nghĩa chính xác của aggregate function."},{"label":"C","why":"Đây là đặc điểm kỹ thuật của COUNT(*), nó đếm cả các tuple có giá trị NULL."},{"label":"D","why":"GROUP BY thường được dùng để chia nhóm dữ liệu trước khi áp dụng aggregate function."}],"vocab":[{"word":"Aggregate function","reading":"","meaning":"Hàm tính toán trên một tập hợp các giá trị để trả về một kết quả duy nhất."},{"word":"Deterministic","reading":"","meaning":"Tính chất hàm luôn trả về cùng một kết quả với cùng một đầu vào."}]},{"id":329,"slide":329,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which one of the following is not true for a view?","options":[{"label":"A","text":"View never contains derived columns."},{"label":"B","text":"A view definition is permanently stored as part of the database."},{"label":"C","text":"View is a virtual table."},{"label":"D","text":"View is derived from other tables."}],"answer":"A","note":"A","key_point":"View là virtual table, định nghĩa được lưu trữ nhưng dữ liệu không lưu vật lý.","why_correct":"View hoàn toàn có thể chứa derived columns (cột tính toán) thông qua các biểu thức như SUM, AVG hoặc phép toán số học trong câu lệnh SELECT.","why_wrong":[{"label":"B","why":"Định nghĩa của view (câu lệnh CREATE VIEW) được lưu trong Data Dictionary."},{"label":"C","why":"Đây là định nghĩa chính xác của view, nó không lưu trữ dữ liệu thực tế."},{"label":"D","why":"View được tạo ra dựa trên kết quả truy vấn từ các base tables hoặc các view khác."}],"vocab":[{"word":"View","reading":"","meaning":"Bảng ảo được tạo từ kết quả của một câu lệnh truy vấn."},{"word":"Derived column","reading":"","meaning":"Cột không lưu trữ trực tiếp mà được tính toán từ các cột khác."},{"word":"Virtual table","reading":"","meaning":"Bảng không tồn tại vật lý, chỉ tồn tại dưới dạng định nghĩa truy vấn."}]},{"id":330,"slide":330,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"What is NOT true about the cursor in SQL?","options":[{"label":"A","text":"It is considered the best practice to use when we want insert, update, or delete data in a table of SQL Server."},{"label":"B","text":"The cursor allows users to process data from a result set, one row at a time."},{"label":"C","text":"Cursors are an alternative to commands, which operate on all rows in a result set at the same time."},{"label":"D","text":"Unlike commands, cursors can be used to update data on a row-by-row basis."}],"answer":"A","note":"A","key_point":"Cursor xử lý từng dòng (row-by-row) và không phải là best practice trong SQL.","why_correct":"Sử dụng Cursor để thao tác dữ liệu (DML) là phản tác dụng vì SQL được tối ưu hóa cho các tập hợp (set-based operations). Dùng lệnh set-based luôn nhanh và hiệu quả hơn nhiều so với Cursor.","why_wrong":[{"label":"B","why":"Đây là định nghĩa chính xác về chức năng của Cursor."},{"label":"C","why":"Đúng, Cursor là giải pháp thay thế khi cần xử lý logic phức tạp từng dòng thay vì set-based."},{"label":"D","why":"Đúng, Cursor cho phép cập nhật dữ liệu trên từng dòng cụ thể trong khi các lệnh SQL thông thường tác động lên toàn bộ tập kết quả."}],"vocab":[{"word":"Cursor","reading":"","meaning":"Đối tượng trong SQL dùng để duyệt và xử lý dữ liệu từng dòng một."},{"word":"Set-based","reading":"","meaning":"Cách tiếp cận xử lý dữ liệu theo tập hợp thay vì từng dòng."}]},{"id":331,"slide":331,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"What is not the purpose of the index in MS-SQL Server?","options":[{"label":"A","text":"To use less hardware resources"},{"label":"B","text":"To enhance the query performance"},{"label":"C","text":"To provide an index to a record"},{"label":"D","text":"To perform fast in searching"}],"answer":"A","note":"A","key_point":"Index giúp tăng tốc độ truy vấn nhưng tiêu tốn thêm tài nguyên lưu trữ.","why_correct":"Index không giúp tiết kiệm tài nguyên phần cứng; ngược lại, nó chiếm thêm dung lượng ổ đĩa và bộ nhớ để lưu cấu trúc B-tree.","why_wrong":[{"label":"B","why":"Đây là mục đích chính của index để giảm thời gian thực thi câu lệnh SELECT."},{"label":"C","why":"Index cung cấp cơ chế truy cập trực tiếp đến các record dựa trên giá trị khóa."},{"label":"D","why":"Tìm kiếm nhanh là lợi ích cốt lõi của việc sử dụng cấu trúc dữ liệu index."}],"vocab":[{"word":"Index","reading":"","meaning":"Cấu trúc dữ liệu hỗ trợ tìm kiếm và truy xuất dữ liệu nhanh chóng."},{"word":"B-tree","reading":"","meaning":"Cấu trúc cây cân bằng thường dùng để cài đặt index trong SQL Server."}]},{"id":332,"slide":332,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which one of the following is not true for a view?","options":[{"label":"A","text":"View never contains derived columns."},{"label":"B","text":"A view definition is permanently stored as part of the database."},{"label":"C","text":"View is a virtual table."},{"label":"D","text":"View is derived from other tables."}],"answer":"A","note":"A","key_point":"View là virtual table, định nghĩa được lưu trữ nhưng dữ liệu không lưu vật lý.","why_correct":"View hoàn toàn có thể chứa các derived columns (cột tính toán) thông qua các biểu thức như SUM, AVG hoặc phép toán số học trong câu lệnh SELECT.","why_wrong":[{"label":"B","why":"Định nghĩa (metadata) của view thực sự được lưu trong system catalog của database."},{"label":"C","why":"Đây là định nghĩa chuẩn của view, nó không lưu trữ dữ liệu thực tế."},{"label":"D","why":"View được tạo ra dựa trên kết quả truy vấn từ các base tables hoặc các view khác."}],"vocab":[{"word":"View","reading":"","meaning":"Bảng ảo được tạo ra từ kết quả của một câu lệnh truy vấn."},{"word":"Derived column","reading":"","meaning":"Cột không tồn tại trực tiếp trong bảng mà được tính toán từ các cột khác."},{"word":"Base table","reading":"","meaning":"Bảng thực tế lưu trữ dữ liệu trong database."}]},{"id":333,"slide":333,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which operation is not part of basic relational algebra?","options":[{"label":"A","text":"Projection"},{"label":"B","text":"Join"},{"label":"C","text":"Sorting"},{"label":"D","text":"Selection"}],"answer":"C","note":"C","key_point":"Sorting is not a basic relational algebra operation.","why_correct":"Các phép toán cơ bản của relational algebra gồm Selection, Projection, Cartesian product, Union, Set difference và Renaming. Sorting không nằm trong số đó vì relational algebra xử lý các tập hợp (sets) không có thứ tự.","why_wrong":[{"label":"A","why":"Projection (Π) là phép toán cơ bản dùng để chọn các cột."},{"label":"B","why":"Join (⋈) được xây dựng từ Cartesian product và Selection, là phép toán dẫn xuất quan trọng."},{"label":"D","why":"Selection (σ) là phép toán cơ bản dùng để lọc các tuple theo điều kiện."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Đại số quan hệ, hệ thống các phép toán thao tác trên quan hệ."},{"word":"Projection","reading":"","meaning":"Phép chiếu lấy ra các cột cụ thể trong bảng."},{"word":"Selection","reading":"","meaning":"Phép chọn lọc các tuple thỏa mãn điều kiện."}]},{"id":334,"slide":334,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"(Choose 1 answer) Which of the following is NOT a standard aggregation operator?","options":[{"label":"A","text":"Sum"},{"label":"B","text":"Max"},{"label":"C","text":"Count"},{"label":"D","text":"Group"}],"answer":"D","note":"D","key_point":"Aggregation operator dùng để tính toán trên tập hợp dữ liệu như Sum, Max, Count, Avg.","why_correct":"Group (GROUP BY) là mệnh đề dùng để gom nhóm các hàng, không phải là một aggregation operator trả về giá trị gộp.","why_wrong":[{"label":"A","why":"Sum là aggregation operator tính tổng."},{"label":"B","why":"Max là aggregation operator tìm giá trị lớn nhất."},{"label":"C","why":"Count là aggregation operator đếm số lượng tuple."}],"vocab":{"word":"aggregation operator","reading":"","meaning":"Hàm tổng hợp dùng để tính toán trên nhiều hàng dữ liệu."}},{"id":335,"slide":335,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which of the following is NOT the binary operation in the relational Algebra?","options":[{"label":"A","text":"Project"},{"label":"B","text":"Cartesian product"},{"label":"C","text":"Union"},{"label":"D","text":"Set difference"}],"answer":"A","note":"A project dùng trong phép toán đơn phân","key_point":"Project là phép toán đơn phân (unary operation) trong relational algebra.","why_correct":"Phép Project (Π) chỉ thao tác trên một relation duy nhất để lọc ra các cột, do đó nó không phải là binary operation.","why_wrong":[{"label":"B","why":"Cartesian product kết hợp hai relation, là một binary operation."},{"label":"C","why":"Union thực hiện trên hai relation tương thích, là một binary operation."},{"label":"D","why":"Set difference thao tác trên hai relation, là một binary operation."}],"vocab":[{"word":"Project","reading":"","meaning":"Phép toán một ngôi trong relational algebra dùng để chọn các cột."},{"word":"Cartesian product","reading":"","meaning":"Phép nhân Descartes kết hợp tất cả các tuple của hai relation."}]},{"id":336,"slide":336,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"In SQL, a view is a virtual table based on the result-set of an SQL statement. Which statement is not correct about view?","options":[{"label":"A","text":"The UPDATE command is applicable to all views."},{"label":"B","text":"The fields in a view are fields from one or more real tables in the database."},{"label":"C","text":"The database engine recreates the view, every time a user queries it."},{"label":"D","text":"A view always shows up-to-date data."}],"answer":"A","note":"A","key_point":"View là virtual table và không phải view nào cũng hỗ trợ câu lệnh UPDATE.","why_correct":"Đáp án A không chính xác vì không phải mọi view đều có thể thực hiện lệnh UPDATE (ví dụ view chứa hàm aggregate, GROUP BY, DISTINCT, hoặc join phức tạp). Do đó đây là phát biểu sai về view.","why_wrong":[{"label":"B","why":"Đúng vì các field trong view lấy từ một hoặc nhiều real tables."},{"label":"C","why":"Đúng vì standard view được database engine tính toán lại mỗi khi có query gọi đến."},{"label":"D","why":"Đúng vì view luôn truy vấn dữ liệu mới nhất từ các real tables bên dưới."}],"vocab":[{"word":"view","reading":"","meaning":"Bảng ảo lưu trữ định nghĩa câu lệnh SQL chứ không lưu dữ liệu vật lý."},{"word":"virtual table","reading":"","meaning":"Bảng ảo xuất hiện kết quả giống bảng thật nhưng dựa trên query."}]},{"id":338,"slide":338,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"The predicate in a where clause can involve Boolean operations such as and. The result of true and unknown is _____, false and unknown is _____, while unknown and unknown is _____.","options":[{"label":"A","text":"Unknown, unknown, false"},{"label":"B","text":"True, false, unknown"},{"label":"C","text":"True, unknown, unknown"},{"label":"D","text":"Unknown, false, unknown"}],"answer":"D","note":"D","key_point":"Three-valued logic trong SQL xử lý các giá trị unknown với toán tử Boolean.","why_correct":"Theo bảng chân trị ba giá trị (Three-valued logic), true and unknown cho ra unknown, false and unknown cho ra false, và unknown and unknown cho ra unknown.","why_wrong":[{"label":"A","why":"Sai kết quả của phép toán true and unknown."},{"label":"B","why":"Sai toàn bộ các trường hợp trong bảng chân trị."},{"label":"C","why":"Sai kết quả của phép toán false and unknown."}],"vocab":[{"word":"Three-valued logic","reading":"","meaning":"Hệ logic ba giá trị bao gồm true, false và unknown trong SQL."},{"word":"predicate","reading":"","meaning":"Điều kiện lọc trong mệnh đề WHERE."}]},{"id":339,"slide":339,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"A table can be in 3NF but not in 1NF.","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"B","note":"B","key_point":"Mọi relation ở 3NF đều phải thỏa mãn 1NF trước tiên.","why_correct":"Theo định nghĩa của normalization, 1NF là điều kiện tiên quyết cơ bản nhất. Một table bắt buộc phải đạt 1NF rồi mới có thể tiến lên các chuẩn cao hơn như 2NF và 3NF.","why_wrong":{"label":"A","why":"Sai vì thứ tự các dạng chuẩn là tiến dần từ 1NF lên 3NF, không thể bỏ qua 1NF."},"vocab":[{"word":"normalization","reading":"","meaning":"Quá trình chuẩn hóa cơ sở dữ liệu."},{"word":"1NF","reading":"","meaning":"Dạng chuẩn 1, yêu cầu các giá trị trong table phải là atomic."},{"word":"3NF","reading":"","meaning":"Dạng chuẩn 3, loại bỏ các transitive dependency."}]},{"id":340,"slide":340,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"A database administrator: a person or persons responsible for the struc-ture or schema of the database.","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"A","note":"A","key_point":"Database Administrator chịu trách nhiệm quản lý cấu trúc và schema của database.","why_correct":"Database Administrator (DBA) là người giữ vai trò quản trị hệ thống cơ sở dữ liệu, bao gồm thiết kế và duy trì structure cũng như schema.","why_wrong":{"label":"B","why":"Sai vì phát biểu trên hoàn toàn đúng với định nghĩa về vai trò của DBA trong hệ thống."},"vocab":[{"word":"Database Administrator","reading":"","meaning":"Người quản trị cơ sở dữ liệu."},{"word":"schema","reading":"","meaning":"Lược đồ cơ sở dữ liệu."}]},{"id":341,"slide":341,"section":"Mô hình ER","prompt":"","setup":"Relationships in the E/R model are also represented by relations.\nThe relation for a given relationship R has the following attributes:\nIf the relationship has attributes, then these are also attributes of relation R.","stem":"","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"A","note":"A","key_point":"Mối quan hệ (relationship) trong E/R model được biểu diễn thành một relation với các attribute tương ứng.","why_correct":"Trong chuyển đổi E/R model sang relational schema, các relationship set cũng được ánh xạ thành các relation chứa các primary key của các entity tham gia và các attribute riêng của relationship đó.","why_wrong":{"label":"B","why":"Sai vì theo quy tắc ánh xạ E/R model, relationship cũng được biểu diễn dưới dạng relation."},"vocab":[{"word":"relationship","reading":"","meaning":"Mối quan hệ giữa các entity trong E/R model."},{"word":"relation","reading":"","meaning":"Bảng dữ liệu trong relational model."}]},{"id":342,"slide":342,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Triggers are stored blocks of code that have to be called in order to operate.","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"B","note":"B","key_point":"Triggers tự động thực thi khi một sự kiện (event) cụ thể xảy ra.","why_correct":"Triggers không cần gọi thủ công; chúng được hệ thống tự động kích hoạt (fire) khi có các thao tác DML như INSERT, UPDATE, hoặc DELETE trên bảng.","why_wrong":{"label":"A","why":"Sai vì triggers không phải là stored procedures hay functions cần gọi tên để chạy."},"vocab":[{"word":"Trigger","reading":"","meaning":"Đoạn mã tự động thực thi trong database khi có sự kiện thay đổi dữ liệu."},{"word":"DML","reading":"","meaning":"Data Manipulation Language, bao gồm các lệnh INSERT, UPDATE, DELETE."}]},{"id":343,"slide":343,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which of the following statement/s is/are TRUE?\n\n(1) A column with FOREIGN key constraint does not allow duplicate values.\n(2) A FOREIGN key constraint can be defined to refer to columns with the UNIQUE constraint in another table.","options":[{"label":"A","text":"Both the statements are True."},{"label":"B","text":"Both the statements are False."},{"label":"C","text":"Only statement 1 is True."},{"label":"D","text":"Only statement 2 is True."}],"answer":"D","note":"D","key_point":"FOREIGN KEY tham chiếu đến PRIMARY KEY hoặc cột có UNIQUE constraint.","why_correct":"FOREIGN KEY cho phép giá trị trùng lặp trong chính bảng chứa nó, miễn là giá trị đó tồn tại trong cột được tham chiếu (PRIMARY KEY hoặc UNIQUE) ở bảng khác.","why_wrong":[{"label":"1","why":"FOREIGN KEY không yêu cầu giá trị là duy nhất, nó chỉ đảm bảo tính toàn vẹn tham chiếu."},{"label":"A","why":"Sai vì mệnh đề 1 không đúng."},{"label":"B","why":"Sai vì mệnh đề 2 là đúng."},{"label":"C","why":"Sai vì mệnh đề 1 sai và mệnh đề 2 đúng."}],"vocab":[{"word":"FOREIGN KEY","reading":"","meaning":"Ràng buộc đảm bảo giá trị trong cột phải tồn tại trong bảng tham chiếu."},{"word":"UNIQUE constraint","reading":"","meaning":"Ràng buộc đảm bảo mọi giá trị trong cột là duy nhất, không trùng lặp."}]},{"id":345,"slide":345,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"The Isolation property in transactions ensures that:","options":[{"label":"A","text":"Each transaction is encrypted"},{"label":"B","text":"No two transactions run concurrently"},{"label":"C","text":"Transactions do not interfere with each other"},{"label":"D","text":"Only one user accesses the system"}],"answer":"C","note":"C","key_point":"Isolation đảm bảo các transaction thực thi độc lập, không ảnh hưởng lẫn nhau.","why_correct":"Isolation là một trong bốn thuộc tính ACID, đảm bảo rằng kết quả của các transaction chạy đồng thời giống như khi chúng chạy tuần tự.","why_wrong":[{"label":"A","why":"Encryption thuộc về bảo mật, không phải thuộc tính ACID của transaction."},{"label":"B","why":"Isolation cho phép chạy đồng thời (concurrency) nhưng vẫn đảm bảo tính độc lập."},{"label":"D","why":"Hệ thống vẫn hỗ trợ nhiều người dùng, Isolation chỉ quản lý sự can thiệp giữa các transaction."}],"vocab":[{"word":"Isolation","reading":"","meaning":"Thuộc tính đảm bảo các transaction thực thi tách biệt, không thấy dữ liệu trung gian của nhau."},{"word":"ACID","reading":"","meaning":"Tập hợp các thuộc tính (Atomicity, Consistency, Isolation, Durability) đảm bảo tính toàn vẹn của transaction."},{"word":"Concurrency","reading":"","meaning":"Khả năng thực thi nhiều transaction cùng một lúc trên hệ thống."}]},{"id":346,"slide":346,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which syntax is commonly used for the rename operation in Relational Algebra?","options":[{"label":"A","text":"RENAME relation TO new_relation"},{"label":"B","text":"RENAME attribute IN relation TO new_attribute"},{"label":"C","text":"ALTER TABLE relation RENAME TO new_relation"},{"label":"D","text":"SELECT * FROM relation AS new_relation"}],"answer":"A","note":"A","key_point":"Toán tử Rename (ρ) dùng để đổi tên relation hoặc các attribute trong Relational Algebra.","why_correct":"Trong lý thuyết Relational Algebra, toán tử ρ (rho) được sử dụng để đổi tên một relation hoặc các attribute của nó, thường được viết dưới dạng ρ_{new_name}(R).","why_wrong":[{"label":"B","why":"Đây là mô tả chức năng đổi tên attribute, không phải cú pháp tổng quát cho toán tử Rename."},{"label":"C","why":"Đây là câu lệnh DDL trong SQL, không phải cú pháp của Relational Algebra."},{"label":"D","why":"Đây là cú pháp truy vấn SQL, không thuộc về Relational Algebra."}],"vocab":[{"word":"Relational Algebra","reading":"","meaning":"Ngôn ngữ truy vấn hình thức dựa trên tập hợp dùng để thao tác dữ liệu."},{"word":"Rename","reading":"","meaning":"Toán tử dùng để đặt tên mới cho một relation hoặc các attribute của nó."}]},{"id":347,"slide":347,"section":"Tổng quan DBMS","prompt":"","setup":"","stem":"Which of the following best defines a database?","options":[{"label":"A","text":"A collection of unorganized files"},{"label":"B","text":"A program used to analyze data"},{"label":"C","text":"A structured collection of data"},{"label":"D","text":"A spreadsheet"}],"answer":"C","note":"C","key_point":"Database là tập hợp dữ liệu có cấu trúc được tổ chức để truy xuất hiệu quả.","why_correct":"Database được định nghĩa là một tập hợp dữ liệu có cấu trúc, cho phép lưu trữ, quản lý và truy xuất thông tin một cách hệ thống.","why_wrong":[{"label":"A","why":"Dữ liệu trong database phải được tổ chức, không phải là các file rời rạc, không có cấu trúc."},{"label":"B","why":"Đây là chức năng của DBMS hoặc các công cụ phân tích, không phải định nghĩa của chính database."},{"label":"D","why":"Spreadsheet là công cụ lưu trữ dữ liệu đơn giản, không cung cấp đầy đủ các tính năng quản trị như một database thực thụ."}],"vocab":[{"word":"Database","reading":"","meaning":"Tập hợp dữ liệu có cấu trúc được lưu trữ trên máy tính."},{"word":"DBMS","reading":"","meaning":"Hệ quản trị cơ sở dữ liệu dùng để tương tác với database."}]},{"id":348,"slide":348,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which of the following operations cannot be used in relational algebra? Choose two answers","options":[{"label":"A","text":"Union"},{"label":"B","text":"Divide"},{"label":"C","text":"Select"},{"label":"D","text":"Loop"}],"answer":"BD","note":"BD","key_point":"Relational algebra bao gồm các phép toán tập hợp và quan hệ cơ bản.","why_correct":"Relational algebra là hệ thống các phép toán trên tập hợp (set-based), không hỗ trợ các cấu trúc điều khiển thủ tục như Loop. Phép Divide (chia) không phải là một phép toán cơ bản trong định nghĩa gốc của Codd, dù có thể biểu diễn qua các phép toán khác.","why_wrong":[{"label":"A","why":"Union là phép toán tập hợp cơ bản để gộp các tuple từ hai relation tương thích."},{"label":"C","why":"Select (σ) là phép toán cơ bản để lọc các tuple thỏa mãn điều kiện."}],"vocab":[{"word":"Relational algebra","reading":"","meaning":"Ngôn ngữ truy vấn hình thức dựa trên lý thuyết tập hợp."},{"word":"Tuple","reading":"","meaning":"Một hàng (row) trong bảng dữ liệu."},{"word":"Select","reading":"","meaning":"Phép toán σ dùng để lọc các hàng thỏa mãn điều kiện."}]},{"id":349,"slide":349,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which operation is not part of basic relational algebra?","options":[{"label":"A","text":"Projection"},{"label":"B","text":"Join"},{"label":"C","text":"Sorting"},{"label":"D","text":"Selection"}],"answer":"C","note":"C","key_point":"Sorting không phải là phép toán cơ bản trong relational algebra.","why_correct":"Relational algebra gồm 6 phép toán cơ bản: Selection, Projection, Cartesian product, Union, Set difference, và Renaming. Join là phép toán dẫn xuất.","why_wrong":[{"label":"A","why":"Projection là một trong các phép toán cơ bản để lọc các cột."},{"label":"B","why":"Join là phép toán dẫn xuất rất quan trọng được xây dựng từ Cartesian product và Selection."},{"label":"D","why":"Selection là phép toán cơ bản để lọc các tuple theo điều kiện."}],"vocab":[{"word":"relational algebra","reading":"","meaning":"Đại số quan hệ, hệ thống các phép toán thao tác trên quan hệ."},{"word":"Projection","reading":"","meaning":"Phép chiếu lấy ra các cột cụ thể."},{"word":"Selection","reading":"","meaning":"Phép chọn lọc các tuple thỏa mãn điều kiện."}]},{"id":350,"slide":350,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"Which SQL command is used to define a table schema?","options":[{"label":"A","text":"ALTER TABLE"},{"label":"B","text":"SELECT"},{"label":"C","text":"CREATE TABLE"},{"label":"D","text":"INSERT"}],"answer":"C","note":"C","key_point":"CREATE TABLE được dùng để định nghĩa cấu trúc (schema) của một bảng mới.","why_correct":"Lệnh CREATE TABLE khởi tạo một bảng mới trong database, bao gồm tên bảng, các column và kiểu dữ liệu (data type) của chúng.","why_wrong":[{"label":"A","why":"ALTER TABLE dùng để sửa đổi cấu trúc của bảng đã tồn tại."},{"label":"B","why":"SELECT dùng để truy vấn dữ liệu (DQL), không định nghĩa cấu trúc."},{"label":"D","why":"INSERT dùng để thêm dữ liệu (DML) vào bảng đã có."}],"vocab":[{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh dùng để định nghĩa cấu trúc database."},{"word":"Schema","reading":"","meaning":"Cấu trúc logic của database, bao gồm các bảng, cột và ràng buộc."}]},{"id":351,"slide":351,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"Which relational algebra operator removes attributes from a relation?","options":[{"label":"A","text":"Selection (σ)"},{"label":"B","text":"Projection (π)"},{"label":"C","text":"Join (⋈)"},{"label":"D","text":"Union (∪)"}],"answer":"B","note":"B","key_point":"Projection (π) được dùng để chọn các thuộc tính (cột) cụ thể từ một relation.","why_correct":"Phép toán Projection (π) thực hiện việc loại bỏ các cột không cần thiết và chỉ giữ lại các thuộc tính được chỉ định trong danh sách.","why_wrong":[{"label":"A","why":"Selection (σ) lọc các tuple (hàng) dựa trên điều kiện, không thay đổi số lượng cột."},{"label":"C","why":"Join (⋈) kết hợp các tuple từ hai relation, thường làm tăng số lượng thuộc tính."},{"label":"D","why":"Union (∪) kết hợp các tuple từ hai relation có cùng schema, không loại bỏ thuộc tính."}],"vocab":[{"word":"Projection","reading":"","meaning":"Phép toán chọn lọc các cột (thuộc tính) từ một bảng."},{"word":"Relation","reading":"","meaning":"Một bảng dữ liệu trong mô hình quan hệ."},{"word":"Tuple","reading":"","meaning":"Một hàng dữ liệu trong bảng."}]},{"id":352,"slide":352,"section":"Đại số quan hệ","prompt":"","setup":"","stem":"What is the purpose of the RENAME operation in relational algebra? Choose three answers","options":[{"label":"A","text":"To avoid ambiguity, especially when joining relations with the same attribute names."},{"label":"B","text":"To make query expressions clearer and easier to read."},{"label":"C","text":"To resolve naming conflicts in operations like UNION"},{"label":"D","text":"To search, indexing, and join tables quickly."}],"answer":"ABC","note":"ABC","key_point":"RENAME (ρ) thay đổi tên relation hoặc attribute để tránh xung đột và tăng tính rõ ràng.","why_correct":"RENAME giúp phân biệt các attribute trùng tên khi thực hiện join, làm biểu thức dễ đọc hơn và giải quyết xung đột tên trong các tập hợp như UNION.","why_wrong":{"label":"D","why":"RENAME là thao tác logic trên schema, không liên quan đến hiệu năng vật lý như indexing hay tìm kiếm."},"vocab":[{"word":"RENAME","reading":"","meaning":"Phép toán đổi tên relation hoặc attribute trong relational algebra."},{"word":"Relational Algebra","reading":"","meaning":"Ngôn ngữ truy vấn hình thức dựa trên các phép toán tập hợp."},{"word":"Attribute","reading":"","meaning":"Tên cột trong một relation."}]},{"id":353,"slide":353,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"In a student registration system, which normal form is violated if one field contains multiple course IDs for the same student?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"4NF"}],"answer":"A","note":"A","key_point":"1NF yêu cầu mọi thuộc tính phải chứa giá trị nguyên tử (atomic value).","why_correct":"1NF quy định mỗi ô trong bảng chỉ được chứa một giá trị duy nhất. Việc lưu nhiều course ID trong một field vi phạm tính nguyên tử của dữ liệu.","why_wrong":[{"label":"B","why":"2NF liên quan đến Partial Functional Dependency, chỉ xét sau khi đã đạt 1NF."},{"label":"C","why":"3NF liên quan đến Transitive Dependency, chỉ xét sau khi đã đạt 2NF."},{"label":"D","why":"4NF liên quan đến Multi-valued Dependency, chỉ xét sau khi đã đạt BCNF."}],"vocab":[{"word":"1NF","reading":"","meaning":"Dạng chuẩn 1, yêu cầu dữ liệu phải ở dạng bảng và các giá trị là nguyên tử."},{"word":"Atomic value","reading":"","meaning":"Giá trị không thể chia nhỏ hơn được nữa trong ngữ cảnh của thuộc tính đó."},{"word":"Normalization","reading":"","meaning":"Quá trình tổ chức dữ liệu để giảm thiểu dư thừa và tránh các bất thường."}]},{"id":354,"slide":354,"section":"Chuẩn hoá \u0026 phụ thuộc hàm","prompt":"","setup":"","stem":"Which normalization form eliminates transitive dependency?","options":[{"label":"A","text":"1NF"},{"label":"B","text":"2NF"},{"label":"C","text":"3NF"},{"label":"D","text":"BCNF"}],"answer":"C","note":"C","key_point":"3NF loại bỏ transitive dependency bằng cách yêu cầu mọi non-prime attribute phụ thuộc trực tiếp vào khóa.","why_correct":"3NF yêu cầu bảng phải đạt 2NF và không tồn tại transitive dependency, nghĩa là không có non-prime attribute nào phụ thuộc vào một non-prime attribute khác.","why_wrong":[{"label":"A","why":"1NF chỉ yêu cầu giá trị của các attribute là atomic."},{"label":"B","why":"2NF chỉ loại bỏ partial functional dependency."},{"label":"D","why":"BCNF là dạng chuẩn cao hơn, xử lý các trường hợp phụ thuộc vào candidate key mà 3NF chưa giải quyết hết."}],"vocab":[{"word":"transitive dependency","reading":"","meaning":"Sự phụ thuộc bắc cầu giữa các attribute trong một relation."},{"word":"non-prime attribute","reading":"","meaning":"Attribute không thuộc bất kỳ candidate key nào."}]},{"id":355,"slide":355,"section":"Mô hình ER","prompt":"","setup":"","stem":"What is the relationship between a weak entity set and its owner entity in an E/R diagram?","options":[{"label":"A","text":"One-to-one relationship."},{"label":"B","text":"Many-to-many relationship."},{"label":"C","text":"Many-to-one relationship."},{"label":"D","text":"One-to-many relationship."}],"answer":"C","note":"C","key_point":"Weak entity set luôn có quan hệ Many-to-one với owner entity set.","why_correct":"Mỗi weak entity chỉ thuộc về duy nhất một owner entity thông qua identifying relationship. Ngược lại, một owner entity có thể sở hữu nhiều weak entity.","why_wrong":[{"label":"A","why":"Sai vì một owner entity thường sở hữu nhiều weak entity."},{"label":"B","why":"Sai vì weak entity không thể liên kết với nhiều owner entity cùng lúc."},{"label":"D","why":"Sai vì đây là chiều ngược lại của mối quan hệ sở hữu."}],"vocab":[{"word":"Weak entity set","reading":"","meaning":"Thực thể không có primary key riêng, phụ thuộc vào owner entity."},{"word":"Owner entity","reading":"","meaning":"Thực thể mạnh chứa primary key dùng để định danh cho weak entity."},{"word":"Identifying relationship","reading":"","meaning":"Mối quan hệ liên kết weak entity với owner entity của nó."}]},{"id":356,"slide":356,"section":"Mô hình ER","prompt":"","setup":"","stem":"What type of attribute in an ER diagram is represented with a dashed oval?","options":[{"label":"A","text":"Multivalued attribute"},{"label":"B","text":"Derived attribute"},{"label":"C","text":"Composite attribute"},{"label":"D","text":"Primary attribute"}],"answer":"B","note":"B","key_point":"Derived attribute được biểu diễn bằng hình oval nét đứt trong ER diagram.","why_correct":"Derived attribute là thuộc tính có giá trị được tính toán từ các thuộc tính khác, không lưu trữ trực tiếp trong database.","why_wrong":[{"label":"A","why":"Multivalued attribute được biểu diễn bằng hình oval nét đôi."},{"label":"C","why":"Composite attribute được biểu diễn bằng các hình oval con nối với oval chính."},{"label":"D","why":"Primary attribute (thường là Primary key) được biểu diễn bằng hình oval có gạch chân."}],"vocab":[{"word":"Derived attribute","reading":"","meaning":"Thuộc tính có giá trị suy ra từ các thuộc tính khác."},{"word":"Multivalued attribute","reading":"","meaning":"Thuộc tính có thể chứa nhiều giá trị cho một thực thể."},{"word":"Composite attribute","reading":"","meaning":"Thuộc tính có thể chia nhỏ thành các thành phần đơn giản hơn."}]},{"id":357,"slide":357,"section":"Mô hình quan hệ \u0026 khoá","prompt":"","setup":"","stem":"There is a foreign-key F in Relation1 that references set of attributes G of Relation2. Suppose a tuple t of Relation1 has non-NULL values in all the attributes of F, call the list of t\u0027s values in these attributes t[F], then in Relation2 there must be some tuple that ______ with t[F] on the attributes G.","options":[{"label":"A","text":"agrees"},{"label":"B","text":"disagrees"},{"label":"C","text":"is not relative"},{"label":"D","text":"differs with"}],"answer":"A","note":"A","key_point":"Foreign key constraint yêu cầu giá trị của F trong Relation1 phải tồn tại trong Relation2.","why_correct":"Theo định nghĩa của foreign key, khi tuple t có giá trị non-NULL ở các thuộc tính F, bắt buộc phải có một tuple trong Relation2 chứa các giá trị trùng khớp (agree) tại tập thuộc tính G.","why_wrong":[{"label":"B","why":"Trái ngược với ràng buộc tham chiếu của foreign key."},{"label":"C","why":"Không phản ánh mối quan hệ giữa foreign key và primary key."},{"label":"D","why":"Sai về mặt ngữ nghĩa vì các giá trị phải khớp nhau thay vì khác biệt."}],"vocab":[{"word":"foreign key","reading":"","meaning":"Thuộc tính hoặc tập thuộc tính tham chiếu đến primary key của relation khác."},{"word":"tuple","reading":"","meaning":"Một dòng hoặc bản ghi trong relation."}]},{"id":358,"slide":358,"section":"DDL \u0026 ràng buộc","prompt":"","setup":"","stem":"In a relational database, which SQL command is used to modify the structure of an existing table?","options":[{"label":"A","text":"UPDATE"},{"label":"B","text":"ALTER"},{"label":"C","text":"MODIFY"},{"label":"D","text":"CHANGE"}],"answer":"B","note":"B","key_point":"Sử dụng ALTER để thay đổi cấu trúc của một table đã tồn tại.","why_correct":"Lệnh ALTER (thuộc DDL) được dùng để thêm, xóa hoặc sửa đổi các cột và ràng buộc trong một table schema hiện có.","why_wrong":[{"label":"A","why":"UPDATE là lệnh DML dùng để chỉnh sửa dữ liệu (tuples) bên trong table chứ không đổi cấu trúc."},{"label":"C","why":"MODIFY không phải là một SQL statement độc lập chuẩn để đổi cấu trúc table mà thường là mệnh đề đi kèm trong ALTER."},{"label":"D","why":"CHANGE không phải là lệnh chuẩn để thay đổi cấu trúc table trong ANSI SQL."}],"vocab":[{"word":"ALTER","reading":"","meaning":"Lệnh DDL dùng để thay đổi cấu trúc của một database object như table."},{"word":"DDL","reading":"","meaning":"Data Definition Language, nhóm lệnh dùng để định nghĩa cấu trúc dữ liệu."}]},{"id":359,"slide":359,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"The ORDER BY clause can only be used in cases _________","options":[{"label":"A","text":"GROUP BY queries"},{"label":"B","text":"SELECT queries"},{"label":"C","text":"HAVING queries"},{"label":"D","text":"None of the others"}],"answer":"B","note":"B","key_point":"ORDER BY clause được sử dụng trong các SELECT queries để sắp xếp kết quả trả về.","why_correct":"Mệnh đề ORDER BY luôn được gắn với một SELECT query để sắp xếp thứ tự hiển thị của các tuple kết quả.","why_wrong":[{"label":"A","why":"GROUP BY chỉ là một phần của SELECT query, không độc quyền dùng ORDER BY."},{"label":"C","why":"HAVING dùng để lọc nhóm trong GROUP BY chứ không bắt buộc đi kèm ORDER BY."},{"label":"D","why":"Sai vì đáp án B là chính xác."}],"vocab":[{"word":"ORDER BY","reading":"","meaning":"Mệnh đề dùng để sắp xếp kết quả truy vấn SQL theo thứ tự tăng hoặc giảm dần."},{"word":"SELECT query","reading":"","meaning":"Câu truy vấn chọn lọc dữ liệu trong cơ sở dữ liệu."}]},{"id":360,"slide":360,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"While executing a join operation between two tables, what type of join returns all rows from the left table and matched rows from the right table?","options":[{"label":"A","text":"Inner Join"},{"label":"B","text":"Right Join"},{"label":"C","text":"Full Outer Join"},{"label":"D","text":"Left Join"}],"answer":"D","note":"D","key_point":"Left Join trả về tất cả các hàng từ bảng bên trái và các hàng khớp từ bảng bên phải.","why_correct":"Left Join giữ lại toàn bộ các tuple từ bảng bên trái (left table). Nếu không tìm thấy dòng khớp ở bảng bên phải, các cột tương ứng sẽ nhận giá trị NULL.","why_wrong":[{"label":"A","why":"Chỉ trả về các hàng khớp ở cả hai bảng."},{"label":"B","why":"Trả về tất cả các hàng từ bảng bên phải và các hàng khớp từ bảng bên trái."},{"label":"C","why":"Trả về tất cả các hàng từ cả hai bảng."}],"vocab":[{"word":"Left Join","reading":"","meaning":"Phép kết nối giữ lại tất cả các hàng của bảng bên trái."},{"word":"Inner Join","reading":"","meaning":"Phép kết nối chỉ lấy các dòng khớp ở cả hai bảng."}]},{"id":361,"slide":361,"section":"Truy vấn SQL","prompt":"","setup":"","stem":"Which keyword is used in SQL to filter grouped results?","options":[{"label":"A","text":"WHERE"},{"label":"B","text":"TOP"},{"label":"C","text":"GROUP BY"},{"label":"D","text":"HAVING"}],"answer":"D","note":"D","key_point":"Dùng HAVING để lọc dữ liệu sau khi đã nhóm bằng GROUP BY.","why_correct":"Keyword HAVING được thiết kế để áp dụng điều kiện lọc trên các nhóm (aggregate results), trong khi WHERE chỉ lọc trên các tuple đơn lẻ trước khi nhóm.","why_wrong":[{"label":"A","why":"WHERE lọc tuple trước khi thực hiện GROUP BY."},{"label":"B","why":"TOP dùng để giới hạn số lượng dòng trả về trong kết quả."},{"label":"C","why":"GROUP BY dùng để nhóm các dòng có cùng giá trị, không dùng để lọc."}],"vocab":[{"word":"HAVING","reading":"","meaning":"Mệnh đề dùng để lọc các nhóm dữ liệu trong SQL."},{"word":"GROUP BY","reading":"","meaning":"Mệnh đề gom nhóm các dòng dữ liệu có chung giá trị."}]},{"id":362,"slide":362,"section":"Thêm, sửa, xoá dữ liệu","prompt":"","setup":"","stem":"Which statement best describes the DELETE command?","options":[{"label":"A","text":"Deletes all rows and cannot be rolled back"},{"label":"B","text":"Deletes the table structure and all its data"},{"label":"C","text":"Deletes specific rows and can be rolled back"},{"label":"D","text":"Deletes only columns that exists in DELETE command."}],"answer":"C","note":"C","key_point":"DELETE command removes specific tuples from a relation and supports rollback.","why_correct":"DELETE xóa các tuple cụ thể dựa trên điều kiện WHERE và là thao tác DML nên có thể được rollback.","why_wrong":[{"label":"A","why":"Nhầm lẫn với TRUNCATE hoặc cấu trúc DDL không thể rollback."},{"label":"B","why":"Đây là hành vi của câu lệnh DROP TABLE, xóa cả table schema."},{"label":"D","why":"DELETE xóa toàn bộ tuple (row), không xóa cột (column)."}],"vocab":[{"word":"DELETE","reading":"","meaning":"Lệnh DML dùng để xóa các tuple trong table."},{"word":"rollback","reading":"","meaning":"Thao tác hoàn tác các thay đổi chưa được commit."}]},{"id":363,"slide":363,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"In query optimization, why is it beneficial for the database engine to use indexes?","options":[{"label":"A","text":"To reduce table size"},{"label":"B","text":"To enforce foreign key constraints"},{"label":"C","text":"To speed up data retrieval"},{"label":"D","text":"To convert text to binary"}],"answer":"C","note":"C","key_point":"Indexes speed up data retrieval by avoiding full table scans.","why_correct":"An index creates a separate sorted data structure like a B-tree that allows the database engine to locate rows much faster.","why_wrong":[{"label":"A","why":"Indexes actually consume extra disk space, they do not reduce table size."},{"label":"B","why":"Foreign key constraints are enforced using constraints, not indexes."},{"label":"D","why":"Indexes do not perform data type conversion."}],"vocab":[{"word":"index","reading":"","meaning":"Cấu trúc dữ liệu giúp tăng tốc độ tìm kiếm dữ liệu trong bảng."},{"word":"query optimization","reading":"","meaning":"Quá trình tối ưu hóa câu lệnh truy vấn để chạy nhanh hơn."}]},{"id":364,"slide":364,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In database transactions, which isolation level is most restrictive?","options":[{"label":"A","text":"READ UNCOMMITTED"},{"label":"B","text":"READ COMMITTED"},{"label":"C","text":"REPEATABLE READ"},{"label":"D","text":"SERIALIZABLE"}],"answer":"D","note":"D","key_point":"SERIALIZABLE là isolation level cao nhất và restrictive nhất trong database transactions.","why_correct":"SERIALIZABLE ngăn chặn được tất cả các concurrency problems như dirty read, non-repeatable read và phantom read bằng cách ép các transaction chạy tuần tự nhau.","why_wrong":[{"label":"A","why":"Cho phép đọc dữ liệu chưa được commit, mức độ restrictive thấp nhất."},{"label":"B","why":"Chỉ tránh được dirty read, vẫn cho phép non-repeatable read xảy ra."},{"label":"C","why":"Tránh được dirty read và non-repeatable read nhưng vẫn có thể dính phantom read."}],"vocab":[{"word":"SERIALIZABLE","reading":"","meaning":"Isolation level cao nhất, đảm bảo tính cô lập hoàn toàn như chạy tuần tự."},{"word":"transaction","reading":"","meaning":"Một chuỗi các thao tác cơ sở dữ liệu được thực hiện như một thể thống nhất."}]},{"id":365,"slide":365,"section":"Giao dịch \u0026 đồng thời","prompt":"","setup":"","stem":"In the context of a banking application, which of the following best represents a transaction that violates atomicity? Choose two answers.","options":[{"label":"A","text":"A money transfer where funds are withdrawn from one account but not credited to another due to a crash"},{"label":"B","text":"A funds transfer request fails before any account is updated, so neither the debit nor the credit happens"},{"label":"C","text":"Both the debit from Account A and the credit to Account B are completed successfully"},{"label":"D","text":"Create a new account successfully but can not link it to the customer profile."}],"answer":"AD","note":"AD","key_point":"Atomicity đảm bảo mọi thao tác trong transaction phải hoàn tất hoặc không thực hiện gì cả.","why_correct":"A vi phạm vì chỉ thực hiện một phần (debit) mà thiếu phần còn lại (credit). D vi phạm vì chỉ thực hiện được một phần của quy trình nghiệp vụ (tạo account) mà thất bại ở phần liên kết.","why_wrong":[{"label":"B","why":"Đây là trạng thái an toàn vì không có thay đổi nào được ghi nhận (tuân thủ atomicity)."},{"label":"C","why":"Đây là trạng thái lý tưởng khi transaction hoàn tất thành công (commit)."}],"vocab":[{"word":"Atomicity","reading":"","meaning":"Tính nguyên tử, đảm bảo transaction thực hiện toàn bộ hoặc không thực hiện gì."},{"word":"Transaction","reading":"","meaning":"Một đơn vị công việc logic bao gồm nhiều thao tác trên database."}]},{"id":366,"slide":366,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"","stem":"Which two statements correctly describe stored procedures? (Choose two correct answers)","options":[{"label":"A","text":"They can return multiple result sets"},{"label":"B","text":"They are compiled each time they run"},{"label":"C","text":"They support conditional logic like IF ...ELSE"},{"label":"D","text":"They replace the need for triggers"}],"answer":"AC","note":"AC","key_point":"Stored procedures là các khối code SQL được lưu trữ, hỗ trợ logic và trả về kết quả.","why_correct":"Stored procedures có thể trả về nhiều result sets thông qua các câu lệnh SELECT liên tiếp và hỗ trợ đầy đủ các cấu trúc điều khiển như IF...ELSE để xử lý logic phức tạp.","why_wrong":[{"label":"B","why":"Stored procedures được biên dịch lần đầu và lưu execution plan để tối ưu hóa hiệu năng."},{"label":"D","why":"Stored procedures và triggers có mục đích khác nhau; triggers tự động chạy dựa trên sự kiện DML, không thay thế được nhau."}],"vocab":[{"word":"Stored procedure","reading":"","meaning":"Một tập hợp các câu lệnh SQL được lưu trữ trong database để thực thi như một đơn vị."},{"word":"Result set","reading":"","meaning":"Tập hợp các hàng dữ liệu trả về từ một truy vấn."},{"word":"Trigger","reading":"","meaning":"Đoạn code tự động thực thi khi có sự kiện DML xảy ra trên bảng."}]},{"id":367,"slide":367,"section":"Chỉ mục \u0026 tối ưu","prompt":"","setup":"","stem":"Which indexes can be automatically created by defining constraints in a table? (Choose two correct answers)","options":[{"label":"A","text":"PRIMARY KEY"},{"label":"B","text":"CHECK"},{"label":"C","text":"UNIQUE"},{"label":"D","text":"FOREIGN KEY"}],"answer":"AC","note":"AC","key_point":"PRIMARY KEY và UNIQUE constraint tự động tạo index để đảm bảo tính duy nhất.","why_correct":"Khi định nghĩa PRIMARY KEY, hệ quản trị CSDL tự động tạo một unique index để kiểm tra tính duy nhất và hỗ trợ truy vấn. Tương tự, UNIQUE constraint cũng tạo ra một unique index để ngăn chặn các giá trị trùng lặp.","why_wrong":[{"label":"B","why":"CHECK constraint chỉ kiểm tra điều kiện logic trên dữ liệu, không cần index."},{"label":"D","why":"FOREIGN KEY không tự động tạo index trong hầu hết các hệ quản trị CSDL phổ biến."}],"vocab":[{"word":"PRIMARY KEY","reading":"","meaning":"Ràng buộc định danh duy nhất cho mỗi tuple trong bảng."},{"word":"UNIQUE","reading":"","meaning":"Ràng buộc đảm bảo không có hai tuple nào có giá trị trùng lặp tại cột đó."},{"word":"Constraint","reading":"","meaning":"Các quy tắc áp đặt lên dữ liệu để đảm bảo tính toàn vẹn."}]},{"id":368,"slide":368,"section":"Thủ tục, trigger, view, cursor","prompt":"","setup":"Given a relation:\nLaptop(model, speed, ram, hd, price)\n\nWhat will this function return when called with dbo.GetLaptopPrice(1)?\n\nCREATE FUNCTION dbo.GetLaptopPrice (@model INT)\nRETURNS BIGINT\nAS\nBEGIN\nDECLARE @price BIGINT\nSELECT @price = price FROM Laptop WHERE model = @model\nRETURN @price\nEND","stem":"What will this function return when called with dbo.GetLaptopPrice(1)?","options":[{"label":"A","text":"The average laptop price with model = 1"},{"label":"B","text":"The price of all laptops"},{"label":"C","text":"The price of laptop with model = 1"},{"label":"D","text":"The model of laptop with price = 1"}],"answer":"C","note":"C","key_point":"Scalar function trả về một giá trị duy nhất dựa trên tham số đầu vào.","why_correct":"Hàm sử dụng mệnh đề WHERE model = @model để lọc đúng tuple có model bằng 1, sau đó gán giá trị price của tuple đó vào biến @price và trả về.","why_wrong":[{"label":"A","why":"Không có hàm tính toán trung bình (AVG) trong câu lệnh SELECT."},{"label":"B","why":"Câu lệnh SELECT có điều kiện WHERE nên không trả về tất cả các dòng."},{"label":"D","why":"Hàm trả về giá trị của cột price, không phải cột model."}],"vocab":[{"word":"Scalar function","reading":"","meaning":"Hàm trả về một giá trị đơn lẻ."},{"word":"Tuple","reading":"","meaning":"Một dòng dữ liệu trong bảng."}]}]};
const REFS = [];

const SKEY = "quiz_" + DATA.course;
let state = { answers:{}, i:0, mode:"quiz", section:"all", shuffle:false, wrongOnly:false };
try { Object.assign(state, JSON.parse(localStorage.getItem(SKEY) || "{}")); } catch(e){}
state.mode = state.mode || "quiz";

let pending = {};   // lựa chọn dở của câu nhiều đáp án, không lưu xuống máy
const save = () => { try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} };
const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Chọn font theo nội dung: câu tiếng Nhật dùng font CJK, câu tiếng Anh/Việt dùng font UI,
   biểu thức đại số quan hệ và SQL dùng mono để giữ thẳng hàng dấu ngoặc. */
const hasJP  = s => /[぀-ヿ一-龯]/.test(s||"");
const isExpr = s => /[Πσρ⋈∪∩×÷]|SELECT |FROM |WHERE |JOIN /i.test(s||"");
const cls = s => isExpr(s) ? "mono" : (hasJP(s) ? "" : "latin");

function pool(){
  let q = DATA.questions;
  if (state.section !== "all") q = q.filter(x => x.section === state.section);
  if (state.wrongOnly) q = q.filter(x => state.answers[x.id] && !same(state.answers[x.id], x.answer));
  if (state.shuffle){
    q = q.slice();
    let seed = 20260728;
    const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i=q.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  }
  return q;
}

/* Đề DBI có câu chọn nhiều đáp án (answer = "AB", "ACD"), câu 2–5 phương án,
   và một câu đề không ghi đáp án. Xử lý cả ba ở đây. */
const letters = s => (s || "").split("").filter(c => /[A-Z]/.test(c));
const isMulti = q => letters(q.answer).length > 1;
const same = (a, b) => { const x = letters(a).sort().join(""), y = letters(b).sort().join(""); return x && x === y; };

function optionsHtml(q, picked, reveal){
  const ans  = new Set(letters(q.answer));
  const pick = new Set(letters(picked));
  return q.options.map(o => {
    let k = "", mark = "";
    if (reveal && ans.size){
      if (ans.has(o.label)){ k = " correct"; mark = "〇"; }
      else if (pick.has(o.label)){ k = " wrong"; mark = "×"; }
      else k = " dim";
    } else if (!reveal && pick.has(o.label)){
      k = " sel";
    }
    return `<button class="opt${k}" data-l="${esc(o.label)}"${reveal?" disabled":""}>
      <span class="key">${esc(o.label)}</span>
      <span class="otext ${cls(o.text)}">${esc(o.text)}</span>
      ${mark?`<span class="mark">${mark}</span>`:""}
    </button>`;
  }).join("");
}

function explainHtml(q, picked, showVerdict){
  const parts = [];
  if (!letters(q.answer).length){
    parts.push(`<div class="verdict na">Slide này không ghi đáp án — phần ghi chú bị dùng để ghi lời dặn.</div>`);
  } else if (showVerdict && picked){
    const ok = same(picked, q.answer);
    parts.push(`<div class="verdict ${ok?"ok":"no"}">${ok?"〇 Đúng":"× Sai — đáp án là "+esc(letters(q.answer).join(", "))}</div>`);
  } else {
    parts.push(`<div class="verdict ok">Đáp án: ${esc(letters(q.answer).join(", "))}</div>`);
  }
  if (q.key_point) parts.push(`<div class="keypoint">${esc(q.key_point)}</div>`);
  if (q.note) parts.push(`<div class="block"><span class="label">Ghi chú của giáo trình</span><div class="src">${esc(q.note)}</div></div>`);
  if (q.why_correct) parts.push(`<div class="block"><span class="label">Vì sao đúng</span><div class="body">${esc(q.why_correct)}</div></div>`);
  if (q.why_wrong && q.why_wrong.length) parts.push(
    `<div class="block"><span class="label">Vì sao các phương án kia sai</span>
     <ul class="why">${q.why_wrong.map(w=>`<li><b>${esc(w.label)}</b><span>${esc(w.why)}</span></li>`).join("")}</ul></div>`);
  if (q.vocab && q.vocab.length) parts.push(
    `<div class="block"><span class="label">Từ vựng</span><table class="vocab">
     ${q.vocab.map(v=>`<tr><td>${esc(v.word)}</td><td>${esc(v.reading)}</td><td>${esc(v.meaning)}</td></tr>`).join("")}
     </table></div>`);
  if (q.key_point) parts.push(`<div class="caveat">Ghi chú của giáo trình là nguyên văn từ slide. Phần phân tích phía dưới do máy soạn — đã kiểm tra mẫu, không kiểm từng câu.</div>`);
  return `<div class="exp">${parts.join("")}</div>`;
}

function cardHtml(q, picked, reveal){
  const multi = isMulti(q);
  return `<div class="meta"><span class="tag">${esc(q.section)}</span><span>Slide ${q.slide}</span>
      ${multi?`<span class="multi">Chọn ${letters(q.answer).length} đáp án</span>`:""}</div>
    ${q.prompt?`<div class="prompt">${esc(q.prompt)}</div>`:""}
    ${q.setup?`<div class="setup">${esc(q.setup)}</div>`:""}
    ${q.stem?`<div class="stem ${cls(q.stem)}">${esc(q.stem)}</div>`:""}
    <div class="opts">${optionsHtml(q,picked,reveal)}</div>
    ${(multi && !reveal)?`<div><button class="btn" id="submit">Kiểm tra</button></div>`:""}
    ${reveal?explainHtml(q,picked,state.mode==="quiz"):""}`;
}

function render(){
  const qs = pool();
  // Câu không có đáp án thì không tính điểm được, nên loại khỏi mẫu số.
  const scorable = DATA.questions.filter(x => letters(x.answer).length);
  const answered = scorable.filter(x => state.answers[x.id]).length;
  const right    = scorable.filter(x => same(state.answers[x.id], x.answer)).length;
  el("stat").innerHTML = `<b>${answered}</b>/${scorable.length} đã làm · đúng <b>${right}</b>` +
     (answered?` · <b>${Math.round(right/answered*100)}%</b>`:"");
  el("bar").style.width = (answered/scorable.length*100) + "%";

  const list = state.mode === "list", refs = state.mode === "refs";
  el("single").hidden   = list || refs;
  el("listView").hidden = !list;
  el("refsView").hidden = !refs;

  if (refs){
    el("refsView").innerHTML = REFS.map(t => `
      <div class="card">
        <h2>${esc(t.title)}</h2><div class="from">Slide ${t.slide}</div>
        ${t.rows.map(r => `<div class="rrow">
          <div class="rterm">${esc(r.item)}</div>
          <div class="rmean">${esc(r.meaning)}</div>
          ${r.examples && r.examples.length ? `<div class="rex">${r.examples.map(x =>
            `<div><span class="ja">${esc(x.ja)}</span>${x.vi?` <span class="vi">— ${esc(x.vi)}</span>`:""}</div>`
          ).join("")}</div>` : ""}
        </div>`).join("")}
      </div>`).join("");
    return;
  }

  if (!qs.length){
    const msg = `<div class="empty">Không có câu nào khớp bộ lọc.</div>`;
    if (list) el("listView").innerHTML = msg; else el("card").innerHTML = msg;
    return;
  }

  if (list){
    el("listView").innerHTML = qs.map(q =>
      `<div class="card">${cardHtml(q, state.answers[q.id], true)}</div>`).join("");
    return;
  }

  if (state.i >= qs.length) state.i = 0;
  if (state.i < 0) state.i = qs.length - 1;
  const q = qs[state.i];
  const submitted = state.answers[q.id];
  const multi = isMulti(q);
  const reveal = state.mode === "read" || !!submitted;
  // Câu nhiều đáp án: giữ lựa chọn đang chọn dở trong `pending`, chỉ chốt khi bấm Kiểm tra.
  const picked = reveal ? submitted : (multi ? (pending[q.id] || "") : submitted);
  el("card").innerHTML = cardHtml(q, picked, reveal);

  el("card").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const l = b.dataset.l;
    if (multi){
      const cur = new Set(letters(pending[q.id] || ""));
      cur.has(l) ? cur.delete(l) : cur.add(l);
      pending[q.id] = [...cur].sort().join("");
      render();
    } else {
      state.answers[q.id] = l; save(); render();
    }
  });
  const sb = el("submit");
  if (sb) sb.onclick = () => {
    if (!pending[q.id]) return;
    state.answers[q.id] = pending[q.id]; save(); render();
  };
}

function go(d){ const n = pool().length; if(!n) return; state.i = (state.i + d + n) % n; save(); render(); }

/* controls */
const sel = el("sect");
sel.innerHTML = `<option value="all">Tất cả — ${DATA.questions.length} câu</option>` +
  DATA.sections.map(s => {
    const c = DATA.questions.filter(q=>q.section===s).length;
    return c ? `<option value="${esc(s)}">${esc(s)} — ${c} câu</option>` : "";
  }).join("");
sel.value = state.section;
sel.onchange = () => { state.section = sel.value; state.i = 0; save(); render(); };

function setMode(m){
  if (m === "refs" && !REFS.length) m = "quiz";
  state.mode = m; state.i = 0;
  ["Quiz","Read","List","Refs"].forEach(k =>
    el("m"+k).setAttribute("aria-pressed", String(m === k.toLowerCase())));
  save(); render();
}
el("mQuiz").onclick = () => setMode("quiz");
el("mRead").onclick = () => setMode("read");
el("mList").onclick = () => setMode("list");
el("mRefs").onclick = () => setMode("refs");
if (REFS.length) el("mRefs").hidden = false;

const toggle = (id, key) => el(id).onclick = () => {
  state[key] = !state[key]; state.i = 0;
  el(id).setAttribute("aria-pressed", String(state[key])); save(); render();
};
toggle("shuf","shuffle");
toggle("wrong","wrongOnly");

el("prev").onclick = () => go(-1);
el("next").onclick = () => go(1);
el("reset").onclick = () => {
  if (!confirm("Xoá toàn bộ tiến độ và kết quả đã làm?")) return;
  state.answers = {}; state.i = 0; save(); render();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.mode === "list" || state.mode === "refs") return;
  const k = e.key.toUpperCase();
  if (["A","B","C","D","E"].includes(k) || ["1","2","3","4","5"].includes(k)){
    const l = /[1-5]/.test(k) ? "ABCDE"[+k-1] : k;
    const b = el("card").querySelector(`.opt[data-l="${l}"]:not(:disabled)`);
    if (b){ e.preventDefault(); b.click(); }
  }
  // Ở câu nhiều đáp án, Enter/Space chốt bài thay vì nhảy sang câu sau
  else if ((e.key === "Enter" || e.key === " ") && el("submit")){ e.preventDefault(); el("submit").click(); }
  else if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter"){ e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
});

el("shuf").setAttribute("aria-pressed", String(state.shuffle));
el("wrong").setAttribute("aria-pressed", String(state.wrongOnly));
setMode(state.mode);
</script>
