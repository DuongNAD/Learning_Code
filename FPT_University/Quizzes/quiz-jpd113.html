meaning":"Tiếng Anh"}]},{"id":206,"slide":206,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"私は、まいあさ（　　）6時（　　）おきます。","options":[{"label":"A","text":"に / に"},{"label":"B","text":"× / に"},{"label":"C","text":"も / に"},{"label":"D","text":"に / ×"}],"answer":"B","fix":"","note":"B","key_point":"Danh tu chi thoi gian co dinh (nhu 6時) di voi tro tu に, con tu chi thoi gian bat dinh (nhu まいあさ) khong can tro tu.","why_correct":"まいあさ (moi sang) la tu chi thoi gian bat dinh nen khong dung tro tu (×). 6時 la thoi diem cu the nen dung tro tu に de chi thoi gian thuc hien hanh dong.","why_wrong":[{"label":"A","why":"Dung tro tu に sau まいあさ la sai vi tu chi thoi gian bat dinh khong di kem に."},{"label":"C","why":"Dung tro tu も sau まいあさ khong phu hop ve ngu phap va y nghia trong cau nay."},{"label":"D","why":"Bo qua tro tu o vi tri thu hai la sai vi thoi diem cu the 6時 bat buoc phai co に."}],"vocab":[{"word":"まいあさ","reading":"maiasa","meaning":"moi sang"},{"word":"おきます","reading":"okimasu","meaning":"thuc day"}]},{"id":207,"slide":207,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"やすみは 日曜日 (     ) 月曜日です。","options":[{"label":"A","text":"と"},{"label":"B","text":"は"},{"label":"C","text":"も"},{"label":"D","text":"×"}],"answer":"A","fix":"","note":"A","key_point":"Dùng \u0027と\u0027 để nối các danh sách sự vật, sự việc mang tính liệt kê đầy đủ.","why_correct":"Trợ từ \u0027と\u0027 có nghĩa là \u0027và\u0027, dùng để nối hai danh sách \u0027chủ nhật\u0027 và \u0027thứ hai\u0027 lại với nhau.","why_wrong":[{"label":"B","why":"Dùng để đánh dấu chủ ngữ hoặc nêu chủ đề, không phù hợp để nối hai danh từ song song."},{"label":"C","why":"Có nghĩa là \u0027cũng\u0027, dùng khi đồng tình hoặc thêm một đối tượng tương tự, không dùng để liệt kê."},{"label":"D","why":"Không cần điền gì là sai vì câu thiếu trợ từ kết nối hai danh từ."}],"vocab":[{"word":"休み","reading":"やすみ","meaning":"ngày nghỉ, nghỉ ngơi"},{"word":"日曜日","reading":"にちようび","meaning":"Chủ Nhật"},{"word":"月曜日","reading":"げつようび","meaning":"Thứ Hai"}]},{"id":208,"slide":208,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: まいあさ、なにを たべますか。\nB: たまご（　）パン（　）を たべます。","options":[{"label":"A","text":"から / まで"},{"label":"B","text":"と / と"},{"label":"C","text":"と / や"},{"label":"D","text":"や / など"}],"answer":"D","fix":"","note":"D","key_point":"Dùng や ... など để liệt kê không đầy đủ các danh từ.","why_correct":"や nối các danh từ tiêu biểu (trứng, bánh mì) và など đi cuối câu thể hiện việc kể ra một số món trong số nhiều món thường ăn.","why_wrong":[{"label":"A","why":"から / まで chỉ điểm khởi đầu và kết thúc của thời gian hoặc không gian, không dùng để liệt kê."},{"label":"B","why":"と / と dùng để liệt kê đầy đủ tất cả các món, nhưng thực tế bữa sáng còn có thể có món khác."},{"label":"C","why":"Cấu trúc と / や không kết hợp với nhau theo cách này trong tiếng Nhật."}],"vocab":[{"word":"たまご","reading":"tamago","meaning":"trứng"},{"word":"パン","reading":"pan","meaning":"bánh mì"}]},{"id":209,"slide":209,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (  ).","setup":"","stem":"マルコさんはブラジル人です。マリさん (      ) ブラジル人です。","options":[{"label":"A","text":"の"},{"label":"B","text":"は"},{"label":"C","text":"と"},{"label":"D","text":"も"}],"answer":"D","fix":"","note":"D","key_point":"Dùng trợ từ も để chỉ sự tương đồng (cũng...)","why_correct":" マルコ là người Brazil, và Mari cũng là người Brazil nên dùng も.","why_wrong":[{"label":"A","why":"の dùng để chỉ sở hữu hoặc bổ nghĩa giữa hai danh từ, không phù hợp ở đây."},{"label":"B","why":"は dùng để đánh dấu chủ đề, nhưng nếu dùng ở đây sẽ lặp ý với câu trước và không thể hiện được tính tương đồng."},{"label":"C","why":"と có nghĩa là \u0027và\u0027 hoặc \u0027cùng với\u0027, không dùng để nối hai chủ ngữ có cùng tính chấ ":213,"slide":213,"section":"Động từ","prompt":"Chọn đáp án thích hợp trong A. B. C. D để điền vào ngoặc cho câu sau:","setup":"","stem":"えいがを（　　）。","options":[{"label":"A","text":"ねます"},{"label":"B","text":"みます"},{"label":"C","text":"のみます"},{"label":"D","text":"かいます"}],"answer":"B","fix":"","note":"B\nxem phim","key_point":"Dùng động từ 「みます」 (mimasu - xem/nhìn) đi với danh từ chỉ phim ảnh 「えいが」.","why_correct":"「えいがをみます」 là kết hợp chính xác mang nghĩa là \u0027xem phim\u0027.","why_wrong":[{"label":"A","why":"「ねます」 nghĩa là \u0027ngủ\u0027, không dùng để xem phim."},{"label":"C","why":"「のみます」 nghĩa là \u0027uống\u0027, dùng cho đồ ăn thức uống."},{"label":"D","why":"「かいます」 nghĩa là \u0027mua\u0027, không phù hợp với ngữ cảnh xem phim."}],"vocab":[{"word":"えいが","reading":"eiga","meaning":"phim, điện ảnh"},{"word":"みます","reading":"mimasu","meaning":"xem, nhìn"}]},{"id":214,"slide":214,"section":"Động từ","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"私は　まいばん、10時に　しんぶんを　(　　)。","options":[{"label":"A","text":"のみます"},{"label":"B","text":"かいます"},{"label":"C","text":"ねます"},{"label":"D","text":"よめます"}],"answer":"D","fix":"","note":"D\nđọc báo","key_point":"Dùng từ よみます để chỉ hành động đọc sách báo.","why_correct":"Câu này nói về việc đọc báo (しんぶんを よみます), nên đáp án D là chính xác.","why_wrong":[{"label":"A","why":"nomimasu nghĩa là uống, không dùng với báo."},{"label":"B","why":"kaimasu nghĩa là mua, không phù hợp với ngữ cảnh đọc hàng đêm."},{"label":"C","why":"nemasu nghĩa là đi ngủ, không đi với tân ngữ shimbun."}],"vocab":[{"word":"しんぶん","reading":"shimbun","meaning":"tờ báo"},{"word":"よみます","reading":"yomimasu","meaning":"đọc"}]},{"id":215,"slide":215,"section":"Động từ","prompt":"Chọn đáp án thích hợp trong A. B. C. D để điền vào ngoặc cho câu sau:","setup":"","stem":"えいがを（　　）。","options":[{"label":"A","text":"のみます"},{"label":"B","text":"かいます"},{"label":"C","text":"みます"},{"label":"D","text":"ねます"}],"answer":"C","fix":"","note":"C\nxem phim","key_point":"Động từ みます (xem) đi với tân ngữ chỉ hình ảnh, phim ảnh (えいが).","why_correct":"Động từ みます (Kiến - xem) là từ phù hợp nhất để kết hợp với danh từ えいが (Ánh họa - phim).","why_wrong":[{"label":"A","why":"のみます (Ẩm - uống) dùng cho đồ uống, không dùng cho phim."},{"label":"B","why":"かいます (Mãi - mua) dùng cho hàng hóa, không dùng cho phim."},{"label":"D","why":"ねます (Ngụ - ngủ) là hành động cá nhân, không có tân ngữ."}],"vocab":[{"word":"えいが","reading":"eiga","meaning":"phim (Ánh họa)"},{"word":"みます","reading":"mimasu","meaning":"xem (Kiến)"}]},{"id":216,"slide":216,"section":"Động từ","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: やまださん、なつやすみ、日本へ　かえりますか。\nB: いいえ、(　　)。","options":[{"label":"A","text":"かえります"},{"label":"B","text":"かえません"},{"label":"C","text":"かりますです"},{"label":"D","text":"かえませんです"}],"answer":"B","fix":"","note":"B\nいいえ、nên là sẽ tìm động từ đuôi ません =\u003e chọn B","key_point":"Khi trả lời phủ định với \u0027いいえ\u0027, động từ phải chia ở dạng phủ định \u0027ません\u0027.","why_correct":"Câu hỏi dùng \u0027かえりますか\u0027 (có về không?), vì có \u0027いいえ\u0027 nên phải trả lời bằng dạng phủ định \u0027かえません\u0027 (không về).","why_wrong":[{"label":"A","why":"Đây là dạng khẳng định, dùng khi trả lời \u0027はい\u0027."},{"label":"C","why":"Sai ngữ pháp, \u0027かります\u0027 là mượn, không kết hợp với \u0027です\u0027 ở đây."},{"label":"D","why":"Sai ngữ pháp, không thêm \u0027です\u0027 sau đuôi \u0027ません\u0027."}],"vocab":[{"word":"夏休み","reading":"なつやすみ","meaning":"kỳ nghỉ hè"},{"word":"日本","reading":"にほん","meaning":"Nhật Bản"},{"word":"帰ります","reading":"かえります","meaning":"về"}]},{"id":217,"slide":217,"section":"Động từ","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: 6月25日は りゅうがくパーティーです。\nB: えっ！りゅうがくパーティー？なにを しますか。\nA: ケーキを ① ___。ビールを ② ___。","options":[{"label":"A","text":"①たべます / ②のみます"},{"label":"B","text":"①のみます / ②たべます"},{"label":"C","text":"①みます / ②かいます"},{"label":"D","text":"①よめます / ②みます"}],"answer":"A","fix":"","note":"A\năn bánh và uống bia","key_point":"Sử dụng động từ phù hợp với tân ngữ: ケーキ (bánh) đi với たべます (ăn).","why_correct":"ケーキ (bánh) là đồ ăn nên dùng たべます, còn ビール (bia) là đồ uống nên dùng のみます.","why_wrong":[{"label":"B","why":"Ngược nghĩa: không ai uống bánh và ăn bia."},{"label":"C","why":"Sai nghĩa: みます (xem) và かいます (mua) không hợp ngữ cảnh."},{"label":"D","why":"Sai nghĩa: よめます (có thể đọc) và みます (xem) không hợp ngữ cảnh."}],"vocab":[{"word":"食べる","reading":"たべる","meaning":"ăn"},{"word":"飲む","reading":"のむ","meaning":"uống"},{"word":"ケーキ","reading":"けーき","meaning":"bánh ngọt"},{"word":"ビール","reading":"びーる","meaning":"bia"}]},{"id":218,"slide":218,"section":"Động từ","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: 6月1日から7日までは　ホームステイです。\nB: えっ！ホームステイ？なにを　しますか。\nA: はなびを　①________。バーベキューを　②________。","options":[{"label":"A","text":"①みます / ②します"},{"label":"B","text":"①いきます / ②かいます"},{"label":"C","text":"①たべます / ②します"},{"label":"D","text":"①よみます / ②たべます"}],"answer":"A","fix":"","note":"A\nXem pháo hoa và ăn thịt nướng","key_point":"Kết hợp động từ phù hợp với danh từ: xem pháo hoa (はなびをみます) và làm tiệc nướng (バーベキューをします).","why_correct":"Đáp án A chính xác vì \u0027pháo hoa\u0027 (はなび) đi với động từ \u0027xem\u0027 (みます), còn \u0027tiệc nướng\u0027 (バーベキュー) đi với động từ \u0027làm\u0027 (します).","why_wrong":[{"label":"B","why":"Không ai nói \u0027đi pháo hoa\u0027 hay \u0027mua tiệc nướng\u0027 trong ngữ cảnh này."},{"label":"C","why":"Không thể \u0027ăn\u0027 (たべます) pháo hoa."},{"label":"D","why":"Không thể \u0027đọc\u0027 (よみます) pháo hoa."}],"vocab":[{"word":"花火","reading":"はなび","meaning":"pháo hoa"},{"word":"バーベキュー","reading":"ba-be-kyu-","meaning":"tiệc nướng ngoài trời"},{"word":"します","reading":"shi-ma-su","meaning":"làm, tổ chức"}]},{"id":220,"slide":220,"section":"Xếp câu","prompt":"Dựa vào các từ gợi ý cho sẵn hãy chọn câu có ý nghĩa hoàn chỉnh trong các phương án A. B. C. D dưới đây:","setup":"","stem":"これ / です / タイ / りょうり","options":[{"label":"A","text":"これは タイの りょうりです。"},{"label":"B","text":"これ りょうりは タイです。"},{"label":"C","text":"タイは これ りょうりです。"},{"label":"D","text":"りょうりは タイこれです。"}],"answer":"A","fix":"","note":"A\nĐấy là món ăn của Thái Lan.\nこれ luôn đứng đầu, sau これ luôn là một trợ từ (は、が...), sau trợ từ là một danh từ, trong trường hợp trên là タイのりょうり (giữa hai danh từ phải dùng の). です luôn đứng cuối","key_point":"Cấu trúc chỉ định: これ + は + Danh từ 1 + の + Danh từ 2 + です.","why_correct":"Câu A sắp xếp đúng trật tự ngữ pháp: \u0027これ\u0027 làm chủ ngữ đi với trợ từ \u0027は\u0027, theo sau là cụm danh từ \u0027タイのりょうり\u0027 (món ăn Thái Lan) được nối bằng trợ từ \u0027の\u0027, và kết thúc bằng \u0027です\u0027.","why_wrong":[{"label":"B","why":"Sai vì \u0027これ\u0027 không thể đứng trực tiếp trước danh từ \u0027りょうり\u0027 để bổ nghĩa (phải dùng \u0027この\u0027)."},{"label":"C","why":"Sai cấu trúc và ngữ nghĩa, dịch ra là \u0027Thái Lan là món ăn này\u0027 không hợp lý."},{"label":"D","why":"Sai trật tự từ nghiêm trọng, cụm \u0027タイこれ\u0027 không có nghĩa và \u0027です\u0027 không đứng sau \u0027これ\u0027."}],"vocab":[{"word":"これ","reading":"kore","meaning":"cái này"},{"word":"タイ","reading":"tai","meaning":"Thái Lan"},{"word":"料理","reading":"りょうり (Liệu Lý)","meaning":"món ăn, ẩm thực"}]},{"id":221,"slide":221,"section":"Xếp câu","prompt":"Dựa vào các từ gợi ý cho sẵn hãy chọn câu có ý nghĩa hoàn chỉnh trong các phương án A. B. C. D dưới đây:","setup":"","stem":"私 / 学生 / ふじだいがく / です","options":[{"label":"A","text":"学生は 私の ふじだいがくです。"},{"label":"B","text":"ふじだいがくが 学生は 私の です。"},{"label":"C","text":"私は ふじだいがくの 学生です。"},{"label":"D","text":"私は 学生的 ふじだいがくです。"}],"answer":"C","fix":"","note":"C\nTôi là sinh viên của trường đại học Fuji.\n私: tôi\n学生: học sinh\nふじだいがく: fuji - tên, daigaku - trường đại học\n\ndanh từ sở hữu + の + danh từ bị sở hữu","key_point":"Cấu trúc sở hữu: [Danh từ 1] の [Danh từ 2] (Danh từ 2 của Danh từ 1).","why_correct":"Câu C sử dụng đúng trợ từ の để nối \u0027Fuji Daigaku\u0027 (trường) với \u0027Gakusei\u0027 (sinh viên), tạo thành \u0027sinh viên của trường đại học Fuji\u0027.","why_wrong":[{"label":"A","why":"Sai trật tự, biến trường đại học thành vật sở hữu của sinh viên."},{"label":"B","why":"Sai vị trí trợ từ が và cấu trúc câu không tự nhiên."},{"label":"D","why":"Từ \u0027Gakuseiteki\u0027 không tồn tại trong tiếng Nhật."}],"vocab":[{"word":"私","reading":"わたし","meaning":"Tôi"},{"word":"学生","reading":"がくせい","meaning":"Học sinh/Sinh viên (Học sinh)"},{"word":"大学","reading":"だいがく","meaning":"Trường đại học (Đại học)"}]},{"id":222,"slide":222,"section":"Xếp câu","prompt":"Dựa vào các từ gợi ý cho sẵn hãy chọn câu có ý nghĩa hoàn chỉnh trong các phương án A. B. C. D dưới đây:","setup":"","stem":"じゃありません / 私 / かいしゃいん","options":[{"label":"A","text":"じゃありませんは 私の かいしゃいん。"},{"label":"B","text":"かいしゃいんは じゃありません 私。"},{"label":"C","text":"私は かいしゃいん じゃありません。"},{"label":"D","text":"かいしゃいんは じゃありませんの 私。"}],"answer":"C","fix":"","note":"C\nTôi không phải là nhân viên công ty.\n私: tôi - đứng đầu\nかいしゃいん: nhân viên\nじゃありません: phủ định, luôn đứng cuối\nsau 私 phải có trợ từ (は、が...)","key_point":"Cấu trúc phủ định: [Danh từ 1] は [Danh từ 2] じゃありません (không phải là).","why_correct":"Câu C tuân thủ đúng trật tự: Chủ ngữ (私) + は + Danh từ (かいしゃいん) + Phủ định (じゃありません).","why_wrong":[{"label":"A","why":"Sai trật tự, không thể đặt phủ định lên đầu câu."},{"label":"B","why":"Sai trật tự, danh từ chỉ người phải đứng trước trợ từ は."},{"label":"D","why":"Sai ngữ pháp, trợ từ の không dùng để nối danh từ với phủ định."}],"vocab":[{"word":"私","reading":"わたし","meaning":"tôi"},{"word":"会社員","reading":"かいしゃいん","meaning":"nhân viên công ty (Hội Xã Viên)"},{"word":"じゃありません","reading":"ja arimasen","meaning":"không phải là (dạng phủ định)"}]},{"id":223,"slide":223,"section":"Xếp câu","prompt":"Dựa vào các từ gợi ý cho sẵn hãy chọn câu có ý nghĩa hoàn chỉnh trong các phương .)"}]},{"item":"へ","meaning":"sử dụng cùng với từ chỉ địa điểm, có nghĩa là hướng tới đâu.","examples":[{"ja":"わたしはまいにちだいがくへいきます。","vi":"(Tôi tới trường hằng ngày)"}]},{"item":"の","meaning":"dùng với nghĩa là của ai hoặc để bổ nghĩa cho danh từ đứng trước nó.","examples":[{"ja":"これはわたしのパソコンです。","vi":"(Đây là máy tính của tôi.)"},{"ja":"これはとりにくのスープです。","vi":"(Đây là món súp làm từ thịt gà.)"}]},{"item":"と","meaning":"và","examples":[{"ja":"これはパソコンととけいです。","vi":"(Đây là cái máy tính và cái đồng hồ.)"}]},{"item":"~や~など","meaning":"~ và ~, và vân vân, nghĩa xấp xỉ bằng と","examples":[{"ja":"わたしはたまごやパンなどをたべます。","vi":"(Tôi ăn bánh mì, trứng,....)"}]},{"item":"から\nまで","meaning":"từ\nđến","examples":[{"ja":"としょかんはごぜん8時から[...]ごろまでです。","vi":"(Thư viện mở cửa từ 8h sáng đến 5h chiều)"}]}]}];

const SKEY = "quiz_" + DATA.course;
let state = { answers:{}, i:0, mode:"quiz", section:"all", shuffle:false, wrongOnly:false };
try { Object.assign(state, JSON.parse(localStorage.getItem(SKEY) || "{}")); } catch(e){}
state.mode = state.mode || "quiz";

let pending = {};   // lựa chọn dở của câu nhiều đáp án, không lưu xuống máy
const save = () => { try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} };
const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Chọn font theo nội dung: câu tiếng Nhật dùng font CJK, câu tiếng Anh/Việt dùng font UI,
   biểu thức đại số quan hệ và SQL dùng mono để giữ thẳng hàng dấu ngoặc. */
const hasJP  = s => /[぀-ヿ一-龯]/.test(s||"");
const isExpr = s => /[Πσρ⋈∪∩×÷]|SELECT |FROM |WHERE |JOIN /i.test(s||"");
const cls = s => isExpr(s) ? "mono" : (hasJP(s) ? "" : "latin");

function pool(){
  let q = DATA.questions;
  if (state.section !== "all") q = q.filter(x => x.section === state.section);
  if (state.wrongOnly) q = q.filter(x => state.answers[x.id] && !same(state.answers[x.id], x.answer));
  if (state.shuffle){
    q = q.slice();
    let seed = 20260728;
    const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i=q.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  }
  return q;
}

/* Đề DBI có câu chọn nhiều đáp án (answer = "AB", "ACD"), câu 2–5 phương án,
   và một câu đề không ghi đáp án. Xử lý cả ba ở đây. */
const letters = s => (s || "").split("").filter(c => /[A-Z]/.test(c));
const isMulti = q => letters(q.answer).length > 1;
const same = (a, b) => { const x = letters(a).sort().join(""), y = letters(b).sort().join(""); return x && x === y; };

function optionsHtml(q, picked, reveal){
  const ans  = new Set(letters(q.answer));
  const pick = new Set(letters(picked));
  return q.options.map(o => {
    let k = "", mark = "";
    if (reveal && ans.size){
      if (ans.has(o.label)){ k = " correct"; mark = "〇"; }
      else if (pick.has(o.label)){ k = " wrong"; mark = "×"; }
      else k = " dim";
    } else if (!reveal && pick.has(o.label)){
      k = " sel";
    }
    return `<button class="opt${k}" data-l="${esc(o.label)}"${reveal?" disabled":""}>
      <span class="key">${esc(o.label)}</span>
      <span class="otext ${cls(o.text)}">${esc(o.text)}</span>
      ${mark?`<span class="mark">${mark}</span>`:""}
    </button>`;
  }).join("");
}

function explainHtml(q, picked, showVerdict){
  const parts = [];
  if (!letters(q.answer).length){
    parts.push(`<div class="verdict na">Slide này không ghi đáp án — phần ghi chú bị dùng để ghi lời dặn.</div>`);
  } else if (showVerdict && picked){
    const ok = same(picked, q.answer);
    parts.push(`<div class="verdict ${ok?"ok":"no"}">${ok?"〇 Đúng":"× Sai — đáp án là "+esc(letters(q.answer).join(", "))}</div>`);
  } else {
    parts.push(`<div class="verdict ok">Đáp án: ${esc(letters(q.answer).join(", "))}</div>`);
  }
  if (q.fix) parts.push(`<div class="block"><span class="label warn">⚠ Đã sửa đáp án so với đề gốc</span><div class="fixnote">${esc(q.fix)}</div></div>`);
  if (q.key_point) parts.push(`<div class="keypoint">${esc(q.key_point)}</div>`);
  if (q.note) parts.push(`<div class="block"><span class="label">Ghi chú của giáo trình${q.fix?" (nguyên văn, chưa sửa)":""}</span><div class="src">${esc(q.note)}</div></div>`);
  if (q.why_correct) parts.push(`<div class="block"><span class="label">Vì sao đúng</span><div class="body">${esc(q.why_correct)}</div></div>`);
  if (q.why_wrong && q.why_wrong.length) parts.push(
    `<div class="block"><span class="label">Vì sao các phương án kia sai</span>
     <ul class="why">${q.why_wrong.map(w=>`<li><b>${esc(w.label)}</b><span>${esc(w.why)}</span></li>`).join("")}</ul></div>`);
  if (q.vocab && q.vocab.length) parts.push(
    `<div class="block"><span class="label">Từ vựng</span><table class="vocab">
     ${q.vocab.map(v=>`<tr><td>${esc(v.word)}</td><td>${esc(v.reading)}</td><td>${esc(v.meaning)}</td></tr>`).join("")}
     </table></div>`);
  if (q.key_point) parts.push(`<div class="caveat">Ghi chú của giáo trình là nguyên văn từ slide. Phần phân tích phía dưới do máy soạn — đã kiểm tra mẫu, không kiểm từng câu.</div>`);
  return `<div class="exp">${parts.join("")}</div>`;
}

function cardHtml(q, picked, reveal){
  const multi = isMulti(q);
  return `<div class="meta"><span class="tag">${esc(q.section)}</span>${q.exam
      ? `<span>${esc(q.exam)} · Q${esc(q.questionNo)}</span>`
      : `<span>Slide ${q.slide}</span>`}
      ${multi?`<span class="multi">Chọn ${letters(q.answer).length} đáp án</span>`:""}</div>
    ${q.prompt?`<div class="prompt">${esc(q.prompt)}</div>`:""}
    ${q.setup?`<div class="setup">${esc(q.setup)}</div>`:""}
    ${q.stem?`<div class="stem ${cls(q.stem)}">${esc(q.stem)}</div>`:""}
    <div class="opts">${optionsHtml(q,picked,reveal)}</div>
    ${(multi && !reveal)?`<div><button class="btn" id="submit">Kiểm tra</button></div>`:""}
    ${reveal?explainHtml(q,picked,state.mode==="quiz"):""}`;
}

function render(){
  const qs = pool();
  // Câu không có đáp án thì không tính điểm được, nên loại khỏi mẫu số.
  const scorable = DATA.questions.filter(x => letters(x.answer).length);
  const answered = scorable.filter(x => state.answers[x.id]).length;
  const right    = scorable.filter(x => same(state.answers[x.id], x.answer)).length;
  el("stat").innerHTML = `<b>${answered}</b>/${scorable.length} đã làm · đúng <b>${right}</b>` +
     (answered?` · <b>${Math.round(right/answered*100)}%</b>`:"");
  el("bar").style.width = (answered/scorable.length*100) + "%";

  const list = state.mode === "list", refs = state.mode === "refs";
  el("single").hidden   = list || refs;
  el("listView").hidden = !list;
  el("refsView").hidden = !refs;

  if (refs){
    el("refsView").innerHTML = REFS.map(t => `
      <div class="card">
        <h2>${esc(t.title)}</h2><div class="from">Slide ${t.slide}</div>
        ${t.rows.map(r => `<div class="rrow">
          <div class="rterm">${esc(r.item)}</div>
          <div class="rmean">${esc(r.meaning)}</div>
          ${r.examples && r.examples.length ? `<div class="rex">${r.examples.map(x =>
            `<div><span class="ja">${esc(x.ja)}</span>${x.vi?` <span class="vi">— ${esc(x.vi)}</span>`:""}</div>`
          ).join("")}</div>` : ""}
        </div>`).join("")}
      </div>`).join("");
    return;
  }

  if (!qs.length){
    const msg = `<div class="empty">Không có câu nào khớp bộ lọc.</div>`;
    if (list) el("listView").innerHTML = msg; else el("card").innerHTML = msg;
    return;
  }

  if (list){
    el("listView").innerHTML = qs.map(q =>
      `<div class="card">${cardHtml(q, state.answers[q.id], true)}</div>`).join("");
    return;
  }

  if (state.i >= qs.length) state.i = 0;
  if (state.i < 0) state.i = qs.length - 1;
  const q = qs[state.i];
  const submitted = state.answers[q.id];
  const multi = isMulti(q);
  const reveal = state.mode === "read" || !!submitted;
  // Câu nhiều đáp án: giữ lựa chọn đang chọn dở trong `pending`, chỉ chốt khi bấm Kiểm tra.
  const picked = reveal ? submitted : (multi ? (pending[q.id] || "") : submitted);
  el("card").innerHTML = cardHtml(q, picked, reveal);

  el("card").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const l = b.dataset.l;
    if (multi){
      const cur = new Set(letters(pending[q.id] || ""));
      cur.has(l) ? cur.delete(l) : cur.add(l);
      pending[q.id] = [...cur].sort().join("");
      render();
    } else {
      state.answers[q.id] = l; save(); render();
    }
  });
  const sb = el("submit");
  if (sb) sb.onclick = () => {
    if (!pending[q.id]) return;
    state.answers[q.id] = pending[q.id]; save(); render();
  };
}

function go(d){ const n = pool().length; if(!n) return; state.i = (state.i + d + n) % n; save(); render(); }

/* controls */
const sel = el("sect");
sel.innerHTML = `<option value="all">Tất cả — ${DATA.questions.length} câu</option>` +
  DATA.sections.map(s => {
    const c = DATA.questions.filter(q=>q.section===s).length;
    return c ? `<option value="${esc(s)}">${esc(s)} — ${c} câu</option>` : "";
  }).join("");
sel.value = state.section;
sel.onchange = () => { state.section = sel.value; state.i = 0; save(); render(); };

function setMode(m){
  if (m === "refs" && !REFS.length) m = "quiz";
  state.mode = m; state.i = 0;
  ["Quiz","Read","List","Refs"].forEach(k =>
    el("m"+k).setAttribute("aria-pressed", String(m === k.toLowerCase())));
  save(); render();
}
el("mQuiz").onclick = () => setMode("quiz");
el("mRead").onclick = () => setMode("read");
el("mList").onclick = () => setMode("list");
el("mRefs").onclick = () => setMode("refs");
if (REFS.length) el("mRefs").hidden = false;

const toggle = (id, key) => el(id).onclick = () => {
  state[key] = !state[key]; state.i = 0;
  el(id).setAttribute("aria-pressed", String(state[key])); save(); render();
};
toggle("shuf","shuffle");
toggle("wrong","wrongOnly");

el("prev").onclick = () => go(-1);
el("next").onclick = () => go(1);
el("reset").onclick = () => {
  if (!confirm("Xoá toàn bộ tiến độ và kết quả đã làm?")) return;
  state.answers = {}; state.i = 0; save(); render();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["list", "refs", "tricks", "numbers"].includes(state.mode)) return;
  const k = e.key.toUpperCase();
  if (["A","B","C","D","E"].includes(k) || ["1","2","3","4","5"].includes(k)){
    const l = /[1-5]/.test(k) ? "ABCDE"[+k-1] : k;
    const b = el("card").querySelector(`.opt[data-l="${l}"]:not(:disabled)`);
    if (b){ e.preventDefault(); b.click(); }
  }
  // Ở câu nhiều đáp án, Enter/Space chốt bài thay vì nhảy sang câu sau
  else if ((e.key === "Enter" || e.key === " ") && el("submit")){ e.preventDefault(); el("submit").click(); }
  else if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter"){ e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
});

el("shuf").setAttribute("aria-pressed", String(state.shuffle));
el("wrong").setAttribute("aria-pressed", String(state.wrongOnly));
setMode(state.mode);
</script>
