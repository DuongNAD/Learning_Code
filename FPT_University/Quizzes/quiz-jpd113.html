<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPD113 — Ngân hàng câu hỏi</title>
<style>
  :root{
    --paper:#F2F3F0; --card:#FFFFFF; --ink:#16202E; --ink-soft:#54606F; --ink-faint:#8A94A0;
    --rule:#DDE0DC; --rule-strong:#C6CBC5;
    --indigo:#2B4C7E; --indigo-soft:#E7ECF4;
    --ok:#1F7A5C; --ok-bg:#E6F2ED; --no:#C4442D; --no-bg:#FBEAE6;
    --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px -12px rgba(22,32,46,.18);
    --mono:ui-monospace,"Cascadia Mono","Consolas","SF Mono",monospace;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Yu Gothic UI","Meiryo","MS Gothic",sans-serif;
    --ui:"Segoe UI","Inter","Helvetica Neue",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#12161A; --card:#1A1F25; --ink:#E7E9E4; --ink-soft:#A3ACB6; --ink-faint:#6E7883;
      --rule:#2A3138; --rule-strong:#3B444D;
      --indigo:#89AEE0; --indigo-soft:#1E2A3A;
      --ok:#5FC49C; --ok-bg:#16302A; --no:#EE8168; --no-bg:#341E1A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12161A; --card:#1A1F25; --ink:#E7E9E4; --ink-soft:#A3ACB6; --ink-faint:#6E7883;
    --rule:#2A3138; --rule-strong:#3B444D;
    --indigo:#89AEE0; --indigo-soft:#1E2A3A;
    --ok:#5FC49C; --ok-bg:#16302A; --no:#EE8168; --no-bg:#341E1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --paper:#F2F3F0; --card:#FFFFFF; --ink:#16202E; --ink-soft:#54606F; --ink-faint:#8A94A0;
    --rule:#DDE0DC; --rule-strong:#C6CBC5;
    --indigo:#2B4C7E; --indigo-soft:#E7ECF4;
    --ok:#1F7A5C; --ok-bg:#E6F2ED; --no:#C4442D; --no-bg:#FBEAE6;
    --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px -12px rgba(22,32,46,.18);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 96px}

  /* ---------- top rail ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--paper);
         border-bottom:1px solid var(--rule);padding:14px 0 12px;margin-bottom:26px}
  .rail{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .course{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo)}
  .subtitle{font-size:12px;color:var(--ink-faint);letter-spacing:.02em}
  .spacer{flex:1}
  .stat{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b{color:var(--ink);font-weight:650}
  .bar{height:3px;background:var(--rule);border-radius:2px;margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--indigo);width:0;transition:width .3s ease}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  select,.btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card);
    border:1px solid var(--rule-strong);border-radius:7px;padding:6px 11px;cursor:pointer}
  select{max-width:100%}
  .btn:hover{border-color:var(--indigo);color:var(--indigo)}
  .btn[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
  :root[data-theme="dark"] .btn[aria-pressed="true"],
  .btn[aria-pressed="true"]{color:var(--paper)}
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:7px;overflow:hidden}
  .seg .btn{border:0;border-radius:0;border-right:1px solid var(--rule-strong)}
  .seg .btn:last-child{border-right:0}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

  /* ---------- question card ---------- */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
        box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;gap:16px}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .tag{background:var(--indigo-soft);color:var(--indigo);padding:2px 8px;border-radius:20px;
       letter-spacing:.06em;font-weight:650}
  .prompt{font-size:14.5px;color:var(--ink-soft);text-wrap:pretty}
  .setup{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--paper);
         border:1px solid var(--rule);border-radius:8px;padding:12px 14px;
         overflow-x:auto;white-space:pre;color:var(--ink-soft)}
  .stem{font-family:var(--jp);font-size:23px;line-height:1.75;font-weight:600;text-wrap:balance}
  .stem.latin{font-family:var(--ui);font-size:19px;font-weight:600}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:9px;margin:2px 0 0}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
       background:var(--card);border:1px solid var(--rule-strong);border-radius:9px;
       padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--indigo);background:var(--indigo-soft)}
  .opt:disabled{cursor:default}
  .key{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rule-strong);
       display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:1px}
  .otext{font-family:var(--jp);font-size:17px;line-height:1.6}
  .otext.latin{font-family:var(--ui);font-size:15.5px}
  .otext.mono{font-family:var(--mono);font-size:13.5px;line-height:1.6;
              overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .mark{flex:none;margin-left:auto;font-size:19px;line-height:1;padding-left:8px;font-weight:400}

  .opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}
  .opt.sel .key{border-color:var(--indigo);color:var(--indigo);font-weight:800}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .key{border-color:var(--ok);color:var(--ok)}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--no-bg)}
  .opt.wrong .key{border-color:var(--no);color:var(--no)}
  .opt.wrong .mark{color:var(--no)}
  .opt.dim{opacity:.5}

  /* ---------- explanation ---------- */
  .exp{border-top:1px solid var(--rule);padding-top:16px;display:flex;flex-direction:column;gap:13px}
  .exp[hidden]{display:none}
  .verdict{font-size:14px;font-weight:650}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)} .verdict.na{color:var(--ink-faint)}
  .multi{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         color:var(--indigo);background:var(--indigo-soft);padding:2px 8px;border-radius:20px}
  .block{display:flex;flex-direction:column;gap:5px}
  .label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .keypoint{font-size:15.5px;line-height:1.6;font-weight:600;border-left:2.5px solid var(--indigo);padding-left:12px}
  .body{font-size:14.5px;line-height:1.65;color:var(--ink-soft)}
  .src{font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:var(--paper);
       border:1px solid var(--rule);border-radius:8px;padding:11px 13px;color:var(--ink-soft)}
  .fixnote{font-size:13.5px;line-height:1.65;background:var(--no-bg);border:1px solid var(--no);
           border-radius:8px;padding:11px 13px;color:var(--ink)}
  .label.warn{color:var(--no)}
  ul.why{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  ul.why li{font-size:14px;line-height:1.6;color:var(--ink-soft);display:flex;gap:9px}
  ul.why li b{color:var(--no);font-weight:700;flex:none;min-width:14px}
  table.vocab{border-collapse:collapse;font-size:14px;width:100%}
  table.vocab td{padding:5px 12px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  table.vocab td:first-child{font-family:var(--jp);font-weight:650;white-space:nowrap}
  table.vocab td:nth-child(2){font-family:var(--jp);color:var(--ink-faint);white-space:nowrap}
  table.vocab td:last-child{color:var(--ink-soft);width:99%}
  .caveat{font-size:11.5px;color:var(--ink-faint);font-style:italic}

  /* ---------- nav ---------- */
  .nav{display:flex;gap:8px;align-items:center;margin-top:20px}
  .nav .spacer{flex:1}
  .hint{font-size:11.5px;color:var(--ink-faint)}
  .hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);
            border-radius:4px;padding:1px 5px;background:var(--card)}

  /* ---------- list mode ---------- */
  .list{display:flex;flex-direction:column;gap:14px}
  .list .card{padding:20px 22px}
  .empty{text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:15px}

  /* ---------- reference tables ---------- */
  .refs{display:flex;flex-direction:column;gap:22px}
  .refs h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           color:var(--indigo);margin:0 0 2px}
  .refs .from{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}
  .rrow{display:grid;grid-template-columns:minmax(88px,auto) 1fr;gap:4px 18px;
        padding:12px 0;border-top:1px solid var(--rule)}
  .rrow:first-of-type{border-top:0}
  .rterm{font-family:var(--jp);font-size:19px;font-weight:650;line-height:1.4}
  .rmean{font-size:14.5px;line-height:1.6;color:var(--ink-soft)}
  .rex{grid-column:2;display:flex;flex-direction:column;gap:3px;margin-top:5px;
       border-left:2px solid var(--rule-strong);padding-left:11px}
  .rex div{font-size:14px;line-height:1.6}
  .rex .ja{font-family:var(--jp);color:var(--ink)}
  .rex .vi{color:var(--ink-faint);font-size:13px}
  @media (max-width:600px){ .rrow{grid-template-columns:1fr;gap:3px} .rex{grid-column:1} }

  @media (max-width:600px){
    .wrap{padding:0 14px 80px}
    .card{padding:20px 17px 18px;border-radius:10px}
    .stem{font-size:20px} .stem.latin{font-size:17px}
    .otext{font-size:16px} .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="rail">
      <span class="course">JPD113</span>
      <span class="subtitle">Tiếng Nhật sơ cấp · Semester 3</span>
      <span class="spacer"></span>
      <span class="stat" id="stat"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="controls">
      <select id="sect"></select>
      <div class="seg">
        <button class="btn" id="mQuiz"  aria-pressed="true">Luyện tập</button>
        <button class="btn" id="mRead"  aria-pressed="false">Đọc</button>
        <button class="btn" id="mList"  aria-pressed="false">Danh sách</button>
        <button class="btn" id="mRefs"  aria-pressed="false" hidden>Tra cứu</button>
      </div>
      <button class="btn" id="shuf" aria-pressed="false">Trộn câu</button>
      <button class="btn" id="wrong" aria-pressed="false">Chỉ câu sai</button>
      <span class="spacer"></span>
      <button class="btn" id="reset">Xoá tiến độ</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="single">
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn" id="prev">← Trước</button>
      <button class="btn" id="next">Sau →</button>
      <span class="spacer"></span>
      <span class="hint"><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> chọn · <kbd>→</kbd> câu sau</span>
    </div>
  </div>
  <div class="list" id="listView" hidden></div>
  <div class="refs" id="refsView" hidden></div>
</main>

<script>
const DATA = {"course":"JPD113","sections":["Kanji","Điền vào chỗ trống","Công việc","Hành động","Sở thích","Vị trí, Địa điểm","Đồ vật, Đồ ăn","Người","Đất nước","Thời gian","Giao tiếp, chào hỏi","Động từ","Xếp câu","Chọn từ khác loại","Nghĩa"],"questions":[{"id":8,"slide":8,"section":"Kanji","prompt":"Các chữ Hán trong ngoặc [  ] có cách đọc tương ứng như thế nào? Hãy chọn đáp án đúng trong A. B. C. D","setup":"","stem":"これは [一万円]です。","options":[{"label":"A","text":"いちせん"},{"label":"B","text":"いちまん"},{"label":"C","text":"いちひゃく"},{"label":"D","text":"まん"}],"answer":"B","fix":"","note":"B\nNhất Vạn =\u003e いちまん (1 vạn)","key_point":"Cách đọc chữ Hán [一万] (Nhất Vạn) là いちまん (10.000).","why_correct":"Chữ Hán [一万] (Nhất Vạn) có nghĩa là 10.000, được đọc là いちまん. Khi ghép với 円 (yên) ta được 一万円 (いちまんえん) nghĩa là 10.000 yên.","why_wrong":[{"label":"A","why":"いちせん (Nhất Thiên) nghĩa là 1.000, không khớp với chữ 万 (Vạn)."},{"label":"C","why":"いちひゃく (Nhất Bách) nghĩa là 100, sai chữ Hán và thực tế 100 chỉ đọc là ひゃく."},{"label":"D","why":"まん chỉ là chữ Vạn, thiếu từ chỉ số lượng 一 (いち) ở phía trước."}],"vocab":[{"word":"一万","reading":"いちまん","meaning":"10.000 (1 vạn)"},{"word":"円","reading":"えん","meaning":"Yên (đơn vị tiền tệ Nhật)"}]},{"id":9,"slide":9,"section":"Kanji","prompt":"Các từ trong ngoặc [ ] dưới đây có chữ Hán tương ứng như thế nào? Hãy chọn đáp án đúng trong A. B. C. D.","setup":"","stem":"いま、[ごじ] です。","options":[{"label":"A","text":"六時"},{"label":"B","text":"五寺"},{"label":"C","text":"六寺"},{"label":"D","text":"五時"}],"answer":"D","fix":"","note":"D\n5 giờ, chữ Ngũ Thời","key_point":"Cách viết chữ Hán của ごじ (5 giờ) là 五時 (Ngũ Thời).","why_correct":"ごじ (goji) nghĩa là 5 giờ, được ghép từ chữ 五 (Ngũ - số 5) và 時 (Thời - giờ).","why_wrong":[{"label":"A","why":"六時 (Lục Thời) đọc là ろくじ (rokuji), nghĩa là 6 giờ."},{"label":"B","why":"五寺 dùng sai chữ 寺 (Tự - ngôi chùa) thay vì chữ 時 (Thời)."},{"label":"C","why":"六寺 kết hợp sai số 6 (六) và chữ 寺 (Tự - ngôi chùa)."}],"vocab":[{"word":"今","reading":"いま","meaning":"bây giờ (Kim)"},{"word":"五時","reading":"ごじ","meaning":"5 giờ (Ngũ Thời)"}]},{"id":10,"slide":10,"section":"Kanji","prompt":"Các chữ Hán trong ngoặc [ ] có cách đọc tương ứng như thế nào? Hãy chọn đáp án đúng trong A. B. C. D.","setup":"","stem":"マリーさんは [二十一才] ですか。","options":[{"label":"A","text":"にじゅういちさい"},{"label":"B","text":"にじゅういっさい"},{"label":"C","text":"じゅうさい"},{"label":"D","text":"にじゅうはっさい"}],"answer":"B","fix":"","note":"B\n21 tuổi =\u003e Cách đọc: 20 + 1 tuổi: にじゅういっさい","key_point":"Cách đếm tuổi kết thúc bằng số 1 (〜いっさい) có biến âm gấp đôi phụ âm.","why_correct":"Chữ Hán 二十一才 (âm Hán Việt: Nhị Thập Nhất Tuế) nghĩa là 21 tuổi, được đọc là にじゅういっさい do có biến âm gấp đôi phụ âm ở đuôi chỉ tuổi (いち + さい biến thành いっさい).","why_wrong":[{"label":"A","why":"にじゅういちさい sai vì không chia biến âm ở đuôi chỉ tuổi (いちさい là sai ngữ pháp)."},{"label":"C","why":"じゅうさい nghĩa là 10 tuổi (thường đọc là じゅっさい hoặc じっさい), thiếu mất số 20 ở đầu."},{"label":"D","why":"にじゅうはっさい nghĩa là 28 tuổi (二十八才)."}],"vocab":[{"word":"二十一才","reading":"にじゅういっさい","meaning":"21 tuổi"},{"word":"才","reading":"さい","meaning":"tuổi (đơn vị đếm)"}]},{"id":11,"slide":11,"section":"Kanji","prompt":"Các từ trong ngoặc [  ] dưới đây có chữ Hán tương ứng như thế nào? Hãy chọn đáp án đúng trong A. B. C. D.","setup":"","stem":"アリさんは [なんさい] ですか。","options":[{"label":"A","text":"何ナ"},{"label":"B","text":"何才"},{"label":"C","text":"可才"},{"label":"D","text":"可ナ"}],"answer":"B","fix":"","note":"B\nmấy tuổi, chữ Hà Tài","key_point":"Cách viết chữ Hán của \"なんさい\" (mấy tuổi) là \"何才\" (Hà Tài).","why_correct":"Chữ \"何\" (Hà) nghĩa là \"mấy\" và \"才\" (Tài - chữ thay thế thông dụng cho 歳 Tuế) nghĩa là \"tuổi\". Ghép lại ta được \"何才\" (なんさい) nghĩa là \"mấy tuổi\".","why_wrong":[{"label":"A","why":"Chữ \"ナ\" là chữ Katakana, không phải chữ Hán \"才\" (Tài)."},{"label":"C","why":"Dùng sai chữ \"可\" (Khả) thay vì chữ \"何\" (Hà)."},{"label":"D","why":"Sai cả chữ \"可\" (Khả) và dùng chữ Katakana \"ナ\" không có nghĩa."}],"vocab":{"word":"何才","reading":"なんさい","meaning":"mấy tuổi (Hà Tài)"}},{"id":12,"slide":12,"section":"Kanji","prompt":"Các chữ Hán trong ngoặc [ ] có cách đọc tương ứng như thế nào? Hãy chọn đáp án đúng trong A. B. C. D.","setup":"","stem":"ミンさんは日本語 [学校] の先生です。","options":[{"label":"A","text":"かっこう"},{"label":"B","text":"かくこう"},{"label":"C","text":"がくこう"},{"label":"D","text":"がっこう"}],"answer":"D","fix":"","note":"D\nHọc Hiệu (trường học) =\u003e がっこう","key_point":"Chữ Hán 「学校」 (Học Hiệu) có cách đọc là 「がっこう」 với âm ngắt.","why_correct":"Chữ 「学校」 (Học Hiệu - trường học) kết hợp từ 「学」 (がく) và 「校」 (こう), khi ghép lại âm 「く」 biến đổi thành âm ngắt 「っ」 tạo thành 「がっこう」.","why_wrong":[{"label":"A","why":"「かっこう」 sai âm đầu, thiếu âm đục 「が」 (đây là cách đọc của từ 恰好 - ngoại hình)."},{"label":"B","why":"「かくこう」 không đúng quy tắc biến âm và không có nghĩa."},{"label":"C","why":"「がくこう」 là cách đọc ghép thô chưa biến âm, không đúng phát âm thực tế."}],"vocab":[{"word":"学校","reading":"がっこう","meaning":"trường học (Học Hiệu)"},{"word":"先生","reading":"せんせい","meaning":"giáo viên, thầy cô (Tiên Sinh)"},{"word":"日本語","reading":"にほんご","meaning":"tiếng Nhật (Nhật Bản Ngữ)"}]},{"id":13,"slide":13,"section":"Kanji","prompt":"Hãy chọn cách viết kanji đúng cho từ trong ngoặc ( ) trong câu sau đây.","setup":"","stem":"ナタポンさんの (がっこう) は にほんごがっこうです。","options":[{"label":"A","text":"学校"},{"label":"B","text":"日本"},{"label":"C","text":"大学"},{"label":"D","text":"先生"}],"answer":"A","fix":"","note":"A","key_point":"Cách viết Kanji của がっこう (trường học) là 学校 (Học Hiệu).","why_correct":"学校 (Học Hiệu) có cách đọc là がっこう, mang nghĩa là trường học, phù hợp hoàn toàn với từ hiragana trong ngoặc.","why_wrong":[{"label":"B","why":"日本 (Nhật Bản) đọc là にほん, nghĩa là nước Nhật."},{"label":"C","why":"大学 (Đại Học) đọc là だいがく, nghĩa là trường đại học."},{"label":"D","why":"先生 (Tiên Sinh) đọc là せんせい, nghĩa là giáo viên."}],"vocab":[{"word":"学校","reading":"がっこう","meaning":"trường học"},{"word":"日本語学校","reading":"にhんごがっこう","meaning":"trường tiếng Nhật"}]},{"id":14,"slide":14,"section":"Kanji","prompt":"Hãy lựa chọn cách đọc đúng cho từ kanji trong ngoặc ( ) trong câu sau đây.","setup":"","stem":"アンナさんは (学生) です。","options":[{"label":"A","text":"がくだい"},{"label":"B","text":"がっこう"},{"label":"C","text":"がくせい"},{"label":"D","text":"くがせい"}],"answer":"C","fix":"","note":"C\nTiên Sinh (thầy/cô) =\u003e せんせい","key_point":"Cách đọc Kanji của 学生 (Học Sinh) là がくせい.","why_correct":"Chữ 「学生」 có âm Hán Việt là \"Học Sinh\". Trong đó, 「学」 đọc là がく và 「生」 đọc là せい (giống chữ 生 trong 先生 - せんせい), ghép lại thành がくせい.","why_wrong":[{"label":"A","why":"がくだい là từ không có nghĩa, dễ bị nhầm lẫn với 大学 (だいがく - Đại học)."},{"label":"B","why":"がっこう là cách đọc của chữ 学校 (Học Hiệu), nghĩa là trường học."},{"label":"D","why":"くがせい bị viết sai thứ tự các âm tiết và là từ không có nghĩa."}],"vocab":[{"word":"学生","reading":"がくせい","meaning":"học sinh, sinh viên"},{"word":"先生","reading":"せんせい","meaning":"giáo viên, thầy/cô"}]},{"id":15,"slide":15,"section":"Kanji","prompt":"Hãy lựa chọn cách đọc đúng cho từ kanji trong ngoặc (   ) trong câu sau đây.","setup":"","stem":"あそこは (大学) です。","options":[{"label":"A","text":"だいがく"},{"label":"B","text":"がっこう"},{"label":"C","text":"かくせい"},{"label":"D","text":"がっくせい"}],"answer":"A","fix":"","note":"A\nĐại Học =\u003e だいがく","key_point":"Cách đọc Kanji của từ 「大学」 (Đại Học) là 「だいがく」.","why_correct":"Từ 「大学」 (âm Hán Việt: Đại Học) được ghép từ chữ 「大」 (đọc là だい) và chữ 「学」 (đọc là がく) tạo thành 「だいがく」 nghĩa là trường đại học.","why_wrong":[{"label":"B","why":"「がっこう」 là cách đọc của từ 「学校」 (Học Hiệu), nghĩa là trường học."},{"label":"C","why":"「かくせい」 là cách đọc sai âm của từ 「学生」 (Học Sinh - đọc đúng là がくせい)."},{"label":"D","why":"「がっくせい」 là từ không có nghĩa và viết sai chính tả."}],"vocab":[{"word":"大学","reading":"だいがく","meaning":"trường đại học"},{"word":"あそこ","reading":"あそこ","meaning":"chỗ kia, đằng kia"},{"word":"学校","reading":"がっこう","meaning":"trường học"},{"word":"学生","reading":"がくせい","meaning":"học sinh, sinh viên"}]},{"id":16,"slide":16,"section":"Kanji","prompt":"Hãy chọn cách viết kanji đúng cho từ trong ngoặc ( ) trong câu sau đây.","setup":"","stem":"(あのひと) は アメリカじんじゃありません。","options":[{"label":"A","text":"あの人"},{"label":"B","text":"あの校"},{"label":"C","text":"あの語"},{"label":"D","text":"あの日"}],"answer":"A","fix":"","note":"A\nあのひと : người kia =\u003e tìm đáp án có chữ 人(nhân) nghĩa là người","key_point":"Chữ 人 (Nhân) có nghĩa là người, đọc là ひと (hito).","why_correct":"「あのひと」 nghĩa là \"người kia\", trong đó từ 「ひと」 được viết bằng chữ Kanji 「人」 (âm Hán Việt: Nhân) chỉ người.","why_wrong":[{"label":"B","why":"Chữ 「校」 (âm Hán Việt: Hiệu) nghĩa là trường học, không liên quan đến người."},{"label":"C","why":"Chữ 「語」 (âm Hán Việt: Ngữ) nghĩa là ngôn ngữ hoặc tiếng nói."},{"label":"D","why":"Chữ 「日」 (âm Hán Việt: Nhật) nghĩa là ngày hoặc mặt trời."}],"vocab":[{"word":"あの人","reading":"あのひと","meaning":"người kia"},{"word":"アメリカ人","reading":"アメリカじん","meaning":"người Mỹ"}]},{"id":17,"slide":17,"section":"Kanji","prompt":"Hãy chọn cách viết kanji đúng cho từ trong ngoặc ( ) trong câu sau đây.","setup":"","stem":"私は (はたち) です。","options":[{"label":"A","text":"20本"},{"label":"B","text":"20語"},{"label":"C","text":"20日"},{"label":"D","text":"20才"}],"answer":"D","fix":"","note":"D\nはたち: 20 tuổi =\u003e tìm đáp án có chữ 才","key_point":"はたち nghĩa là 20 tuổi, được viết bằng Kanji là 20才 (hoặc 20歳).","why_correct":"はたち là cách đọc đặc biệt dành riêng cho 20 tuổi. Trong đó, 20才 (Âm Hán Việt: Nhị Thập Tài) là cách viết giản lược thông dụng của 20歳.","why_wrong":[{"label":"A","why":"20本 (Nhị Thập Bản) đọc là にじゅっぽん, dùng để đếm các vật dài thon như chai, bút."},{"label":"B","why":"20語 (Nhị Thập Ngữ) đọc là にじゅうご, nghĩa là 20 từ hoặc 20 ngôn ngữ."},{"label":"C","why":"20日 (Nhị Thập Nhật) đọc là はつか, nghĩa là ngày 20 hoặc 20 ngày."}],"vocab":[{"word":"はたち","reading":"20才 / 20歳","meaning":"2 âu hỏi làm gì."},{"label":"D","why":"どこ (ở đâu) kết hợp thành どこも nghĩa là \u0027không nơi nào cả\u0027, thường đi với động từ di chuyển như 行きません (không đi đâu cả) chứ không đi với しません."}],"vocab":[{"word":"にちようび","reading":"日曜日","meaning":"Chủ nhật"},{"word":"なに","reading":"何","meaning":"Cái gì"},{"word":"します","reading":"します","meaning":"Làm"}]},{"id":64,"slide":64,"section":"Điền vào chỗ trống","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: すみません、インフォメーションは（　　　）ですか。\nB: あちらです。","options":[{"label":"A","text":"だれ"},{"label":"B","text":"なに"},{"label":"C","text":"どこ"},{"label":"D","text":"いつ"}],"answer":"C","fix":"","note":"C: = where (ở đâu)\nTrả lời là あちら(ở đằng kia), vậy câu hỏi sẽ là ở đâu =\u003e chọn C","key_point":"Dùng từ nghi vấn どこ (ở đâu) khi câu trả lời chỉ nơi chốn, phương hướng (あちら).","why_correct":"Vì câu trả lời là 「あちら」 (ở đằng kia) chỉ phương hướng và địa điểm, nên câu hỏi phải dùng từ nghi vấn chỉ nơi chốn là 「どこ」 (ở đâu).","why_wrong":[{"label":"A","why":"「だれ」 nghĩa là \"ai\", dùng để hỏi người."},{"label":"B","why":"「なに」 nghĩa là \"cái gì\", dùng để hỏi đồ vật hoặc sự việc."},{"label":"D","why":"「いつ」 nghĩa là \"khi nào\", dùng để hỏi thời gian."}],"vocab":[{"word":"インフォメーション","reading":"いんふぉめーしょん","meaning":"Quầy thông tin"},{"word":"あちら","reading":"あちら","meaning":"Đằng kia, phía kia"}]},{"id":65,"slide":65,"section":"Điền vào chỗ trống","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: パウさんは ここ、(      ) へいきますか。\nB: としょかんへ いきます。","options":[{"label":"A","text":"なん"},{"label":"B","text":"どこ"},{"label":"C","text":"いつ"},{"label":"D","text":"だれ"}],"answer":"B","fix":"","note":"B\nとしょかん(thư viện) là từ chỉ địa điểm, vậy câu hỏi phải là đi đâu =\u003e chọn B","key_point":"Dùng từ nghi vấn どこ (ở đâu) khi hỏi về địa điểm, phương hướng di chuyển.","why_correct":"Câu trả lời là としょかん (thư viện) chỉ địa điểm đi kèm trợ từ chỉ phương hướng へ, do đó câu hỏi phải dùng từ nghi vấn chỉ nơi chốn どこ.","why_wrong":[{"label":"A","why":"なん (cái gì) dùng để hỏi về đồ vật hoặc hành động, không dùng cho địa điểm."},{"label":"C","why":"いつ (khi nào) dùng để hỏi về thời gian."},{"label":"D","why":"だれ (ai) dùng để hỏi về người."}],"vocab":[{"word":"としょかん","reading":"としょかん","meaning":"thư viện"},{"word":"いきます","reading":"いきます","meaning":"đi"}]},{"id":66,"slide":66,"section":"Điền vào chỗ trống","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"お誕生日 (たんじょうび) は (  ) ですか。","options":[{"label":"A","text":"なん"},{"label":"B","text":"どこ"},{"label":"C","text":"いつ"},{"label":"D","text":"どちら"}],"answer":"C","fix":"","note":"C\nsinh nhật là khi nào?","key_point":"Dùng nghi vấn từ いつ (khi nào) để hỏi về thời gian hoặc ngày sinh nhật.","why_correct":"いつ mang nghĩa là \"khi nào\", là từ để hỏi phù hợp nhất khi muốn hỏi về thời gian diễn ra sinh nhật (お誕生日).","why_wrong":[{"label":"A","why":"なん (cái gì) không đứng một mình trước ですか để hỏi về ngày sinh nhật (phải dùng なんがつなんにち)."},{"label":"B","why":"どこ (ở đâu) là nghi vấn từ dùng để hỏi về địa điểm, nơi chốn."},{"label":"D","why":"どちら (phía nào/cái nào) dùng để hỏi phương hướng hoặc lựa chọn giữa hai vật."}],"vocab":[{"word":"お誕生日","reading":"おたんじょうび","meaning":"sinh nhật (cách nói lịch sự)"},{"word":"いつ","reading":"いつ","meaning":"khi nào"}]},{"id":67,"slide":67,"section":"Điền vào chỗ trống","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: これは (　　) の とけいですか。\nB: インドの　とけいです。","options":[{"label":"A","text":"どこ"},{"label":"B","text":"いくら"},{"label":"C","text":"なん"},{"label":"D","text":"どちら"}],"answer":"A","fix":"","note":"A\nTrả lời là インドのとけい (đồng hồ của Ấn Độ), như vậy câu hỏi sẽ là đồng hồ của nước nào.\nKhi hỏi về đất nước thì luôn sử dụng どちら chứ không dùng どこ trường hợp này hỏi bạn đến từ đâu thì hợp lý, còn đồ vật thì cần chó gì lịch sự","key_point":"Dùng nghi vấn từ 「どこ」 để hỏi về xuất xứ (nước nào, hãng nào) c  câu hỏi xác nhận \"きょうしですか\" (Có phải là giáo viên không?).","why_wrong":[{"label":"A","why":"\"おしごとは？\" dùng để hỏi công việc, câu trả lời sẽ trực tiếp nêu nghề nghiệp chứ không bắt đầu bằng \"はい\"."},{"label":"B","why":"\"いつですか。\" dùng để hỏi về thời gian (Khi nào?), không phù hợp với câu trả lời."},{"label":"D","why":"\"なんさいですか。\" dùng để hỏi tuổi (Mấy tuổi?), không liên quan đến nghề nghiệp giáo viên."}],"vocab":[{"word":"きょうし","reading":"きょうし","meaning":"giáo viên (Giáo Sư)"},{"word":"おしごと","reading":"おしごと","meaning":"công việc (Sĩ Sự)"},{"word":"なんさい","reading":"なんさい","meaning":"mấy tuổi (Hà Tuế)"}]},{"id":83,"slide":83,"section":"Công việc","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) trong câu sau đây.","setup":"","stem":"A: たなかさんのおしごとは？\nB: (　　)。","options":[{"label":"A","text":"にほんごのきょうしのがっこうです"},{"label":"B","text":"にほんごがっこうのきょうしです"},{"label":"C","text":"きょうしのがっこうじゃありません"},{"label":"D","text":"가っこうのきょうしじゃありません"}],"answer":"B","fix":"","note":"B\nおしごとは(hỏi công việc là gì) =\u003e chọn B (giáo viên của trường tiếng Nhật)","key_point":"Cách trả lời câu hỏi về nghề nghiệp bằng danh từ chỉ công việc cụ thể.","why_correct":"Câu hỏi 「おしごとは？」 dùng để hỏi về công việc của ai đó. Đáp án B 「にほんごがっこうのきょうしです」 (Tôi là giáo viên trường tiếng Nhật) là câu trả lời trực tiếp và lịch sự về nghề nghiệp.","why_wrong":[{"label":"A","why":"Sai trật tự từ, cụm này mang nghĩa là \"trường học của giáo viên tiếng Nhật\" chứ không chỉ nghề nghiệp."},{"label":"C","why":"Mang nghĩa \"không phải là trường học của giáo viên\", hoàn toàn không phù hợp để trả lời cho câu hỏi hỏi về nghề nghiệp."},{"label":"D","why":"Bị lỗi chính tả chữ 「が」 viết nhầm thành chữ tiếng Hàn 「가」, và việc trả lời phủ định không tự nhiên trong ngữ cảnh này."}],"vocab":[{"word":"仕事","reading":"しごと (Sĩ Sự)","meaning":"Công việc"},{"word":"日本語学校","reading":"にほんごがっこう (Nhật Bản Ngữ Học Hiệu)","meaning":"Trường tiếng Nhật"},{"word":"教師","reading":"きょうし (Giáo Sư)","meaning":"Giáo viên"}]},{"id": ","meaning":"nhân viên công ty"}]},{"id":96,"slide":96,"section":"Hành động","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: ふゆやすみ、りょこうを しますか。\nB: いいえ、(          )。","options":[{"label":"A","text":"りょこうをします"},{"label":"B","text":"りょこうをしません"},{"label":"C","text":"りょこうではありません"},{"label":"D","text":"りょこうじゃありません"}],"answer":"B","fix":"","note":"B\nCâu hỏi là しますか, nếu trả lời là không thì sẽ là しません","key_point":"Phủ định của động từ 「しますか」 là 「いいえ、しません」.","why_correct":"Câu hỏi dùng động từ 「しますか」 (có làm... không?), nên khi trả lời phủ định với 「いいえ」, ta phải dùng dạng phủ định tương ứng của động từ là 「しません」.","why_wrong":[{"label":"A","why":"りょこうをします là thể khẳng định (sẽ du lịch), mâu thuẫn với từ phủ định 「いいえ」 ở đầu câu."},{"label":"C","why":"りょこうではありません là phủ định của danh từ (không phải là du lịch), không dùng để trả lời cho câu hỏi hành động."},{"label":"D","why":"りょこうじゃありません là dạng phủ định danh từ thân mật hơn của ではありません, không phù hợp ngữ cảnh này."}],"vocab":[{"word":"冬休み","reading":"ふゆやすみ","meaning":"kỳ nghỉ đông (Âm Hán Việt: Đông Hưu)"},{"word":"旅行","reading":"りょこう","meaning":"du lịch (Âm Hán Việt: Lữ Hành)"}]},{"id":97,"slide":97,"section":"Hành động","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A「にほんへ　いきます。」\nB「へえ。(　　　)。」","options":[{"label":"A","text":"いいです"},{"label":"B","text":"そうですか"},{"label":"C","text":"えっ"},{"label":"D","text":"そうです"}],"answer":"B","fix":"","note":"B","key_point":"Sử dụng 「そうですか」 để tiếp nhận và phản hồi thông tin mới một cách lịch sự.","why_correct":"「そうですか」 có nghĩa là \"Thế à? / Vậy à?\", kết hợp với thán từ 「へえ」 (Ồ) tạo thành một phản hồi tự nhiên khi nghe người khác chia sẻ thông tin mới.","why_wrong":[{"label":"A","why":"「いいです」 nghĩa là \"được đấy\" hoặc \"không cần đâu\", không phù hợp để phản hồi trong ngữ cảnh này."},{"label":"C","why":"「えっ」 là thán từ biểu thị sự ngạc nhiên đột ngột, không đứng sau thán từ 「へえ」."},{"label かいます"}],"answer":"A","fix":"","note":"A\nChủ Nhật, tôi nghe nhạc ở nhà.","key_point":"Trợ từ 「で」 chỉ nơi diễn ra hành động và cụm 「おんがくをききます」 (nghe nhạc).","why_correct":"Trợ từ 「で」 biểu thị địa điểm xảy ra hành động 「うちで」 (ở nhà), kết hợp với động từ 「ききます」 (nghe) phù hợp với tân ngữ 「おんがく」 (âm nhạc).","why_wrong":[{"label":"B","why":"Động từ 「はたらきます」 (làm việc) không thể đi với tân ngữ 「おんがくを」 (âm nhạc)."},{"label":"C","why":"Trợ từ 「に」 không dùng để chỉ nơi diễn ra hành động hành vi, và 「よめます」 (có thể đọc) không đi với âm nhạc."},{"label":"D","why":"Trợ từ 「ni」 sai ngữ pháp và động từ 「かいます」 (mua) không phù hợp với ngữ cảnh này."}],"vocab":[{"word":"日曜日","reading":"にちようび","meaning":"Chủ nhật (Âm Hán Việt: Nhật Diệu Nhật)"},{"word":"うち","reading":"うち","meaning":"Nhà"},{"word":"おんがく","reading":"おんがく","meaning":"Âm nhạc (Âm Hán Việt: Âm Nhạc)"},{"word":"ききます","reading":"ききます","meaning":"Nghe"}]},{"id":101,"slide":101,"section":"Sở thích","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (  ) trong câu sau đây.","setup":"","stem":"A: ミラーさんのしゅみはりょうりとサッカーですか。\nB: いいえ、(   )。","options":[{"label":"A","text":"りょうりとサッカーです"},{"label":"B","text":"りょうりとサッカーじゃありません"},{"label":"C","text":"りょうりですか"},{"label":"D","text":"りょうりとサッカーですか"}],"answer":"B","fix":"","note":"B\nCâu hỏi đang hỏi sở thích của nó là nấu ăn và đá bóng phải không\nNó trả lời là không =\u003e chọn B (đáp án có じゃありません)","key_point":"Sử dụng thể phủ định 「じゃありません」 để trả lời cho câu hỏi danh từ khi có 「いいえ」.","why_correct":"Khi câu trả lời bắt đầu bằng 「いいえ」 (Không), ta phải phủ định thông tin được hỏi bằng cách chuyển đuôi 「です」 thành 「じゃありません」 (Không phải là...).","why_wrong":[{"label":"A","why":"Đây là thể khẳng định (です), mâu thuẫn trực tiếp với từ phủ định 「いいえ」 ở đầu câu."},{"label":"C","why":"Đây là một câu hỏi lấp lửng về nấu ăn, không phù hợp để làm câu trả lời."},{"label":"D","why":"Đây là câu hỏi lặp lại câu của người A, không dùng để trả lời cho câu hỏi nghi vấn."}],"vocab":[{"word":"しゅみ","reading":"しゅみ","meaning":"sở thích (Âm Hán Việt: Thú Vị)"},{"word":"りょうり","reading":"りょうり","meaning":"nấu ăn, món ăn (Âm Hán Việt: Liệu Lý)"},{"word":"サッカー","reading":"さっかー","meaning":"bóng đá"}]},{"id":102,"slide":102,"section":"Sở thích","prompt":"Chọn đáp án thích hợp trong A. B. C. D để điền vào ngoặc cho câu sau:","setup":"","stem":"A: しゅみは なんですか。\nB: (　　) です。","options":[{"label":"A","text":"スポーツ"},{"label":"B","text":"エレベーター"},{"label":"C","text":"ブラジル"},{"label":"D","text":"トイレ"}],"answer":"A","fix":"","note":"A","key_point":"Hỏi về sở thích (しゅみ - 趣味) và trả lời bằng danh từ chỉ hoạt động giải trí.","why_correct":"Câu hỏi \u0027しゅみは なんですか\u0027 nghĩa là \u0027Sở thích của bạn là gì?\u0027. Trong các phương án, chỉ có スポーツ (thể thao) là danh từ chỉ sở thích hợp lý.","why_wrong":[{"label":"B","why":"エレベーター nghĩa là thang máy, không thể là sở thích."},{"label":"C","why":"ブラジル nghĩa là nước Brazil, là tên quốc gia."},{"label":"D","why":"トイレ nghĩa là nhà vệ sinh, không thể là sở thích."}],"vocab":[{"word":"趣味","reading":"しゅみ (Thú Vị)","meaning":"sở thích"},{"word":"スポーツ","reading":"すぽーつ","meaning":"thể thao"},{"word":"エレベーター","reading":"えれべーたー","meaning":"thang máy"},{"word":"ブラジル","reading":"ぶらじる","meaning":"nước Brazil"},{"word":"トイレ","reading":"といれ","meaning":"nhà vệ sinh"}]},{"id":103,"slide":103,"section":"Sở thích","prompt":"Chọn đáp án thích hợp trong A. B. C. D để điền vào ngoặc cho câu sau:","setup":"","stem":"しゅみは (　　) です。","options":[{"label":"A","text":"本を よみます"},{"label":"B","text":"どくしょ"},{"label":"C","text":"あさ"},{"label":"D","text":"おきます"}],"answer":"B","fix":"","note":"B","key_point":"Cấu trúc nói về sở thích: しゅみは [Danh từ] です.","why_correct":"どくしょ (読書 - Độc Thư) là một danh từ chỉ việc đọc sách, phù hợp hoàn hảo để điền vào cấu trúc danh từ chỉ sở thích.","why_wrong":[{"label":"A","why":"本を よみます là cụm động từ, muốn làm vị ngữ chỉ sở thích phải chuyển thành dạng danh từ hóa là 本を読むことです."},{"label":"C","why":"あさ nghĩa là buổi sáng, không phải là một sở thích."},{"label":"D","why":"おきます là động từ thức dậy, không thể đi trực tiếp trước です và không mang ý nghĩa sở thích."}],"vocab":[{"word":"しゅみ","reading":"しゅみ","meaning":"sở thích (Hán Việt: Thú Vị)"},{"word":"どくしょ","reading":"どくしょ","meaning":"việc đọc sách (Hán Việt: Độc Thư)"},{"word":"あさ","reading":"あさ","meaning":"buổi sáng (Hán Việt: Triều)"},{"word":"おきます","reading":"おきます","meaning":"thức dậy (Hán Việt: Khởi)"}]},{"id":104,"slide":104,"section":"Sở thích","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) .","setup":"","stem":"A: しゅみはなんですか。\nB: (          ) です。","options":[{"label":"A","text":"だいがく"},{"label":"B","text":"しちがつ"},{"label":"C","text":"おんがく"},{"label":"D","text":"がくせい"}],"answer":"C","fix":"","note":"C","key_point":"Cách hỏi và trả lời về sở thích (しゅみ) trong tiếng Nhật.","why_correct":"Câu hỏi \u0027しゅみはなんですか\u0027 nghĩa là \u0027Sở thích của bạn là gì?\u0027. Do đó, câu trả lời phải là một danh từ chỉ sở thích, và \u0027おんがく\u0027 (âm nhạc) là lựa chọn phù hợp nhất.","why_wrong":[{"label":"A","why":"\u0027だいがく\u0027 (大学 - Đại Học) nghĩa là trường đại học, không dùng để trả lời cho câu hỏi về sở thích."},{"label":"B","why":"\u0027しちがつ\u0027 (七月 - Thất Nguyệt) nghĩa là tháng 7, là từ chỉ thời gian."},{"label":"D","why":"\u0027がくせい\u0027 (学生 - Học Sinh) nghĩa là học sinh/sinh viên, chỉ danh tính hoặc nghề nghiệp."}],"vocab":[{"word":"しゅみ","reading":"shumi","meaning":"sở thích (Sino-Viet: Thú Vị)"},{"word":"おんがく","reading":"ongaku","meaning":"âm nhạc (Sino-Viet: Âm Nhạc)"},{"word":"だいがく","reading":"daigaku","meaning":"trường đại học (Sino-Viet: Đại Học)"},{"word":"がくせい","reading":"gakusei","meaning":"học sinh, sinh viên (Sino-Viet: Học Sinh)"}]},{"id":105,"slide":105,"section":"Sở thích","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: Bさんの　しゅみは　なんですか。\nB: サッカーです。\nA: (　　)。","options":[{"label":"A","text":"私の　しゅみは　サッカーです。"},{"label":"B","text":"私の　しゅみも　サッカーです。"},{"label":"C","text":"私の　しゅみは　サッカーですか。"},{"label":"D","text":"私の　しゅみも　サッカーですか。"}],"answer":"B","fix":"","note":"B\nB đã trả lời là môn đá bóng (サッカー). Đáp án cũng có chữ サッカー nên tìm đáp án có chữ も (cũng)\n=\u003e chọn A","key_point":"Sử dụng trợ từ 「も」 để biểu thị sự tương đồng (cũng) về sở thích.","why_correct":"Khi người B trả lời sở thích là bóng đá (サッカー), người A muốn chia sẻ rằng bản thân mình cũng có cùng sở thích đó, do đó cần dùng trợ từ 「も」 (cũng) trong câu khẳng định.","why_wrong":[{"label":"A","why":"Dùng trợ từ 「は」 chỉ mang tính chất giới thiệu đơn thuần, không thể hiện được sự đồng điệu \"cũng\" với người B."},{"label":"C","why":"Là câu hỏi tự vấn về sở thích của chính mình bằng trợ từ 「は」 và 「か」, hoàn toàn không phù hợp trong ngữ cảnh này."},{"label":"D","why":"Là câu hỏi tự vấn bằng trợ từ 「も」 và 「か」, không tự nhiên khi tự hỏi về sở thích của bản thân."}],"vocab":[{"word":"しゅみ","reading":"しゅみ","meaning":"Sở thích (âm Hán Việt: Thú Vị)"},{"word":"サッカー","reading":"さっかー","meaning":"Môn bóng đá"}]},{"id":107,"slide":107,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"______ で　しんぶんを　かいます。","options":[{"label":"A","text":"うち"},{"label":"B","text":"コンビニ"},{"label":"C","text":"うみ"},{"label":"D","text":"じゅぎょう"}],"answer":"B","fix":"","note":"B\nđịa điểm + で","key_point":"Trợ từ 「で」 đi sau danh từ chỉ địa điểm để diễn tả nơi diễn ra hành động.","why_correct":"「コンビニ」 (cửa hàng tiện lợi) là địa điểm thực tế và phù hợp nhất để thực hiện hành động mua báo (しんぶんを かいます).","why_wrong":[{"label":"A","why":"「うち」 (nhà - Gia) thường là nơi đọc báo, không phải nơi để đến mua báo."},{"label":"C","why":"「うみ」 (biển - Hải) là cảnh quan tự nhiên, không có hoạt động mua bán báo."},{"label":"D","why":"「じゅぎょう」 (giờ học - Thụ Nghiệp) là danh từ chỉ hoạt động, không phải địa điểm."}],"vocab":[{"word":"しんぶん","reading":"しんぶん (新聞)","meaning":"tờ báo (Sino-Viet: Tân Văn)"},{"word":"かいます","reading":"かいます (買います)","meaning":"mua"},{"word":"コンビニ","reading":"コンビニ","meaning":"cửa hàng tiện lợi"},{"word":"じゅぎょう","reading":"じゅぎょう (授業)","meaning":"giờ học (Sino-Viet: Thụ Nghiệp)"}]},{"id":108,"slide":108,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"_____ で　CDを　ききます。","options":[{"label":"A","text":"うち"},{"label":"B","text":"あさ"},{"label":"C","text":"しんぶん"},{"label":"D","text":"ホームステイ"}],"answer":"A","fix":"","note":"A","key_point":"Sử dụng trợ từ で sau danh từ chỉ địa điểm để biểu thị nơi diễn ra hành động.","why_correct":"うち (nhà) là danh từ chỉ địa điểm phù hợp nhất đi với trợ từ で để tạo thành cụm \u0027うちで\u0027 (ở nhà), diễn tả nơi thực hiện hành động nghe CD.","why_wrong":[{"label":"B","why":"あさ (buổi sáng) là danh từ chỉ thời gian, không đi với trợ từ で để chỉ nơi chốn."},{"label":"C","why":"しんぶん (tờ báo) là danh từ chỉ vật thể, không phù hợp về mặt ý nghĩa trong ngữ cảnh này."},{"label":"D","why":"ホームステイ (homestay/ở nhà dân bản xứ) không phù hợp về mặt ý nghĩa khi kết hợp với hành động nghe CD."}],"vocab":[{"word":"家","reading":"うち (Gia)","meaning":"nhà"},{"word":"聞きます","reading":"ききます (Văn)","meaning":"nghe"},{"word":"朝","reading":"あさ (Triều)","meaning":"buổi sáng"},{"word":"新聞","reading":"しんぶん (Tân Văn)","meaning":"tờ báo"}]},{"id":109,"slide":109,"section":"Vị trí, Địa điểm","prompt":"Hãy chọn câu có cách sử dụng từ đúng nhất cho từ vựng sau đây.","setup":"","stem":"こうこう","options":[{"label":"A","text":"ワンさんのしゅみはこうこうです。"},{"label":"B","text":"ワンさんのしごとはこうこうです。"},{"label":"C","text":"ワンさんはこうこうのせんせいです。"},{"label":"D","text":"ワンさんはこうこうです。"}],"answer":"C","fix":"","note":"C","key_point":"こうこう (高校 - Cao Hiệu) nghĩa là trường trung học phổ thông (cấp 3).","why_correct":"Cụm từ \u0027こうこうのせんせい\u0027 (giáo viên cấp 3) là cách kết hợp danh từ hoàn toàn hợp lý để chỉ nghề nghiệp của anh Wang.","why_wrong":[{"label":"A","why":"Sở thích (しゅみ) không thể là \u0027trường cấp 3\u0027."},{"label":"B","why":"Công việc (しごと) không thể là \u0027trường cấp 3\u0027 (phải là giáo viên hoặc nhân viên trường học)."},{"label":"D","why":"Câu này nghĩa là \u0027Anh Wang là trường cấp 3\u0027, hoàn toàn sai logic."}],"vocab":[{"word":"高校","reading":"こうこう","meaning":"Trường cấp 3 (Cao Hiệu)"},{"word":"先生","reading":"せんせい","meaning":"Giáo viên (Tiên Sinh)"},{"word":"趣味","reading":"しゅみ","meaning":"Sở thích (Thú Vị)"},{"word":"仕事","reading":"しごと","meaning":"Công việc (Sĩ Sự)"}]},{"id":110,"slide":110,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"はじめまして。私は パクです。\n(　　) の 学生です。","options":[{"label":"A","text":"二十六才"},{"label":"B","text":"あおぞら 学校"},{"label":"C","text":"きょうし"},{"label":"D","text":"かいしゃいん"}],"answer":"B","fix":"","note":"B","key_point":"Sử dụng danh từ chỉ tên trường học trước cụm \"の 学生\" để giới thiệu nơi mình đang học.","why_correct":"あおぞら 学校 (Trường học Aozora) là danh từ chỉ tên trường, kết hợp với \"の 学生\" tạo thành nghĩa \"học sinh của trường Aozora\", phù hợp nhất trong ngữ cảnh giới thiệu bản thân.","why_wrong":[{"label":"A","why":"二十六才 (Nhị Thập Lục Tuế - 26 tuổi) là từ chỉ tuổi tác, không kết hợp với \"の 学生\"."},{"label":"C","why":"きょうし (Giáo viên) mâu thuẫn về mặt ngữ nghĩa khi tự giới thiệu mình là học sinh (学生)."},{"label":"D","why":"かいしゃいん (Nhân viên công ty) mâu thuẫn với danh xưng học sinh (学生) trong câu."}],"vocab":[{"word":"学生","reading":"がくせい","meaning":"học sinh, sinh viên (Học Sinh)"},{"word":"学校","reading":"がっこう","meaning":"trường học (Học Hiệu)"},{"word":"教師","reading":"きょうし","meaning":"giáo viên (Giáo Sư)"},{"word":"会社員","reading":"かいしゃいん","meaning":"nhân viên công ty (Hội Xã Viên)"}]},{"id":111,"slide":111,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: (　　) で　バーベキューをしますか。\nB: こうえんで　します。","options":[{"label":"A","text":"なに"},{"label":"B","text":"どこ"},{"label":"C","text":"だれ"},{"label":"D","text":"いつ"}],"answer":"B","fix":"","note":"B","key_point":"Dùng nghi vấn từ どこ (ở đâu) để hỏi về địa điểm xảy ra hành động với trợ từ で.","why_correct":"Câu trả lời là こうえん (công viên - địa điểm) đi với trợ từ で, nên câu hỏi phải dùng nghi vấn từ chỉ nơi chốn là どこ (ở đâu).","why_wrong":[{"label":"A","why":"なに nghĩa là \u0027cái gì\u0027, dùng để hỏi về đồ vật hoặc hành động chứ không hỏi về địa điểm."},{"label":"C","why":"だれ nghĩa là \u0027ai\u0027, dùng để hỏi về người."},{"label":"D","why":"いつ nghĩa là \u0027khi nào\u0027, dùng để hỏi về thời gian."}],"vocab":[{"word":"バーベキュー","reading":"ばーべきゅー","meaning":"tiệc nướng ngoài trời (barbecue)"},{"word":"公園","reading":"こうえん","meaning":"công viên (Âm Hán Việt: Công Viên)"}]},{"id":112,"slide":112,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"私は ______ で かばんを かいます。","options":[{"label":"A","text":"スーパー"},{"label":"B","text":"おべんとう"},{"label":"C","text":"まいばん"},{"label":"D","text":"ホームステイ"}],"answer":"A","fix":"","note":"A","key_point":"Danh từ chỉ địa điểm đi với trợ từ で để chỉ nơi thực hiện hành động.","why_correct":"スーパー (siêu thị) là danh từ chỉ địa điểm duy nhất phù hợp để đi với trợ từ で và hành động かばんを かいます (mua cặp sách).","why_wrong":[{"label":"B","why":"おべんとう (cơm hộp) là danh từ chỉ đồ ăn, không thể là nơi chốn để thực hiện hành động mua bán."},{"label":"C","why":"まいばん (mỗi tối) là trạng từ chỉ thời gian, không đi với trợ từ で để chỉ nơi chốn."},{"label":"D","why":"ホームステイ (homestay) là hoạt động ở cùng nhà dân bản xứ, không phù hợp làm địa điểm mua sắm."}],"vocab":[{"word":"かばん","reading":"かばん","meaning":"cặp sách, túi xách"},{"word":"買います","reading":"かいます","meaning":"mua"},{"word":"スーパー","reading":"すーぱー","meaning":"siêu thị"},{"word":"お弁当","reading":"おべんとう","meaning":"cơm hộp"},{"word":"毎晩","reading":"まいばん","meaning":"mỗi tối"}]},{"id":113,"slide":113,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: 7月15日から20日までは　スキーりょこうです。\nB: どこへ　いきますか。\nA: _______へ　いきます。","options":[{"label":"A","text":"ほっかいどう"},{"label":"B","text":"はなび"},{"label":"C","text":"さいふ"},{"label":"D","text":"とんかつ"}],"answer":"A","fix":"","note":"A","key_point":"Hỏi địa điểm với どこへ (đi đâu) yêu cầu câu trả lời là một danh từ chỉ nơi chốn.","why_correct":"Câu hỏi dùng nghi vấn từ \u0027どこ\u0027 (ở đâu) nên câu trả lời phải là một địa danh. \u0027ほっかいどう\u0027 (Hokkaido) là địa điểm duy nhất phù hợp để đi với trợ từ \u0027へ\u0027 và động từ \u0027いきます\u0027.","why_wrong":[{"label":"B","why":"はなび (pháo hoa) là danh từ chỉ sự vật/sự kiện, không phải địa điểm."},{"label":"C","why":"さいふ (ví tiền) là danh từ chỉ đồ vật, không thể dùng làm điểm đến."},{"label":"D","why":"とんかつ (món thịt heo chiên xù) là món ăn, không phù hợp ngữ cảnh."}],"vocab":[{"word":"7月15日","reading":"しちがつじゅうごにち","meaning":"ngày 15 tháng 7"},{"word":"スキーりょこう","reading":"すきーりょこう","meaning":"chuyến du lịch trượt tuyết"},{"word":"どこ","reading":"どこ","meaning":"đâu, ở đâu"},{"word":"ほっかいどう","reading":"ほっかいどう","meaning":"Hokkaido (địa danh)"}]},{"id":114,"slide":114,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"てんいん: いらっしゃいませ。\nA: すみません、けいたいでんわは　どこですか。\nてんいん: けいたいでんわは（　　）です。","options":[{"label":"A","text":"こちら"},{"label":"B","text":"それ"},{"label":"C","text":"その"},{"label":"D","text":"これ"}],"answer":"A","fix":"","note":"A","key_point":"Sử dụng đại từ chỉ phương hướng lịch sự こちら để trả lời cho câu hỏi nơi chốn どこ.","why_correct":"こちら (phía này, chỗ này) là đại từ chỉ phương hướng/địa điểm mang tính lịch sự, rất phù hợp với vị thế của nhân viên cửa hàng khi hướng dẫn vị trí sản phẩm cho khách hàng hỏi どこ (ở đâu).","why_wrong":[{"label":"B","why":"それ (cái đó) là đại từ chỉ đồ vật ở gần người nghe, không dùng để chỉ nơi chốn."},{"label":"C","why":"その (đó...) là từ chỉ định bổ nghĩa cho danh từ, bắt buộc phải có danh từ theo sau chứ không đứng một mình làm vị ngữ."},{"label":"D","why":"これ (cái này) là đại từ chỉ đồ vật ở gần người nói, không dùng để trả lời cho câu hỏi địa điểm."}],"vocab":[{"word":"店員","reading":"てんいん","meaning":"nhân viên cửa hàng (Điếm Viên)"},{"word":"いらっしゃいませ","reading":"いらっしゃいませ","meaning":"xin chào quý khách (lời chào của nhân viên)"},{"word":"携帯電話","reading":"けいたいでんわ","meaning":"điện thoại di động (Huề Đới Điện Thoại)"},{"word":"どこ","reading":"どこ","meaning":"ở đâu"}]},{"id":115,"slide":115,"section":"Vị trí, Địa điểm","prompt":"Hãy chọn câu có cách sử dụng từ đúng nhất cho từ vựng sau đây.","setup":"","stem":"にほんごがっこう","options":[{"label":"A","text":"マルコさんのなまえはにほんごがっこうです。"},{"label":"B","text":"マルコさんのはにほんごがっこうのがくせいです。"},{"label":"C","text":"マルコさんのはにほんごがっこうです。"},{"label":"D","text":"マルコさんのしごとのはにほんごがっこうです。"}],"answer":"B","fix":"","note":"B","key_point":"Sử dụng từ にほんごがっこう (trường tiếng Nhật) để chỉ cơ sở giáo dục.","why_correct":"Câu B diễn đạt đúng ý nghĩa: \u0027Marco là học sinh của trường tiếng Nhật\u0027 (phần \u0027さんのは\u0027 có thể là lỗi gõ của đề, đúng ra là \u0027さんは\u0027, nhưng cấu trúc bổ nghĩa \u0027trường tiếng Nhật của học sinh\u0027 là hoàn toàn chính xác).","why_wrong":[{"label":"A","why":"Sai nghĩa vì dịch là \u0027Tên của Marco là trường tiếng Nhật\u0027."},{"label":"C","why":"Sai ngữ cảnh vì dịch là \u0027Cái của Marco là trường tiếng Nhật\u0027, không rõ ràng và không tự nhiên."},{"label":"D","why":"Sai logic vì công việc (しごと) không thể là một ngôi trường."}],"vocab":[{"word":"日本語学校","reading":"にほんごがっこう","meaning":"Trường tiếng Nhật"},{"word":"学生","reading":"がくせい","meaning":"Học sinh, sinh viên"},{"word":"名前","reading":"なまえ","meaning":"Tên"},{"word":"仕事","reading":"しごと","meaning":"Công việc"}]},{"id":116,"slide":116,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: エレベーターは あそこですか。\nB: (          )、あちらです。","options":[{"label":"A","text":"はい"},{"label":"B","text":"いいえ"},{"label":"C","text":"そうですね"},{"label":"D","text":"そうですか"}],"answer":"A","fix":"","note":"A\nあちら là dạng lịch sự của あそこ, về nghĩa 2 từ giống nhau","key_point":"Dùng \"はい\" để đồng ý vì \"あちら\" là dạng lịch sự của \"あそこ\" (cùng chỉ một nơi).","why_correct":"\"あちら\" là cách nói lịch sự hơn của \"あそこ\" (phía kia, đằng kia). Vì hai từ này chỉ cùng một vị trí nên B trả lời \"はい\" (Vâng) để xác nhận thông tin của A là đúng.","why_wrong":[{"label":"B","why":"\"いいえ\" nghĩa là \"Không\", dùng để phủ định, không phù hợp vì hai từ chỉ cùng một nơi."},{"label":"C","why":"\"そうですね\" nghĩa là \"Đúng thế nhỉ\" hoặc \"Để tôi xem\", dùng để đồng tình với nhận định hoặc suy nghĩ, không dùng để trả lời câu hỏi xác nhận địa điểm."},{"label":"D","why":"\"そうですか\" nghĩa là \"Thế à?\", dùng khi tiếp nhận thông tin mới từ người khác chứ không dùng để trả lời câu hỏi."}],"vocab":[{"word":"エレベーター","reading":"えれべーたー","meaning":"Thang máy"},{"word":"あそこ","reading":"あそこ","meaning":"Chỗ kia, đằng kia"},{"word":"あちら","reading":"あちら","meaning":"Phía kia, hướng kia (lịch sự của あそこ)"}]},{"id":117,"slide":117,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: はい、さくら　ゆうびんきょくです。\nB: すみません、（　　　）は　何時　までですか。","options":[{"label":"A","text":"ここ"},{"label":"B","text":"そちら"},{"label":"C","text":"こちら"},{"label":"D","text":"あそこ"}],"answer":"B","fix":"","note":"B\nđịa điểm gần người nghe và xa người nói =\u003e B\nđịa điểm gần người nghe và gần người nói =\u003e A,C\nđịa điểm xa người nghe và xa người nói =\u003e D","key_point":"Sử dụng そちら để chỉ nơi của người nghe, đặc biệt lịch sự khi gọi điện thoại.","why_correct":"Trong cuộc điện thoại, người B đang gọi đến bưu điện (phía người nghe A), do đó dùng từ lịch sự そちら (phía bên anh/chị) để hỏi giờ làm việc là chính xác nhất.","why_wrong":[{"label":"A","why":"ここ (ở đây) chỉ địa điểm gần người nói B, không thể dùng để hỏi về bưu điện ở phía người nghe."},{"label":"C","why":"こちら (phía này) chỉ phía của người nói B, không dùng để hỏi về phía của đối phương."},{"label":"D","why":"あそこ (chỗ kia) chỉ địa điểm ở xa cả người nói lẫn người nghe, không phù hợp trong ngữ cảnh gọi điện trực tiếp này."}],"vocab":[{"word":"ゆうびんきょく","reading":"郵便局 (bưu cục)","meaning":"Bưu điện"},{"word":"何時","reading":"なんじ (hà thời)","meaning":"Mấy giờ"},{"word":"まで","reading":"made","meaning":"Đến, đến khi"}]},{"id":118,"slide":118,"section":"Vị trí, Địa điểm","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: エスカレーターは どこです。\nB: (　　) です。","options":[{"label":"A","text":"あれ"},{"label":"B","text":"これ"},{"label":"C","text":"あちら"},{"label":"D","text":"みっか"}],"answer":"C","fix":"","note":"C\ncâu hỏi là どこ(ở đâu) =\u003e chọn C (ở đằng kia)","key_point":"Hỏi địa điểm với 「どこ」 cần trả lời bằng từ chỉ phương hướng như 「あちら」.","why_correct":"Câu hỏi dùng 「どこ」 (ở đâu) để hỏi về vị trí của thang cuốn, vì vậy câu trả lời phù hợp nhất phải là từ chỉ phương hướng 「あちら」 (phía kia, đằng kia).","why_wrong":[{"label":"A","why":"「あれ」 là đại từ chỉ vật ở xa (\"cái kia\"), không dùng để chỉ nơi chốn hay phương hướng."},{"label":"B","why":"「これ」 là đại từ chỉ vật ở gần người nói (\"cái này\"), không phù hợp để trả lời cho câu hỏi địa điểm."},{"label":"D","why":"「みっか」 nghĩa là \"ngày mùng 3\" hoặc \"3 ngày\", hoàn toàn không liên quan đến câu hỏi vị trí."}],"vocab":[{"word":"エスカレーター","reading":"えすかれーたー","meaning":"thang cuốn"},{"word":"どこ","reading":"どこ","meaning":"ở đâu"},{"word":"あちら","reading":"あちら","meaning":"hướng kia, đằng kia (lịch sự)"}]},{"id":120,"slide":120,"section":"Đồ vật, Đồ ăn","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:\nA: これは いくらですか。\nB: (     ) は 千円です。","setup":"","stem":"(     )","options":[{"label":"A","text":"それ"},{"label":"B","text":"あれ"},{"label":"C","text":"そこ"},{"label":"D","text":"あそこ"}],"answer":"A","fix":"","note":"A\nA nói là これ tức là vật này đang gần A. Vậy nên khi B trả lời thì B sẽ phải nói là それ(vật xa B và gần A). C và D là các cụm chỉ địa điểm, ko dùng chỉ đồ vật","key_point":"Quy tắc Ko-So-A-Do: Khi đối phương hỏi bằng \"これ\", ta phải trả lời bằng \"それ\".","why_correct":"Vật nằm gần người A nên A dùng \"これ\" (cái này). Đối với người B, vật đó ở xa mình và gần đối phương nên B phải dùng \"それ\" (cái đó) để trả lời.","why_wrong":[{"label":"B","why":"\"あれ\" dùng để chỉ vật ở xa cả người nói và người nghe."},{"label":"C","why":"\"そこ\" là đại từ chỉ địa điểm (chỗ đó), không dùng để chỉ đồ vật."},{"label":"D","why":"\"あそこ\" là đại từ chỉ địa điểm (chỗ kia), không dùng để chỉ đồ vật."}],"vocab":[{"word":"これ","reading":"kore","meaning":"cái này (gần người nói)"},{"word":"それ","reading":"sore","meaning":"cái đó (gần người nghe)"},{"word":"いくら","reading":"ikura","meaning":"bao nhiêu tiền"},{"word":"千円","reading":"せんえん (sen\u0027en)","meaning":"1000 Yên (Âm Hán Việt: Thiên Viên)"}]},{"id":121,"slide":121,"section":"Đồ vật, Đồ ăn","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: このりょうりは 何ですか。\nB: (　　) です。","options":[{"label":"A","text":"ぶたにく　りょうり"},{"label":"B","text":"ぶたにくの　りょうり"},{"label":"C","text":"ぶたにくで　りょうり"},{"label":"D","text":"ぶたにくから　りょうり"}],"answer":"B","fix":"","note":"B","key_point":"Sử dụng trợ từ の để nối hai danh từ bổ nghĩa cho nhau.","why_correct":"ぶたにく (thịt heo) và りょうり (món ăn) đều là danh từ, do đó cần dùng trợ từ の ở giữa để tạo thành cụm danh từ \u0027món ăn thịt heo\u0027.","why_wrong":[{"label":"A","why":"Không thể ghép trực tiếp hai danh từ độc lập này lại với nhau mà không có trợ từ nối."},{"label":"C","why":"Trợ từ で chỉ phương thức, chất liệu hoặc địa điểm, không dùng để nối trực tiếp hai danh từ bổ nghĩa như thế này."},{"label":"D","why":"Trợ từ から chỉ nguồn gốc, xuất xứ hoặc từ đâu, không phù hợp để định nghĩa tên món ăn."}],"vocab":[{"word":"豚肉","reading":"ぶたにく (Đồn Nhục)","meaning":"thịt heo"},{"word":"料理","reading":"りょうり (Liệu Lý)","meaning":"món ăn, nấu ăn"}]},{"id":122,"slide":122,"section":"Đồ vật, Đồ ăn","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"私は ______ で かばんを かいます。","options":[{"label":"A","text":"まいばん"},{"label":"B","text":"おべんとう"},{"label":"C","text":"ホームステイ"},{"label":"D","text":"スーパー"}],"answer":"D","fix":"","note":"D\nmua túi trong siêu thị.","key_point":"Chọn danh từ chỉ địa điểm phù hợp với hành động mua sắm (で かいます).","why_correct":"スーパー (siêu thị) là danh từ chỉ địa điểm phù hợp nhất đi với trợ từ で để diễn tả nơi diễn ra hành động mua cặp sách (かばんを かいます).","why_wrong":[{"label":"A","why":"まいばん (mỗi tối) là trạng từ chỉ thời gian, không dùng với trợ từ chỉ địa điểm で."},{"label":"B","why":"おべんとう (cơm hộp) là món ăn, không phải là địa điểm để thực hiện hành động mua sắm."},{"label":"C","why":"ホームステイ (homestay) là việc ở cùng nhà dân bản xứ, không phù hợp làm nơi mua cặp sách."}],"vocab":[{"word":"かばん","reading":"かばん","meaning":"cặp sách, túi xách"},{"word":"買います","reading":"かいます","meaning":"mua"},{"word":"スーパー","reading":"すーぱー","meaning":"siêu thị"},{"word":"毎晩","reading":"まいばん","meaning":"mỗi tối (Âm Hán Việt: Mỗi Vãn)"},{"word":"お弁当","reading":"おべんとう","meaning":"cơm hộp (Âm Hán Việt: Biện Đương)"}]},{"id":123,"slide":123,"section":"Đồ vật, Đồ ăn","prompt":"Chọn đáp án thích hợp trong A, B, C, D để điền vào ngoặc cho câu sau:","setup":"","stem":"A: すみません、これは なんの スープですか。\nてんいん: (　　) の スープです。","options":[{"label":"A","text":"かばん"},{"label":"B","text":"こうえん"},{"label":"C","text":"はなび"},{"label":"D","text":"ぶたにく"}],"answer":"D","fix":"","note":"D\nSúp/canh làm từ thịt lợn.","key_point":"Lựa chọn danh từ chỉ nguyên liệu thực phẩm phù hợp để kết hợp với スープ (súp).","why_correct":"ぶたにく (豚肉 - Đồn Nhục) có nghĩa là thịt lợn. ぶたにくのスープ nghĩa là súp thịt lợn, là câu trả lời duy nhất chỉ nguyên liệu món ăn phù hợp trong ngữ cảnh này.","why_wrong":[{"label":"A","why":"かばん nghĩa là cái cặp/túi xách, không thể dùng làm nguyên liệu nấu súp."},{"label":"B","why":"こうえん (公園 - Công Viên) nghĩa là công viên, không liên quan đến đồ ăn."},{"lab "text":"おねがいします"},{"label":"D","text":"はじめまして"}],"answer":"B","fix":"","note":"B","key_point":"「すみません」 dùng để thu hút sự chú ý của người khác một cách lịch sự trước khi hỏi.","why_correct":"「すみません」(sumimasen) có nghĩa là \u0027xin lỗi\u0027 hoặc \u0027làm ơn cho hỏi\u0027, được dùng để bắt đầu một câu hỏi hoặc yêu cầu một cách lịch sự.","why_wrong":[{"label":"A","why":"「どうも」(doumo) có nghĩa là \u0027cảm ơn\u0027 hoặc \u0027rất nhiều\u0027, không dùng để thu hút sự chú ý."},{"label":"C","why":"「おねがいします」(onegaishimasu) có nghĩa là \u0027làm ơn\u0027 (khi nhờ vả), không phù hợp để hỏi giờ."},{"label":"D","why":"「はじめまして」(hajimemashite) có nghĩa là \u0027rất vui được gặp bạn\u0027, dùng khi lần đầu gặp mặt."}],"vocab":[{"word":"いま","reading":"いま","meaning":"bây giờ"},{"word":"何時","reading":"なんじ","meaning":"mấy giờ (Hà Thời)"},{"word":"10時","reading":"じゅうじ","meaning":"10 giờ (Thập Thời)"},{"word":"すみません","reading":"すみません","meaning":"xin lỗi, làm ơn cho hỏi"}]},{"id":167,"slide":167,"section":"Thời gian","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (  ).","setup":"","stem":"A: Bさんのたんじょうびは (        )。\nB: 6がつ25にちです。","options":[{"label":"A","text":"なんですか"},{"label":"B","text":"なんです"},{"label":"C","text":"いつです"},{"label":"D","text":"いつですか"}],"answer":"D","fix":"","note":"D\ncó từ たんじょうび(sinh nhật) và câu trả lời có chứa ngày và tháng =\u003e chọn D (có từ いつ là khi nào và ですか để thành 1 câu hỏi)","key_point":"Sử dụng いつですか để hỏi về thời gian, ngày tháng.","why_correct":"Câu trả lời là ngày tháng (6がつ25にち), nên chúng ta dùng いつですか (khi nào?) để hỏi về thời gian, ngày sinh nhật.","why_wrong":[{"label":"A","why":"なんです (nan desu ka) hỏi \u0027là cái gì?\u0027, không dùng để hỏi về thời gian."},{"label":"B","why":"なんです (nan desu) là câu khẳng định \u0027là cái gì\u0027, không phải câu hỏi."},{"label":"C","why":"いつです (itsu desu) là câu khẳng định \u0027là khi nào\u0027, không phải câu hỏi."}],"vocab":[{"word":"たんじょうび","reading":"たんじょうび","meaning":"sinh nhật"},{"word":"いつ","reading":"いつ","meaning":"khi nào"},{"word":"6がつ25にち","reading":"ろくがつにじゅうごにち","meaning":"ngày 25 tháng 6"}]},{"id":169,"slide":169,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (   ) .","setup":"","stem":"A: (   ) .\nB: はじめまして。\n","options":[{"label":"A","text":"よろしくおねがいします"},{"label":"B","text":"おやすみなさい"},{"label":"C","text":"はじめまして"},{"label":"D","text":"すみません"}],"answer":"C","fix":"","note":"C\nB trả lời sau và nói はじめまして(Nice to meet you). A là người nói trước nên cũng sẽ nói tương tự =\u003e chọn C","key_point":"Khi lần đầu gặp mặt, cả hai bên đều nói はじめまして (hajimemashite).","why_correct":"Trong cuộc hội thoại giới thiệu lần đầu, người nói A và người nói B đều sẽ nói はじめまして (hajimemashite) để chào hỏi nhau. B đã nói はじめまして, nên A cũng sẽ nói tương tự.","why_wrong":[{"label":"A","why":"よろしくおねがいします (yoroshiku onegaishimasu) nghĩa là \u0027Rất mong được giúp đỡ/chiếu cố\u0027, thường nói sau はじめまして."},{"label":"B","why":"おやすみなさい (oyasuminasai) nghĩa là \u0027Chúc ngủ ngon\u0027, dùng khi tạm biệt trước khi đi ngủ."},{"label":"D","why":"すみません (sumimasen) nghĩa là \u0027Xin lỗi\u0027 hoặc \u0027Cảm ơn\u0027, không dùng để giới thiệu lần đầu."}],"vocab":[{"word":"はじめまして","reading":"はじめまして","meaning":"Rất vui được gặp (lần đầu gặp mặt)"},{"word":"よろしくおねがいします","reading":"よろしくおねがいします","meaning":"Rất mong được giúp đỡ/chiếu cố"},{"word":"おやすみなさい","reading":"おやすみなさい","meaning":"Chúc ngủ ngon"},{"word":"すみません","reading":"すみません","meaning":"Xin lỗi/Cảm ơn"}]},{"id":170,"slide":170,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A:「にほんへ　いきます。」\nB:「へえ。(　　　)。」","options":[{"label":"A","text":"えっ"},{"label":"B","text":"いいです"},{"label":"C","text":"そうです"},{"label":"D","text":"そうですか"}],"answer":"D","fix":"","note":"D\nthể hiện sự ngạc nhiên + xác nhận thông tin.\n(nếu là B thì phải là いいですね。)","key_point":"「そうですか」 dùng để thể hiện sự ngạc nhiên, quan tâm hoặc xác nhận thông tin.","why_correct":"Sau thán từ 「へえ」 (thể hiện sự ngạc nhiên, quan tâm), 「そうですか」 là cách diễn đạt tự nhiên để xác nhận thông tin vừa nghe hoặc thể hiện sự ngạc nhiên, hứng thú. Nó có nghĩa là \u0027Vậy à?\u0027.","why_wrong":[{"label":"A. えっ","why":"Đây là một thán từ thể hiện sự ngạc nhiên mạnh, thường dùng độc lập và không phải là một câu hỏi xác nhận thông tin."},{"label":"B. いいです","why":"Nghĩa là \u0027Tốt/Được rồi\u0027. Không phù hợp để phản hồi thông tin về việc ai đó sẽ đi đâu. Nếu muốn khen ngợi thì phải là 「いいですね」."},{"label":"C. そうです","why":"Nghĩa là \u0027Đúng vậy\u0027. Đây là câu khẳng định, không phải câu hỏi xác nhận hay thể hiện sự ngạc nhiên như 「そうですか」."}],"vocab":[{"word":"日本","reading":"にほん","meaning":"Nhật Bản"},{"word":"行きます","reading":"いきます","meaning":"đi"},{"word":"へえ","reading":"へえ","meaning":"Ồ (thán từ thể hiện sự ngạc nhiên, quan tâm)"},{"word":"そうですか","reading":"そうですか","meaning":"Vậy à? (thể hiện sự ngạc nhiên, xác nhận thông tin)"}]},{"id":171,"slide":171,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"アリさん「すみません。ちゃわんを　おねがいします。」\nてんいん「(　　)。」","options":[{"label":"A","text":"あのう、すみません"},{"label":"B","text":"いらっしゃいませ"},{"label":"C","text":"どうぞ"},{"label":"D","text":"ありがとうございました"}],"answer":"C","fix":"","note":"C\nKhách hàng muốn gọi món, thì てんいん(tức là nhân viên quán ăn) sẽ nói là xin mời (どうぞ)","key_point":"Dùng どうぞ để đáp lại khi đưa đồ cho khách hoặc mời ai đó dùng thứ gì.","why_correct":"Khi khách hàng gọi đồ và nhân viên mang ra hoặc đưa cho, nhân viên sẽ nói \"どうぞ\" (xin mời).","why_wrong":[{"label":"A","why":"Dùng để thu hút sự chú ý khi muốn bắt đầu nói chuyện, không hợp hoàn cảnh này."},{"label":"B","why":"Dùng để chào khách khi họ vừa bước vào quán, không dùng khi đưa đồ."},{"label":"D","why":"Có nghĩa là \"cảm ơn rất nhiều\", dùng khi kết thúc giao dịch hoặc nhận được giúp đỡ."}],"vocab":[{"word":"てんいん","reading":"てんいん","meaning":"nhân viên cửa hàng"},{"word":"ちゃわん","reading":"ちゃわん","meaning":"chén, bát"}]},{"id":172,"slide":172,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"てんいん「(　　　)。」\nアリさん「すみません。でんしじしょはどこですか。」","options":[{"label":"A","text":"あのう、すみません"},{"label":"B","text":"いらっしゃいませ"},{"label":"C","text":"どちらですか"},{"label":"D","text":"だれですか"}],"answer":"B","fix":"","note":"B\nnếu như là てんいん(nhân viên cửa hàng) nói trước thì sẽ luôn là いらっしゃいませ-kính chào quý khách","key_point":"Nhân viên cửa hàng (店員) luôn chào khách bằng 「いらっしゃいませ」.","why_correct":"Khi khách hàng bước vào cửa hàng, nhân viên (店員) sẽ chào đón khách bằng câu lịch sự chuẩn mực 「いらっしゃいませ」 (Kính chào quý khách).","why_wrong":[{"label":"A","why":"Dùng khi bắt chuyện hoặc xin lỗi, không phải lời chào từ nhân viên."},{"label":"C","why":"Nghĩa là \"ở đâu/hướng nào\", dùng để hỏi vị trí."},{"label":"D","why":"Nghĩa là \"ai thế\", dùng để hỏi danh tính một người."}],"vocab":[{"word":"店員","reading":"てんいん","meaning":"nhân viên cửa hàng"},{"word":"電子辞書","reading":"でんしじしょ","meaning":"từ điển điện tử"}]},{"id":173,"slide":173,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: はじめまして、パクです。よろしくおねがいします。\nB: ナタポンです。(　　) よろしくおねがいします。","options":[{"label":"A","text":"そうですか"},{"label":"B","text":"こちらこそ"},{"label":"C","text":"どういたしまして"},{"label":"D","text":"ありがとう"}],"answer":"B","fix":"","note":"B","key_point":"Dùng 「こちらこそ」 để đáp lại lời chào 「よろしくおねがいします」.","why_correct":"「こちらこそ」 có nghĩa là \"chính tôi mới là người...\", dùng để đáp lại câu chào hỏi hoặc nhờ vả một cách lịch sự khi đối phương nói 「よろしくおねがいします」.","why_wrong":[{"label":"A","why":"Nghĩa là \"Thế à?\", dùng khi tiếp nhận thông tin mới chứ không dùng để đáp lại lời chào."},{"label":"C","why":"Nghĩa là \"Không có gì\", dùng để đáp lại lời cảm ơn."},{"label":"D","why":"Nghĩa là \"Cảm ơn\", không phù hợp để đáp lại tron n hoặc địa điểm diễn ra hành động, không dùng ở đây."}],"vocab":[{"word":"毎日","reading":"まいにち","meaning":"hàng ngày"},{"word":"朝ごはん","reading":"あさごはん","meaning":"cơm sáng"},{"word":"食べる","reading":"たべる","meaning":"ăn"}]},{"id":183,"slide":183,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: 毎日 (まいにち) 、あさごはんを 食 (た) べますか。\nB: いいえ、私は あさ、なに (　　) 食 (た) べません。","options":[{"label":"A","text":"を"},{"label":"B","text":"も"},{"label":"C","text":"へ"},{"label":"D","text":"で"}],"answer":"B","fix":"","note":"B","key_point":"と/なにか/なん + も + V(phủ định): hoàn toàn không...","why_correct":"Câu trả lời có động từ phủ định \"食べません\" (không ăn). Khi đi với từ để hỏi \"なに\" (cái gì) và kết hợp với trợ từ \"も\", ta được cấu trúc chỉ sự phủ định toàn bộ (hoàn toàn không ăn gì cả).","why_wrong":[{"label":"A","why":"Trợ từ \"を\" chỉ tân ngữ, không kết hợp với \"なに\" trong câu phủ định toàn bộ như thế này."},{"label":"C","why":"Trợ từ \"へ\" chỉ hướng di chuyển, không phù hợp với động từ ăn uống."},{"label":"D","why":"Trợ từ \"で\" chỉ phương tiện hoặc địa điểm diễn ra hành động, không đi với \"なに\" trong ngữ cảnh này."}],"vocab":[{"word":"毎日","reading":"まいにち","meaning":"mỗi ngày"},{"word":"朝ご飯","reading":"あさごはん","meaning":"cơm sáng"},{"word":"食べる","reading":"たべる","meaning":"ăn"}]},{"id":184,"slide":184,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"これは かんこく (　　) かばんです。","options":[{"label":"A","text":"で"},{"label":"B","text":"も"},{"label":"C","text":"×"},{"label":"D","text":"の"}],"answer":"D","fix":"","note":"D","key_point":"Dùng trợ từ の để nối danh词 chỉ xuất xứ hoặc sở hữu.","why_correct":"かんこく (Hàn Quốc) là danh từ chỉ xuất xứ, bổ nghĩa cho かばん (cái túi) nên cần dùng trợ từ の ở giữa.","why_wrong":[{"label":"A","why":"で chỉ phương tiện hoặc địa điểm diễn ra hành động, không dùng để nối danh từ."},{"label":"B","why":"も có nghĩa là \u0027cũng\u0027, không phù hợp trong ngữ cảnh nối hai danh từ."},{"label":"C","why":"× nghĩa là không cần trợ từ, nhưng ở đây bắt buộc phải có の để nối."}],"vocab":[{"word":"かばん","reading":"ka-ban","meaning":"cái túi, cặp sách"},{"word":"かんこく","reading":"kan-ko-ku","meaning":"Hàn Quốc"}]},{"id":185,"slide":185,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"カレーを 2つ (　　) コーヒーを 2つ (　　) ください。","options":[{"label":"A","text":"の / を"},{"label":"B","text":"と / を"},{"label":"C","text":"と / ×"},{"label":"D","text":"× / と"}],"answer":"C","fix":"","note":"C","key_point":"Dùng と để liệt kê danh từ và を để chỉ đối tượng của động tác.","why_correct":"カレーを 2つ と コーヒーを 2つ ください dùng と để nối hai món curry và coffee, và dùng を cho danh từ chỉ vật nhận hành động ください.","why_wrong":[{"label":"A","why":"の dùng để chỉ sở hữu hoặc bổ nghĩa giữa hai danh từ, không dùng để liệt kê ở đây."},{"label":"B","why":"Dùng と cho cả hai chỗ là thừa và sai ngữ pháp vì コーヒー đứng trước ください phải đi với trợ từ を."},{"label":"D","why":"Trợ từ đặt sai vị trí, không thể bỏ trống chỗ đầu rồi dùng と ở chỗ sau."}],"vocab":[{"word":"カレー","reading":"karee","meaning":"cà ri"},{"word":"コーヒー","reading":"koohii","meaning":"cà phê"}]},{"id":186,"slide":186,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ).","setup":"","stem":"私はベトナムじんです。ランさん（　　）ベトナムじんです。","options":[{"label":"A","text":"に"},{"label":"B","text":"も"},{"label":"C","text":"の"},{"label":"D","text":"と"}],"answer":"B","fix":"","note":"B","key_point":"Dùng も (mo) để diễn tả ý nghĩa \"cũng\" khi chủ ngữ có điểm tương đồng.","why_correct":"Câu trước nói \"Tôi là người Việt Nam\", câu sau nói \"Bạn Lan cũng là người Việt Nam\", nên dùng も để thay thế cho は.","why_wrong":[{"label":"A","why":"に chỉ hướng đi hoặc thời điểm, không dùng để nối các chủ ngữ tương đồng."},{"label":"C","why":"の chỉ sự sở hữu hoặc bổ nghĩa cho danh từ phía sau, không phù hợp ở đây."},{"label":"D","why":"と có nghĩa là \"và\" hoặc \"với\", dùng để liệt kê danh từ chứ không đứng ở vị trí này."}],"vocab":[{"word":"私","reading":"わたし","meaning":"tôi"},{"word":"ベトナム","reading":"betonamu","meaning":"Việt Nam"}]},{"id":187,"slide":187,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (   ).","setup":"","stem":"A: さとうさん (    ) くにはどちらですか。\nB: にほんです。","options":[{"label":"A","text":"の"},{"label":"B","text":"も"},{"label":"C","text":"は"},{"label":"D","text":"と"}],"answer":"A","fix":"","note":"A","key_point":"Trợ từ 「の」 dùng để chỉ sở hữu hoặc mối quan hệ giữa danh từ với danh từ.","why_correct":"Cấu trúc 「[Danh từ 1] の [Danh từ 2]」 dùng để hỏi quốc gia thuộc về ai. 「さとうさんのくに」 có nghĩa là \"quốc gia của anh/chị Sato\".","why_wrong":[{"label":"B","why":"「も」 có nghĩa là \"cũng\", không dùng để nối hai danh từ chỉ sở hữu."},{"label":"C","why":"「は」 dùng để đánh dấu chủ ngữ, nếu đặt vào đây sẽ làm câu bị thừa chủ ngữ."},{"label":"D","why":"「と」 có nghĩa là \"và\" hoặc \"cùng với\", không phù hợp trong ngữ cảnh hỏi quê quán sở hữu này."}],"vocab":[{"word":"くに","reading":"kuni","meaning":"quốc gia, đất nước"},{"word":"にほん","reading":"nihon","meaning":"Nhật Bản"}]},{"id":188,"slide":188,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) .","setup":"","stem":"A: せんせい、きむらさん (       ) にほんじんですか。\nB: はい。にほんじんです。","options":[{"label":"A","text":"に"},{"label":"B","text":"と"},{"label":"C","text":"は"},{"label":"D","text":"も"}],"answer":"C","fix":"Đề chấm B (と), nhưng \"きむらさんと にほんじんですか\" không thành câu — と chỉ dùng nối hai danh từ, mà ở đây chỗ trống đứng sau danh từ cuối. Đáp án đúng ngữ pháp là は: \"せんせい、きむらさんは にほんじんですか\" (Thầy ơi, anh Kimura là người Nhật ạ?), khớp với câu đáp \"はい。にほんじんです。\" Đã đối chiếu lại ảnh slide gốc nên đây là lỗi của đề, không phải lỗi đọc slide.","note":"B","key_point":"は đánh dấu chủ đề: [Người] は [quốc tịch/nghề] ですか。","why_correct":"せんせい、きむらさんは にほんじんですか。= \"Thầy ơi, anh Kimura là người Nhật ạ?\" は nêu chủ đề (きむらさん), phần sau nói về chủ đề đó. Câu đáp はい。にほんじんです。 xác nhận đúng mạch này.","why_wrong":[{"label":"A","why":"に dùng cho thời điểm (6時に) hoặc đích đến, không đứng giữa người và danh từ chỉ quốc tịch."},{"label":"B","why":"と nối hai danh từ ngang hàng nên phải nằm GIỮA chúng (せんせいと きむらさん), không thể đứng sau danh từ cuối. Đây là đáp án đề chấm, nhưng đặt vào thì câu không thành câu."},{"label":"D","why":"も nghĩa là \"cũng\", chỉ đúng nếu trước đó đã nhắc một người khác là người Nhật — hội thoại này không có ngữ cảnh đó."}],"vocab":[{"word":"日本人","reading":"にほんじん","meaning":"người Nhật"},{"word":"先生","reading":"せんせい","meaning":"thầy/cô giáo"}]},{"id":189,"slide":189,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) .","setup":"","stem":"Q: ミンさん、しゅみはなんですか。\nA: サッカー (    ) すいえいです。","options":[{"label":"A","text":"の"},{"label":"B","text":"も"},{"label":"C","text":"は"},{"label":"D","text":"と"}],"answer":"D","fix":"","note":"D","key_point":"Dùng trợ từ \u0027と\u0027 (to) để liệt kê các danh từ (A và B).","why_correct":"Trợ từ \u0027と\u0027 được dùng để nối hai danh từ, mang nghĩa là \u0027và\u0027. Ở đây dùng để liệt kê hai sở thích là bóng đá và bơi lội.","why_wrong":[{"label":"A","why":"Trợ từ \u0027の\u0027 dùng để chỉ sự sở hữu hoặc bổ nghĩa cho danh từ, không dùng để liệt kê."},{"label":"B","why":"Trợ từ \u0027も\u0027 mang nghĩa là \u0027cũng\u0027, không phù hợp để nối hai danh từ trong ngữ cảnh này."},{"label":"C","why":"Trợ từ \u0027は\u0027 dùng để đánh dấu chủ đề của câu, không dùng để nối danh từ."}],"vocab":[{"word":"しゅみ","reading":"shumi","meaning":"sở thích"},{"word":"サッカー","reading":"sakkaa","meaning":"bóng đá"},{"word":"すいえい","reading":"suiei","meaning":"bơi lội"}]},{"id":190,"slide":190,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) .","setup":"","stem":"Q: すみません。きむらさん (     ) しごとは？\nA: かいしゃいんです。","options":[{"label":"A","text":"が"},{"label":"B","text":"と"},{"label":"C","text":"の"},{"label":"D","text":"に"}],"answer":"C","fix":"","note":"C","key_point":"Dùng trợ từ の để nối danh từ, chỉ sự sở hữu hoặc mối quan hệ.","why_correct":"Cấu trúc \u0027Danh từ 1 の Danh từ 2\u0027 dùng để hỏi về công việc của ai đó. Ở đây là \u0027công việc của anh Kimura\u0027.","why_wrong":[{"label":"A","why":"が dùng để nhấn mạnh chủ ngữ, không dùng để nối danh từ."},{"label":"B","why":"と nghĩa là \u0027và\u0027 hoặc \u0027cùng với\u0027, không phù hợp ngữ pháp câu này."},{"label":"D","why":"に chỉ thời gian hoặc địa điểm, không dùng để nối danh từ."}],"vocab":[{"word":"仕事","reading":"しごと","meaning":"công việc"},{"word":"会社員","reading":"かいしゃいん","meaning":"nhân viên công ty"}]},{"id":191,"slide":191,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc ( ) .","setup":"","stem":"マイさんは FPT (     ) しゃいんです。","options":[{"label":"A","text":"と"},{"label":"B","text":"の"},{"label":"C","text":"も"},{"label":"D","text":"は"}],"answer":"B","fix":"","note":"B","key_point":"Dùng trợ từ \u0027no\u0027 (の) để nối hai danh từ (A no B).","why_correct":"Cấu trúc \u0027FPT no shain\u0027 (nhân viên của FPT) dùng \u0027no\u0027 để chỉ mối quan hệ sở hữu hoặc thuộc về.","why_wrong":[{"label":"A","why":"Trợ từ \u0027to\u0027 dùng để liệt kê danh từ (và/với)."},{"label":"C","why":"Trợ từ \u0027mo\u0027 dùng để chỉ sự tương đồng (cũng)."},{"label":"D","why":"Trợ từ \u0027wa\u0027 dùng để đánh dấu chủ ngữ, không dùng để nối danh từ."}],"vocab":{"word":"社員","reading":"しゃいん","meaning":"Nhân viên công ty (Xã viên)"}},{"id":192,"slide":192,"section":"Giao tiếp, chào hỏi","prompt":"Hãy lựa chọn đáp án phù hợp nhất điền vào trong ngoặc (  ).","setup":"","stem":"ワンさんのしゅみはりょうり（　　）おんがくです。","options":[{"label":"A","text":"と"},{"label":"B","text":"の"},{"label":"C","text":"も"},{"label":"D","text":"は"}],"answer":"A","fix":"","note":"A","key_point":"Dùng trợ từ \u0027to\u0 ","text":"も"}],"answer":"D","fix":"","note":"D\ncũng là...","key_point":"Dùng も (mo) để diễn tả ý nghĩa \u0027cũng\u0027 cho danh từ đi trước.","why_correct":"Câu trước nói \u0027Miller-san là học sinh\u0027. Câu sau có ý \u0027Yamada-san CŨNG là học sinh\u0027, nên dùng trợ từ も.","why_wrong":[{"label":"A","why":"と dùng để liệt kê đầy đủ hoặc làm cùng ai đó, không hợp nghĩa."},{"label":"B","why":"で chỉ phương tiện hoặc nơi chốn diễn ra hành động, sai ngữ pháp."},{"label":"C","why":"や dùng để liệt kê chưa đầy đủ các danh từ, không phải ý \u0027cũng\u0027."}],"vocab":{"word":"学生","reading":"がくせい","meaning":"học sinh, sinh viên"}},{"id":201,"slide":201,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"これは かんこく ( 　　 ) かばんです。","options":[{"label":"A","text":"で"},{"label":"B","text":"も"},{"label":"C","text":"×"},{"label":"D","text":"の"}],"answer":"D","fix":"","note":"D","key_point":"Dùng \u0027の\u0027 để nối danh tố chỉ xuất xứ/quốc gia với danh từ theo sau.","why_correct":"かんこく (Hàn Quốc) là danh từ chỉ quốc gia, cần trợ từ \u0027の\u0027 để bổ nghĩa cho danh từ \u0027かばん\u0027 (cái cặp) đứng sau.","why_wrong":[{"label":"A","why":"\u0027で\u0027 chỉ địa điểm diễn ra hành động hoặc phương tiện, không dùng để nối danh từ sở hữu/xuất xứ."},{"label":"B","why":"\u0027も\u0027 có nghĩa là \u0027cũng\u0027, không phù hợp trong ngữ cảnh nối hai danh từ này."},{"label":"C","why":"Dấu \u0027×\u0027 nghĩa là không cần trợ từ, nhưng ở đây bắt buộc phải có trợ từ \u0027の\u0027."}],"vocab":[{"word":"かんこく","reading":"kankoku","meaning":"Hàn Quốc"},{"word":"かばん","reading":"kaban","meaning":"cái cặp, túi xách"}]},{"id":202,"slide":202,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"A: これは (　　) のスープですか。\nB: さかなとやさいのスープです。","options":[{"label":"A","text":"どこ"},{"label":"B","text":"いつ"},{"label":"C","text":"だれ"},{"label":"D","text":"なん"}],"answer":"D","fix":"","note":"D","key_point":"なん (nan) dùng để hỏi về loại, thành phần của sự vật.","why_correct":"なん (nan) có nghĩa là \"gì\", dùng để hỏi về loại hoặc thành phần của món súp. Câu trả lời \"súp cá và rau\" phù hợp với câu hỏi này.","why_wrong":[{"label":"A","why":"どこ (doko) có nghĩa là \"ở đâu\", dùng để hỏi về địa điểm."},{"label":"B","why":"いつ (itsu) có nghĩa là \"khi nào\", dùng để hỏi về thời gian."},{"label":"C","why":"だれ (dare) có nghĩa là \"ai\", dùng để hỏi về người."}],"vocab":[{"word":"スープ","reading":"すーぷ","meaning":"súp"},{"word":"さかな","reading":"さかな","meaning":"cá"},{"word":"やさい","reading":"やさい","meaning":"rau"},{"word":"なん","reading":"なん","meaning":"gì, cái gì"},{"word":"どこ","reading":"どこ","meaning":"ở đâu"},{"word":"いつ","reading":"いつ","meaning":"khi nào"},{"word":"だれ","reading":"だれ","meaning":"ai"}]},{"id":203,"slide":203,"section":"Giao tiếp, chào hỏi","prompt":"Chọn trong A. B. C. D đáp án thích hợp để điền vào chỗ trống:","setup":"","stem":"カレーを　2つ（　　）コーヒーを　2つ（　　）ください。","options":[{"label":"A","text":"の / を"},{"label":"B","text":"と / を"},{"label":"C","text":"と / ×"},{"label":"D","text":"× / と"}],"answer":"C","fix":"","note":"C","key_point":"Dùng 「と」 để liệt kê các danh từ, và không cần thêm trợ từ trước 「ください」 khi đã có 「を」.","why_correct":"Trợ từ 「と」 được dùng để nối hai danh từ (カレーを2つ và コーヒーを2つ) với nghĩa \u0027và\u0027. Sau 「コーヒーを2つ」, không cần thêm trợ từ nào nữa vì 「ください」 là động từ yêu cầu trực tiếp, và trợ từ 「を」 đã được dùng với danh từ \u0027コーヒー\u0027.","why_wrong":[{"label":"A","why":"「の」 không dùng để liệt kê các danh từ trong trường hợp này. Thừa 「を」 ở vị trí thứ hai."},{"label":"B","why":"Thừa 「を」 ở vị trí thứ hai, vì 「を」 đã được dùng với danh từ \u0027コーヒー\u0027."},{"label":"D","why":"Thiếu 「と」 để nối các danh từ. 「と」 không phù hợp ở vị trí thứ hai trước 「ください」."}],"vocab":[{"word":"カレー","reading":"かれー","meaning":"món cà ri"},{"word":"コーヒー","reading":"こーひー","meaning":"cà phê"},{"word":"2つ","reading":"ふたつ","meaning":"hai c
